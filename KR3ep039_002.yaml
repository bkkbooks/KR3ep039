body:
  text: 卷二類中章脈稟六陽先天元氣充足足徵松柏之姿老而彌徑平素善啖後天亦富所以望八之年一切起居如壯盛之人然而病患類中者何居或指為肝腎下虛而用地黃飲子或指為中氣不足而用耆朮補中一遵河間之訓一執東垣之說又有泄降肺氣者乃丹溪之法要皆各有意見立方定論盡屬高明珠玉在前無從置喙今診得脈象洪大右肢偏廢面色雖無華彩然亦不見萎黃目尚有神言不蹇澀舌邊淡紅中心苔白前月有二十多日大便不通初一日大便解後隨即小便不利似癃非癃似遺溺而並非遺溺少腹脹滿飲食日減種種病情大抵由中氣不足濕熱不化內風暗動使然夫中氣者何脾胃是也何以不足勞碌傷之也勞碌何以傷脾胃脾胃主四肢故也內風何以暗動脾胃屬土土衰則木橫木橫則風動也脾胃失運則濕熱不化故舌上有濁苔也若果肝腎精血衰憊舌且干而光矣安得有苔然又有陽虛濁聚舌上有苔者其證必喘而多汗脈沉微細為辨今脈洪大似非陽虛之可擬然小便何以不利經曰中氣不足則溲便為之變又曰膀胱者州都之官津液藏焉氣化則能出拙見用方似宜轉運中樞利其氣化為先內經有云凡病皆當治本惟大小便不利者法當先治其標蓋以小便不利勢必膀胱脹滿滿極則上攻腹胸喘厥臻至矣安得不先治其標乎人參一錢半夏一錢澤瀉一錢半枳實六分赤苓二錢冬朮一錢肉桂四分陳皮八分血珀八分研末藥汁調下二診按類中一證風由內生非關外感昔河間主火是訓是氣召風入氣為本而風為標丹溪主痰是訓是痰召風人痰為本而風為標喻嘉言聰明特識謂陽虛邪害空竅為本或氣或火或痰為標以豫論之曰召曰入曰邪害內風外風混同莫別惟近代葉天士直指名之曰內風掀動為痱中最為明瞭然則內風何以掀動耶或由水虧不能涵木河間之訓是也或由土衰不能培木東垣之訓是也丹溪濕痰之說又補二家之未逮而喻氏陽虛之說又補三子之未備也今診脈大稍斂一息四至不失和緩之形是有胃氣經曰得神者昌又曰安穀則昌服藥後食粥兩盞神情安穩未必立見傾危但少腹脹滿大如覆碗連及乎臍誠如昨案所云倘若上攻腹胸喘厥臻至奈何奈何夫少腹為膀胱之部位膀胱居少腹之中央凡小便祕而膀胱脹滿者為水利其小便即愈小便通而少腹脹滿者為氣徒用通利無益也膀胱者屬太陽有上口而無下口氣化而後能出亦必氣化而後能入此病欲溲不溲不溲反遺乃膀胱啓閉無權陽氣失化也是當以輸化膀胱之陽氣為要矣據述未病以前小溲已不自如則知中氣不足清陽下陷已非一日徒化膀胱之陽而不助其中氣治與不治等也握樞而運惟有從中宣化其上下仿喻西昌進退黃連一法以就高明教正人參一錢薑汁炒川連三分半夏一錢茯苓二錢冬朮一錢厚朴五分煎汁炒陳皮八分鹽水炒肉桂三分澤瀉一錢半三診養生者之言曰急守爾精勿妄泄祕而寶之可常活竊疑未必盡然今觀是證益信太翁元陽素旺腎氣常充故望八之年猶能御女不輟正是多壽之徵前者邀診林議為中氣不足膀胱失化用五苓散合進退黃連一法幸奏微功今前證皆減惟小溲仍然淋澀而莖中反增熱痛乃心火旺而相火熾也使能心若寒灰自知愛養漸次調理將見起床復舊安有莖中作痛之變倘若熾盛不已轉為強中消渴如之奈何姑清君相以熄火焰之燔犀角川連龍膽草淡芩黃柏澤瀉瞿麥鮮生地黑梔草稍通草竹葉四診醫者意也以意會之隨機應變初無一定之法亦無一定之方此證初因中氣不足膀胱失化故前以轉運中樞輸化陽氣得效今則心火妄動相火隨熾故昨以清心導赤瀉肝止痛立法幸獲奏功慰喜慰喜茲診左脈稍平知肝心之火漸退而右尺尚旺乃腎膀之火未清仍以前法增損前方去犀角加萆薢原注此江陰章姓病也與袁霞軒同道會診前二診重在宣化中氣後二診轉用清泄君相之火隨證應變不拘守一方喜獲良效後薦袁君獨任調理善後之責結果全愈陳操持煩冗曲運神思心陽亢逆肝風旋動機竅不靈語言遲鈍雖無類中之象即屬類中之萌與袁先生同議熄風和陰宣竅化痰方法石決明五錢煨天麻一錢鉤藤三錢遠志肉五分甘草湯制玄參一錢半半夏一錢茯苓二錢陳皮一錢鹽水炒石菖蒲三分竹油二十匙沖薑汁一匙沖二診水之精為志火之精為神神藏於心心太勞則神浮而不藏陽氣弛張內風旋動因而暈厥幾乎僕中猶幸平日自知涵養握志堅定足以留戀其神神氣不致渙散而厥可回不然則危矣厥回諸無所苦惟心欲言而口不接意欲宣而辭不達主翁自謂神志短少心腎不交即此二語洞徹病原林覺多言反晦真布鼓過雷門矣今擬收斂浮越之神以交心腎仍佐和陽熄風宣竅化痰之品石決明五錢打牡蠣三錢煅茯神三錢丹參三錢陳皮五分半夏一錢遠志五分大生地四錢龍齒三錢煅棗仁三錢炒石菖蒲三分竹油草匙沖薑汁一匙沖三診昨晚進藥之後舌辣麻澀片刻即已一夜安寐昧爽略覺心跳總屬心血衰少之故今診脈稍柔風陽有漸熄之機而語言稍貫機巧有漸靈之意可喜可喜然竊有懇者貴恙既因操勞而起似宜屏絶應酬不拘常理閉目靜養返觀內照使水升火降心腎自交交則為既濟濟則諸恙霍然矣昔朱大復先生教人心常放下目常向下上者降則下者升亦交心腎之法也至於用藥養心血以安神則風陽自靜補陰精而益志則機竅自靈仍佐化痰和胃以治其中經旨所謂交陰陽者必和其中也人參茯神辰砂拌大生地麥冬辰砂拌棗仁炒遠志甘草湯制製半夏梨汁拌炒秫米炒黃四診夫貞者元之根不貞無以為元而冬者春之基冬不斂藏則無以為春生之助譬之於病亦然若劉河間論類中多由將息失宜水不制火肝風內動原以陰虛為言不專主火為訓蓋上盛者下必虛水虧者木自亢易老治風先養血仲淳清火先養陰皆知本之言也茲當殘臘節屆小寒司天歲氣一周初運將交風木乘此綢繆大固封藏之本先期培植佇看生髮之榮某本菲材術慚小道仰荷寵光之下逮敢不竭力以圖維幸能奏效不辱遠道而來從此告歸聊贈片言而去寡言語屏應酬乃病中所調養之當然慎起居戒勞怒又病後攝生之要務倘不自知節愛則駕輕走熟交春木旺風動何難伏惟珍重千萬是荷今擬煎膏二方煎則安神定志膏則專培精血以俟春回寒谷尚當拜賀崇禧人參大熟地茯苓棗仁遠志石決明麥冬川貝母鉤鉤膏方棗仁大熟地麥冬白薇玄參玉竹龜版大生地牡蠣海參淡菜阿膠收膏川貝母調入錢類中五年偏痱在右元氣不足痰流經絡近今兩月穀食大增雖為美事亦屬胃火火能消穀故善食而易飢也調治方法不外補養精血熄風通絡和胃化痰制首烏當歸大熟地刺蒺藜三角胡麻桑寄生茯苓半夏曲麥冬肉新會皮淵按此肝腎水虧而虛火盛者故以滋水熄風為治趙風中廉泉痰阻舌本口角流涎舌蹇而澀右肢麻木僕中根萌擬熄風和陽化痰泄絡羚羊角石決明膽星法半夏茯苓甘菊炭遠志煨天麻橘紅淵按痰火用事故瀉火化痰通絡熄風甘菊不宜用炭某口歪於左手廢於右肝風胃濕互相牽掣舌強而蹇痰留心脾之絡也類中顯然黨參當歸半夏茯神鉤鉤石決明川斷秦艽膽星桑枝淵按脾虛生痰肝虛生風運脾即是化痰養肝佐以熄風為虛實參半之治王兩手關脈皆見一粒厥厥動搖之象此脾虛木勝內風動躍之候也左半肢體麻木不仁頭眩面麻此屬偏枯慮延僕中制首烏當歸白芍茯苓陳皮煨天麻秦艽石決明刺蒺藜池菊鉤鉤桑枝復診兩關脈厥厥動搖之象大減其內風有暗熄之機左手屈伸稍安左足麻木未愈今擬補腎生肝為治本之計地黃飲子去桂附淵按去附桂水中之火尚不虛也詒按未雨綢繆故易於奏效兩方用藥亦能與病機宛轉相赴薛年已六旬腎肝精血衰微內風痰涎走絡右偏手足無力舌強言澀類中之根萌也溫補精血兼化痰涎冀免偏枯之纍然非易事耐心調理為宜蓯蓉干巴戟肉茯神木瓜半夏杞子鹽水炒遠志肉甘草湯制海風藤萸肉酒炒牛膝杜仲鹽水炒詒按此與下條均因有類中之萌作未雨綢繆之計故用藥力求平穩不敢喜事以邀功也復診腎藏精而主骨肝藏血而主筋腎肝精血衰微筋骨自多空隙濕熱痰涎乘虛入絡右偏手足無力舌根牽強類中之根溫補精血宣通經絡兼化痰涎守服不懈加以恬養安泰庶幾卻病延年蓯蓉干黨參元米炒牛膝半夏杞子鹽水炒陳皮續斷茯苓巴戟肉桑枝又丸方蓯蓉干二兩酒煮爛搗入黨參三兩元米炒熟地四兩砂仁末陳酒拌蒸爛搗入麥冬二兩去心元米炒棗仁三兩炒研巴戟肉三兩鹽水炒歸身二兩酒炒萆薢三兩炒制首烏四兩炒茯神三兩半夏二兩牛膝三兩鹽水炒天冬二兩去心元米炒陳皮二兩五錢杜仲三兩鹽水炒虎骨三兩炙菖蒲一兩杞子四兩鹽水炒上藥各選道地如法制炒共研細末用竹瀝四兩薑汁三兩搗入再將白蜜為丸如黍米大用磁器裝好每朝服五錢開水送下唐風痰入絡腦後脹痛舌根牽強言語不利飲食減進久防痱中羚羊角防風制殭蠶生甘草羌活遠志肉川芎桔梗桑葉薄荷鉤鉤復診頸項脹是風舌根強屬痰風與痰合久防類中熟地白芍續斷杞子杜仲秦艽當歸牛膝淵按實多虛少前方恰合後方太補與痰阻舌本者不宜費類中之後手足不遂舌根牽強風痰入絡所致防其復中黨參大生地制南星白芍秦艽冬朮制首烏羚羊角虎骨歸身牛膝茯苓海風藤沙苑子棗仁杜仲生苡仁陳皮川貝半夏上藥濃煎三次加竹瀝二茶杯薑汁二十匙白蜜二杯阿膠四兩煬化收膏某勞碌傷氣肝風陽氣弛張肥體氣虛濕熱痰火擾動忽然磕睡幾乎跌僕舌強言漫右偏肢痱此屬偏中猶幸神識尚清痰涎未湧或可圖幸治以熄風化痰安神清火冀其得效為妙羚羊決明天麻天竺黃茯神菖蒲川貝膽星半夏橘紅嫩鉤竹瀝淡薑汁吳體肥多濕性躁多火十年前小産血崩遂陰虧火亢肝風暗動筋絡失養其根已非一日去秋伏暑而成三瘧瘧久營衛偏虛遂致內風夾痰擾絡右半身麻痹而似偏痱調理漸愈今但右足麻辣熱痛痛自足大指而起顯系血虛肝經失養據云腿膝常冷足骱常熱並非足骱有火而腿膝有寒也想因濕火乘虛下注故痛處覺熱上腿之處氣血不足故寒也至於左脛外廉皮肉之內結核如棉子發作則痛甚此屬筋箭是風痰瘀血交凝入絡而成與右足之熱痛麻辣不同今且先治其右足姑擬一方請正大生地萆薢茯苓阿膠天麻五加皮歸身牛膝冬朮獨活絲瓜絡木瓜淵按筋箭之名甚新詒按論頗明透方亦平穩肝氣肝風肝火胡少腹脅肋肝之部也腰腎之府也年老則精血枯而絡脈空肝氣乘虛入絡濕熱又從之為患補養精血疏肝通絡兼化濕熱以治之川楝子香附烏藥當歸茯苓旋覆花延胡猩絳陳皮蓯蓉干青蔥管復診補養精血疏通脈絡脅肋之痛稍減惟小溲短少夜半以後脘腹覺脹是濁氣不化也前方加通陽泄濁之品川楝子吳萸烏藥杞子當歸延胡索茯苓車前橘葉蓯蓉干九香蟲兩頭尖小麥芽某脈雙弦有寒飲在胃也脘痛吐酸木剋土也得食則痛緩病屬中虛當和中泄木祛寒小建中湯加味主之白芍桂枝乾薑炙草半夏橘餅川椒黨參白朮詒按大小建中合劑方藥穩切某脘痛肢冷脈伏頭汗淋漓防厥金鈴子五靈脂延胡旋覆花赭石乳香沒藥丁香蔻仁香附詒按此肝氣挾瘀之證故立方如此再診脘痛甚則防厥薑黃半夏陳皮茯苓香附吳萸旋覆花赫石蔻仁某肝木挾下焦水寒之氣乘於脾胃脘痛攻肋嘔吐酸水脈細而弦擬溫中禦寒扶土抑木方法炮姜川椒吳萸黨參桂枝白芍白朮茯苓香附砂仁詒按此肝氣挾感寒治法用藥頗精到某肝氣與飲邪相合為病脘腹作痛嘔吐酸水擬苦辛泄木辛溫蠲飲川連吳萸炒陳皮木香丁香蔻仁乾薑川楝子延胡香附川椒詒按肝氣病兼證最多須看其立方融洽處岑煩勞罷極則傷肝肝傷則氣逆而上迫為脅痛為咳嗽秦氏所謂先脅痛而後咳者肝傷肺也治法不在肺而在於肝夏令將臨恐有失血之虞旋覆花桃仁炭杏仁川貝蘇梗丹皮冬瓜子黑山梔鬱金苡仁枇杷露詒按審證清切立方諦當愚意再加當歸桑白皮白芍某病將一載肝氣橫逆而不平中氣久虛而不振惟肝逆故胸脘阻塞而攻衝惟中虛故營衛不和而寒熱凡大便溏飲食少右脈細左脈弦是其證也四君子合逍遙加左金是其治也黨參冬朮陳皮茯苓歸身神麯白芍柴胡鹽水少香附鹽水炒川連吳萸炒穀芽玫瑰花詒按案語爽郎方亦的當擬再加沉香鬱金再診陽虛惡寒陰虛發熱脾虛則便溏而乏力木旺則脘痞而氣塞前方補中泄木肝氣已平合以益火生土氣血雙補黨參冬朮蓯蓉鹿角霜杞子木香菟絲子歸身白芍陳皮茯苓杜仲砂仁玫瑰花詒按肝氣平後續用培補是一定層次惟既有寒熱見證似可參用桂枝建中之意以和之某凡臟邪惟虛則受之而實則不受惟實者能傳而虛則不傳仲景云肝病實脾治肝邪之盛也內經云肝病緩中治肝體之虛也此證肝氣有餘肝血不足法宜兩顧為得歸身白芍沙苑杞子冬朮茯神青皮陳皮香附金鈴子砂仁詒按議論確鑿非胸中有古書者不能道方亦精到方中歸芍杞苑所以養肝血青陳香鈴所以疏肝氣藥品看似平常用意恰已周到某營陰虛則氣火易升肝木橫則脾土受侮腹滿頭暈肝脾之病耳鳴喉燥虛火之愆陰虛生內熱腎虛故腰痛擬補陰潛陽扶土抑木法生地砂仁炒四兩茯苓烘三兩山藥炒三兩萸肉酒炒三兩丹皮酒炒二兩澤瀉炒三兩龜版炙三兩沙苑鹽水炒三兩黨參炒三兩杜仲鹽水炒三兩歸身酒炒三兩白芍炒二兩石決明煅四兩上藥為末煉蜜打和為丸曬乾泛上後藥香附三兩分三份一份鹽水炒一份醋炒一份蜜水炒陳皮鹽水炒七錢沉香三錢神麯一兩上藥為末用橘葉湯泛上前丸為衣詒按以補藥為丸而以和氣之藥末泛上為衣與喻嘉言藥用外廓之意相合雖無精義可取而心思靈巧可備一格時脘痛不時發作曾經吐蛔兼見鼻血女年二七天癸未通想由胃中有寒肝家有火金鈴子散加五靈脂香附乾薑川連使君子肉烏藥烏梅茯苓復診肝胃不和脘脅痛得食乃安中氣虛擬泄肝和胃二陳湯去草加川連六神麯烏藥高良薑香附砂仁吳氣血兩虛心跳頭眩肝鬱不舒胸中痞脹用景嶽逍遙飲參入丹溪左金丸大熟地香附當歸陳皮白芍茯神棗仁砂仁白朮吳萸炒川連淵按熟地恐礙膈頭眩屬痰阻中脘最多薛中氣不足木來乘土上衝為嘔上冒為眩蓋上衝者肝之氣也上冒者肝之風也頭面汗出偏左亦屬肝之陽有餘而肝之陰不足經云汗出偏沮使人偏枯久久防有肢麻不遂見證調治之法和中為主平肝次之越人所謂損其肝者緩其中仲景所謂肝病治脾當先實脾是也黨參三錢茯苓二錢陳皮八分鹽水炒青鹽製半夏一錢白芍一錢五分石決明五錢煅甘菊炭一錢蜜生薑一片川連三分吳萸汁炒青鹽橄欖二個原注效朱心跳少寐是血虛也氣攻作脹是肝虛也頭眩筋惕是肝風也食少便溏是脾虛也平肝氣熄肝風養營陰補脾土是其治也制香附青陳皮茯苓赤白各半歸身白芍沙苑子制首烏神麯砂仁姜棗趙心腎虛而不交肝脾虛而不調內風上擾頭眩心跳中土式微不寐納少交濟坎離須借戊己以為媒欲平肝風亦宜培土黨參歸身白芍冬朮茯神遠志棗仁神麯沙苑子孫血不養筋肝風走絡左臂痠痛或止或作法當養血通絡制首烏當歸杞子穭豆衣丹參蒺藜苡仁茯苓秦艽桑枝紅棗蔣酒客中虛嘈雜木勝風動頭旋掉眩兼以手振此內風挾痰為患須戒酒節欲為要天麻冬朮茯苓杞子沙苑子鉤鉤制首烏當歸白芍半夏石決明池菊謝久患肝風眩暈復感秋風成瘧瘧愈之後周身筋脈跳躍甚則發厥此乃血虛不能涵木筋脈失養虛風走絡痰涎凝聚所致擬養血熄風化痰通絡制首烏紫石英白蒺藜半夏茯神洋參陳皮羚羊角石決明煨天麻棗仁竹油薑汁淵按瘧後脾氣必虛風動雖由木燥痰聚由於脾虛若舌苔濁膩運脾化痰尤不可少詒按歸芍似不可少金左手脈沉弦而澀數不調乃血虛而肝風暗動也右關脈獨緩滑胃有濕痰尺寸俱弱金水兩虛證見耳聾兩肩膊酸而難舉痰多口中乾膩是其徵也大生地麥冬歸身石決明半夏蒺藜鉤鉤橘紅牡蠣玄參指迷茯苓丸丁脈左弱為血虛右弱為氣虛氣血兩虛上為頭眩半身以下皆形麻木而成癱瘓甚則心亂神昏此肝風挾痰所致法當清上補下淡蓯蓉大生地天冬牛膝玄參菖蒲天麻萆薢茯苓陳皮黃柏洋參淵按清陽明以利機關養肝腎以滋陰血運脾氣以化濕痰絲絲入扣丁營陰虛則風陽易逆脾胃弱則肝木易橫心嘈頭眩耳鳴液涸陽升之兆腹脹脘痞厭食脾虛氣滯之愆今吐瀉之餘實系肝強脾弱宗越人肝病緩中論治人參茯苓冬朮竹茹麥冬半夏陳皮橘葉刺蒺藜雞子黃拌炒薛陰虧營損風木之臟失涵木勝風淫倉廩之官受制是以頭痛肢麻腹滿暖氣心跳少寐掌熱腰痠等證見也所慮水土俱弱肝木獨強強者難於驟服弱者宜急扶持今再益營陰以扶綏之實倉廩以堵御之佐金氣以制治之亦剿撫兼行之法也大生地歸身白芍穀芽懷山藥神麯潞黨參茯神陳皮刺蒺藜紅棗川連吳萸炒王血虛肝風上逆痰涎走絡頭眩心跳乾咳痰少右肩臂不能舉足熱無力養陰以熄風陽化痰以調脾胃黨參元米炒生地海浮石同拌半夏決明沙苑鹽水炒茯神棗仁蛤殼茯苓陳皮嫩鉤竹二青復診治風先治血血行風自滅治痰先化氣氣化痰自失生地茯神嫩鉤陳皮沙苑決明蛤殼棗仁竹茹張頭痛巔疾下虛上實過在足少陰厥陰甚則入腎眴蒙昭尤經文明指肝膽風陽上盛久痛不已必傷少陰腎陰腎陰一衰故目䀮䀮無所見而腰痛復起也前方清鎮無效今以育陰潛陽鎮逆法生地龜版杜仲鹽水炒牡蠣茯神棗仁磁石阿膠米粉炒女貞鹽水炒沙苑鹽水炒石決明淵按此厥陰頭痛也三陰經皆至頸而還惟厥陰上額交巔甚則入腎者木燥水必虧乙癸同源也楊鬱火內燔氣血消灼濕熱不化釀成瘍毒四肢麻痛眼鼻牽引肝風內動脾胃受戕慮延敗證姑先清氣血之燔佐以熄風通絡羚羊角連翹木防己苡仁滑石赤苓黑山梔絲瓜絡丹皮鉤鉤通草藿香葉淵按濕熱風火內盛故以清火化濕通絡熄風不涉虛故不用補榮病起肝風繼增痰飲吐酸所以口目筋掣而胸膈不利也近因暑熱上蒸咽喉碎癢暫投涼劑喉患即解而胸脘愈覺撐脹夫肝風之動由於陰血之虧而痰飲之乘又系胃陽之弱病涉兩歧法難兼用今且宣化胃濕以祛痰稍佐平肝降逆法半夏茯苓陳皮麥冬杏仁旋覆花川貝山梔薑汁炒鬱金丹皮白蔻仁竹茹淵按此等病最難看其實在中焦脾胃也蓋飲生於脾聚於胃苟能治得痰飲肝風無有不愈脾氣既升肝自不郁胃氣既降肝自清寧何風之有詒按此等兩礙之病最難用藥須看其周到尉帖處方中旋郁貝杏是兼參胸痹治法朱五臟六腑之精氣皆上注於目目之繫上屬於腦後出於項故凡風邪中於項入於腦者多令目系急而邪視或頸項強急也此證始由口目牽引乃外風引動內風內風多從火出其源實由於水虧水虧則木旺木旺則風生至於口唇乾燥赤碎名餂唇風亦由肝風胃火之所成也治當清火熄風養陰為法大生地丹皮沙參鉤鉤桑葉羚羊角石決明白芍川斛芝麻蔗皮玄參心梨皮顧血不養筋筋脈牽掣晝日則安暮夜則發不能安臥病在陰經宜養血以和經脈大生地黨參黃耆川芎茯苓柏子仁當歸白芍棗仁桑枝何肝風陽氣上冒頭左偏痛連及左目難開胸脘氣脹肝木乘胃法以泄降和陽羚羊角蔓荊子川連刺蒺藜池菊鉤鉤石決明神麯茯苓半夏桑葉施久遺下虛腎水不足肝風暗動上升則頭痛眩暈乘中則或吐或瀉近來夜寐出汗左目鋭眥赤腫少陽木火上盛也法以上熄風陽下滋腎水中和脾胃外實腠理用湯丸並進磁朱六味丸淡鹽湯送下石決明懷藥白芍玄參牡蠣沙苑子茯神黨參芡實紅棗浮麥潘情懷鬱勃肝膽風陽上升右目昏蒙左半頭痛心嘈不寐飢而善食內風掀旋不熄痛勢倏忽無定營液消耗慮其痙厥法以滋營養液清熄風陽務宜暢抱庶克臻效大生地玄精石阿膠天冬池菊白芍羚羊角石決明女貞子鉤鉤復診服滋陰和陽法風陽稍熄第舌心無苔心嘈善飢究屬營陰消爍胃虛求助於食議滋柔甘緩大生地石決明麥冬阿膠白芍橘餅大麻仁女貞子洋參茯神淵按舌心無苔胃陰虛也加炙草守中壯水更妙詒按此養陰柔肝之正法與前人復脈定風阿膠雞黃等法用意相合李肝風陽氣弛張兼挾濕熱上混清竅左耳常流清水時或作癢右鼻燥而窒塞頭暈沉沉法以熄風和陽羚羊角石決明池菊鉤鉤粉丹皮黑山梔磁石蒺藜赤苓通草穭豆衣左慈丸三錢範驚動肝膽風陽與胃中之痰濁交互入絡營衛運行之氣上下升降之機阻窒礙滯周身皮膚肌肉關節麻木不仁胸脘不暢飲食無味口多涎沫頭昏心悸風陽抑鬱不伸痰濁瀰漫不化苔白而裂大便乾燥胃雖有濕而腸液已枯矣擬清火熄風化痰滲濕參以養血滋液羚羊蓯蓉干天麻決明半夏制南星麻仁澤瀉橘紅茯神當歸嫩鉤鉤薑汁竹瀝淵按飲食不化精微而化痰濁致胃濕腸燥由氣祕不行中焦升降失其常度耳某血枯肝風走絡左臂痠痛時作時止法當養血通絡制首烏當歸秦艽生苡仁桑枝丹參刺蒺藜茯苓穭豆衣杞子紅棗徐少腹之塊已平小便已利而反不禁索有肝風脾泄宿恙近增右手麻木脈象弦大而滑時覺痰多氣升此中氣已虛精血不足內風走絡脾濕生痰法當兼顧制首烏懷山藥冬朮歸身白芍茯苓菟絲子沙苑子黨參半夏陳皮桑枝朱血與津液其原皆稟於胃胃氣虛則血少而風動風煽胃中則精液虧而火炎夫胃與大腸同屬陽明故上為牙痛左肩亦痛下則便艱而痔痛也頭眩心跳血虛故也擬養陽明氣血以滋津液為法制洋參柏子仁歸身麥冬升麻黃耆新會皮玄精石於朮茯神荷蒂淵按胃氣虛未必風動惟胃虛不能布化精微營陰失其資生灌溉始木燥風生上有牙痛下有痔痛津枯金燥風火交煽矣復診補氣血以止痛生津液以潤腸制洋參熟地黃耆於朮當歸柏子仁陳皮麥冬麻仁生穀芽錢外風引動內風頭偏右痛不能著枕用青空膏羌活柴胡防風川連酒炒甘菊焦山梔黃芩桑葉絲瓜絡鉤鉤薛頭風痛偏於右發則連及牙齦甚則嘔吐痰涎肝風襲於脾胃寒痰流入筋絡溫補泄化為法竹節白附子黃耆羌活刺蒺藜半夏吳萸制殭蠶鉤鉤淵按頭痛牙痛屬熱者多而亦有寒痰流絡用溫散者陳診脈左關獨弦滑風陽挾痰上擾陽明頭額偏左連及腮齒皆痛擬熄風陽兼清痰火羚羊角制殭蠶桑葉丹皮嫩鉤鉤甘菊花石決明鮮銀花藤刺蒺藜另細辛三分荊芥錢半生石膏五錢共研粗末泡湯漱口另乳香一錢沒藥一錢生南星一錢生半夏一錢殭蠶一錢冰片三分共研細末和入陳酒乾麵調敷蘇肝陰久虧風陽上擾不熄頭頂目珠皆痛痛則心嘈難過漾漾欲嘔多煩少寐大便燥結高年當春分節陽升勃勃之際自宜育陰熄風鎮逆寧神生地茯神阿膠沙參鮮首烏沙苑子麻仁棗仁甘菊麥冬石決明炙甘草復診耳目昏花初起多由風熱次則因於肝火久則必致陰虛此證已及半年其為陰虛陽亢無疑育陰以和陽壯水以制火是定法也大生地麥冬丹皮磁石茯神石決明焦山梔玄參棗仁沙苑子北沙參另磁朱丸二錢每朝鹽花湯送下華病久正虛陰陽兩弱坎離不交夜不成寐久臥於床不耐煩勞茲因舟行跋涉遠道就診忽然神糊不語兩手不定遮晴撏發煩躁不安診脈促亂飲食不進想由舟中熱悶鼓動風陽擾亂神明卒然生變姑擬熄風和陽安神定志冀得神清穀進或可再商生洋參茯苓丹皮沙苑石決明竹茹天竺黃棗仁嫩鉤遠志肉淵按痰濁為風陽煽動堵塞神明猝然不語須豁痰開竅豁痰如羚羊膽星竹瀝之類開竅如牛黃至寶蘇合之類隨證用之或者有濟蘇肝風上升於巔頂原屬陰虧痰濁彌滿於中宮多因脾弱目痛頭疼心嘈便結陰虧陽亢之徵舌苔濁厚納少噁心胃虛濁泛之象高年久病圖治實難勉擬一方備參人參半夏天麻橘皮玄明粉茯神沙苑鹽水炒磁石黃柏玄精石乾薑復診頭痛減而得寐苔薄白而帶灰火降則神安濕化則燥顯前方加減再望轉機前方去乾薑黃柏加知母北沙參姜竹茹三診頭痛雖減風陽猶未全平舌苔灰白痰濁仍未全化心跳若飢營陰虧而有火聞喧欲暈陽上亢而下虛擬養營陰以降火和胃氣而化痰參以鎮逆佐以寧神制洋參牡蠣茯神沙苑石決明半夏大生地陳皮杏仁竹茹玄精石某軍事倥傯勞心勞力眠食無暇感冒風邪引動內風犯胃凌上半邊頭痛嘔吐黃水擬去外風以熄內風兼和胃氣而化痰濕荊芥秦艽防風天麻石決明陳皮茯苓白芷甘菊鉤鉤半夏竹茹白蔻仁宋營血內虧不能涵木加以惱怒肝風暗動不時頭昏腳軟防其跌僕今宜養血熄風黨參當歸白芍川貝陳皮茯神棗仁香附橘葉砂仁石決明刺蒺藜淵按營虛由脾不化心不生黨參當歸補脾以生營砂仁橘葉快脾以疏肝余亦清金制木利氣養營者也朱水虧不能涵木陽升陰不上承時際春深木旺陽升之候是以寒熱頭痛胸痞少寐便結等證見也仿趙養葵法大生地砂仁拌茯神丹皮柴胡鹽水炒棗仁女貞子麥冬硃砂拌歸身陳皮生薑石決明紅棗淵按從逍遙散滲入滋水養肝頗有巧思某肝為風臟而主筋心為火臟而主脈心包絡與三焦相為表裡俱藏相火心包主裡三焦統領一身之絡此病起於病後心中嘈熱胸前跳躍繼而氣攻背脊如火之灼或大或小或長或短皆在經絡脊脈之中良由病後絡脈空虛相火內風走竄入絡非清不足以熄火非鎮不足以定風然而絡脈空虛使非堵截其空隙之處又恐風火去而復入故清火熄風填竅三法必相須為用也第此證實屬罕見醫者意也以意會之可耳仿仲景法羚羊角寒水石滑石紫石英龍骨石決明生石膏磁石赤石脂牡蠣大黃甘草各三錢上藥研末每服一錢一日三服用大生地一兩百合一兩煎湯調服詒按金匱中風門有候氏黑散風引湯二方其用意以填竅為主喻西昌論之詳矣讀者取喻氏之論觀之即識此方之意章經曰上虛則眩丹溪云無痰不作眩病機論曰諸風掉眩皆屬於肝是眩暈不出虛風與痰三者為患健忘筋惕虛與肝之病也吐痰干膩津液所化也從三者治之雖不中不遠矣生洋參天麻天竺黃川貝茯神牡蠣制南星石決明甘菊花牛膝女貞子嫩鉤鉤復診眩暈虛風兼夾痰前方布置已成斑病來心悸宗筋縮養血清肝理必參生洋參天竺黃天麻川貝嫩鉤鉤羚羊角石決明菖蒲茯神大補陰丸諸外風引動內風頭兩邊及巔頂俱痛咳嗽舌苔白身熱能食知味病在上焦古方治頭痛都用風藥以高巔之上惟風可到也荊芥一錢川芎八分酒炒杏仁三錢防風錢半甘菊花一錢淡芩錢半酒炒枳殼一錢羌活錢半藁本一錢上藥研粗末外加松蘿茶葉三錢分三服開水泡服另細辛三分雄黃一分研末搐鼻取嚏淵按古方清空膏一派升散全無意義可用之證甚少唐肝風太旺肝陰又虛氣旺則火動而風生陰虛則液虧而血弱血弱則心跳液虧則口乾火動故發熱風生則頭痛擬佐金以平木培土以熄風養血以柔肝益陰以退熱歸身丹皮鹽水炒北沙參吳萸三分拌炒棗仁陳皮冬朮土炒刺蒺藜穭豆皮茯神白芍橘葉李陰虧於下氣逆於上抑塞於中煎熬津液氣急痰凝病成煎厥本屬為難而藥必清滋效非容易所慮酷暑將臨外受炎蒸之熱內無寧靜之期則有甚加劇耳鮮生地棗仁豬膽汁炒玄參茯神女貞子牡蠣石決明羚羊角遠志甘草湯制竹茹淵按煎厥證內經述之世不多見大抵水虧木燥肝家風陽挾痰上擾阻氣機塞竅隧與肝風痰火有同類耳某右脈弦滑搏結左但弦小先曾吐血血未全止而復發癇厥此肝火沖激乘於肺則血上溢乘於脾胃為痰所遏則癇厥作焉此右脈之所以弦滑也左但弦而小腎水不足不能涵木法當壯水則木不亢而火平佐以化痰鎮逆治其癇厥也大生地鬱金北沙參茯苓天冬青黛水飛旋覆花代赭石石決明蛤殼麥冬丹皮每朝服指迷茯苓丸三錢開水下晚服六味地黃丸五錢鹽花湯下某經云年四十而陰氣自半也起居衰矣況五十乎此證肝腎陰虧於下風陽上升兼挾痰濁故去年二月起病先嘔而繼以頭眩心嘈至今不能全愈診脈浮弦而大按少力是屬升多降少上盛下虛久延慮其僕中法當養陰潛陽化痰並進然養陰補下當以丸劑潛陽化痰煎劑為宜更須自知靜養庶幾無事制首烏半夏女貞子蒸龜版漂刮淨鉤藤白芍石決明茯神刺蒺藜杞子青鹽拌炒陳皮每朝服八仙長壽丸五錢淡鹽湯送下某病原的系風陽走絡攻注疼痛實由肝鬱得之但口中甜膩胃家又有濕濁法必兼理為妥惟是絡脈之病不能速愈須耐心安守為囑羚羊角鉤藤刺蒺藜石決明枳殼茯苓池菊陳皮製半夏旋覆花猩絳雪羹某三焦相火挾肝陽而上升每日侵晨則氣自臍左而上衝心胸痞塞自覺胸中熱舌尖辣面色紅過午則氣漸下降至夜則安而火降則下或遺泄此皆無形氣火為患也推其原始由乎陰虛今則相火妄行蒸煉胃液成痰所以吐痰黏膩灰黑而咽嗌胃管之間常覺不流利也法當清相火導虛陽而下歸窟宅更佐以化痰鎮逆病來已久難期速效黃柏鹽水炒一錢二分桂心三分砂仁炒三分蛤殼一兩甘草三分知母鹽水炒一錢二分茯苓三錢川連鹽水炒四分玄精石三錢長流水煎詒按此方取交濟封髓之法用意極為精到惟病因肝腎不攝虛陽浮逆擬再加牡蠣龜版以攝下旋覆竹茹以清上似於病情更為周匝朱久有伏梁痞痛嘔酸之患是氣血寒痰凝結也自遭驚恐奔波遂至脘腹氣撐旁攻脅肋上至咽嗌血隨氣而上溢甚至盈碗盈盆兩載以來屢發屢止血雖時止而氣之撐脹終未全平近來發作不吐酸水而但吐血想久伏之寒化而為熱矣立方當從氣血凝積二字推求備候商用鬱金香附醋炒丹參茯苓炒黑丹皮蘇梗延胡索醋炒韭菜根汁一酒杯沖童便沖鮮藕另用雲南黑白棋子二枚研細末用白蜜調徐徐咽下淵按血從驚恐而來所謂驚則氣亂恐則氣下氣亂血逆必然之理棋子治何病未詳復診肝鬱化火胃寒化熱氣滿於腹上攻脘脅則血亦上出前方疏理氣血之壅病情稍效今以化肝煎加減蓋肝胃之氣必以下降為順而瘀凝之血亦以下行為安氣降而血不復升是知氣降而火降瘀化而血安必相須為用也鬱金三稜醋炒延胡索川貝青皮桃仁澤瀉焦山梔茯苓蘇梗絲瓜絡鮮藕鮮苧麻連根葉吳血色紫而有塊此屬肝火乘胃瘀凝上泛也仿繆仲醇法阿膠蒲黃炒丹皮白芍蘇子鮮生地降香大黃醋炒成炭藕汁黑山梔枇杷葉白扁豆詒按此肝火沖激於血絡所致最易留瘀致病故用藥如此若再加茜根炭三七似於瘀血一面更為著力某寡居十載愁腸苦心牙齦出血有時若癇其病已久茲一月前猝遭驚恐遂神糊語亂口吐紫血腹脹不食兩脈模糊難以捉摸此乃驚動肝陽神魂擾亂血隨氣逆是即薄厥之屬今兩足常冷陽升於上急以介類潛陽重以鎮怯冀其厥止再商川連吳萸炒牡蠣阿膠茯神棗仁石決明羚羊角龍骨茜草炭紫石英代赭石白芍金箔詒按病深且久病氣內涉於臟實難取效但就病論治隨證用藥已能處處尉貼自屬可存再診風陽稍熄神志未安仍從前法增損川連吳萸炒石決明牡蠣茯神龍骨遠志羚羊角紫石英阿膠棗仁白芍橘紅石菖蒲金箔另硃砂安神丸三錢某素有脘痛之疾逢節必發近則吐出鮮血當時脘痛服桂花露見效想桂能平肝香能理郁露則輕清故能清肝經之鬱熱今血從吐出仍屬肝逆乘胃犯肺仿仲醇法麥冬白芍蘇子阿膠丹皮炭玉竹藕節蘆根茅根枇杷葉三七徐喪弟悲哀太過肝陽升動無制初起病發如狂今則心跳少寐頭暈口乾略見咳嗽擬安神養陰清火降氣為法石決明丹皮棗仁茯神川貝北沙參廣橘紅麥冬玄參竹茹枇杷葉某茹素精枯液涸更兼便血傷陰去冬骨骱疼酸今又心懸如墜時或口不能言心中恐怖必大聲驚叫而後醒此風陽內擾震動君主火溢沖激也病出於肝關於心乘於脾故又腹脹也擬養陰柔肝而熄風陽佐安神和中久病宜緩調又宜常服膏滋方大生地八兩茯神三兩陳皮一兩五錢炙甘草一兩歸身二兩炒天冬二兩去心柏子仁三兩炒研沙苑子三兩龍齒三兩煅棗仁三兩炒研洋參三兩枸杞子三兩石決明六兩煅焦六曲三兩紅棗四兩桂圓肉四兩五味子一兩五錢炒研牡蠣三兩煅上藥煎濃汁用川貝末二兩蓮心粉二兩白蜜四兩收膏朝暮開水沖服一羹杓淵按精血兩枯肝燥火動故見證如是陳先嘔數日嘔止而發痙厥日必三五次此肝逆犯胃聚液成痰內風陽氣弛張痰亦從之為患擬清泄風陽兼和其胃羚羊角鉤鉤半夏陳皮黑山梔玄參石決明池菊花竹茹復診痙厥日數發口噤不能言而心中了了病不在心而有肝夫心為君主肝為將軍當其氣火風相煽之際一如將在外君命有所不受則君主雖明安能遽禁其強暴哉況胃為心子胃家之痰與肝家之風相助為虐舌紅碎痛一派炎炎之勢莫遏欲化胃痰先清肝火羚羊角大生地犀角茯苓生山梔天竺黃石決明玄參鉤鉤金箔棗仁川連炒竹油沖服薑汁沖服詒按議論明快立方尉帖擬去犀角加川連更為親切錢肝苦急急食甘以緩之生甘草一斤研末紅棗一斤將棗煮爛去皮核與甘草打和為丸每服三錢開水送下原注此人並無表證又不內熱一日數十痙服此二料即愈詒按前兩方是風火致痙者通治之方後一方是依經用藥但平實無靈機如此重病而服之竟效奇哉華病由喪子憂怒抑鬱肝火偏盛小溲淋濁漸至遺精一載有餘日無虛度今年新正加以左少腹睪丸氣上攻胸心神狂亂齦血目青皆肝火亢盛莫制也經云腎主閉藏肝司疏泄二臟皆有相火其繫上屬於心心為君火君不制相相火妄動雖不交會亦暗流走泄矣當制肝之亢益腎之虛宗越人東實西虛瀉南補北例川連焦山梔延胡索鮮生地赤苓沙參川楝子知母黃柏龜版芡實另當歸龍薈丸一錢開水送下詒按遺泄有專屬乎肝者此等證是也此方可引以為例附丸方川連鹽水炒苦參白朮米泔浸曬牡蠣共研末用雄豬肚一枚將藥末納入肚中以線扎好用水酒各半煎爛將酒藥末共搗如嫌爛加建蓮粉拌干作丸每朝三錢開水送下詒按此劉松石豬肚丸方也加川連一味某春脈當弦而反微是肝虛也肝虛魂不藏夜不得寐晝日當寤而反寐是胃虛也胃為兩陽合明之府胃虛則陽氣失明故晝日反寐補肝之虛以藏魂益胃之虛以補氣生熟棗仁茯神新會白黨參半夏生熟穀芽秫米白芍炙甘草淵按此等方案在古人亦不可多得孫病起有因藥投罔效初如伏暑之狀漸延勞瘵之形兩脈弦搏不柔兩目正圓直視舌心光紅如柿皮舌邊碎缺如蟲蝕時躁時狂時清時靜皆病之忌然亦病之常無足怪者狂躁時目中常見緑衣紅褲二童子或在床擾亂或出外遊嬉大似鬼附神憑懦者以為有剛者以為無皆非也大凡天下之事不外乎理而醫之於理為尤切細按病情全屬心肝兩臟鬱火變幻心藏神肝藏魂心屬離火其色赤肝屬震木其色青木火一升則神不守舍兩目正圓直視如痙掀衣煩躁如狂所見緑衣紅褲二童子得非神魂之出舍乎緑者青之變色也按內經大惑論有精神魂魄散不相得之文婦人臟躁條有悲傷欲哭象若神憑之說左氏論蠱惑之疾仲景載狐惑之病詳察此病根由必有所惑而不解惑之既久臟陰日傷陽火日勝精神魂魄散失以致變怪莫識昧者以為外來之邪魅不知即是臟內之神魂此真所謂大惑不解也聊備此說請質高明未知以為然否羚羊角一錢半犀角六分石決明一兩牡蠣三錢洋參一錢半丹參三錢玄參一錢半茯神三錢龍齒三錢煅虎睛一對獺肝四分磨沖金箔一張桃枝三寸柳支三寸另珠子血珀研末吹舌上津唾咽下原注此病服十劑後其鬼魅不見得全愈痰病吳上年夏季痰火迷心神呆語亂愈後至今復發現診脈浮小弱舌心紅而苔白語言錯亂哭笑不常憑脈而論似屬心風蓋由風入心經蘊熱蒸痰所致用本事方獨活湯獨活防風淡芩山梔玄參鮮地茯苓甘草橘紅竹葉石菖蒲膽星淵按心脾有伏痰積痰故見症如是詒按論證確鑿此為學有本源查許學士獨活湯原方僅有獨活防風茯苓三味相同此蓋用其意而不襲其成方也某寐中常坐起而不自知日間靜則磕睡此濁痰迷閉清陽陽氣鬱而不宣也膽星川貝茯苓陳皮枳實半夏黨參遠志菖蒲再診體肥多濕之人濕熱蒸痰阻塞肺胃喉中氣粗呼吸如喘臥寐之中常欲坐起仍然鼾睡而不自知所以起坐之故蓋痰阻氣鬱蒙閉清陽陽氣鬱極則欲伸故寐中欲坐起也病屬痰與火為患茲擬煎方開其肺痹另用丸藥化其痰火痰火一退清陽得伸病自愈矣射干橘紅冬瓜子杏仁桔梗象貝竹瀝薑汁葶藶子蘇子枇杷葉另黑醜取頭末三錢萊蔔子炒三錢檳榔炒三錢大黃酒炒三錢研末蜜丸作十二粒每午後一丸臨臥一丸噙化咽下詒按審病既得其真諦用藥自然入彀丸方中加入菖蒲膽星鬱金東丹等以開鬱墜痰較似得力某膽虛則神自怯氣鬱則痰自凝於是咽喉若塞氣短似喘偶值煩勞夜寐多魘無形之氣與有形之痰互相為患遂至清淨無為之府與虛靈不昧之神均失其寧謐之常欲安其神必化其痰欲壯其膽必舒其氣故清之化之和之益之必相須為用也沙參棗仁川連炒半夏膽星遠志茯神神麯石菖蒲橘紅金箔竹瀝薑汁另膽星三錢琥珀一錢金箔五張黑白醜取頭末各一錢五分上藥另研和一處共為細末每服三分橘紅湯送下又方黨參薑汁炒半夏膽星茯神遠志棗仁川貝橘紅蛤殼神麯竹瀝薑汁某痰之標在肺胃痰之本在脾腎腎虛則水泛脾虛則濕聚二者均釀痰之本也經曰脾惡濕腎惡燥脾腎兩虛法當滋燥兼行而痰戀肺胃又宜標本同治熟地茅朮芝麻炒陳皮川貝茯苓半夏紫菀詒按案語斟酌病機切實不泛用藥亦絲絲入扣用黑地黃法以兩補脾腎合二陳以和胃菀貝以利肺藥品無多而層層都到非有簡練工夫不能作此陸陽升頭痛心虛善忘痰火迷心若昧若狂安神定志人參可用而膩補且緩以其納少痰多也舒郁化痰川貝最妙而燥劫須忌以其舌苔乾白也潛陽熄風須參重鎮而收澀當戒恐反斂其痰也人參茯神川貝石決明蛤殼棗仁川連三分拌炒研復診脈細數懶言倦臥其為精氣神三者皆虛然舌苔白膩有痰且有飲再察神情靜則氣怠而若虛動則氣上而自亂是虛而有痰兼有火也火伏而痰不上升則靜靜則虛象現火動而痰升則躁躁則虛象隱非不虛也痰火為之起伏也治不越十味溫膽加減臨證各有心思悉關根柢參鬚川貝茯神棗仁石決明橘紅三診陰遏於外陽伏於內陰如迷霧陽若日光今陽為陰遏故沉沉默默而矇昧脈亦為之不顯有時陽光見晛則起坐而神清脈亦為之稍起頃之陰霾四合陽氣復翳則仍昏昏如寐前案謂有痰飲鬱於其中十味溫膽屢投不應再思病源起於頭眩心悸苔白多痰常服蒼朮見效近因神亂若癡多從事於痰火清滋重鎮陰勝於陽以致變幻然欲開陰霧法必通陽譬之離照當空而後陰霧始散議進仲景苓桂朮甘湯加味苓桂朮甘湯加遠志淵按此從喻氏寓意草得來昧者見神亂若癡從事於痰火不思心主陽神痰為陰物以陰邪遏其陽氣靈明為之蒙閉顛倒內經云重陽則狂重陰則顛顛狂二證未可混治世醫一見神志昏亂多從事於痰火由不讀內經耳何右關脈獨滑動如豆此有痰濁在中焦也中脘皮肉覺厚手足筋脈時或動惕痰走經絡之象法當攻補兼施朝服香砂六君丸三錢夜服控涎丹十四粒硃砂為衣陸素有痰飲咳嗽土弱金虛金虛不能制木並不能生水土弱不能御木之侮並不能生金而化痰病情有似風痰癱瘓足軟難行口流涎沫舌左半無苔口常不渴脈虛弦滑大便堅燥種種見症皆顯金土水不足而風痰有餘病根日久調之不易姑擬一方備採蓯蓉干半夏五味牛膝鹽水炒麥冬元米炒巴戟天麻仁熟地茯神陳皮肉桂竹瀝薑汁某心境沉悶意願不遂近因患瘧多飲燒酒酒酣之後如醉如狂語言妄亂及今二日診脈小弦滑沉舌苔薄白小水短赤大便不通渴欲飲冷昏昏默默不知病之所的因思瘧必有痰酒能助火痰火內擾神明不安此少陽陽明同病而連及厥陰也少陽為進出之樞陽明為藏邪之藪今邪並陽明瀰漫心包故發狂而又昏昏默默也仿仲景柴胡加龍牡湯主之柴胡黃苓半夏茯苓龍骨甘草牡蠣鉛丹菖蒲大黃竹瀝薑汁詒按病之來原去路一一指出藥亦的當某情志鬱勃心肝受病神思不安時狂時靜時疑時怯心邪傳肺則心悸不寐而咳嗽肝邪傳膽則目定而振栗其實皆鬱火為患也擬清心安神壯膽為主平肝和脾佐之川連茯神菖蒲龍骨遠志北沙參棗仁膽星川貝鐵落石決明豬膽一個用川芎五分研納入膽內以線扎好入煎詒按清心化痰涼肝鎮怯立方周到尉貼尤妙在川芎一味入豬膽內可以疏木鬱壯膽氣開後人無數法門也某肝火痰涎內蒙心竅外竄經絡時發癇證洋參制三兩天竺黃一兩明礬一兩首烏制四兩茯神烘三兩半夏一兩川貝二兩附子五錢雄精五錢辰砂五錢南星制一兩石決明煅四兩川鬱金一兩陳皮鹽水炒丹皮炒各二兩上藥為末用金箔濂珠血珀玳瑁獺肝羚羊角另研細末用鉤鉤三兩煎濃湯衝入竹瀝一杯薑汁一杓將上藥末泛丸每早服二錢橘紅湯送下詒按前方兼顧水虛此方專治痰火見證不同固各有所當也某肝風胃濕凝聚成痰每逢勞碌則氣逆而痰湧驟然昏迷少頃復醒醒後數日無力此屬癇類其原總由水虧不能涵木所致煎方無效宜用丸藥生地茯神山藥丹皮棗仁茯苓萸肉澤瀉磁石上藥為末煉蜜捻作小丸將後藥泛上半夏南星制陳皮青黛蛤殼鬱金石決明沉香珀琥上藥為末泛上前丸為衣曬乾每服五錢淡鹽花湯送下詒按作丸之法頗極精妙某情懷鬱抑元氣內虧心中難過虛火肝風上逆唇口腫痛頭眩耳鳴食少無力時常太息防其痰火神蒙之變非輕證也羚羊角沙苑子川石斛天竺黃石決明嫩鉤藤棗仁甘菊花玄參丹皮燈心復診痰火神煩不寐防患瘋癲枳實天竺黃石決明茯神羚羊角膽星川連竹瀝薑汁棗仁竹瀝達痰丸三錢開水送虛損丁先天不足督任空虛背脊高突足痿不行童勞痼疾頗費圖治長夏濕熱內蒸故前方以虎潛立法今秋陽漸薄當以溫煦奇經擬用青囊班龍丸增損班龍丸加龜版豬脊筋原注此病愈今已二十餘歲矣但駝背耳孟陰虛肝鬱骨蒸無汗勞損之根銀柴胡當歸丹皮白芍茯苓生地冬朮黑山梔桑葉二診內熱稍和脈數亦減腹中偏左有時作痛年已二九經事未通血虛肝鬱顯然慮延乾血勞損大生地八錢龜版三錢漂刮淨鱉甲三錢醋炙白芍二錢桂枝三分煎汁炒桃仁五分去皮尖炒黑阿膠一錢半蛤粉拌炒杏仁一錢半去皮尖炒黃牡蠣五錢煅地鱉蟲三個洗浸玫瑰花三朵原注此病全愈溫衛氣虛則灑灑惡寒營氣虛則蒸蒸發熱營衛並出中焦總以脾胃為主補脾胃則金有所恃不必治肝而肝自馴矣黨參冬朮當歸川貝玫瑰花黃耆茯苓白芍陳皮詒按為虛損證探原立論方亦精到趙血不養心則心悸少寐胃有寒飲則嘔吐清水虛火爍金則咽痛肝木乘中則腹脹此時調劑最難尉貼蓋補養心血之藥多嫌其滯清降虛火之藥又恐其滋欲除胃寒慮其溫燥劫液欲平肝木恐其克伐耗氣今仿胡洽居士法專治其胃以胃為氣血之鄉土為萬物之母一舉而三善備焉請試服之黨參冬朮茯苓半夏棗仁扁豆陳皮懷山藥秫米淵按土虛木燥積飲內生原木之所以燥由脾不運化精微而生營血以養肝木耳治胃一言最扼要詒按於無可措手中尋出養胃一法自屬扼要之圖擬再加白芍木瓜以和肝竹茹麥冬以清肺似更周匝復診陰虛則陽不藏水虧則木自旺金衰不能制木脾弱更受木刑久病不復便謂之損調補之外何法敢施黨參茯神棗仁熟地冬朮當歸陳皮川貝神麯五味子龍眼肉三診陽明為陽盛之經虛則寒栗少陰為相火之宅虛則火升咽喉燥痛耳鳴顴赤所由來也至於腹中撐脹雖為肝旺亦屬脾衰心跳少寐咳嗽短氣心營肺衛俱虛矣虛者補之是為大法虛不受補謂之逆候黨參懷山藥神麯玄參白芍大生地茯神棗仁陳皮侯病已兩月外皮不熱而脈微數急是里有熱也裡熱屬陰虛非關表邪並無頭痛惡寒愈散其邪愈虛其表故反增咳嗽也若謂濕熱亦似是而非夫濕熱蘊於中焦必有胸痞噁心見症此證無之其非濕熱明矣近來數日腹中不和大便溏且以和中為主兼理其脾肺再商治本可耳黨參茯苓木香廣皮砂仁冬木神麯川貝款冬花復診和補相投諸恙俱減惟脈數未靜究屬元氣真陰虧損但前之補在肺脾再參入腎藥兼養其陰以觀動靜黨參冬朮白芍穭豆皮蓮肉首烏歸身茯苓沙苑子穀芽馮病延半載骨熱不已鼻血時流周身骨痛營陰大虧虛火內亢脈沉搏數口燥渴飲勞損根深入夏防劇擬滋少陰清陽明大生地知母玄參地骨皮鱉甲石膏胡黃連黨參炙甘草麥冬佩蘭葉丁營陰內虧頭眩心嘈下午微寒內熱能食無力胃中有熱則消穀脾虛氣弱則無力也黨參沙苑子茯苓川連棗仁知母女貞子白芍冬朮麥冬竹茹詒按此虛損初萌之候因脾虛氣弱未便滋補耳張勞碌內傷脾倦怠而無力凜凜畏寒頻淅淅盜汗出咳多痰帶紅食少身無熱土衰金不生衛虛營不攝延來半載余勞損難調適炙甘草當歸白芍冬朮黨參懷山藥黃耆麥冬茯神五味子紅棗淵按此非勞倦傷中乃勞損傷精也所因不同見證亦異勿得混洽復診益元氣補脾土土旺而金自生氣足而力自足前方去甘草加陳皮生熟穀芽陳先後天俱不足痰多鼻血陰虧陽亢之徵納少腹疼土衰木橫之兆是以年將弱冠猶然幼稚之形面白無華具見精神之乏治先天當求精血之屬培後天須參穀食之方黨參茯苓冬朮陳皮黑芝麻懷山藥白扁豆炙甘草砂仁建蓮肉粳米上藥為末米飲湯調服加白糖少許棗湯調服亦可附丸方精不足者補之以味當求精血之屬治其腎也熟地菟絲子牛膝白芍鹿角膠山藥歸身五味子川柏杜仲甘杞子茯苓澤瀉天冬龜版丹皮山萸肉上為末用鮮紫河車一具洗淨煮爛將上藥末杵和為丸如梧子大每朝鹽花湯送下三錢詒按煎丸兩方亦尋常調補之法好在調補先後二天選藥精當一絲不雜錢心脾營陰內虧肝膽風火上逆內熱頭眩項間結核脈虛形弱治以養營然病由內生不易速效大生地洋參玄參歸身白芍石決明茯神嫩鉤鉤穭豆衣香附廣皮川貝十大功勞某咳嗽成勞最難治十藥神書傳葛氏生津順氣化痰濁補血安神分次第病經一載元氣虧節屆春分恐危殆安穀則昌古所言姑擬一方補脾胃玉竹懷山藥生苡仁白扁豆川貝茯苓甜杏仁款冬花生穀芽沙參某咳嗽發熱日久前投補益脾胃之藥六七劑穀食加增起居略健但熱勢每交寅卯而盛乃少陽旺時也少陽屬膽與肝相為表裡肝膽有鬱熱戕伐生生之氣肺金失其清肅脾胃失其轉輸相火日益熾陰津日益涸燎原之勢不至涸竭不止也其脈弦數者肝膽鬱熱之候也刻下初交夏令趁其胃旺加餐擬進酸苦益陰和陽清徹肝膽之鬱熱考古有柴前梅連煎頗有深意柴胡豬膽汁浸炒五分白芍一錢烏梅五分黨參三錢炙甘草四分淡秋石三分前胡一錢麥冬二錢川連鹽水炒五分薤白頭五分原注此方服後熱勢竟退此時已停經二月以後或熱或止喜其能食至四五月後方知其有孕詒按此等證最易認作虛損得此議論大開後人眼目又按此必有微邪伏於肝膽之間挾木火而發煎熬津液日就乾涸古人所謂營風者曹仁伯謂即是此證徐肺脾兩虛心營虧損咳嗽氣塞骨蒸夜熱脈形軟數面白無華勞損根深夏至防劇懷山藥茯苓棗仁川貝黨參五味子扁豆苡仁款冬花橘餅復診脈軟數為氣虛骨蒸心跳為血虛咳嗽頭眩面色痿黃脾肺兩虛之候也黨參扁豆陳皮五味子款冬花茯苓棗仁川貝炙甘草紅棗奚陽虛生外寒陰虛生內熱熱氣熏於肺則咳嗽咳久則音啞肺遺熱於大腸則肛門結瘍皆陰虛之為病也至於陽虛之說一則衛外之陽一則胃中之陽惟胃中陽虛嘔酸水痰涎證成勞損今當扶土生金黨參五味子川貝半夏金石斛茯苓麥冬扁豆陳皮炮姜地骨皮十大功勞復診投扶土生金法穀食反減夜熱增重乃胃陰失降虛陽外浮也夫脾宜升則健胃宜降則和胃為陽土生肺金今診左脈數疾為心肝陽亢之象肝火戕胃心火爍金宜其食減熱增夏令防劇金石斛黨參穀芽陳皮川貝石決明川連麥冬半夏沙參五味子茯苓三診前方退心肝之火養肺胃之陰其熱稍減而咳未平然此為肺虛而咳本非易治之證再從前法加減黨參川貝桑白皮五味子沙參麥冬炙甘草地骨皮石決明粳米四診咳嗽內熱俱減惟脈之細數不退仍為可慮黨參地骨皮茯苓白芍川貝五味子麥冬沙參炙甘草每晨服八仙長壽丸三錢開水送張左寸關搏指心肝之陽亢右關小緊脾胃之虛寒是以腹中常痛大便不實病延四月身有微熱是屬虛陽外浮近增口舌碎痛亦屬虛火上炎津液消灼勞損何疑當以溫中為主稍佐清上俾土厚則火斂金旺則水生黨參炮姜麥冬茯苓炙甘草五味子白朮燈心淵按坤土不能坐鎮中宮虛陽因而上浮未可以口舌碎痛輒進清降腹痛便溏脾土虛寒已著不得不溫矣詒按此陰虧而虛火上炎之證也方以理中合生脈法溫中清上兩面周到所云土厚則火斂金旺則水生見理極精非淺學所能學步王病後胃氣不醒脘腹飽脹近增寒熱噁心痰升氣逆咳嗆口乾阻塞咽嗌大便艱難小便短澀左脅有塊大如覆杯撐攻作痛此因脾胃不足肝木亢逆清氣不升濁氣不降攻消克伐元氣愈傷納穀大減津液日枯虛火內熾戕及肺胃漸見火升顴赤脈數內熱之象當成勞損宜以扶土為主升清降濁佐以瀉火清金俾得中氣安和自然飽脹漸解黨參升麻川連懷山藥延胡茯苓柴胡白芍杏仁枳殼通草陳皮半夏川楝子蘇梗薔薇露枇杷葉淵按痰升氣逆咳嗆雖有寒熱升柴不可用因攻克而元傷胃減仍以連楝苦寒延枳破氣毋乃矛盾欲望中氣安和其可得乎法雖從東垣得來但東垣不是如此用法用古人方須會其意若徒襲其貌適為所誤耳楊先咳嗽而四肢無力肺脾兩虛加以怒動肝木侮脾土益受戕脘腹胸脅撐攻曾經吐血乃心火乘胃胃中瘀血上溢大便溏薄每月必發寒熱數次姑擬扶土生金佐以平木異功散白芍川貝麥冬神麯五味子川連吳萸炒川朴沉香淵按乃土虛木橫而脹也川連川朴益其脹耳復診就脈數內熱咳嗽脘脅仍痛而論乃陰虛肝鬱成熱肺失清肅仍防吐血北沙參陳皮川貝延胡白芍金鈴子茯苓丹皮橘餅麥冬藕汁沖服朱陰虛肝鬱鬱火刑金咳嗽痰中帶血乳房頸間皆結癧痰心空嘈雜頭眩目花腰痠腿軟勞損之根治主養陰佐以化痰大生地歸身白芍阿膠茯神穭豆衣玉竹香附棗仁沙參石決明丹皮紫菀川貝鉤鉤女貞子藕節橘葉紅棗羊病本陰虛時當酷暑潮熱乾咳漸入損途養陰冀其退熱然藥宜輕不宜重恐過滋反傷脾胃也健脾可以加餐然亦不宜燥恐燥則劫爍肺陰也姑擬一方備正生洋參白扁豆五味子丹皮麥冬肉地骨皮生苡仁懷山藥沙參茯苓枇杷葉張十年前三瘧之後盜汗常出陰津大傷去秋咳嗽氣升痰中帶血至今行動氣喘內熱多汗食少無力脈虛細數勞損根深四君子湯五味子熟地焦六曲粟殼紫石英熟附子黃耆白芍麥冬復診肺主出氣腎主納氣腎虛不能納氣氣反上逆而喘痰飲留中加以汗出陽虛咳血陰虛內熱食少肺腎虛勞之候四君子湯麥冬紫石英熟附子丹皮大熟地半夏白芍沉香五味子粟殼烏梅淵按奪血毋汗奪汗毋血血陰也汗亦陰也何以言陰虛陽虛蓋汗出為陽氣失衛咳血為陰火所迫故有陰陽之分三診盜汗氣喘咳嗽脈細精氣兩虛舍補攝肺腎之外更將何法以治景嶽云大虛之證即微補尚難見效而況於不補乎前方加歸身牡蠣龍骨黃耆徐二月間吐痰帶血血止之後略兼乾咳交清明節咳嗽漸甚四月初身加發熱今診脈細數形容消瘦行動氣升此屬腎氣先虧於下復因勞碌感邪延綿不已慮成勞損靜養為佳阿膠牛蒡子炙甘草茯苓杏仁川貝款冬花南沙參蛤殼枇杷葉孫久有咳嗽血痰之恙今復肛門結瘍是肺遺熱於大腸脈數音啞勞損之根時當夏令火旺金衰頗有氣逆血沸之慮沙參地骨皮阿膠白芍麥冬白扁豆杏仁川貝枇杷葉丹皮白蜜二匙藥汁調服高脈沉取數其陰內虧其熱在裡勞損之候證見咳吐白痰心腹不時疼痛痛則氣滿得矢氣則稍寬病兼肝鬱據云咳嗽已及三年初無身熱則病從痰飲而始宜從痰飲氣鬱例治之法半夏炙甘草桂木茯苓冬朮陳皮川貝神麯歸身丹皮白芍香附沉香橘餅復診痰飲咳嗽發熱肺腎兩虧濕熱不化用苓桂術甘合二陳治其肺脾都氣丸兼治其腎可也苓桂朮甘湯合二陳加沉香杏仁川貝都氣丸四錢鹽花湯送下馮久咳痰稠上午發熱面色青黃左脈細數右脈軟弱病屬上損幸大便不溏尚未過中及下加謹調養交夏至節無變再議黨參炙甘草懷山藥麥冬五味子青蒿酒炒白芍桂枝三分拌炒川貝白扁豆茯苓棗仁煨生薑復診咳嗽脈細數前上午發熱今下午亦熱陰氣漸傷大便間或帶血脾氣虛也從景嶽理陰煎例扶過夏至節一陰來復病無增變庶幾可延四君子湯合生脈散加生地懷山藥白芍白扁豆川貝阿膠紅棗趙漏瘍日久陰津暗滲加以咳嗽氣耗考試勞神於是咳甚氣升便溏內熱音啞喉痛等等接踵而至脈象細數已成勞損夫精氣神為人身三寶一有所傷便為大患況三者皆虛乎敢謝不敏幸熟察焉沙參甜杏仁麥冬元米炒生甘草川貝茯苓白扁豆懷山藥十大功勞童年已十七天癸未通骨格瘦小先天不足也不時鼻衄虛火上炎也腹痛綿綿中虛木橫也曾見蛔蟲木橫則蟲動也此屬童損先天不足之證以後天補之難矣茯苓懷山藥陳皮當歸茜草炭烏藥冬朮白芍丹皮川椒烏鰂骨某失血後咳嗽音啞氣升則欲咳乃腎虛不納也熟地阿膠麥冬沙參川貝紫石英玄參藕再診腎氣稍納上氣稍平但咳尚未止四肢無力真陰與元氣虛而不復時當炎暑暑濕熱三氣交蒸虛體最易幻變保養為上用景嶽保陰煎生地熟地天冬麥冬沙參玉竹川貝五味子紫石英阿膠東白芍百合煎湯代水詒按前方用紫石英以鎮納腎氣此方用百合以清保肺金此用藥諦當處學者宜留意焉某先吐血而後咳逆喘急延及半載寒熱無序營衛兩虧舌色光紅陰精消涸不能右臥為肺傷大便不實為脾傷水落石出之時難免致劇北沙參茯苓扁豆玉竹五味子金石斛川貝百合麥冬功勞葉詒按上兩案均屬陰損已成之候調治不易奏效而此證大便不實難進清滋較前證更劇然用藥亦不過如此少年自愛者當慎之於早也內傷雜病王左脈空大腎水虧也倦怠無力脾氣弱也食少則陰虛陰虛生內熱證屬內傷補中益氣加黑山梔白芍朝服六味丸四錢淵按陰虛有二有營中之陰虛有腎中之陰虛營陰虛故從東垣六味地黃則治腎陰虛詒按補中益氣補脾氣六味補腎陰立法頗切實惟左脈空大方中升柴二味尚宜斟酌耳胡脈軟無力屬氣虛便溏食少屬脾虛乾咳無痰屬肺虛時覺口苦屬心熱移脾也宜十補一清四君子湯川連防風懷山藥陳皮澤瀉六神麯砂仁馮夜涼晝熱熱在上午此東垣所謂勞倦傷脾也上午熱屬氣虛用補中益氣湯補氣升陽補中益氣湯加神麯茯苓詒按論證立方如開門見山心目俱朗李病將半載寒熱奄纏前方補營兼以疏郁心悸腹脹仍然茲更便溏足腫是脾氣虛弱也脈緩無力當補其脾進歸脾加減法防風根黨參黃耆冬朮茯苓大腹皮歸身白芍棗仁木香荷葉蒂淵按可參入桂枝薑棗金骨格瘦小先天元氣不足夏秋寒熱至今不已脈細數弱氣血兩虧頭不痛而但身疼或口沃清水此胃氣虛寒也當商溫補仿東垣法黨參茯苓陳皮桂枝柴胡黃耆半夏神麯當歸乾薑砂仁淵按中氣虛寒少陽膽木之氣抑遏故寒熱糾纏升陽益胃湯恰合尤妙在加乾薑詒按少陽生氣被郁故寒熱不已東垣升陽益胃法用之恰合加乾薑者助胃陽也復診補中益胃溫衛氣開腠理諸恙皆減仍從前法前方去神麯乾薑加白朮白芍倪據述有時驚悸有時肌肉頑木或一日溏泄數次或數日一大便堅干難出惟小便常紅此心氣鬱結脾氣失運失運則生濕鬱結則聚火火則耗精濕則阻氣而氣機不利矣擬荊公妙香散加味補益心脾通達氣機立法西洋參黃耆茯神桔梗遠志懷山藥麝香調服辰砂木香川連鹽水炒炙甘草麥冬元米炒共為末藿香陳皮湯泛丸每朝三錢開水送下某費心太過中氣不足濕熱內蘊咽下至胸常若空空行動無力臀發濕瘡宜自安逸防其心跳頭眩冬朮半夏茯苓陳皮歸身砂仁黨參香附苡仁萆薢桑枝趙脈沉數手足冷胸悶食少脾胃衰弱大便乾燥者腸中之津液枯也法當溫中土潤大腸仿菟絲子丸加減吳茱萸淡蓯蓉花檳榔懷牛膝砂仁柏子仁川熟附陳皮菟絲子茯苓懷山藥淵按檳榔一味取其沉降直達下焦引領辛潤諸藥至大腸耳非欲其破滯氣也復診前方加火麻仁郁李仁當歸穆思慮傷脾之營勞碌傷脾之氣歸脾湯補脾之營也補中益氣湯補脾之氣也今將二方併合服之黨參黃耆冬朮茯神歸身炙甘草砂仁棗仁升麻柴胡製半夏木香陳皮詒按同是脾病而病原用藥確有氣營之別一經指點便覺頭頭是道薛腎氣虛逆非滋不納脾弱運遲滋則呆滯然則如何而可曰補腎之陽即可以轉運脾氣從仲景腎氣丸化裁大熟地附子三分炒五味子茯苓懷山藥肉桂心麥冬元米炒牛膝鹽水炒山萸肉陳皮紫石英破故紙鹽水炒胡桃肉詒按補腎即可以補脾益火以生土也用腎氣丸恰合丁病本陽虛土弱而乏生生之氣故脾胃大憊時當夏暑溫藥難投補脾雖不若補腎然酷暑鬱蒸濕熱用事不若補脾胃為穩高麗參陳皮冬朮炮姜茯苓白扁豆益智仁穀芽沈腎為缺胃虛亦缺缺之一證屬腎胃二經大抵陽氣欲升陰氣欲降腎虛則陽欲升而遲胃虛則陰欲降而緩故內經曰陰陽相引故數缺此兼胸背多汗足跟時脹氣血兩虧法當兼顧西黨參歸身黃耆冬朮茯神大熟地枸杞子麥冬川石斛蛤殼某風邪入絡小續命湯原注此證病後一日數次不能言語只要自己捏肩背即可漸漸而言也汪腎水不足君火上炎相火下熾心中如燔舌光如柿陽事易舉陰精易泄擬清君火以制相火益腎陰以制肝陽所慮酷暑炎蒸恐藥力無權將亢陽為害而增劇耳川連淡芩黃柏阿膠甘草大生地雞子黃一枚攪和沖服另雞子一個破頭納大黃三分蒸熟每日服一個復診投鹹苦堅陰降火以制亢陽心中之燔灼舌色之光紅已減三分之一然上午之身熱如燎者未退幸納食頗增苦寒可進再望轉機為吉川連大生地淡芩玄參蛤殼阿膠玄精石甘草雞子黃一枚沖服三診舌乾紅知飢善食水虧陽亢土燥於中鹹苦堅陰之劑雖衰其燔亢之勢未能盡除其焰時當炎暑濕熱與相火蒸騰擬復入清中固下仍不出鹹苦之例洋參甘草川連生石膏蛤殼大生地知母麥冬阿膠黃柏末豬膽汁丸三錢每朝開水送下一錢淵按胃氣未敗可任苦寒咸潤直折其炎上之火然亦須防胃敗虛損之所以難治者大都如此詒按君相交燔腎陰被灼所謂一水不能勝二火此證是也僅與壯水猶難勝任必得苦以泄之咸以制之而火乃退更得苦以堅之咸以滋之而陰乃復某營虛氣鬱營虛則內熱氣鬱則脘脹法以養營舒郁丹參香附川貝茯苓歸身棗仁陳皮牛膝首烏制續斷砂仁紅棗詒按此虛實互治之法吐血咯血鼻衄汪止血必須順氣氣降則血自下行而不上逆然須靜養為佳黨參三錢川貝母一錢半甜杏仁一錢半茯神三錢杜蘇子三錢麥冬一錢半懷山藥三錢鬱金一錢橘紅五分鹽水炒參三七五分藕一兩蓮肉五粒紅棗三個二診養肺胃之陰而降上逆之氣氣順而血自歸經矣今血雖止尚宜調攝靜養為是黨參三錢懷山藥三錢北沙參三錢川貝母一錢半茯神三錢麥冬一錢半甜杏仁一錢半蓮肉五粒桑白皮一錢半蜜炙紫菀一錢半藕一兩三診古人治咳嗽痰血血止之後多以胃藥收功以胃為氣血之源也此證下有遺泄腰痠乏力似宜兼固其腎然胃有痰濕其不喜滋膩可知今仿葛氏白鳳膏合補髓丹法靜心調攝懷山藥四兩烘茯苓二兩人乳拌蒸三次烘乾黨參二兩元米拌炒炙草一兩蓮肉四兩炒冬朮二兩蜜拌蒸曬七次烘乾阿膠二兩煬化龜版三兩漂淨炙酥沙苑子二兩鹽水炒牡蠣三兩煅藕節炭一兩陳皮一兩鹽水炒川貝母一兩芡實二兩炒陳京墨一兩杵碎研末上藥為末用烏嘴白鴨一隻去毛腸雜及骨但取鴨肉豬脊筋草四條放瓦罐中用陳酒煮爛搗如泥將上藥末杵和為丸如嫌干可加煉白蜜如嫌爛可加懷山藥粉丸如梧子大每朝服五錢空心棗湯送下葉血止咳不已脈沉帶數其根猶未去也蓋氣猶風也血猶水也咳則氣逆不順血亦逆而不順矣經絡不和血不寧靜必降其氣而後血不復升亦必充其陰而後火乃退耳大生地紫菀丹皮川貝赤苓玄精石甜杏仁沙參赤芍枇杷葉淵按此喻妙極從內經天暑地熱悟會得來尤血止乾咳陰虛也急以生津救肺沙參丹皮麥冬茯神五味子桑白皮蛤殼川貝鮮藕甜杏仁侯脈數血湧胃氣大虛胸中痞塞大便帶溏是痞為虛痞數為虛數咳血三月今忽沖溢唇白麵青斷非實火大凡實火吐血宜清宜降虛火吐血宜補宜和古人謂見痰休治痰見血休治血血久不止宜胃藥收功今援引此例人參一錢白扁豆一兩川貝三錢茯苓三錢藕汁一杯沖好墨汁三匙沖詒按此方於扶胃藥中參以止血之意固屬正治惟唇白麵青既見虛寒確據似宜於此方中參入炮姜等溫攝之品以斂浮陽而止血也復診脈數退血少止而反惡寒汗出蓋血脫則氣無所依氣屬陽主外衛虛則不固也最怕喘厄暴脫猶幸胸痞已寬稍能容納仿血脫益氣例經曰陽生陰長是之謂耳人參炒扁豆五味子炙甘草炮薑炭懷山藥藕汁詒按此方與前方同意以惡寒故加炮姜三診血脫益氣前賢成法今血雖大止而神氣益憊唇口面青怕其虛脫欲牢根底更進一層人參炮姜陳皮大熟地砂仁拌炒麥冬冬朮炒扁豆五味子附子秋石湯制灶心黃土煎湯代水詒按伏龍肝未審何意此方大意亦與第一方相似漸參溫補之意以防其虛脫故耳四診肝腎之氣從下泛上青黑之色見於面部陰陽離散交子丑時防脫勉擬鎮攝希冀萬一人參大熟地紫石英五味子麥冬肉桂茯苓青鉛坎氣詒按此方急於固脫故用藥如是五診血止三日痰吐如汙泥且臭是胃氣大傷肺氣敗壞而成肺痿痿者萎也如草木萎而不振終屬勞損沉疴外臺引用炙甘草湯取其益氣生津以救肺之枯萎後人用其方恆去薑桂之辛熱此證面青不渴正宜溫以扶陽但大便溏薄除去麻仁可耳人參炙甘草麥冬阿膠大生地炮姜五味子肉桂紫石英六診病勢仍然從前方加減前方去炮姜加制洋參詒按以後方均是復脈加減七診連進炙甘草湯病情大有起色但咳嗆則汗出肺氣耗散矣散者收之不宜再兼辛熱當參收斂之品人參大熟地沉香末拌炒炙甘草阿膠黃耆五味子粟殼大棗淵按如此險證一絲不亂景嶽所謂非常之病非非常之醫不能治某久咳失血精氣互傷連進滋補頗獲小效但血去過多驟難充復從來血證肺腎兩虛者宜冬不宜夏蓋酷暑炎蒸有水涸金銷之慮今交仲夏宜日餌生津益氣大滋金水之虛兼扶胃土則金有所恃且精氣生成於水穀久病以胃氣為要也制洋參大熟地麥冬黃耆懷山藥大生地五味子茯苓陳皮炙甘草白扁豆黨參詒按層層照顧可謂慮周藻密方中擬再加百合沙參復診血止胃稍醒仍守前法前方加粟殼蜜炙另用白芨一味為丸每朝服三錢朱中氣素虛兼患痰飲冬必咳嗽近勞碌感寒忽氣升吐血微寒發熱汗出心嘈其血必三日一來寒熱亦三日一作蓋熱邪內熾逼血上行病在三陰之樞恐其下厥上竭沖溢喘脫麻黃西洋參白芍麥冬五味子歸身炙甘草黃耆川貝荊芥炭茅根藕汁淵按汗出心嘈營陰虛矣麻黃總屬不宜邢先天不足之體曾發虛痰潰而將斂交春陽氣升發漸覺喉癢咳嗽二三日來忽然吐血今又大吐血色鮮紅診脈細促心嘈若飢一團虛火炎炎莫御用藥雖宜清降亦當預顧真陰否則恐血脫陰傷而暈生地沙參丹皮炭茜草炭小薊炭阿膠麥冬五味子朱茯神京墨汁三匙童便沖一杯復診照原方加川貝茅根三診節屆春分陽氣勃勃升動血證際此稍平復盛良以身中之肝陽應天時之陽氣上升無制故又忽然大吐急當休養其陰兼以清降所恐火愈降而陰愈傷耳羚羊角玄參鮮生地丹皮大生地茯神麥冬阿膠茜草炭石決明茅根藕汁側柏葉汁淵按降火滋陰亦不得不然之勢張陰虛內熱咳嗽痰紅脈數無神漸延勞損沙參白芍川貝丹皮白扁豆甜杏仁麥冬茯神丹參茜草炭百合一兩煎湯代水程咳嗽四年曾經失血今已音啞脈形細弱真陰元氣皆虧勞損根深藥難見效猶幸胃氣尚可大便未溏姑擬甘潤養陰希圖苟安而已北沙參麥冬杏仁川貝玉竹扁豆生甘草茯苓橘餅枇杷葉再診咳嗽止而失血音啞津液枯槁勞損成矣脈形細弱精氣兩虧內經於針藥所不及者調以甘藥金匱遵之而用黃耆建中湯急建其中氣俾得飲食增而津液旺冀其精血漸充復其真陰之不足蓋舍此別無良法也黃耆秋石水炒白芍桂炒去桂北沙參生炙甘草玉竹麥冬川貝茯苓橘餅詒按此與前方看似無聊應酬之作其實精到尉帖所謂舍此無良法也顧酒客濕熱熏蒸肺受火刑而失清肅之令咳嗽音啞吐血痰紅喉痹乾燥是皆肺火見證尚非全屬陰虛雖然火亢不息久必傷陰究宜戒酒為上治以清肅高源兼養胃陰為法沙參甜杏仁丹皮玄參山梔川貝茜草炭雞距子藕汁茅根某始由寒飲咳嗽繼而化火動血一二年來血證屢止屢發而咳嗽不已脈弦形瘦飲邪未去陰血已虧安靜則咳甚勞動則氣升蓋靜則屬陰飲邪由陰生也動則屬陽氣升由火動也陰虛痰飲四字顯然擬金水六君同都氣丸法補腎之陰以納氣化胃之痰以蠲飲飲去則咳自減氣納則火不升大生地海浮石拌炒半夏青鹽制麥冬元米炒五味子炒紫石英煅丹皮炒成炭牛膝鹽水炒懷山藥炒蛤殼打訶子茯苓青鉛枇杷葉蜜炙淵按咳血一證非盡由陰虛若痰飲久咳乃胃絡受傷胃氣不降血從氣逆而來治痰飲降胃氣血自止矣徒事滋陰恐氣愈逆而血愈多也詒按陰虛而兼痰飲用藥最難須看其兩不礙手處範脈虛數兩尺愈虛心肝脾胃俱受其病惟腎獨虛心肝火亢肺胃受戕痰由濕生血隨氣逆咳嗽黃痰帶血掌中覺熱法宜養腎之陰以清心肝之火而肅肺胃之氣大生地海浮石拌丹皮炭沙參川貝茯苓白扁豆甜杏仁茜草炭生苡仁藕節阿膠米粉炒枇杷葉某咳嗽吐血晡熱便溏腹中有塊攻痛肺腎陰傷脾陽復弱肝木橫於中矣飲食少納倉廩空虛心如懸罄何恃不恐黨參白芍吳萸三分拌炒懷山藥棗仁川貝新會皮款冬花丹皮炒焦茯神沙苑子生穀芽許形寒飲冷則傷肺兩寒相感中外皆傷故氣逆而咳嗽也咳而欲嘔曰胃咳加以用力勞動陽絡受傷痰中帶血久而不已易入損門旋覆花代赭石杏仁丹皮鬱金橘紅半夏曲款冬花紫菀茯苓枇杷葉朱操勞思慮陰津元氣內虧脾失運而生痰肺失降而為咳痰中帶紅時生內熱勞損之根勿得輕視大熟地川貝生苡仁懷山藥丹皮炒焦甜杏仁麥冬茯神半夏枇杷葉呂脈數左寸獨鋭心經有火吐血不止法宜清養犀角鮮生地淡芩阿膠蒲黃炒丹皮炒焦山梔杏仁茜草炭茅根藕節龐去秋咳嗽些微帶血已經調治而痊交春吐血甚多咳嗽至今不止更兼寒熱朝輕晡甚飲食少納頭汗不休真陰大虧虛陽上亢肺金受爍脾胃傷戕津液日益耗元氣日益損脈沉細澀口膩而干虛極成勞難為力矣姑擬生脈六君子湯保肺清金調元益氣過夏令再議生洋參沙參麥冬五味子白扁豆製半夏茯神陳皮炙甘草枇杷露一小杯沖服野薔薇露一小杯沖服原注生脈散保肺清金六君子去朮嫌其燥加扁豆培養脾陰土旺自能生金也不用養陰退熱之藥一恐滋以膩腸一恐涼則妨胃耳從來久病總以胃氣為本經云有胃則生此其道也詒按此平正通達調補方之久服無弊者雷久咳帶血今又音啞咽痛此怒動肝火肺失清肅所謂金破不鳴宜培土生金稍佐降火沙參甜杏仁白扁豆玄參茯苓桔梗生苡仁蟬衣川貝玉竹豬板油同蜜煬化沖服白蜜華咳嗽內傷經絡吐血甚多脈不數身不熱口不渴切勿見血投涼法當益胃擬理中加味黨參元米炒白扁豆炒焦炙甘草炮姜白芍歸身炭血餘炭丹皮炭杏仁藕節陳粳米詒按見識老到立方精卓薛吐血鼻血牙血發斑斑中出血陽明之火極熾而腹滿濡軟少陰之氣不運病已三月血有間斷有瘀血在腹中故也食少身熱脈數其陰已虛擬養陰化瘀清胃和中大生地五靈脂醋炒歸身炭犀角白芍炮薑炭茜草炭茯苓丹皮炭焦山梔荊芥炭延胡索醋炒陳皮鹽水炒鮮藕復診血上下溢責之中虛而邪復擾之血去既多餘熱上熾鼻血時流便血時下中州之擾猶未已也安中州清熱邪理中湯加味治之西洋參元米制白朮炭牛膝炭黃芩炙甘草茜草炭丹皮炭炮薑炭赤苓百草霜伏龍肝淵按脾陰虛而伏熱擾血分黑歸脾黑地黃最合某吐血時發自止陽絡受傷或夾瘀凝而然不足慮也血止之後喉癢乾咳卻不相宜夫乾咳則氣逆而火動火動則難免其血之不來倘加內熱易入損途刻下胃納甚少先議養胃陰一法川石斛丹皮鬱金茯苓炙甘草麥冬生苡仁沙參川貝鮮藕白扁豆薛痰飲久咳咳傷肺絡失血脈不數舌苔白不必過清但順氣化痰氣順則血自歸經痰化則咳嗽可止蘇子杏仁川貝茜草炭鬱金桑白皮丹皮蛤殼藕節冬瓜子枇杷葉淵按非但不可過清直不宜清耳仲景云痰飲須以溫藥和之可謂要言不繁郁歷春夏秋血證屢發診脈虛弱形容清瘦年方十七精未充而早泄陰失守而火升異日難名之疾恐應褚氏之言治宜滋水降火須自保養為要大生地生洋參丹皮炭茯神白扁豆炒焦懷山藥茜草炭阿膠蒲黃炒麥冬茅根蓮肉鮮藕錢內則陰虛有火外則寒邪深襲失血咳嗽又兼三瘧病已數月瘧來心口痠痛胸腹空豁難過經云陽維為病苦寒熱陰維為病苦心痛此陰陽營衛之偏虛也擬黃耆建中法和中藏之陰陽而調營衛復合生脈保肺之陰復脈保腎之陰通盤合局頭頭是道矣歸身炭炙甘草大生地砂仁炒五味子鱉甲黃耆青蒿沙參白芍桂枝三分拌炒阿膠麥冬煨生薑紅棗淵按三瘧寒熱並非陽維為病心口痠痛難過乃胃有寒痰肝有蘊熱肺胃失順降之常再襲寒邪而咳血矣膩補之方恐不相合詒按正虛而兼寒邪故立方如此顧頭痛嘔血皆在上午陽經之火無疑法以清降犀角羚羊角麥冬石決明生石膏知母丹皮炒焦竹葉鉤鉤復診清泄陽明之火頭痛已減仍用前法羚羊角玄參生石膏麥冬澤瀉知母石決明淡芩生甘草殷肝胃不和脘痛嘔酸兼以酒濕熏蒸於胃胃為多氣多血之鄉故吐出瘀血甚多血止之後仍脘中作脹嘔吐酸水法宜調和肝胃切戒寒涼製半夏陳皮鬱金烏藥桃仁泥延胡炮薑炭茯苓香附蘇梗雞距子詒按此與陰虛失血不同更兼氣鬱濕阻故用藥如是李傷酒吐血血出於胃雖屬無妨其陰久虧擬和胃降火法鮮石斛川貝丹皮白扁豆茯苓山梔白芍沙參炙甘草玄參茅根鮮藕某飢飽勞傷其病在胃胃為多氣多血之鄉胃傷則血從吐出擬和胃降氣化瘀法沙參生苡仁丹皮炒焦茜草炭杏仁鬱金炙甘草桃仁泥白扁豆茯苓藕節某素患嘔血血止復發現有胸痛時時噯氣舌苔白膩脈細而遲此胃中有瘀血挾痰濁為患也旋覆花鬱金杏仁紫菀栝蔞仁代赭石茯苓貝母降香枇杷葉詒按血證中之變例擬加丹參桃仁某少陰水虧陽明火亢鼻血不止擬玉女煎合四生飲法生地黃鮮地黃龜版石膏知母玄參北沙參懷牛膝茜草炭血餘炭茅根汁側柏葉汁鮮荷葉汁艾葉汁詒按案方俱精潔不支便血某痔血雖自大腸來也屬脾虛濕熱至於大瘧古云邪伏三陰薛立齊云三陰者脾也上午瘧止直至今夜復作未免又有暑邪內伏近日痔血相兼為患擬用清暑益氣湯加味內化濕熱外解新邪總以益氣扶中為主俾中樞一運自然內外分消矣黨參炙草黃耆蒼朮冬朮當歸麥冬五味青皮陳皮神麯黃柏葛根升麻澤瀉防風蜀漆赤苓煨姜大棗詒按宿病兼新邪而發須先治新感仍照顧宿病乃能得手此方是也經云三陰瘧疾此三陰專指太陰脾臟言與統指肝脾腎三臟者不同再診素有便血之證而患大瘧日久凡患大瘧其始必有寒邪邪入三陰大瘧成焉若陰虛之人寒久必化為熱熱陷三陰便血作焉而三陰之寒仍在也溫三陽之陽以少陽為始清三陰之熱以少陰為主然血既由大腸而出又當兼清大腸方用棉子肉內具生氣溫少陽之陽也鮮首烏性兼潤血清少陰之熱也柿餅灰性涼而澀清大腸之血也標本並治雖不中不遠矣棉子肉炒黑四兩柿餅灰四兩二味研末用鮮首烏二斤搗自然汁取汁去渣以汁調神麯一兩煮爛將上藥末搗丸每服三錢棗湯下詒按凡久病氣偏尋常湯藥性味牽制不能奏績必用性味專簡之方乃能見效此方即用此意某脾虛不能攝血便後見紅脾虛不能化濕腹臌足腫病根日久腎陰亦傷腎司二便故小便不利是皆脾腎二經之病也法以溫攝雙調熟地炮姜茯苓澤瀉陳皮車前子川朴茅朮五味丹皮山藥阿膠詒按凡脾腎兩傷者當斟酌於潤燥之間用藥極難古方惟黑地黃丸最佳方亦從此化出再診熟地茅朮炭白頭翁黃柏鹽水炒炮薑炭阿膠五味秦皮三診山藥川連酒炒澤瀉車前子茯苓川朴陳皮鹽水炒伏龍肝煎湯代水炒黑腎氣丸合黑地黃丸加阿膠龍骨鹿角霜益智仁原注第一方用黑地黃丸加阿膠治脾腎兩虛兼以攝其陰血第二方用白頭翁湯清厥陰之熱以止血第三方暗用平胃散以化濕治其腹鳴外合車前子澤瀉山藥仍用六味地黃意補其腎以利膀胱而通水道也又再加伏龍肝仍暗合黃土湯意治少陰便血層層回顧如此某便血腸燥脈大氣虛補氣則清陽自升清腸則便血自止黃耆炒黑防風根阿膠地榆炭當歸炭五味荷蒂炭另金銀花炒黑一兩柿餅灰一兩槐米炒一兩豬膽汁泛丸每朝服一錢詒按立方用藥頗有思路可取丸方尤佳某腸胃有濕熱濕鬱生痰熱鬱生火大便下血晨起吐痰熱處濕中濕在上而熱在下治上宜化痰理濕治下宜清熱退火用二陳合三黃為法半夏陳皮茯苓川連黃芩杏仁胡黃連地榆皮側柏葉百草霜詒按兩面周到於此可得上下合治之法某腸痔脫肛便血其根已久有時舉發而脈象細數營陰大傷面黃少神脾氣大困兼之腹中鳴響脾陽且不運矣一切苦寒止血之藥非惟少效抑恐礙脾擬東垣黑地黃丸法熟地砂仁拌炒炭一兩炮姜四分黃耆炙三錢茅朮米泔浸炒一錢五分五味炒一錢五分黨參三錢荷葉蒂四個二診原方加阿膠伏龍肝詒按方極正當凡陰虛而脾陽困頓者當取以為法蔣便血如射此屬腸風荊芥炭一錢五分白朮三錢淡芩三錢醋炒槐花三錢炒細生地四錢黨參三錢歸身炭一錢五分阿膠一錢五分蒲黃炒地榆炭一錢五分荷葉蒂二個另用棉子肉炙炭四錢柿餅炙炭一兩共研和每服三錢此方治諸便血皆效劉下焦濕熱腸痔便血腎囊作癢歸尾二錢苡仁三錢地榆炭三錢防風一錢五分槐米三錢炒銀花三錢細生地四錢鮮首烏五錢洗打皂角子二粒炙又丸方胡黃連三錢酒炒槐米二兩炒金銀花三兩甘草二兩苦參一兩枯礬五錢皂角子二錢炙上藥為末用豬膽汁三枚和煉白蜜為丸每朝服二錢開水下此方據病人云每發服之四朝必愈又敷外痔方五穀蟲炙為末加入冰片用木鱉子一枚將藥末和水磨敷漸化神效某久虛不能統血並不能轉運其氣是以便血時作而又腹微滿也吐出之痰結硬此為老痰乃濕熱所結法當兼理四物湯去川芎加黨參冬朮懷山藥陳皮龜版蛤殼荸薺海䖳淵按不能統血不能轉運其氣腹微滿皆脾虛也
