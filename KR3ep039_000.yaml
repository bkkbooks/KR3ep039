body:
  text: 臌脹水腫廉水腫初愈之後復感時令溫邪以致腫勢復甚更加脘痛煩躁壯熱氣粗小溲短少大便不通吳又可所謂因疫復腫者是也防加喘急神昏則危險立至擬方備商淡豆豉三錢黑山梔一錢半花檳榔一錢半淡芩一錢川朴一錢草果三分煨知母一錢半甘遂四分麵包煨澤瀉一錢半葶藶子一錢半研大黃三錢酒浸絞汁炒二診用達原加甘遂大黃梔豉加葶藶澤瀉水腫溫邪俱稍退幸能見效再望轉機淡豆豉黑山梔花檳榔川朴淡芩葶藶子澤瀉知母大腹皮赤苓冬瓜皮通草王濕熱素伏下焦皮膚頑癬近感風邪著腠理陡然寒熱面目上部先腫蔓延中下今大腹陰囊足脛悉腫據云陽物暴縮足冷似屬陰寒然鼻中熱氣上衝此乃陽被濕鬱氣不宣通非陽衰可比夫諸濕腫滿皆屬於脾而肺主一身氣化伸得肺氣宣通斯風與濕自然而解射干杏仁大腹皮苡仁茯苓桑白皮澤瀉冬瓜子通草絲瓜絡沉香琥珀枇杷葉淵按陽被濕遏肺氣不得宣通乃麻黃連軺赤小豆湯為的對五皮飲雖加杏仁射干恐仍不能開泄肺表復診鼻頭色微黑者有水氣腹滿足浮囊腫水泛而侮土也腹中氣攻脹痛土虛則木橫也欲泄水必崇土欲平氣必疏木吳萸炒川連沉香白朮葶藶子大腹皮茯苓香附陳皮川朴澤瀉淵按中焦陽氣傷矣左金非崇土之方肺失通調膀胱不化何不用桂枝且能疏木三診面黧腹腫脈沉而細此脾腎之陽不化水濕阻滯於中證防加劇姑且滲濕通陽肉桂炒白芍茯苓豬苓白朮大腹皮細辛澤瀉川朴陳皮焦六曲香櫞皮麥芽金風濕相搏一身悉腫咽痛發熱咳而脈浮擬越婢法麻杏甘石加赤苓腹皮通草詒按咳而咽痛肺有鬱熱故用越婢法復診風水者在表之風邪與在裡之水濕合而為病也其證頭面肢體浮腫必兼咳嗽故為風水更兼食積其腹必滿三焦不利法當開上疏中達下若不避風恐其增劇羌活防風枳殼杏仁大腹皮川朴茯苓橘紅澤瀉萊蔔子桑皮青蔥生薑淵按羌防不如麻黃專開手太陰之風水故古人有越婢麻黃赤豆等治表實腫脹無羌防等方也細參本草自無此等雜治詒按證屬外風與內濕相合故用藥從表裡兩解之法馮産後數十日忽發肝風心蕩不寐繼以血崩今周身浮腫氣逆不得安臥頭眩口不渴病勢夜重血虛氣勝木旺土弱也土弱不制水水反侮土土既受木克又被水侮是為重虛欲培土先補火佐以泄木即內經虛者補之盛者瀉之之義肉桂冬朮茯苓澤瀉大腹皮木香陳皮炮姜神麯通草血珀淵按溫而不燥補而不滯和養肝脾之氣以招失亡之血其脹自消朱腫脹已退脈象較前稍大汗出至膝而止陽氣有流通之象陰濕有消化之機今以溫理中州中州得運庶幾決瀆流通寒轉為溫否轉為泰矣然須調養百日庶無反復之虞熟附子冬朮茯苓通草桂枝焦六曲牛膝陳皮澤瀉姜皮復診腫脹由乎脾腎陽虛水濕偏淫通陽化濕水邪平方法原為對證面目四肢俱癟單單大腹膨脝更兼遺泄再傷陰久病恐難勝任桂枝陳皮冬瓜皮益智仁姜皮另六味丸三錢藥汁送下楊脈沉小便不利面目肢體大腹陰囊悉腫病屬裡水鼻中流血喉間略痛肺家有鬱熱也擬越婢湯蜜炙麻黃杏仁甘草石膏白朮赤苓澤瀉陳皮防己淡芩復診水濕侵於經絡外溢肌肉發汗利水諸法效而不愈今擬通陽滲泄五苓散加巴戟肉川朴車前子陳皮牛膝五加皮大腹皮姜皮王病後脾虛氣滯浮腫食少大便溏泄法當溫脾黨參茯苓澤瀉木香冬朮炮姜茯神神麯砂仁穀芽詒按病後浮腫屬虛故兼培補僧水腫自下而起腿足陰囊大腹胸膈咽喉無處不受其災泛濫莫御今先從上瀉下肺主一身之氣又曰水出高源古人開鬼門潔淨府雖曰從太陽著手其實不離乎肺也葶藶子杏仁川朴陳皮茯苓川椒目生薑大棗控涎丹每日服五分薑湯送下淵按水腫實證治法如是經云其本在腎其末在肺葶藶瀉肺椒目瀉腎控涎丹不及舟車丸合拍詒按病象已劇用藥自須從猛但控涎丹藥力猛鋭不宜過於多服須酌之孫瘡疥平面浮起漸至腹滿胸悶氣塞小便不利腫勢日甚水濕之氣一無出路證成瘡臌防加氣急發汗而利小便是兩大法門麻黃杏仁白朮澤瀉茯苓豬苓葶藶子川朴通草車前子姜皮復診腫勢已平小便通利前方加減防風白朮半夏茯苓陳皮澤瀉杏仁川朴通草葶藶子車前子姜皮蔥白頭何內有濕熱生瘡外受風寒浮腫風濕相搏證成瘡臌防加喘急防風羌活杏仁大腹皮橘紅赤苓桔梗荊芥川朴桑葉通草馮風水相搏一身面目悉腫咳嗽氣升不得臥證勢險重用越婢法麻黃生甘草杏仁石膏赤苓葶藶子澤瀉陳皮大腹皮生薑大紅棗復診用越婢法雖得微汗手腫稍退余腫未消咳嗽氣急良由勞碌之人脾胃不足氣不行運今以扶脾和中理氣宣達三焦冀其氣化流通冬朮生耆皮大腹皮防己陳皮防風茯苓皮冬瓜皮姜皮某産未滿月勞碌感寒遂患寒熱如瘧一日二三度發所謂太陽風瘧營衛不和故也自冬及春陽氣上升伏寒化熱漸見口渴彌月以來陰雨潮濕陽被濕遏不得宣越濕與熱合交蒸互郁更感風邪湊襲於肺驟加咳嗽氣急一身面目四肢大腹悉腫不得轉側大便溏泄小便短澀舌心苔干渴喜飲冷左脈浮洪右脈軟數病成風水而寒熱仍然且兼多汗勢頻於危殊屬棘手雖有成法可遵深恐鞭長莫及宗仲景風水例兼調營衛顧其元氣仍不出産後感邪方法備質高明商正黨參三錢茯苓二錢炙草三分冬朮二錢土炒歸身一錢半炒白芍一錢半煨姜一片蜜炙麻黃三分桂枝三分生石膏三錢打杏仁二錢大棗二個原注此八珍去芎地又桂麻各半湯越婢湯三方相合用八珍者産後病久營衛氣血交傷去芎地者惡川芎之升礙喘咳恐地黃之滯礙腹滿也麻桂各半和營衛以祛邪本治太陽風瘧汗多仍用麻黃者以喘嗽浮腫之故且有桂芍以監之參術以守之則不畏其散越但宣通其肺氣耳越婢之用乃風水浮腫喘而口渴之成法金匱又云內熱極則身體津脫腠理開汗大泄亦用越婢加朮湯輾轉回顧實有來歷亦出化裁非漫然從事也杜風水相搏一身暴腫上則咳嗽喉有痰聲下則溏泄小便不利發汗而利小便是其大法計不出此遷延匝月節近清明天氣溫暖肺胃久蘊之風從中暗化為熱反服腎氣湯方意欲通陽化水陽未通而陰先劫水未化而火反起矣於是舌燥唇焦齒黑心煩囊縮胸腹膚紅危險之象已造極中之極勉擬清肅肺胃存陰泄熱以冀轉機為幸生石膏杏仁通草茯苓皮豆豉麥冬北沙參川貝丹皮蘆根鮮薄荷根緑豆湯代水復診肺得熱而不降肝有火而上升胃居於中受肝火之沖激欲降不能而反上逆由是嘔吐不納矣昨用清金以通決瀆幸水道已通高原得清肅之令然中焦格拒艮陽失遊溢之權似宜轉運其中但肝火熾甚徒運其中無益也當清肝之亢以衰木火之威胃不受肝之克而中氣得和則嘔可以寧矣川連薑汁炒黃芩薑汁炒半夏澤瀉黑山梔陳皮竹茹薑汁炒茯苓皮川貝枇杷葉蘆根當歸龍薈丸三錢緑豆生薑湯送下淵按風水壞證也兩方應變俱佳王內有濕熱外著風邪風與水搏一身悉腫此屬風水當發汗羌活香薷陳皮防風赤苓焦六曲通草蔥白生薑駱瘡之濕熱與肝之氣鬱互結於裡近感風溫寒熱咳嗽驟然浮腫證屬瘡臌蘇梗杏仁川朴桔梗赤苓澤瀉枳殼橘紅大腹皮茯苓萊蔔子姜皮復診濕夾熱而生瘡風合濕而為腫風從外入故寒熱而咳嗽濕自內生故腹滿而氣急用仲景麻杏苡甘湯加味麻黃杏仁苡仁甘草川朴滑石連翹淡芩枳殼萊蔔子玄明粉薄荷葉共研粗末滾湯泡服三診四肢面目腫退而腹滿未寬在表之風寒雖解在裡之濕熱未治今擬寬中理濕赤苓苡仁陳皮大腹皮杏仁澤瀉萊蔔子川朴通草枳殼姜皮白火炎於上水溢高原肺金受邪面紅浮腫唇鼻俱赤而有皮爛之形腹部腿足亦腫三焦俱受其病矣行步咳喘邪在手太陰無疑用吳鶴皋麥門冬湯瀉火泄水為法麥冬冬瓜皮通草姜皮桑白皮絲瓜絡枇杷葉陳粳米淵按此水腫之變證也用輕清宣化上焦所謂輕可去實範下有濕熱上受風溫初起寒熱即便周身浮腫咳嗽氣塞似與風水同例擬越脾加朮湯麻黃葶藶子半夏赤苓焦白朮射干桑白皮通草杏仁大腹皮冬瓜皮姜皮諸面腫曰風足脛腫曰水蓋風傷於上濕傷於下氣道蘊塞肺失宣降脾失轉輸上則咳喘下則溲澀中則腹滿而水腫成焉證名風水載於金匱病在肺脾法以開上疏中滲下從三焦分泄二陳湯前胡射干川朴澤瀉車前子羌活桔梗桑白皮大腹皮通草姜皮範伏邪濕熱內蘊太陰陽明身熱腹滿面浮足腫兩膝痠痛小便短少擬通經絡以解表燥濕熱以清裡羌獨活防風川朴陳皮大腹皮苡仁柴胡前胡澤瀉赤苓淵按濕熱作脹病在太陰陽明脾胃從敗毒散加減以分疏其內伏之邪既有身熱宜佐苦寒一二味泄之所謂苦辛通降甘淡分利之法也某病起咳嗽咳止而反氣升入暮尤甚面跗龐然浮腫腹雖未滿而按之不軟此屬腎風蓋風邪乘虛而入於腎腎氣上逆故入暮而氣升為甚用五苓通膀胱導出腎中之邪加細辛以徹少陰之寒風晚上再進都氣丸以安其腎庶幾久蘊之邪得解而腎臟無傷切弗輕視此病須防腹滿之虞五苓散加大腹皮陳皮細辛肉桂另晚服都氣丸鹽湯送下詒按腎風之名出於素問風論其所列證狀與此不甚符合但理可相通此案所立治法也頗有精意蓋邪入於臟必借所合之腑為出路以五苓加味治其膀胱以導出腎邪隨用都氣以培腎臟之本邪正虛實之間面面周到率爾操觚者固不能辦此也朱時令水濕內襲與身中素有之濕熱相合驟然浮腫充斥上下三焦擬宣表瀉里之法以消其水香薷川朴通草大腹皮赤苓澤瀉杏仁滑石車前子萊蔔子葶藶子蔥白頭某痞塊由大瘧日久而結多因水飲痰涎與氣相搏而成久則塊散腹滿變為臌脹所謂癖散成臌也脈細如絲重按至骨乃見弦象是肝木乘脾也口乾小便短少是濕熱不運也匝月腹日加大急宜疏通水道泄木和中五苓散川朴薑汁炒川連青皮陳皮大腹皮木香車前子通草另服古方厚朴散川朴三錢薑汁炒枳殼三錢巴豆七粒合炒黃去巴豆木香三錢曬乾研青皮三錢醋炒陳皮三錢鹽水炒甘遂三錢麵包煨大戟炒三錢水浸曬乾乾薑三錢炒黃共為末每服一錢用砂仁車前子泡湯調下是治癖塊散大成臌之妙劑淵按此方誠妙但可施於正氣不虛者若久病及老年氣血衰弱之人恐目前稍松轉瞬而脹益甚將不可治用者宜審慎之詒按此治癖散成臌之妙劑凡遇此等證必乘早圖治若日久正虛便費周張矣録此以為臨證者一隅之取某暑濕伏邪挾積阻滯腸胃中州不運大腹驟滿腹中時痛痛則大便黏膩色紅如痢小水短少脈沉滑數是積之徵也擬大橘皮湯送下木香檳榔丸四苓散橘紅大腹皮木香木通滑石砂仁末川朴煎湯送木香檳榔丸三錢詒按病兼滯痢故須先從腸腑疏導復診氣與水相搏大腹驟滿脈沉小便不利大便欲泄不泄法以疏氣逐水香薷大茴香澤瀉萊蔔子赤苓大戟甘遂枳殼黑白醜生薑詒按此方專逐水積力量頗猛想其正氣尚旺故可放手用之孫脾虛脹滿面浮足腫小便不利脈形細數元氣大虧慮其喘急之變黨參元米炒牛膝茯苓巴戟肉澤瀉鹽水炒陳皮車前子冬朮土炒懷山藥苡仁杞子炭生熟穀芽某腹但脹而不滿者屬氣乃木乘脾土也川連薑汁炒香附砂仁川朴青皮茯苓焦六曲懷山藥陳皮澤瀉淵按黃連治脹乃開中州濕熱也土虛木乘之脹大非所宜陸瘧後濕熱內蘊於脾胃之中熱上蒸為口糜濕內蘊而為腹脹姑先和中清化為法川朴川連焦六曲赤苓大腹皮枳殼澤瀉黑山梔陳皮砂仁淵按連朴此證甚合詒按案方俱平正通達特未知能否奏效耳張木旺乘脾腹脹如鼓形瘦脈細證屬單脹法當溫通淡乾薑茯苓川朴砂仁懷山藥陳皮吳茱萸澤瀉大腹皮金匱腎氣丸五錢開水送淵按虛脹治法川朴易黨參則善陶年甫十三斷無憂鬱之理而腹滿如臌微微內熱將及兩月其義何居良以童心太甚飢飽不調冷熱不節向有胃寒嘔酸之疾今反不嘔腹漸脹大飲食不納內熱時生是非勞碌傷脾而失運乃寒飲停聚而腹脹也脾虛故內熱生單單腹脹名之單脹然治法不同也今以溫利中州稍佐苦泄取柔中之剛能平胃而和脾黨參茯苓半夏陳皮白芍川連吳萸炒炮姜澤瀉川朴冬瓜皮淵按飲食不節傷脾脹宜佐消導如雞金谷蟲之類秦腹暴脹足腫納食則脹益甚濕熱挾氣填塞太陰臌脹重症川朴赤苓大腹皮青皮澤瀉枳殼黑醜山楂炭甘遂麵包煨通草生薑復診腹脹稍寬足仍浮腫運脾化濕冀其漸平川朴赤苓大腹皮川椒目蒼朮澤瀉陳皮焦六曲黑醜通草枳殼生薑淵按二方乃濕熱實脹治法三診腹滿月餘得食則脹甚兩進攻消運脾之法胃脘之脹已松大腹之滿未化再議疏通消導旋覆花五加皮赤苓澤瀉檳榔黑醜雞內金木香通草砂仁詒按此三方治腹脹之由乎濕積者初起通用之法沈先泄瀉而後目盲服單方目明而漸腹滿是脾虛木橫又服草藥寒性傷中病成臌脹其根已久恐難驟效焦白朮冬瓜皮川朴茯苓陳皮澤瀉焦六曲大腹皮砂仁苡仁陳香櫞皮楊兩尺脈滑濕熱積滯在於下焦小便不利大腹脹滿是下焦不利中焦氣不通也肉桂赤苓豬苓白朮澤瀉大戟神麯陳皮冬瓜皮姜皮朱腹滿面黃足腫近因戽水受寒又加疝痛脾虛有濕腎虛有寒防其疝氣上攻大腹益滿平胃散去甘草加茯苓小茴香神麯吳茱萸張痢後陽虛水濕不化腹滿面浮足腫而色青黃脈來虛細慮延臌脹重症川熟附豬苓茯苓白朮黨參上肉桂澤瀉陳皮神麯砂仁詒按病後陽虛腫脹故用胃苓法加溫運之品復診溫通脾腎之陽疏利決瀆之氣冀其脹消腫退熟附子肉桂白朮豬苓澤瀉茯苓皮冬瓜皮川朴陳皮通草淵按兩方治半虛半實乃通陽泄水法廉脾有濕熱積氣漸漸腹滿足腫納食則脹證成氣臌白茯苓川朴白朮苡仁蘇梗五加皮澤瀉陳皮砂仁通草奚濕熱內阻腸胃之間橫連膜原膜原者臟腑之外肌肉之內膈膜之所舍三焦決瀆之道路邪留不去是為腫脹脹屬氣腫屬水是必理氣而疏決瀆以杜腫脹之萌黑白醜各五錢萊蔔子一兩砂仁一兩用葫蘆大者一枚將三味納入再入陳酒一大杯隔湯煎一炷香取出葫蘆中藥炒研為末再以葫蘆炙炭共研和每晨服二錢詒按立方取義頗佳凡腫脹初起者可以取用惠濕傷脾腎之陽先腰痛而後足腫脘中作痛口沃酸水用甘姜苓朮湯合五苓散加味甘草乾薑茯苓白朮豬苓澤瀉肉桂半夏陳皮通草五加皮淵按沃酸一證內經言熱東垣言寒究竟辛通藥最效復診前用辛溫通陽甘淡祛濕脘痛足腫嘔酸等證皆除惟跗腫未退減其制以調之白朮茯苓澤瀉川斷苡仁牛膝陳皮通草桑白皮五加皮薛先足腫而後腹滿面浮寒濕傷於下而漸上攻也通陽化濕以利小便立法桂枝澤瀉陳皮川朴桑白皮萊蔔子五加皮茯苓皮半夏大腹皮姜皮尤脾虛木橫腹中結癖寒熱似瘧延及半載惟脾虛則營衛不和故寒熱惟肝橫則氣血凝滯故結瘕今食少便溏舌紅口渴大腹日滿足跗浮腫形肉瘦削脾腎陰陽兩傷際此火亢金衰之候火亢則陰益虛金衰則木無制深秋水土敗時慮其增劇急宜健運和中稍兼消暑喻嘉言所謂剛中柔劑能變胃而不受胃變此法是矣冀其脾胃稍醒為吉連理湯加陳皮尤瘧止之後腹脹足腫濕熱內歸太陰防成瘧臌但小便清利是屬脾虛擬厚朴溫中湯加味川朴茯苓陳皮乾薑草豆蔻冬瓜皮木香半夏姜皮某病由肝鬱木橫剋土濕熱不化先有淋濁愈後漸漸腹脹左肋微覺隱痛身微有熱脈象細弦木鬱不達慮延鼓脹勿輕視之柴胡茯苓白朮香附川芎山梔神麯丹皮白芍青皮川朴香櫞另左金丸詒按立方精當雖不見出色而已恰到好處陸經停一載有餘肝氣不時橫逆胸脘脅肋疼痛嘔吐酸水大腹日滿青筋綻露此屬血臌蓋由肝氣錯亂於中脾土受困血海凝瘀日積月大狀如懷子而實非也今病已極深藥力恐難見效川楝子丹參歸尾香附鹽水炒延胡索五靈脂醋炒陳皮砂仁紅花淡吳萸蕭腹滿口舌乾燥仲景云此腸間有水氣渴欲飲水水入即吐名曰水逆食已即吐名曰格塞今兼此三者是寒飲水氣伏留於腸胃也病已四五年非一旦可去即宗仲景法彙集而加減之防己赤苓川椒目澤瀉川連大腹皮桂木焦白朮乾薑豬苓半夏白蔻仁吳內經有石瘕石水之證多屬陽氣不布水道阻塞少腹有塊堅硬者為石瘕水氣上攻而腹滿者為石水此症初起小便不利今反小便不禁而腹漸脹滿是石水之象考古石水治法不越通陽利水淺則治膀胱深則治腎久則治脾茲擬一方備採四苓散去豬苓加大腹皮陳皮川朴桑白皮烏藥桂枝雞內金朝服腎氣丸三錢詒按煎方治膀胱丸方治腎方中桂枝擬改肉桂積聚馬心之積名曰伏梁得之憂思而氣結也居於心下胃脘之間其形豎直而長痛發則嘔吐酸水兼夾肝氣痰飲為患也開發心陽以化濁陰之凝結兼平肝氣而化胃中之痰飲桂枝石菖蒲延胡索半夏川連吳萸炒茯苓川楝子陳皮蔻仁鬱金瓦楞子詒按論病立方精到尉貼陳病起逢食則厄食入則脹今臍上至心下一條脹痛坐久則知飢行動則飽脹此屬伏梁胃為心之子故胃亦病也仿東垣五積治例川連吳茱萸乾薑陳皮香附半夏茯苓丁香延胡索五靈脂淵按所謂食厄也病在腸胃唐經停十月腹微滿脈沉細澀臍上心下塊長數寸是屬伏梁因七情恚怒氣鬱痰凝所致經曰大積大聚其可犯也衰其大半而止潔古謂養正積自除不得過用克伐今擬開鬱正元散法理氣行血和脾化痰寓消於補之中二陳湯歸身川芎冬朮山楂炭香附延胡索麥芽蘇梗砂仁茺蔚子金臍以上有塊一條直攻心下作痛痛連兩脅此屬伏梁為心之積乃氣血寒痰凝聚而成背脊熱而眩悸營氣內虧也法當和營化積當歸半夏瓦楞子香附丹參茯苓陳皮木香延胡索川楝子砂仁淵按眩悸亦寒痰為患未必即是營虛否則背脊之熱何來詒按方亦平穩慰帖復診投化積和營伏梁之攻痛稍緩背脊之熱亦減仍從前制前方去茯苓瓦楞子木香加茯神玫瑰花丁肝之積在左脅下名曰肥氣日久撐痛川楝子延胡索川連青皮五靈脂山楂炭當歸鬚蓬莪朮荊三稜茯苓木香砂仁詒按用藥精當復診左脅之痛已緩夜增咳嗽寒熱邪氣走於肺絡宜肺肝同治旋覆花杏仁川楝子荊三稜茯苓款冬花半夏新會皮蓬莪朮猩絳青蔥管詒按暢氣疏瘀平肝通絡此等證用藥不過如此丁久患休息痢止數日後氣攻胸脘板痛上下不通幾至發厥須大便通始減其痛匝月以來大便僅通三次板痛者聚而成塊偏於右部是脾之積也脈沉緊而細面色晦滯陽氣鬱伏濁陰凝聚當與溫通熟附子淡乾薑川朴陳皮茯苓香附大腹皮延胡索沉香化氣丸東垣五積丸復診大便已通脘腹之塊未化脈象沉弦而緊面色之晦滯已明陽光一晛陰凝漸通之象仍以溫通附子乾薑陳皮茯苓木香砂仁通草水紅花子白螺螄殼詒按凡陽氣鬱伏者與陽虛不同於溫藥中宜兼清泄之意乃妥米右關尺牢弦腰腹有塊攻痛是肝腎之積在下焦也用緩消止痛法肉桂雄黃尖檳榔共研細末用獨頭蒜搗丸早晚服各五丸開水送淵按雄黃散結檳榔破滯肉桂溫散下焦沉寒痼冷又能溫脾疏肝丸以獨蒜以濁攻濁深得制方之妙金氣從少腹上衝咽嗌則心中跳脅中痛初起寒熱而嘔此奔豚氣之挾肝邪者也半月以來寒熱雖止氣仍上逆脈沉弦小宜宗金匱法二陳湯去甘草加當歸白芍吳茱萸香附川朴檳榔蘇梗沉香薑汁東行李根復診奔豚之氣漸平脘中之氣未靜當從肝胃求治淡吳萸半夏香附川楝子延胡索茯苓焦六曲陳皮白芍蔻仁王腹中癖塊漸大如盤經事不來腰痠帶下此屬營虛氣滯瘀積內停近日水瀉傷於暑濕當先治其新病平胃散去甘草加芍藥香附吳茱萸焦六曲復診腹塊如覆盤上攻則痛下伏則安足跗浮腫時時沃酸從肝脾胃三經主治川楝子延胡索吳茱萸川椒木香蓬莪朮制香附陳皮茯苓川連薑汁炒三診腹中結塊內熱微寒四肢無力口沃酸水肝脾氣鬱營衛兩虧勞損之象黨參香附當歸丹參川楝子延胡索川椒冬朮乾薑青蒿梗神麯大棗淵按內熱微寒乃肝脾鬱結肺金治節不行營衛不調也宜參逍遙左金法華脾虛胃弱則濕熱不運而生痰痰停中脘則食不化而成積胃脘結塊按之則痛面色青黃木乘中土飲食少納慮延脹滿黨參薑汁炒半夏陳皮川朴茯苓砂仁白芥子山楂肉六曲雞內金馮脈右關滑動舌苔黃白而膩是痰積在中焦也左關弦搏肝木氣旺故左肋斜至臍下有梗一條按之覺硬乃肝氣入絡所結尺寸脈俱微緩泄痢一載氣血兩虧補之無益攻之不可而病根終莫能拔根者何痰積濕熱肝氣也夫濕熱痰積須借元氣以運之外出潔古所謂養正積自除脾胃健則濕熱自化原指久病而言此病不謂不久然則攻消克伐何敢妄施茲擇性味不猛而能通能化者用之人參茯苓於朮青陳皮炙甘草澤瀉枳殼神麯茅朮當歸土炒黃耆防風根白芍吳萸三分煎汁炒又丸方製半夏三兩分六份一份木香二錢煎汁拌炒一份白芥子二錢煎汁拌炒一份烏藥三錢煎汁拌炒一份金鈴子三錢煎汁拌炒一份豬苓二錢煎汁拌炒一份醋拌炒炒畢去諸藥僅以半夏為末入雄精三錢研末麝香一分獨頭蒜三個打爛用醋一茶杯打和為丸每晨服一錢五分開水送淵按製法極佳通化肝脾之痰疏利肝膽之結丸法亦有巧思諸凡與此證相類者皆可用之詒按丸藥製法精巧開後學許多悟境曹寒飲痰涎氣血凝結成癖踞於脘肋下及腰間久必成囊而為窠臼如賊伏於隱僻之處一時難以攻搗昔許學士有此論法當內和脾胃外用攻消今仿其意半夏茯苓烏藥白芥子當歸吳茱萸青皮澤瀉延胡索桂枝杜仲薑汁炒生木香生熟穀芽丁脈遲細脘中有塊納食撐脹腹中漉漉作聲噯腐吞酸大便堅結此脾胃有寒積也當以溫藥下之仿溫脾法附子制乾薑枳實大黃桂木陳皮半夏川朴茯苓詒按小承氣合二陳加薑桂附驅寒飲導積滯立方簡當洪結癖纍纍久踞腹中年逾六旬元氣下虛中氣已弱肝氣肆橫腹漸脹滿脈沉弦細細而沉為虛為寒沉而弦為氣為郁病關情志非濕熱積滯可比攻消克伐難施擬商通補補者補其虛通者通其氣六君子湯蘇梗肉桂香附川朴薑汁炒白芍生薑丁血虛木橫兩脅氣撐脹痛腹中有塊心蕩而寒熱病根日久損及奇經經云衝脈為病逆氣裡急任脈為病男疝女瘕陽維為病苦寒熱陰維為病苦心痛合而參之謂非奇經之病乎調之不易黨參黃耆當歸白芍沙苑茯神杞子香附陳皮白薇紫石英詒按擬再加牛膝青皮沉香復診和營衛而調攝奇經病勢皆減惟腹中之塊未平仍從前法加減前方去杞子加砂仁冬朮詒按古無專屬奇經之病亦無專入奇經之藥考內經八脈行度及前賢議論均謂十二經氣血有餘則溢入奇經有病者也必日久病深由正經而侵入之然則用藥治病自當仍以正經為主學者須明此意勿為近賢議論所蒙也孔病由肝氣橫逆營血不調腹中結瘕脘脅攻痛漸致食減內熱咳嗽痰多當臍動跳心悸少寐口乾腸燥而顯虛勞血痹之象極難醫治姑仿仲景法黨參茯苓棗仁乳香沒藥桃仁當歸川貝香附白蜜地鱉蟲酒炙復診前方養營化瘀下得血塊兩枚腹滿稍軟內熱咳嗽未減今且和營啓胃退熱止咳再望轉機西黨參茯苓丹參廣皮血餘炭杏仁川貝母當歸阿膠地鱉蟲三診氣滯血瘀腹滿有塊攻痛內熱已減咳嗽未平擬兩和氣血方法黨參香附鬱金茯苓山楂肉延胡索當歸杏仁阿膠桃仁沉香血餘炭四診咳嗽不止腹仍滿痛肝肺同病久延不已終成勞損桃杏仁車前子川貝當歸丹皮蘇子阿膠蒲黃炒旋覆花茯苓猩絳詒按前兩方仿金匱血痹治法確有見地後來咳嗽不止已屬內熱傷肺之象腹中滿痛肝氣不平也愚意仍用潤肺疏肝清陰養血法治之丁小腸遺熱於大腸為伏瘕腹中微痛用聖濟檳榔丸檳榔炒桃仁當歸酒炒青皮酒炒火麻仁沉香黨參元米炒茯苓烘木香烘烏藥烘大熟地砂仁拌炒白芍酒炒上藥為末用神麯三兩煮糊為丸每朝三錢開水送伍胸脘有塊大如碗每午後則痛甚於黃昏連及背脹時沃清水諸藥無效枳殼九枚納入阿魏三錢炙焦牡蠣二兩肉桂三錢白螄螺殼二兩共炙為末每痛發時服一錢開水送淵按枳殼破氣阿魏佐肉桂散寒以濁攻濁牡蠣軟堅白螄螺殼始用於丹溪云化伏痰消宿水周食填太陰肝氣欲升而不得胃氣欲降而不能氣塞於中與食相併脘脅疼痛氣攻有塊湯飲輒嘔上不得納下其得出法當疏運其中半夏橘紅青皮萊蔔子川朴薑汁炒吳茱萸赤苓白蔻仁研沖另蘇梗枳殼檳榔三味磨沖某前年秋季伏暑證中即結癥瘕居左脅下春來下午必發微熱晨必吐痰食麵必溏泄此當時熱邪未清早進油膩麵食與痰熱互相結聚於肺胃之絡當以攻消為主柴胡三錢酒炒青皮一兩巴豆五錢同炒去豆三稜三錢醋炒雄精一兩蓬莪朮五錢醋炒大黃一兩皂莢子三粒合炒去皂莢子上藥為末神麯糊丸每服一錢下午服六君子丸三錢淵按柴胡青皮疏肝膽而升清莪稜破滯氣而消塊大黃攻熱積巴豆逐寒積皂子去油膩之積雄精開結化痰也無堅不破無攻不利正氣不虛者可用詒按用藥思路可取錢脈微細陰之象也少腹有塊上攻及脘自脘至嗌一條氣塞發作則大痛欲厥頭汗如雨用方大法固宜以溫通為主矣惟舌有黃膩濁苔便泄臭穢必兼濕熱而塊痛得按稍減中氣又虛方法極難周顧尚祈斟酌是荷川楝子烏藥肉桂烏梅木香淡吳萸澤瀉延胡索茯苓川連酒炒復診下焦濁陰之氣上干清陽之位少腹胸脅有塊攻撐作痛痛甚發厥昨用溫通病勢稍減脈仍微細泄仍臭穢惡谷厭納中氣大虧陰氣凝結當臍硬痛恐屬臟結攻之不可補之亦難誠為棘手肉桂吳茱萸炮姜枸杞子烏藥木香延胡索金鈴子白芍茯苓澤瀉萱花金橘餅蔣少腹結塊漸大如盤上攻則痛下伏則安此屬腸覃氣血凝滯而成擬兩疏氣血香附五靈脂紅花當歸澤蘭延胡索桃仁丹參陳皮砂仁大黃䗪蟲丸每服二十粒開水送金少腹兩旁結塊漸大漸長靜則夾臍而居動則上攻至脘旁及兩脅已八九年矣據云始因停經半載疑其有孕及産多是汙水後遂結塊想是水寒血氣凝聚而成甘遂三錢麵包煨香附一兩鹽水炒三稜一兩醋炒蓬莪朮一兩醋炒桃仁五錢炒肉桂一錢另研川楝子五錢巴豆七粒合炒黃去巴豆五靈脂五錢醋炒地鱉蟲二十一個酒浸炙共研為末煉白蜜搗和為丸每服十丸日三服淵按水寒血氣凝聚衝脈之分果是實證此方必效詒按久病緩攻方法頗穩某寒氣凝聚少腹結瘕時或上攻作痛法以溫通小茴香吳茱萸木香青皮烏藥三稜延胡索砂仁香附某血虛而有瘀氣虛而有滯血虛則心跳血瘀則少腹結塊且多淋帶氣虛故無力氣滯故胸脹滿也補而化之調而理之黨參川芎茯神陳皮川斷歸身香附白芍木香砂仁玫瑰花詒按補而不滯暢而不克此之謂調理此等方看似尋常其實頗費斟酌錢少腹有塊痛則經來如注氣升如喘衝脈久傷肝木肆橫香附醋炒紫石英當歸白芍酒炒三稜醋炒木香大熟地牛膝小茴香鹽水炒青皮醋炒施背筋常冷胸腹有塊時吐酸水此寒痰阻於胃而太陽之氣不宣溫之通之蘇梗桂枝陳皮茯苓半夏製附子川椒老生薑蟲病許腹痛大便泄出細蟲延來己久中氣漸虛此胃中寒積也法當溫中補中川連鹽水炒炮姜木香白芍白朮烏藥使君子吳茱萸川椒伏龍肝煎湯代水某閲病源是屬蟲病無疑蟲由濕熱所化脾土不運而生其發於月底之夜原由脾胃虛寒寒屬陰故夜發也寒久化熱土虛木強其發移於月初必嘔吐胸熱兩乳下跳動蟲隨酸苦痰涎而出多寡不一或大便亦有腹中微痛雖口渴甚不能咽水水下復嘔嘔盡乃平至中旬則康泰無恙矣所以然者月初蟲頭向上且病久嘔多胃陰虧虛火上炎故胸中覺熱虛里跳動中氣虛也中氣者胸中大氣脾胃沖和之氣皆歸所統今中氣虛甚故跳躍也病延一載有餘蟲屬盤踞未易一掃而除圖治之法和中調脾杜生蟲之源生津平肝治胸熱口渴化濕熱降逆氣以治嘔吐久服勿懈自可見功欲求速效恐不能耳川楝子蕪荑黨參元米炒白朮製半夏青皮白芍茯苓焦六曲乾薑陳皮棐子蔻仁使君子肉淵按病從脾胃寒濕而來濕鬱生熱熱鬱生蟲變成本寒標熱本寒則藏真傷而氣結生積標熱則濕熱阻而蟲屬內踞詒按論病頗切實惟立方專於顧本似難取效擬另服殺蟲丸藥以佐之孫厥陰寒氣乘胃直犯中州蟲動不安腹痛如刀之刺口吐酸水清涎法宜辛溫佐以酸苦泄之通之川楝子延胡索川連青皮吳茱萸川椒焦楂炭烏藥使君子竹二青吳喜食生米積聚生蟲腹痛面黃口流涎沫蟲之見證無疑先擬健脾化蟲茅朮米泔水浸青皮鶴蝨棐子炒打蕪荑尖檳榔陳米炒黃共研為末每朝調服三錢略用砂糖少許詒按此治蟲病初起最輕之方痛時口流清水是蟲病的據某丹田有寒胸中有熱中焦不運濕甚生蟲與黃連湯川連肉桂吳茱萸乾薑砂仁使君子半夏青皮烏藥花檳榔復診蟲痛面黃吐涎擬苦辛法川連桂枝川椒蔻仁烏梅焦六曲蕪荑香附合金鈴子散
