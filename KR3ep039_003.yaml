body:
  text: 卷三脘腹痛孫中虛土不制水下焦陰氣上逆於胃胃脘作痛嘔吐清水得食則痛緩擬溫中固下佐以鎮逆四君子湯去草加乾薑烏藥白芍熟地紫石英代赭石橘餅淵按土虛水盛用熟地未合若欲扶土不去草可也張脘痛兩載近發更勤得溫稍松過勞則甚塊居中脘患處皮冷法以溫通二陳湯去草加炮薑吳茱萸木香川朴歸身神麯澤瀉生熟穀芽復診腹痛有塊肝脾不和食少面黃治以疏和丹參白芍懷山藥茯苓茯神冬朮神麯香附砂仁某肝胃氣痛痛久則氣血瘀凝曾經吐血是陽明胃絡之血因鬱熱蒸迫而上也血止之後痛勢仍作每發於午後診脈小緊數舌紅無苔乃血去陰傷而氣分之鬱熱仍阻於肝胃之絡而不能透達宜理氣疏郁取辛通而不耗液者為當川楝子延胡鬱金香附茯苓陳皮旋覆花山梔薑汁炒白螺螄殼左金丸詒按方法輕靈自然中病某肝胃不和腰脅胸背相引而痛舌光無苔營陰內虧大便溏薄脾氣亦弱並無嘔吐痰涎酸水等症宜辛溫通陽酸甘化陰陳皮茯苓蘇梗吳茱萸沙苑子白芍枸杞子薤白頭橘餅淵按脾腎虛寒宜甘溫營陰內虛宜柔緩故不用薑附剛燥之藥某胸中為陽之位清陽失曠則胸痹而痛下午屬陰故痛甚也用苓桂朮甘湯加味茯苓甘草桂枝白朮瓜蔞薤白半夏陳皮乾薑白蔻詒按方藥均親切不浮再診胸痹痰飲脘痛甚則嘔酸脈細胃陽不布先以通陽薤白枳實半夏茯苓陳皮詒按胸脘陽微而窒立方兼治上中而以中焦為主三診胸痹腹痛夜甚晝安清陽不振濁陰僭逆法必通陽黨參茯苓冬朮炙草陳皮半夏桂木川椒乾薑川附詒按此六君加桂附薑椒也用藥可謂切實矣沈肝胃氣痛發則嘔吐酸水治以溫通二陳湯去草加瓜蔞皮吳茱萸白胡椒當歸香附川楝子胡陽微濁聚於胃寒飲竊踞中宮脘痛連脅腹鳴漉漉法當轉運中陽以卻寒飲旋覆花乾薑半夏茯苓澤瀉陳皮水紅花子白螄螺殼生薑復診脘脅之痛雖除脾胃之氣大憊面浮足腫土衰水泛脈細少神慮其腹滿急宜溫補中陽以消水濕又當自知節愛為上六君子湯去草加炮薑熟附子神麯另金匱腎氣丸朝暮各服一錢五分孫水停心下則悸氣鬱胸中則痛痛甚則痞塞而吐白沫得食則寬此中虛夾痰飲為患也六君子湯加川朴乾薑桂木沉香某陽維為病苦寒熱陰維為病苦心痛陽維維於陽陽氣弱則腹痛而便溏陰維維於陰營陰虛則心痛而舌紅也脈微形瘦陰陽並損損及奇經當以甘溫黃耆桂枝當歸炙甘草白芍川貝陳皮砂仁鹿角霜再診但寒不熱便溏脈細肢體面目俱浮悉屬陽虛見象惟舌紅無苔此屬陰傷之候但口不乾渴乃君火之色外露治當引火歸元附桂八味丸加鹿角霜黨參冬朮詒按論病貫串認證真切至用藥之深淺輕重亦覺步步穩實某自咸豐四年秋季飽食睡臥起病今已五載過投消積破氣之藥中氣傷戕脘間窒痛得食則安不能噯氣亦不易轉矢氣脈遲弦肝胃不和陽虛寒聚於中擬通陽泄木法苓桂朮甘湯加陳皮白芍吳茱萸乾薑大棗復診胸背相引而痛證屬胸痹二陳湯去草加瓜蔞仁製附子桂枝乾薑吳茱萸蔻仁竹茹某熱走清道為鼻衄熱逼膻中為心痛脈澀數小便赤此血因火逆火隨血結仿熱厥心痛合瘀血心痛例清之導之金鈴子一錢半延胡索一錢半炒黑山梔一錢半五靈脂一錢半醋炒鬱金一錢生熟蒲黃各四分桃仁炭一錢陳皮五分鹽水炒降香三分磨沖三七三分磨沖某便血之後余瘀凝於肝絡餘熱留於小腸故少腹疼而小便熱痛也化瘀泄熱為治桃仁炒黑丹皮鮮生地木通黑梔滑石歸身楂炭生蒲黃猩絳另回生丹一粒詒按理法雙清胡腹中雷鳴切痛痛甚則脹及兩腰嘔吐酸苦水此水寒之氣侮脾乃中土陽氣不足也溫而通之附子理中湯去草加川椒吳茱萸水紅花子復診脾臟虛寒宿積痰水阻滯腹中時痛痛甚則嘔仿許學士法附子理中湯加當歸茯苓吳茱萸枳實大黃淵按溫下之法甚善惜以後易轍耳三診腹痛下午則脹脈沉弦此屬虛寒挾積前用溫下痛勢稍減今以溫中化積川熟附黨參乾薑花檳榔茯苓當歸青皮陳皮烏藥四診腹痛三年時作時止寒在中焦當與溫化無疑然脈小弦滑必有宿積前用溫下溫通兩法病雖減而未定據云每交午月其痛倍甚則兼濕熱故脈浮小而沉大按之有力此為陰中伏陽也當利少陰之樞溫厥陰之氣運太陰之滯更參滑以去著法柴胡白芍枳實甘草吳茱萸茯苓木香白朮另用黃鱔三段取中七寸炙脆共研末分三服淵按既知宿積何不再進溫下三年之病諒非久虛脈浮小沉大乃積伏下焦蓋痛則氣聚於下故脈見沉大此論似是而非五診腹痛左脈弦木剋土也仲景云腹痛脈弦者小建中湯主之若不止者小柴胡湯所以疏土中之木也余前用四逆散即是此意然三年腹痛痛時得食稍安究屬中虛而漉漉有聲或兼水飲今擬建中法加椒目去其水飲再觀動靜老桂木白芍乾薑炙甘草黨參川椒目淵按此寒而有積為虛中實證與建中甘溫不合故服之痛反上攻以甘能滿中胃氣轉失順下也六診用建中法痛勢上攻及胃脘連於心下左脈獨弦滑是肝邪乘胃也姑擬疏肝金鈴子延胡索吳茱萸香附高良薑木香白檀香某腹中有寒疼痛不止法當溫通金鈴子散乾薑吳茱萸當歸枸杞子官桂木香烏藥紫石英張寒氣稽留氣機不利胸背引痛脘脅氣攻有塊宜辛溫通達二陳湯去草加瓜蔞皮薤白頭乾薑吳茱萸延胡索九香蟲某腹痛便溏脾陽弱也周身疼痛衛陽弱也補中土益衛氣黃耆建中湯主之黃耆桂枝白芍白朮炙草詒按方案俱老到殷嘔而不食病在胃也食而腹痛病在脾也痛連胸脅肝亦病矣氣弱血枯病已深矣和胃養血生津益氣為治淡蓯蓉枸杞子歸身火麻仁大麥仁茯苓半夏陳皮沉香砂仁談脘痛欲嘔甚則防厥黨參陳皮茯苓川椒吳茱萸蔻仁生薑馮脾胃陽衰濁陰僭逆每至下午腹左有塊上攻則心嘈嘈則脘痛黃昏乃止大便常艱擬通胃陽而化濁陰和養血液以悅脾氣淡蓯蓉陳皮吳茱萸茯苓柏子仁郁李仁沙苑子烏梅川椒製半夏復診脘痛嘔酸腹中亦痛非用辛溫何能散寒蠲飲二陳湯去草加肉桂製附子乾薑吳茱萸川椒白朮蔻仁馮當臍腹痛呱呱有聲此寒也以溫藥通之二陳湯去草加淡蓯蓉當歸乾薑吳茱萸烏藥砂仁復診溫腎通陽以散沉寒之氣久服腹痛自已前方去當歸加川熟附葫蘆巴顧當臍硬痛不食不便外似惡寒里無大熱渴不多飲寒食風熱互結於脾胃中用局方五積散合通聖散分頭解治五積合通聖共為末朝暮各用開水調服三錢復診用五積合通聖溫通散寒便通而痛未止脈遲喜食甜味痛在當臍後連及腰身常懍懍惡寒此中虛陽弱寒積內停擬通陽以破其沉寒益火以消其陰翳四君去草加肉桂製附子木香玄明粉烏藥蓯蓉詒按方中玄明粉一味不甚妥洽擬去之三診溫臟散寒腹痛己止今當溫補淡蓯蓉杞子熟地當歸茯苓吳茱萸陳皮製附子烏藥砂仁淵按尚嫌膩滯仍從四君加減為妙袁三四年來腹痛常發發則極甚必數日而平此脾臟有寒積肝經有濕熱故痛則腹中覺熱擬溫脾兼以涼肝金鈴子散陳皮茯苓乾薑白朮川椒白芍神麯砂仁復診腹中寒熱錯雜而痛古方越桃散最妙變散為丸常服可耳淡吳萸乾薑黑山梔白芍炙甘草共為末神麯糊丸每服三錢開水送下原注越桃散惟薑梔二味加吳萸白芍者復以戊己法甘草者取其調和也詒按病邪錯雜用藥卻須一線乃佳如此丸方即合法也某中氣不足溲便為之變腹中結瘕亦氣之不運也二陳湯去草加白朮沙苑子焦神麯苡仁澤瀉砂仁通草復診肝胃不和脘腹作痛嘔吐酸水痰涎經來則腹痛先與泄肝和胃川連半夏陳皮茯苓瓜蔞皮薤白頭乾薑蔻仁猩絳旋覆花三診腹中久有癖塊今因冷食傷中腹痛泄瀉嘔吐不止心中覺熱擬苦辛通降先止其嘔二陳湯去草加黃芩川連川朴蘇梗藿梗蔻仁澤瀉改方加神麯吳飲停中脘脘腹鳴響攻撑作痛大便堅結如栗但能噯氣而無矢氣是胃失下行而氣但上逆也和胃降逆逐水蠲飲治之二陳湯去草加代赭石旋覆花神麯乾薑白芍川椒甘遂澤瀉王脈弦遲臍以上連胃脘脹痛此有寒飲脈經云遲則為寒仲景云口不渴而脈雙弦者飲也香砂六君湯去草加炮薑神麯乾薑復診當臍腹痛痛則氣塞胸中噯氣不得語脈弦大而遲此胃中陽氣不足而有寒飲也當以溫藥通之前方去神麯加香附川熟附範素有肝胃氣痛兼挾寒積脘腹脹滿痛及於腰刻不可忍舌苔白膩渴不欲飲大便似利不利脈沉弦而緊恐屬臟結頗為險候非溫不能通其陽非下不能破其結仿許學士溫脾法製附子乾薑肉桂川朴薑汁炒生大黃枳實淵按咳不可忍上焦之氣亦閉矣所謂五實證非耶復診脘腹脹滿上至心下下連少腹中橫一紋如亞腰葫蘆之狀中宮痞塞陰陽格絶上下不通勢瀕於危勉進附子瀉心一法溫陽以泄濁陰冀其大便得通否則恐致喘汗厥脫難以挽回製附子川連薑汁炒川朴薑汁炒生大黃酒浸長流水煎再服備急丸七粒砂仁湯送下三診兩投溫下大便仍然不通胸腹高突湯水下咽輒吐肢漸冷脈漸細鼻煽額汗厥脫可憂按結胸臟結之分在乎有寒熱無寒熱為別下之不通脹滿愈甚乃太陰脾臟受戕清陽失於轉運崔行功有枳實理中一法取其轉運中陽通便在是挽回厥脫亦在是惟高明裁酌之人參枳實炮薑川附陳皮冬朮原注此證死詒按兩投溫通重劑不得小效枳實理中力量不及前方之大恐未必能奏效也閲夜話録中所載一證與此相似治之未效後擬用溫藥下來復丹未及試用正可與此參觀噎膈嘔噦王痰隔中焦食入脘痛口沃清水嘔吐黏痰大便堅結腸液枯也時多空噯胃失降也擬化痰和胃降氣潤腸法旋覆花鹽水炒代赭石杏仁半夏瓜蔞皮橘紅瓦楞子蘇子白芥子萊蔔子薑汁地栗汁胡氣鬱中焦得食則嘔已延匝月慮成膈證川連吳萸炒白朮半夏藿香焦六曲陳皮香附茯苓鬱金白蔻仁張營陰虛故內熱少寐氣火逆故咽喉哽塞擬四物以養其陰四七以理其氣大生地砂仁拌蘇梗茯苓當歸北沙參川朴白芍半夏棗仁薑竹茹枇杷葉陳操勞抑鬱營虛火亢胃液枯稿飲食哽噎嗌中一條如火之焚有時呱呱作聲此氣火鬱結使然也病關情志非徒藥餌可瘳宜自怡悅庶幾可延旋覆花代赭石沙參黑山梔茯苓川貝焦六曲麥冬杏仁竹茹枇杷葉詒按立方輕清穩適緣病在上膈且屬氣火無形故非重劑邀功者也方中焦曲可去之復診氣火上逆咽喉不利胸痛食噎膈證已成況年逾六旬長齋三十載胃液枯稿欲求濡潤胃陰飲食無礙還望怡情自適前方加西洋參半夏丁脈形弦硬春令見此是即但弦無胃納食哽痛大便堅燥已見木火亢逆胃汁腸液乾枯治之不易旋覆花杏仁火麻仁桃仁蘇子青果荸薺蘆根復診前方潤燥以舒鬱結今擬下氣化痰之劑麥冬半夏杏仁橘紅川貝茯苓竹茹蘆根荸薺海虴枇杷葉淵按兩方清潤可喜洵屬名家秦痰氣阻於胸中故痰多而胸悶納食或嘔兩太陽脹痛清氣不升濁氣不降久延不已恐成膈症半夏橘紅赤苓吳萸汁炒川連黨參澤瀉藿香旋覆花枳殼川貝蔻仁肉桂大腹皮冬朮生薑來復丹一錢藥汁送下許痰飲流落心中心痛徹背大便乾燥飲食哽噎腸胃液枯法當溫潤淡蓯蓉麥冬茯苓桂木薤白頭半夏枸杞子陳皮瓜蔞霜白蔻仁淵按積飲久而傷胃將成噎膈桂蔞薤白治痰飲亦可以治噎膈蓋二證皆上中焦陽微不化所致陳據述病由喪子悲傷氣逆發厥而起今診左脈沉數不利是肝之氣鬱血少不澤也右關及寸滑搏為痰為火肺胃之氣失降肝木之火上逆將水穀津液蒸釀為痰阻塞氣道故咽喉胸膈若有阻礙納食有時嘔噎也夫五志過極多從火化哭泣無淚目澀昏花皆屬陽亢而陰不上承之象目前治法不外順氣降火復入清金平木蘇子茯苓半夏枳實杏仁川貝竹茹沙參橘紅麥冬海虴荸薺原注此七氣湯溫膽湯麥門冬湯三方加減降氣化痰生津和胃大抵病起於肝戕及肺胃故立方當從肺肝胃為主詒按細勘病機斟酌虛實立方似覺平淡實已慘淡經營秦七情鬱結痰氣凝聚胸膈不利時或嘔逆證將半載脾胃大虛前用四七二陳降氣化痰今參入理中兼培中土治標兼顧本也四七湯合二陳湯理中湯加丁香木香蔻仁詒按此證痰氣兩層必須兼到徐氣鬱於胸為膈氣滯於腹為臌飲食不納形肉頓瘦陰氣凝聚陽氣汩沒脈細如絲姑與培土通陽化氣一法黨參肉桂白木大腹皮熟附子澤瀉茯苓來復丹淵按傷胃則膈傷脾則臌膈多鬱火臌多陽衰肺金治節不行肝木起而克賊張胃汁乾枯腸脂燥涸所進飲食盡生為痰不生津血納食則吐痰隨吐出膈證之根漸深高年靜養為宜鮮蓯蓉一兩青鹽半夏三錢茯苓當歸陳皮沉香枳殼詒按此病已深用藥雖合未必能愈矣復診津枯氣結噎膈蓯蓉丸是主方前方加炒香柏子仁陳海虴地栗每日用柿餅一枚飯上蒸軟隨意嚼咽李寒熱咳嗽一載有餘咳痰帶血飲食沃噎胸膈阻窒又成噎膈此必兼挾氣鬱而成今且和胃降氣冀其血止噎減為妙旋覆花半夏杏仁丹皮橘紅茯苓鬱金瓜蔞霜蔻仁竹茹枇杷葉陳卒然心痛納食哽塞粥飲猶可此心氣鬱結防變膈證瓜蔞仁薤白頭旋覆花川貝母茯神半夏桔梗遠志肉竹茹朱脈滑大食入哽噎不下舌膩此屬痰膈大腸燥火凝結擬清痰火佐以宣通旋覆花麥冬六神麯黑山梔赤苓半夏豆豉陳皮杏仁竹茹海虴荸薺枇杷葉吳情志鬱結陽明津液內枯少陰之氣上逆少腹氣上衝咽咽喉覺脹納食哽噎擬溫養津液以降濁陰之氣旋覆花代赭石蓯蓉干枸杞子橘紅茯苓川貝半夏沉香雞冠虴地栗盛氣鬱痰凝胸中失曠背寒脊痛納少哽噎甚則吐出膈症之根旋覆花桂枝瓜蔞皮杏仁竹茹半夏代赭石薤白頭茯苓詒按此證初起痰氣阻於上焦故立方專從肺胃著意以後五方於用藥層次均能絲絲入扣復診諸恙仍然痰稍易出桂枝瓜蔞皮乾薑薤白頭陳皮杏仁旋覆花生鹿角竹茹枇杷葉三診背為陽位心為陽臟心之下胃之上也痰飲竊踞於胃之上口則心陽失其清曠而背常惡寒納食哽噎是為膈證之根蓋痰飲屬陰礙陽故也熟附子桂枝杏仁神麯薤白頭蔻仁瓜蔞皮旋覆花豆豉丁香竹茹枇杷葉淵按溫中化飲降逆潤腸不失古人法度惟豆豉一味不解是何意思四診服溫通陽氣之藥嘔出寒痰甚多未始不美惟納食哽噎之勢未除仍以溫通再觀動靜川熟附桂枝薤白頭半夏陳皮杏仁桃仁瓜蔞仁薑汁韭菜根汁五診上焦吐者從乎氣中焦吐者因乎積此納食哽噎少頃則吐出數口且多清水黏痰是有痰積在中焦也究屬膈症之根勿得輕視川熟附半夏瓦楞子陳皮蘇子薑汁萊蔔子旋覆花白芥子桃仁蓽菝白蜜詒按此證因痰氣兩阻故用藥始終如是周胸痛吐清水自幼酒濕蘊蓄胃中陽氣不宣濁氣凝聚據述前年又得暴喘上氣額汗淋漓發作數次今又增心嘈若飢此皆胃病用小半夏湯半夏茯苓陳皮竹茹生薑淵按暴喘額汗肺腎亦病不獨胃也復診停飲生痰嘔吐酸水胸中板痛前用小半夏湯所以蠲其飲也今風邪傷肺咳嗽內熱擬金沸草散宣風降氣仍寓祛痰蠲飲肺胃兼治之方金沸草半夏陳皮茯苓款冬花杏仁荊芥前胡竹茹枇杷葉趙氣水鬱結成痰咽噎礙食食入輒嘔清水米粒病在胃之上脘降氣化痰之藥須擇不燥者為宜瓜蔞仁半夏曲川貝橘紅丁香蛤殼青黛三分同研包白蜜枇杷葉竹茹蘆根生薑汁沖服復診諸逆衝上皆屬於火食入即吐是有火也川連半夏蘇梗製大黃竹茹枇杷葉淵按內經病機十九條都有不盡然者注者不敢違背隨文敷衍貽誤後學其實是是非非明眼自能別白即如諸逆衝上之證不屬於火者甚多未可一概論也讀經者知之祝胃陽虛則水飲停脾陽虛則穀不化腹中漉漉胸脅脹滿納食輒嘔酸水清涎或噯腐氣法以溫導崇上利水炮薑陳皮蒼朮半夏熟附子白朮黨參澤瀉枳實瓜蔞仁蔻仁穀芽詒按中陽不運痰濕易停故用治中合二陳法沈食下則飽脹作酸嘔吐病屬反胃胃脈浮按則緊沉按則弦弦者木侮土緊者寒在中黨參乾薑半夏陳皮茯苓丁香焦六曲蓽撥蔻仁陳香櫞秦納食輒嘔清水涎沫米粒病在胃也曾經從高墜下脅肋肩膊時痛是兼有瘀傷留於肺胃之絡故嘔有臭氣擬化瘀和胃降逆止嘔為治旋覆花歸鬚廣鬱金杏仁半夏茯苓炒丹皮焦楂肉橘紅蔻仁淵按佐韭薑藕三汁更妙詒按此屬初起輕淺之劑病深者尚宜加重復診止嘔必以和胃氣升必須降納半夏茯苓白朮蔻仁藿香陳皮老桂木神麯乾薑沉香伏龍肝高坤土陽微濕勝腹中不和用平胃理中合劑平胃散合理中湯加茯苓延胡原按方中橫插延胡一味因有瘀凝也詒按立方老潔復診疊進溫中運濕腹中呱呱有聲朝食則安暮食則滯臥則筋惕肉瞤時吐酸水中土陽微下焦陰濁之氣上逆病屬反胃溫中不效法當益火之源舍時從證用茅朮附子理中合真武法附子理中加茯苓陳皮生薑淵按水穀不化精微而生酸痰肝木失於濡潤筋惕肉瞤是肝有燥火也徒事溫燥無益詒按較前方深一層是亦一定步驟孔先曾嘔血胃中空虛寒飲停留陽氣不通水穀不化食入嘔吐酸水穀食隨之而出脈細肢寒陽微已甚證成翻胃慮延脾敗難治熟附子乾薑丁香橘餅蓯蓉干九香蟲二陳湯其中甘草炙黑淵按噎膈反胃從嘔血而起者甚多蓋血雖陰物多嘔則胃陽傷而不復不能運水穀而化精微失其順下之職始則病反胃久則腸液枯稿而為膈證矣嚴噎膈反胃胃脘之病也上焦主納中焦司運能納而不能運故復吐出朝食暮吐責其下焦無陽擬化上焦之痰運中焦之氣益下焦之火俾得三焦各司其權而水穀熟腐自無反出之恙然不易矣旋覆花代赭石熟附子茯苓枳殼新會皮益智仁淡蓯蓉半夏沉香地栗陳雞冠海虴某胃中素有酒濕適因鬥毆惱怒引動肝膽之火與胃中之痰相搏致心跳少寐食入則嘔兩手脈沉是氣鬱也用溫膽加味半夏石菖蒲陳皮甘草枳實棗仁茯神雞距子竹茹薑汁炒詒按既有木火內擾則川連梔丹本不可少也再診溫膽湯加沙參川連丹皮黑梔旋覆花雪羹煎某朝食暮吐完穀不化病成反胃始以寒疝腹中結塊氣從少腹上攻胃脘作痛吐酸而起此中下之陽氣不振肝木侮脾脾不磨化幽門不通大便艱澀法以溫運通陽鮮蓯蓉漂淡去甲一兩五錢半夏陳皮枳殼沉香柏子仁桂心牛膝吳萸乾薑某腹中痛甚則有塊平則無形每每嘔吐酸水此屬中虛陽氣不運當與大建中湯黨參蜀椒乾薑金橘餅詒按簡明切當如老吏斷獄某反胃而兼浮腫小便莖中微痛此中焦陽氣不運而下焦有濕熱也蓽撥磨汁三匙薑汁三匙韭根汁三匙藕汁三匙黃牛乳煎飲兩杯另用沉香末一錢血珀一錢研末分六服再診內經云三陽結為之膈三陰結為之水此證反胃而兼浮腫是三陰三陽俱結也陰陽俱結治法極難前方用蓽撥牛乳飲調服沉香血珀末撥動其陰陽俱結之氣幸反胃之勢已平是其三陽之結已解今腹滿雖寬而腿足之腫仍若是三陰之結猶未解也蓋太陰無陽明之陽少陰無太陽之陽厥陰無少陽之陽則陰獨盛於內而陽氣不通陰氣凝澀膀胱不化而水成焉其脈沉細蓋重陰之象也凡補脾崇土溫潤通陽如理中腎氣丸之屬固亦合法然不若周慎齋和中丸之制為尤妙以其用乾薑能回陽明之陽於脾肉桂回太陽之陽於腎吳萸回少陽之陽於肝則三陽氣勝而三陰之結解水自從膀胱出矣周慎齋和中丸乾薑二兩切片分作四份一份用人參五錢煎湯浸拌收乾炒黑一份用青皮二錢煎湯拌炒黑一份用陳皮三錢煎湯拌炒黑一份用蘇葉二錢五分煎湯拌炒黑肉桂去皮一兩切片作四份一份用益智仁一錢五分研同煮收干一份用澤瀉二錢五分煎濃湯同煮收干一份用茴香一錢五分同煮收干一份用補骨脂二錢五分研同煮收干吳萸五錢作二份一份用薏仁五錢煎湯拌炒一份用青鹽五錢煎湯拌炒黃黨參元米炒一兩茯苓焙一兩製半夏炒一兩甜杏仁一兩茅朮三錢用米泔同浸煮乾去茅朮上藥為末用神麯二兩磨粉煮糊搗丸每朝服一錢暮服五分用薏仁三錢陳皮五分煎湯送下詒按議論精當方法亦清切靈活此等方案固自可法可傳案中論病頗合機宜惟所解內經三陰三陽等語卻與經旨不合許吐血後厄逆作止不定迄今一月舌白膩右脈沉滑左脈細弱其厄之氣自少腹上衝乃瘀血挾痰濁阻於肺胃之絡而下焦相火隨衝脈上逆鼓動其痰則厄作矣病情並見安可模糊若捕風捉影無怪乎其不效也酌方必有濟幸勿躁急為囑半夏茯苓陳皮當歸鬱金丁香柿蒂薑汁藕汁水紅花子東垣滋腎丸一錢陳皮生薑泡湯下陰寒厄者用肉桂五分坎氣二條沉香六分分兩服淵按所謂氣厄痰厄是也與虛寒不同詒按用煎劑以通肺胃之絡阻用丸藥以降沖逆之相火思路精細自然尉帖某瘧後痰氣阻滯胃脘清陽不舒氣升作厄納食輒嘔已經半月防成膈症且與仲景法化痰鎮逆旋覆花代赭石淡乾薑法半夏赤苓制香附丁香柿蒂詒按方案俱簡當可法也消渴李一水不能勝五火火氣燔灼而成三消上渴中飢下則溲多形體消削身常發熱稚齡犯此先天不足故也大生地川連麥冬知母五味子茯苓生甘草生石膏牡蠣花粉詒按稚年患此多在炎暑之時其證有兼見風痙煩躁者余常用此法參用涼肝之品以黃蠶繭煎湯代水頗有效驗李夫三消火病也火能消水一身津液皆干惟水可以勝火大養其陰大清其火乃治本之圖病由遠行受熱腎水內乏當救生水之源大生地沙參五味子麥冬牡蠣蛤殼生洋參桑白皮天冬侯脾胃虛而有火故善飢而能食肝氣盛故又腹脹也甘寒益胃甘溫扶脾苦辛酸以泄肝兼而行之玉竹川石斛麥冬黨參冬朮白芍吳萸炒川連茯苓烏梅橘餅淵按深得古人制方之意而又心靈手敏查脈沉細數而澀血虛氣鬱經事之不來宜也夫五志鬱極皆從火化飢而善食小溲澄腳如膿三消之漸匪伊朝夕然胸痛吐酸水肝鬱無疑肝為風臟郁甚則生蟲從風化也姑擬一方平中見奇川連一錢吳萸炒麥冬三錢薑汁炒蛤殼五錢鮮楝樹根皮一兩洗建蘭葉三錢詒按病屬陰虛火旺案中生蟲一層未免蛇足復診服藥後大便之堅難者化溏糞而易出原得苦泄之功也然脈仍數澀究屬血虛而有鬱熱鬱熱日盛臟陰日消舌紅而碎口渴消飲所由來也月事不至血日乾而火日熾頭眩目花帶下皆陰虛陽亢之徵補臟陰為治本之緩圖清鬱熱乃救陰之先著轉輾思維寓清泄於通補之中其或有濟耶所慮病根深固未易奏績耳川連淡芩黑山梔大生地當歸阿膠川芎白芍建蘭葉另大黃蟅蟲丸早晚各服五丸淵按建蘭葉不香無用徐靈胎論之矣詒按寓清於補恰合病機三診諸恙皆減內熱未退帶下未止經事未通仍從前法川連當歸洋參白芍女貞子茯苓麥冬丹參沙苑子大生地四診經曰二陽之病發心脾不得隱曲女子不月其傳為風消風消者火盛而生風渴飲而消水也先輩謂三消為火疾久必發癰疽余屢用涼血清火之藥職此之故自六七月間足跗生疽之後消證加重其陰愈傷其火愈熾今胸中如燔牙痛齒落陽明之火為劇考陽明氣血兩燔者葉氏每用玉女煎姑仿之鮮生地石膏知母玄參牛膝大生地生甘草天冬川連麥冬茯苓枇杷葉詒按此亦消渴門中應有之證不可不知錢古稱三消為火病火有餘由水不足也十餘年來常服滋陰降火雖不加甚終莫能除然年逾六旬得久延已幸今就舌苔黃膩而論中焦必有濕熱近加手足麻木氣血不能灌溉四末暗藏類中之機擬疏一方培養氣血之虛另立一法以化濕熱之氣標本兼顧希冀弋獲大生地當歸山萸肉麥冬懷山藥洋參龜版建蓮肉豬肚丸三錢另服開水下朱脈左寸關搏數心肝之火極熾口乾小溲頻數而渾濁此下消證也久有腳氣濕熱蘊於下焦擬清心肝之火而化腎與膀胱之濕大生地川連鹽水炒牡蠣黃耆茅朮麥冬赤苓黃柏鹽水炒蛤粉升麻豬肚丸每朝三錢開水送龐胃熱移膽善食而瘦謂之食㑊大便常堅結而不通者胃移熱於大腸也膽移熱於心故又心跳頭昏今擬清胃涼膽為主安神潤腸佐之鮮石斛淡芩郁李仁火麻仁枳殼棗仁瓜蔞皮龍膽草茯神豬膽汁另更衣丸一錢淡鹽花湯送下原注此病服此方五六劑後用滋陰如二地二冬沙洋參等煎膠常服可愈淵按此似消非消之證膽腑鬱熱移胃傳所不勝故用苦寒直瀉膽火方脾陰虛而善飢腎陰虛而溲數肝氣不舒則腹中耕痛胃氣不降則脘中痞窒此二有餘二不足也然有餘不可瀉不足則宜補腎充則肝自平脾升則胃自降耳黨參懷山藥五味子茯神麥冬冬朮大熟地枸杞子陳皮紅棗某昔人以三消為火病而有虛實之分此病得於霍亂之後是脾胃之陰液消乏而心肝之陽氣偏勝然舌有黴苔究屬脾胃伏濁不化內經用蘭草治消渴除陳氣也仿此為之生洋參三錢生甜冬朮三錢生甘草三分茵陳一錢五分茯苓三錢生石膏三錢白糖拌佩蘭葉一錢八仙長壽丸每朝暮各五錢開水下二診前方去石膏加川連知母黃柏天花粉原注五帖全愈痰飲金痰飲停胸清陽失曠咳嗽眩悸與苓桂朮甘湯加味茯苓桂枝白朮炙甘草紫石英陳皮五味子半夏蛤殼胡桃肉潘肛有漏瘍陰津先損於下兼以嗜酒濕熱又盛於中繼因勞碌感寒寒入肺經與胸中素盛之痰濕相合咳嗽嘔吐清水而成痰飲為患仍飲燒酒祛寒宜其血溢矣況內熱脈數陰津已虧欲蠲痰飲恐溫則劫其陰欲除內熱恐清則加其咳宜和胃降氣生苡仁紫菀白扁豆茯苓款冬花川貝母鬱金杏仁蛤殼十大功勞復診陰虛痰飲逢暑既不可溫又不可清舌苔黏膩當和中化痰兼以攝納腎氣二陳湯加杏仁腎氣丸一錢都氣丸二錢相和開水下淵按暑天何嘗不可用溫惟痰飲見吐血以為陰虛不敢溫耳其實血從燒酒傷胃而來尚非真正陰虛三診咳嘔清水乃痰飲之病脈細數內熱為陰虛之候治痰飲則宜溫治陰虛則宜滋藥適相背肝腎為子母之臟不妨補母以益子而胃土又為肺金之母又當和胃以化痰擬滋燥兼行仿東垣法而不礙大熟地冬朮阿膠五味子澤瀉茯苓淡乾薑半夏腎氣丸某痰飲咳嗽已久其源實由於脾腎兩虧柯氏云脾腎為生痰之源肺胃為貯痰之器也近增氣急不得右臥右臥則咳劇肺亦傷矣素患肛門漏瘍邇來糞後有血脾腎虧矣幸胃納尚可議從肺脾腎三經合治然年近六旬愛養為要否則慮延損證熟地砂仁末拌炒半夏陳皮五味子川貝冬朮阿膠蒲黃拌炒炮薑炭歸身炭款冬花茯苓原注此金水六君煎合黑地黃丸加阿膠款冬川貝三味補金水土之虛上能化痰下能止血其中雖有炮薑勿嫌溫燥有五味以攝之詒按此等病立方最難安放平穩似此周到尉貼自非老手不辦周飢飽勞碌則傷胃寒痰凝聚氣血稽留阻於胃絡而胃脘脹痛嘔吐黏痰殆無虛日倘不加謹恐成脹滿異功散去甘草加炮薑熟附子良薑蔻仁復診溫胃化痰從理中二陳平胃三方化裁六君子合附子理中加川朴三診寒積中焦胃陽不布痰飲竊踞為脹為痛為吐為噦法當溫運中陽但病根日久必耐心服藥乃效六君子合附子理中去草加川椒白蔻仁四診中虛非補不運寒飲非溫不化益火生土通陽蠲飲苓桂朮甘湯主之附子理中湯亦主之苓桂朮甘湯合附子理中去草加半夏陳皮蔻仁五診病有常經方有定法藥已見效無事更張袁詩云莫嫌海角天涯遠但肯揚鞭有到時附子理中合二陳湯加老生薑老桂木淵按倜儻風流足徵讀書功夫詒按前後五方看病的確用藥的當案語亦親切簡老於此道中自推老手徐痰飲伏於胸中遇寒則咳而喘心嘈氣塞頭眩腰痠年逾五旬天癸當去而不去是氣虛不能攝血夫氣本屬陽陽氣日衰痰飲日盛法當通陽氣以祛水飲之寒仲景云病痰飲者當以溫藥和之是也二陳合苓桂術甘加款冬杏仁蛤殼沉香朝服都氣丸二錢腎氣丸一錢開水送下秦懸飲踞於脅下疼痛嘔吐清水用仲景法芫花甘遂大戟吳茱萸白芥子各二錢將河水兩大碗入上藥五味煎至濃汁一碗去渣然後入大棗五十枚煮爛俟干每朝食大棗五枚淵按此五飲之一乃實證也用之得當其效如神趙寒入肺底咳喘而嘔水飲停於心下也腰脅痛而經停肝腎已虛擬開上溫中補下麻黃細辛淡乾薑五味子茯苓陳皮杏仁炙甘草大熟地海浮石拌半夏沉香枇杷葉復診痰飲咳嘔清水而致停經發熱帶下淋漓營陰虛而肝腎虧矣脘中脹滿大便偶利則脹覺鬆仍是飲邪見症夫痰飲宜溫宜化而陰虛宜補宜清所慮熱久停經恐成乾血勞損半夏陳皮茯苓細辛拌炒生地薑汁炒白芍乾薑五味子同炒沙苑子當歸川芎款冬花淵按經停發熱未必即屬虛證惟帶下過多營液虛矣脘脹便通則松乃肺脾氣分不化也尤痰飲咳嗽朝晨必吐清水本擬溫藥以化之但時當酷暑兼有臂痛且以和胃化痰半夏陳皮茯苓款冬花蘇子萊蔔子杏仁白芥子指迷茯苓丸每朝服三錢開水送下範寒痰留於胃則脘痛而吐清水入於肺則咳嗽而多白沫宜仿小青龍法辛溫開達上焦淡乾薑茯苓白芍細辛橘紅五味子桂枝半夏款冬花杏仁蓋夫邪之所湊其氣必虛留而不去其病則實留飲久踞不去亦由中氣之虛欲逐其飲先補其中丹溪云補完胃氣而後下之為當茲議先補中氣一法六君子湯去甘草加乾薑復診甘遂半夏湯用甘遂五分三診照前方用甘遂七分四診照前方用甘遂一錢原注雖大便仍未瀉而腹中已覺甚安即停藥三日呂陰虛挾痰飲為病痰飲內留故咳嗽背寒心胸著冷則痛陰虛故內熱也金水六君煎加減治之大熟地半夏陳皮沉香蛤殼款冬花蘇子杏仁沙參茯苓顧頭眩心悸脈沉弦者飲也病發則嘔吐酸水滿背氣攻作痛得噯則痛松此濁陰之氣上攻陽位當以溫藥和之熟附子桂木半夏陳皮冬朮川椒茯苓沉香某水飲去後中氣大虛胃液枯涸難為力矣夫中氣大虧非建中不可而胃陰枯涸非養胃陰又不可然則黃耆建中但補中氣而不能養其胃陰仍非計之善也今擬十全大補陰陽氣血雙調加入麥夏蓯附即十四味建中法並建其脾中腎中之陰陽或者其有濟乎人參鬚黃耆大熟地附子三分煎汁炒川芎茯苓半夏白芍肉桂一分煎汁炒蓯蓉炙甘草麥冬冬朮土炒歸身金橘餅復診肝虛無直補之法補腎即所以補肝中虛有兼補之方補火而更能生土前投十四味建中兩建其脾中腎中之陰陽證既大虛藥宜加峻虛能受補便是生機人參鬚黨參黃耆炙甘草大熟地附子一分拌炒肉桂麥冬歸身冬朮枸杞子半夏茯苓棗仁山萸肉酒炒蓯蓉單痰飲久留咳喘不已痰多黏膩脾腎兩虧脾虛則痰不化而食減腎虛則陽氣衰而水泛以致腹滿足腫面浮病成溢飲金匱云病溢飲者當發其汗小青龍湯主之然脈細陽衰便難液涸腎氣久虛何堪更投發泄耗陰傷陽之劑擬進附子都氣丸裁去熟地者以其痰多痞塞也淡蓯蓉枸杞子青鹽炒茯苓澤瀉半夏五味子製附子牛膝炭胡桃肉孫風邪久戀肺中寒飲停留胃脘風能化熱咳久傷陰積飲生痰胃陽失布肺之子腎也胃之妻脾也肺傷腎亦虧胃虛脾亦弱脾弱故便泄腎虧故左尺脈弦而大也咳將一載雖曾吐血而時嘔清水其為寒飲無疑今從飲門例治大熟地海浮石炒麥冬元米炒生苡仁五味子陳皮焦六曲茯苓半夏乾薑紫石英細辛沉香方向有心痛嘔吐之病得食則安明系中虛而有痰飲伏留於心下也上年春季頭痛寒熱從此咳嗽喉有痰聲當時設遇明眼用小青龍發汗散水表邪與痰飲悉解何至奄纏不愈耶逮至酷暑邪郁化熱咳痰帶臭肺氣受傷交白露節秋金得令肺氣清肅而後漸愈至冬陽氣少藏其咳復作交春入夏咳頻不已病延一載有餘診脈雙弦形肉瘦削口不乾渴身不發熱頭眩心悸肝腎之陰已虛脾胃之氣亦弱痰飲戀而未化自淺及於深矣昔賢謂外飲治脾肺內飲治腎今自外而至於內從肺脾腎三經立法前後綰照以冀各得其所款冬花蘇子杏仁川貝茯苓陳皮半夏乾薑五味子五粒同炒大熟地海浮石拌炒牛膝鹽水炒炙甘草蛤殼馬兜鈴薑汁胡桃肉枇杷葉淵按外飲治肺脾非杏貝等清潤之藥可治當求之於金匱想病已棘手方藥錯雜有不得不然耳費痰飲伏於胸中咳嗽喘促其標在肺其本在腎此證本虛未甚標實有痰法當兩顧大熟地茯苓蛤殼川貝牛膝半夏陳皮杏仁桑白皮枇杷葉陳宗臺先生認此證為痰飲卓識超群曷勝佩服竊思飲痰久踞中土必受其戕而臟氣亙傷窮究必歸於腎腎為五臟之根土為萬物之本脾土弱則清陽失曠而氣化無權腎水虧則真陽失藏而源泉消涸夫以痰飲之病久臥不起於床加以寒熱神疲其為水土俱敗明矣節屆春分木旺陽升之候木旺則土益弱陽升則水益虧清明節後百花齊放將奈之何為今之計崇脾土而轉旋清陽以治其中補腎水而蟄藏真陽以治其下守過清明若得病情安穩有減無增或者其克濟乎苓桂術甘合二陳上午煎服金匱腎氣丸三錢暮服胡寒飲伏留於胃脘清陽失曠於心胸脘中微痛腰背牽掣覺酸時吐清水與苓桂朮甘湯清胸中之陽氣理中湯理脾中之陽氣陽氣復則胃脘之寒飲自化矣照二方加陳皮砂仁半夏復診前方通胸中脾中之陽此方兼通腎中之陽陽氣得通三焦氣機自暢胃中寒飲自化矣照前方加清和丸某腎中之元陽不足膻中之火用不宣痰飲伏留於心下故心胸如盆大一塊常覺板冷背亦常寒三四年來每交子後則氣喘乃陽氣當至而不至痰飲阻遏陽微陰勝故也天明則陽氣張故喘平至心悸咳嗽易於驚恐屬陰邪竊踞胸中為病其常若傷風之狀者衛外之陽亦虛也圖治之法當祛寒飲而逐陰邪斡旋陽氣如離照當空陰邪盡掃用仲景苓桂朮甘湯先通其胸中之陽氣再議茯苓細辛一分煎汁炒冬朮附子二分炒黨參薑汁炒紫石英甘草麻黃一分炒桂木半夏乾薑五味子五粒炒胡桃肉破故紙青鹽炒陳皮白螄螺殼洗詒按審證清切方中以辛烈之品煎汁收入甘平藥內用意頗巧骨脂胡桃參入補腎之意尤為周到此證陽微飲踞自屬確不可易惟所吐之痰是否清稀抑系干黃黏厚案中未經敘明其常若傷風之狀衛陽虛者固有此候亦有痰濁化熱蘊於肺中以致招引外風者亦多此證不可不細為之辨賈病已兩月先嘔而後咳多吐清涎口不渴心胸痛而痞悶此痰飲停於心下也雖微有寒熱並非外感風邪當從胸痹痰飲門中求之半夏茯苓瓜蔞皮橘紅杏仁生薑淵按仲景治胸痹用蔞皮須同薤白治痰飲須同桂枝否則不效蓋胸脘之陽不化飲痹皆不去耳某痰飲阻於胸中咳而短氣心悸用四君補氣二陳化痰桂枝通陽款冬止咳加減成方仍不越苓桂術甘之制若舍仲景而別求良法是猶廢規矩而為方園也詎可得哉桂枝茯苓白朮甘草半夏陳皮黨參款冬花詒按方論俱平正通達可以取法再診用補氣化痰通陽蠲飲咳而短氣俱減但心仍悸參以益智茯苓白朮甘草黨參陳皮半夏桂木款冬花益智仁棗仁某咳嗽口不渴當臍痛而脈細頭常眩運此乃手足太陰二經有寒飲積滯阻遏清陽之氣不能通達故一月之中必發寒熱數次乃鬱極則欲達也病將四月元氣漸虛寒飲仍戀而不化先以小青龍湯蠲除寒飲宣通陽氣再議麻黃桂枝白芍細辛乾薑半夏五味子甘草詒按此內飲而兼外寒之方一月中寒熱數次或因兼感外邪則此方的對矣某脈沉取之數其陰內虧其熱在裡病延日久勞損之候證見咳唾白痰脘腹時痛痛則氣滿得矢氣則稍寬病由肝鬱而成據云咳已三年初無身熱是其根又有痰飲也經訓治病必求其根茲從痰飲氣鬱例治之半夏茯苓桂木丹皮白芍香附沉香神麯歸身甘草冬朮陳皮金橘餅詒按此苓桂術甘合二陳加歸芍丹皮以養肝沉附曲橘以化氣也立方平穩尉貼某痰飲咳逆肺腎兩虛胃濕不化用苓桂木甘湯合二陳治其胃都氣丸治其肺腎可也苓桂朮甘湯合二陳湯加川貝杏仁沉香另都氣丸每服四錢淡鹽湯送下詒按虛實兼到親切不浮哮喘高多年咳喘逢寒遇勞輒發汗多氣升肺傷及腎腎氣虛而不納矣法當補腎以納氣熟地懷牛膝北沙參半夏陳皮茯苓麥冬五味子紫石英蛤殼沉香復診寒入肺底久而化熱同一痰喘先後不同也初病在肺久必及腎同一咳逆虛實不同也補腎以納氣清肺以化痰須兩層兼顧為穩北沙參五味子麥冬川貝杏仁蛤殼懷牛膝地骨皮熟地梨皮枇杷葉詒按前方用藥切當此方案語圓融廉腎陰虛而氣升喘逆心陰虛而心跳少寐胃氣虛而痰飲留戀肝風動而頭眩震掉腸液枯而大便堅干經云腎苦燥急食辛以潤之心苦緩急食酸以收之肝苦急急食甘以緩之腸胃津枯當滋氣血擬都氣丸意大生地蛤粉炒茯神辰砂拌半夏炙甘草五味子沉香柏子仁石決明懷山藥麥冬西洋參吳喘咳多年近加咳嗆形消肉瘦正陰大虧雖有痰濁法當補納大熟地黨參半夏陳皮牛膝款冬花麥冬茯苓紫石英五味子胡桃肉盧腎司納氣而開竅於二陰此病每因勞碌之餘必先頻轉矢氣而後氣升上逆短促如喘飲食二便如常其病在少陰之樞宜補而納之六味地黃丸合生脈散加青鉛詒按腎為作強之官過於勞動則收攝無力故見此證與尋常喘促又是一種認證既確立方亦切實不膚擬再加砂仁胡桃肉陸喘哮十二年三瘧一載瘧止復來喘發愈勤中虛痰飲不化雖痰中帶血而不可以作熱治也擬六君子加杏仁旋覆薑桂方法六君子湯杏仁旋覆花桂枝細辛同炒乾薑五味子同打炒淵按痰中見血仍用薑桂非老手不辦馮年逾七旬伏暑挾濕濕能生熱病起微寒微熱咳嗽痰稠曾經吐血今血雖止而咳仍然脈澀而數舌苔灰白而渴乃濕熱痰濁戀於肺胃病將匝月元氣大傷脾胃不醒穀食少進初起大便堅今則軟而帶溏矣病在肺脾胃三經治在化痰降氣和中甜杏仁茯苓款冬花蛤殼沙參紫菀川貝母苡仁陳皮雪羹另用人參珠子血珀沉香礞石研細末勻和一處再研極細分四服日一服復診夫咳嗽痰喘之病淺則在肺胃深則屬肝腎凡用方之法由淺而深按脈察色知其虛中挾實實者痰濁也故先以化痰降氣和中為法兩劑咳嗽稍平惟氣之喘而短者有出多納少之意則其本虛矣左脈細微肝腎之虛大著雖舌苔黃濁不化亦當以攝納為要且額上汗冷胃泛不納將有虛脫之慮人參一錢五分五味子八分麥冬錢半元米炒山萸肉二錢澤瀉一錢茯苓二錢大熟地六錢附子三分煎汁浸片時炒成炭紫衣胡桃肉不去皮二個紫石英三錢懷牛膝三錢懷山藥五錢炒另用好肉桂三分上沉香三分坎氣二條三味各研末和一處再研細分作二服今晚一服燕窩湯調下明日再進一服若得額汗收斂左脈稍起猶有生機可理若不應手難為力矣杜咳嗽有年每遇勞碌感寒即發並無痰涎此屬氣喘據述病起受寒早用麥冬清滋之藥遂至邪戀於肺曾服麻黃開達見效然病根日久肺氣亦虛虛而不治纍及子母今三焦並治乃肺脾腎三臟兼顧也杜蘇子淡乾薑五味子合搗甜杏仁橘紅半夏款冬花炙甘草早服附桂八味丸一錢金水六君丸三錢開水送復診久咳肺脾腎交虛前用溫納相安今交夏令腎氣丸中桂附嫌剛改用都氣丸可也都氣丸三錢朝服金水六君丸三錢晚服俱鹽湯下三診肺為貯痰之器腎為納氣之根腎虛不納則氣逆而生喘肺虛失降則痰貯而作喘前之辛通肺氣補攝腎氣服下相安而病莫能除良以多年宿恙根深蒂固然按方書內飲治腎外飲治肺不越開上填下之意法半夏茯苓橘紅杏仁霜款冬花乾薑白芍五味子炙甘草上藥為末用麻黃三錢白果肉三十粒枇杷葉二十片煎濃汁泛丸每服一錢朝晚並進與都氣丸同服王高年烘火誤燒被絮遭驚受寒煙燻入肺陡然喘逆痰嘶神糊面浮防其厥脫旋覆花前胡杏仁川貝代赭石茯神蘇子沉香桑白皮款冬花竹油沖薑汁沖淵按此火邪傷肺而喘也與尋常痰喘不同故不用溫納徐喘哮氣急原由寒入肺俞痰凝胃絡而起久發不已肺虛必及於腎胃虛必纍於脾脾為生痰之源肺為貯痰之器痰戀不化氣機阻滯一觸風寒喘即舉發治之之法在上治肺胃在下治脾腎發時治上平時治下此一定章程若欲除根必須頻年纍月服藥不斷倘一曝十寒終無濟於事也此非虛語慎勿草草發時服方款冬花桑皮紫菀蘇子沉香茯苓杏仁橘紅半夏淡芩平時服方熟地五味子陳皮苡仁胡桃肉半夏紫石英煅蛤殼杜仲茯苓詒按論病則源流俱到層折畢清用藥亦周到尉貼絶不浮泛洵非老手不能到此地位復診喘哮頻發脈形細數身常惡寒下焦陰虛中焦痰盛上焦肺弱肺弱故畏寒陰虛故脈數喘之頻發痰之盛也有所感觸則病發焉病有三層治有三法層層護衛法法兼到終年常服庶幾見效否恐無益也發時服方桂枝生曬乾款冬花蜜炙橘紅鹽水炒杏仁霜萊蔔子桑皮蜜炙共研末用枇杷葉十片去毛煎湯再用竹油半茶杯薑汁一酒杯相和一處將上藥末泛丸發喘時每至臥時服二錢苡仁橘紅湯送下平時服方大熟地砂仁拌丹皮鹽水炒茯苓牛膝鹽水炒澤瀉鹽水炒肉桂山萸肉酒炒懷山藥炒五味子鹽水炒磁石上藥為末用煉白蜜搗和拈作小丸丸須光亮俟半乾再用製半夏三兩陳皮二兩炙甘草一兩研極細末泛為衣每朝服二錢發時亦可服葉喘之標在肺喘之本在腎脈遲者寒也舌白者痰也以金水六君煎加味大熟地蛤粉炒半夏陳皮茯苓杜仲款冬花桂枝紫菀杏仁五味子胡桃肉復診喘發已平咳嗽不止吐出濃痰今宜降氣化痰蘇子旋覆花當歸款冬花桑白皮橘紅半夏茯苓杏仁金痰氣聲嘶面仰項折久而不已防有雞胸龜背之變蓋肺氣上而不下痰涎升而不降上盛則下虛故病象若此宜清肺以降逆化痰而理氣生石膏紫石英半夏茯苓橘紅川貝石決明蛤殼紫菀杏仁竹油薑汁另不蛀皂莢三枚去皮弦子煎濃湯一飯碗用大棗三十枚將湯煮爛曬乾將汁再浸再曬乾每日食棗五六枚某汗出不休氣短而喘是氣血陰陽並弱也足常冷為陽虛手心熱為陰虛營不安則汗出氣不納則喘乏法當兼顧大熟地附子三分拌炒黃耆防風一錢拌炒歸身白芍茯苓五味子紫石英黨參冬朮浮麥紅棗淵按此勞損虛喘也金受火刑經所謂耐冬不耐夏夏令見之都屬不治黃耆為汗多而設若喘而無汗即不相宜復診汗出減半氣尚短喘今當大劑滋陰再參重以鎮怯人參固本丸龜膠磁石紫石英五味子白芍胡桃肉三診周身之汗已收頭汗之多未斂氣喘較前覺重交午愈甚掌心覺熱脈形細數飲食減少陰津大虧肺氣傷戕茲當炎暑水衰火旺金受其灼咳嗽痰黃漸延損症擬清金麗水冀其應手為妙沙參麥冬大生地龜版川貝母知母五味子西洋參川黃柏某肺為貯痰之器脾為生痰之源肺虛則痰不易化脾虛則濕不能運痰上逆而喘咳濕下注而足腫腫之與喘無非氣失升降而乏運行之權也今擬脾肺同治冀痰濕運行乃吉黨參葶藶杏仁澤瀉大腹皮半夏赤苓陳皮通草冬瓜子枇杷葉棗詒按論病用藥俱能得其要領某年過花甲腎氣必虧即使善自調攝亦不過少病耳及至既病則各隨其見證而施治焉今咳嗽氣升食少倦怠證形在於肺脾自宜從肺脾求治然氣之所以升者即腎水虛而不能藏納肺氣也食葷油則大便溏者即腎陽衰而不能蒸運脾土也然則補腎尤為吃緊雖不治脾肺而脾肺得蔭矣黨參五味山藥紫石英補骨脂萸肉胡桃肉茯苓另金匱腎氣丸三錢詒按立論頗能探入深處用藥也親切不浮某氣上逆而咳甚舌心紅而邊白此陰虛痰滯下虛上盛之候也病已月餘消痰恐劫其陰養陰恐增其濁擬以降氣化痰少佐益陰為法蘇子降氣湯去桂另都氣丸五錢詒按立方切當某病將一載咳嗽內熱行動喘促少腹牽痛此腎氣虛而不納也仿都氣法生地萸肉茯苓丹皮山藥五味子澤瀉麥冬川貝沉香詒按立方精當再診壯水生金補子益母前方加黨參胡桃肉某咳嗽痰多氣急其標在肺其本在腎歷年既久自淺及深自肺及腎法當治其本矣熟地懷山藥懷牛膝半夏陳皮茯苓蛤殼五味子紫石英沙苑胡桃肉再診補腎納氣水不泛而痰自化培土運濕濕不停而痰可降矣懷牛膝懷山藥半夏陳皮茯苓熟地紫石英銀杏肉杞子五味子胡桃肉詒按兩方案語清簡用藥切實方中再加於術於培土較似有力強中氣不足濕化為痰氣逆不降喘息不安夜重於晝脈象弦滑滑主痰飲痰飲屬陰故病甚於夜也擬降氣化痰兼扶中氣半夏蘇子陳皮茯苓前胡旋覆花神麯竹茹雪羹枇杷葉石行動短氣而喘頭眩心跳得食則脹肝腎虛而氣不納脾胃虛而氣不運用補中益氣送下六味丸補中益氣湯加茯神半夏神麯砂仁煎湯送六味丸四錢邵質小肉脆先天元氣本弱偶因驚恐遂發寒熱熱重寒輕仍能飲食行坐醫投發散消導羌防柴葛服之無數汗總不出漸見咳嗽口渴迄今兩月餘矣七八日來驟加喘促汗出如淋大便溏泄溺竅灼痛小溲頻數夜不能臥飢不欲食渴不多飲舌紅燥裂右脈虛細左脈促疾陰氣大虧陽氣偏亢顯成勞瘵之形將何處治按內經論驚則動肝陽恐則傷腎陰陰傷陽不藏水虧木自橫木能剋土而火爍金此咳嗽喘促汗多者火入金鄉肺陰消爍於上也大便溏泄不食者木乘土位脾氣受困於中也溺瀝竅痛相火熾於下舌紅燥裂君火炎於上處治之法當瀉木火之實而補金土水之虛冀其喘定汗收二便調和再商大生地三錢茯苓三錢丹皮一錢半山藥三錢澤瀉一錢半麥冬三錢五味子九粒沙參三錢白芍三錢草稍五分炙草五分通草五分竹葉十片原注此六味湯合生脈散芍藥甘草湯導赤散四方並一用生地補腎陰茯苓山藥補脾陰丹皮澤瀉瀉相火去山萸者嫌其酸溫也麥冬沙參補肺陰五味斂汗芍藥甘草土中瀉木治腹痛便泄甘草梢瀉火緩痛加通草竹葉合入生地便為導赤散法治竅痛凡雜病雜合當用雜法而又一絲不亂頭頭是道大非易事此方服三劑喘止瀉止溺痛減進粥三飯碗接服此方二十帖愈張稚齡形瘦色黃痰多食少晝日微咳夜寐則喉中嗘吼有聲病已半載性畏服藥此脾虛濕熱蒸痰阻肺也商用藥棗法人參炙甘草冬朮茯苓制川朴蒼朮宋半夏陳皮川貝棐子上藥各研末和一處用好大棗一百枚去核將藥末納入棗中以線扎好每棗一枚大約納藥二分為準再用甜葶藶一兩河水兩大碗將棗煮候棗軟熟不可太爛取出曬乾候飢時將棗細嚼一枚一日可用五六枚余棗湯去葶藶將湯煎濃至一茶杯分三次先溫服原注此平胃六君子湯加川貝棐子也製法極好治脾虛濕熱蒸痰阻肺喉中痰多者極妙方從葛可久白鳳膏化出頗有巧意此病服之遂愈淵按心思巧妙觸發後學不少詒按靈心巧想可法可師秦痰飲咳喘脘中脹滿時或微痛雖肺脾腎三經同病而法當責重於脾蓋脾得運而氣化則痰飲有行動之機也半夏陳皮澤瀉茯苓杏仁破故紙川朴乾薑五味子同研胡桃肉淵按痰飲病輕則治肺脾重則治腎數方皆治飲正軌復診痰飲停於心下上則喘咳下則脘脹多由清陽失曠痰濁內阻轉胸中之陽以安肺運脾中之陽以和胃咳喘與脹滿當松瓜蔞皮茯苓陳皮薤白頭川朴乾薑半夏薑汁炒澤瀉枳實麩炒詒按此證咳脹兩證並重故治法亦脾肺兼顧胡痰飲久留於肺胃或咳或喘或脹滿皆痰氣之為病也化胃中之痰宜苓半化肺中之痰宜橘貝從此擴充以立方茯苓橘紅桂枝紫菀白朮半夏川貝炙甘草杏仁蛤殼詒按此病因有脘脹而無腎虛見證故始終以運脾化痰之法顧閲病原知由痰飲久留肺脾腎三臟交傷下則腎虛不能納氣中則脾虛不能運氣上則肺傷不能降氣由是咳喘不得臥肢腫腹膨神氣疲憊虛亦甚矣治上無益當治中下大熟地海浮石拌炒五味子炒破故紙鹽水炒牛膝鹽水炒蛤殼打沙苑子鹽水炒紫石英煅懷山藥炒麥冬元米炒茯苓黑錫丹每朝服三錢淡鹽湯送下淵按治下固是然五味無干薑熟地牛膝無肉桂肺腎之氣仍不能納降賴有黑錫丹主持可以取效詒按病候已造極深之域用藥如此亦背城借一之計李胃有寒侵肺有寒侵兩寒相得飲邪停咳而喘嘔為痰飲氣亦宜平痰亦宜平病痰飲者藥宜溫仲師方法細詳審二陳湯老桂木吳茱萸川椒苡仁生薑咳嗽卜心咳之狀咳則心痛喉中介介如梗狀甚則咽腫喉痹蓋因風溫襲肺引動心胞之火上逆故治法仍宜宣散肺經風邪參入寧心緩火之品仲景方法略示其端但語焉而未詳後人未細審耳前胡杏仁象貝桔梗射干遠志甘草湯制麥冬沙參小麥一兩煎湯代水微炒在此一味淵按非深入仲景堂奧不能道用宣散肺金風溫之方加小麥一兩清心熱即補心虛何等靈敏詒按心咳屬心火刑金之病宜略加竹葉玄參等清心之品乃合小麥湯代水頗有巧思胡咳嗽嘔吐痰濃頭痛風熱上蘊肺胃失降前胡杏仁蘇子橘紅款冬花桑白皮防風桑葉冬瓜子丁形寒飲冷則傷肺兩寒相感中外皆傷故氣逆而為咳嗽自秋冬歷春夏每每夜甚氣升不得臥近來吐血數口是伏寒化熱而陽絡受傷矣祛其伏寒退其浮熱必兼降氣化痰紫菀杏仁款冬花橘紅川貝桑白皮茯苓桂枝淡黃芩桔梗半夏枇杷葉胡肺有風邪則咳胃有濕痰則滿腎虛則腰痛肝虛則目花既不可徒散亦未可徒補擬兩顧法蘇子降氣湯去桂枝加茯苓玉竹穭豆衣桑葉胡桃肉枇杷葉某素有寒嗽時發時止上年歲底發時寒熱六七日方止至春初喉痛三日聲音遂啞而咳嗽作總因風溫襲於肺部宜宣邪降氣冀勉喘急旋覆花荊芥杏仁款冬花前胡蘇子枳殼川貝川芎桔梗蛤殼枇杷葉許寒咳交冬則發兼患頸項強急不舒大熟地二兩麻黃二錢煎汁浸一宿炒鬆川貝一兩黨參一兩元米炒陳皮一兩茯苓一兩細辛二錢煎汁浸一宿曬烘款冬花一兩製半夏一兩苡仁一兩杏仁霜六錢歸身一兩酒炒五味子五錢乾薑二錢同炒胡桃肉一兩上藥共為細末煉蜜丸每朝三錢開水送下淵按久嗽宜此方若頸項強急未免有外風襲三陽經也何不以湯劑兼治之詒按此陰虛而夾痰飲者故用藥如此再增桂枝一味則頸項強急亦在治中矣僧咳嗽七八年咳甚必汗出近半年以來痰中見血兩次肺氣腎陰虧損矣慮加內熱延成勞怯大熟地歸身蛤殼北沙參麥冬川貝甜杏仁蘇子桑白皮炙甘草枇杷葉復診久嗽肺腎交虛猶幸胃氣尚旺法以金水同治冀精氣漸生大熟地歸身炙甘草潞黨參桂枝款冬花炮薑麥冬半夏阿膠蛤殼原注此仿炙甘草合麥門冬湯病由寒伏肺底致成咳嗽日久傷及精氣故於滋補中兼化痰三診久嗽汗出諸藥不效用寧肺散粟殼一兩六錢醋炙炙烏梅肉四錢共研末每服三錢下午開水調服朝服金水六君子丸四錢開水送下某久病之軀去冬常患火升交春木旺肝膽陽升無制倏忽寒熱頭面紅腫延及四肢焮熱癢痛殆即所謂遊火遊風之類歟匝月以來腫勢大減四五日前偶然裸體傷風遂增咳嗽音啞痰多口乾舌白續發寒熱胃氣從此不醒元氣愈覺難支風火交煽痰濁復甚陰津消涸陽不潛藏清火養陰計非不善抑恐滋則礙脾化痰扶正勢所必需又恐燥則傷液立法務取輕靈定方必求無過北沙參知母鮮生地蛤殼蟬衣豆卷海浮石青果海虴地栗百合另珠粉朝晨用燕窩湯下三分原注上方金匱百合知母地黃湯合本事神效雪羹取其清火化痰不傷腸胃生津養液不礙痰濕酌古參今歸於平正姚咳嗽將及一年陰陽之氣各造其偏陽虛則外寒陰虛生內熱夏令濕熱用事邇日寒暄不調脾胃傷戕恐致成勞毋忽沙參茯苓五味子麥冬黃耆沙苑子川貝苡仁玉竹枇杷葉復診脈數未退陰虛未復咳嗽不止肺氣日虛夏暑將臨病尚未穩仍宜小心安養為要大生地生洋參麥冬川貝玉竹黃耆五味子沙參茯苓枇杷露唐七旬有六之年面色紅潤脈形堅搏外似有餘裡實不足屢患咳嗽嬌臟暗傷本月初旬微感風溫咳嗽又作舌苔薄白底有裂紋飲食略減風溫久戀劫胃津灼肺陰不可再投辛散當以甘潤生津花粉沙參玉竹麥冬苡仁杏仁川貝桑葉李咳嗽喉癢痰或稀或濃濃則腥臭脈象右弦而滑左弦小數肝經有鬱勃之熱肺家有膠黏之痰此痰為火鬱而臭並非肺癰可比當以平肝開鬱參清金化痰沙參橘紅蘇子杏仁石決明川貝茯苓丹皮蛤殼枇杷葉陳海虴漂淡地栗許咳嗽面白為金傷脈數而洪屬虛火是脈克色而火勝金也夏至一陰生正屬火令為剝極則復之際倘若剝而不復頗有火灼金銷之慮黨參黃耆炙甘草茯苓懷山藥麥冬沙參五味子紫菀陳皮原注此生脈散合六君子湯加紫菀夫四君去朮加黃耆山藥陳皮亦名六君在醫方集解中王暑風從背俞而內薄於肺濕熱從胃脈而上注於肺外內合邪其氣並於胸中氣不得通因而上逆氣升作咳舌苔薄白口膩不渴治屬飲家半夏陳皮枳殼馬兜鈴杏仁冬瓜子射干通草枇杷葉淵按宜佐開泄暑風之藥一二味如香薷蘇梗之類詒按此方輕靈可喜擬再加滑石苡仁既有暑風內薄宜再參疏泄之品郝仲景云風舍於肺其人則咳又云胸中有留飲背寒冷如掌大此證是也麻黃桑白皮象貝橘紅黃芩薑汁炒杏仁半夏生甘草茯苓款冬花胡痰飲咳嗽飽則安飢則甚乃胃虛也黃耆炙甘草冬朮陳皮白芍玉竹茯苓苡仁桔梗詒按再加黨參杏仁如何羅乾咳陰虛痰火盛丹溪方法主生津此由脘痛兼痰飲煙體須當溫化遵蓯蓉養陰溫潤咸能下降枸杞子甘溫益血製半夏燥濕痰茯苓清金燥濕陳皮鹽水炒理氣水紅花子飲停脘痛白螄螺殼痰停脘痛白蜜潤燥調服薑汁豁痰沖服復診煙體陰虛兼夾痰飲乾咳無痰脘痛微悶前方咸降兼以溫潤咳雖稍緩痰仍內蘊唇燥舌膩原方加味蓯蓉枸杞子旋覆花半夏茯苓陳皮白螄螺殼海參漂淡去砂薑汁衝入地栗汁衝入淵按海參入煎劑始於葉氏脘痛胸悶明系痰飲體雖陰虛仍不相宜奚黃昏咳嗽肺熱也黎明氣升腎虛也納食倒飽脾虛也補腎納氣治其下清金化痰治其上運脾培土治其中三焦並治大生地沙苑子麥冬川貝茯苓沙參懷山藥六神麯牛膝枇杷葉畢勞心苦志耗損營陰陰虛生內熱熱勝則風動由是心悸少寐頭眩咳嗽晡熱朝涼種種病情相因而至前議甘涼生津微苦泄熱服後熱減咳稀原得小效而或謂外感改投辛散雜入消導苦寒以致咳頻汗多猶云邪未盡達再欲發汗豈非癡説余今仍用甘涼之劑沙參玉竹麥冬地骨皮茯苓穭豆衣川貝茯神鐘乳石雪梨肉紅棗奚風邪襲肺肺氣失宣一月以來咳嗽上引頭痛乃振動肝膽之陽也幸胃旺能食邪未延及於中第久戀於肺者勢必漸化為熱乃咳而喉痛音啞肺陰為熱耗矣宣風散熱潤肺化痰是其治法然非數劑所能治蓋風入肺系祛之亦不易也牛蒡子馬兜鈴川貝桔梗杏仁蛤殼生甘草海浮石阿膠桑葉枇杷葉另蛤粉一兩青黛二錢蟬蛻七分共三味研為細末分七服藥汁調下每日一服原注肺陰已傷引動肝陽咳作頭痛青蛤散頗合皂莢子不可用恐劫液也戴五臟皆有咳總不離乎肺肺為嬌臟不耐邪侵感寒則咳受熱則咳初起微有寒熱必夾表邪邪戀肺虛脈形空大前方降氣化痰保肺滌飲俱無少效據云得汗則身體輕快想由肺氣雖虛留邪未盡補虛而兼化邪亦一法也用錢氏法牛蒡子元米炒馬兜鈴杏仁阿膠蛤粉炒蘇子桑白皮炙甘草款冬花茯苓桑葉枇杷葉詒按此肺虛有邪虛實兼顧之法沈脈虛軟而似數內傷虛弱奚疑夫邪之所湊其氣必虛虛處受邪其病則實咳嗽雖由外感而實則因於氣虛以為風寒固不可以為虛損亦未必可玉竹飲子主之玉竹杏仁蘇子桑白皮款冬花象貝旋覆花沙參元米炒橘紅枇杷葉詒按將虛實二字説得六通四辟此玉竹飲子加減潤肺疏邪虛實兼到祝咳嗽夜重風寒傷於肺勞碌傷於腎腎氣上逆故重咳於夜也前胡杏仁象貝橘紅半夏旋覆花紫菀茯苓沉香沙苑子淵按治風寒則可矣治腎虛則未也某咳嗽白痰味鹹是腎虛水泛為痰也小便黃陰虛內熱初起雖有風寒日久亦從熱化而元氣漸虛矣今從肺腎圖治沙參玉竹橘紅甜杏仁茯苓川貝紫菀蛤殼金狗脊十大功勞平病起傷風咳嗽邪留肺系久咳傷陰火起於腎上衝於心心中熱癢則咳甚而膚熱逮火降則熱亦退而稍平其所以發熱者由於陰虛也惟胃納甚少滋陰之藥不宜過當以金土水三臟皆調立夏在前冀其熱減為妙大生地蛤粉拌搗阿膠米粉拌炒懷山藥炙甘草川貝五味子茯苓牛蒡子丹皮炒焦橘紅紫菀枇杷葉王病後小産産後又復感邪咳嗽寒熱似瘧服解散疏和之藥五六劑邪雖退而未盡至夜猶覺微熱而頭暈心跳寐則驚惕虛象見矣擬養營化邪法生地當歸川芎白芍蘇葉蘇子蘇梗橘紅杏仁枳殼款冬花茯苓炙草川貝母原注方用四物湯三蘇之意在去血分之風和血中之氣余加化痰止嗽藥為佐使耳二診轉方用補肺阿膠湯合金水六君煎去半夏換川貝加款冬顧嗜酒多濕濕蘊生痰體質陰虛煩勞傷氣去冬咳嗽須微帶血行動氣升至今不愈診脈虛小恐加喘急茲以金水六君煎加味大熟地半夏陳皮茯苓款冬花杏仁蛤殼五味子麥冬胡桃肉另金水六君丸每朝服三錢淡鹽花湯送下李傷風咳嗽音啞肺主實邪也半月來連日煩勞勞則氣傷是以左肋虛里之間一點隱痛且右手合谷有時若針刺之狀皆氣亂於中經絡不和也擬疏達風邪兼和肺胃之絡而調其氣杜蘇子款冬花杏仁沙參旋覆花象貝母冬瓜子橘紅甘草絲瓜絡二診傷風咳嗽其脈多浮今反沉緊而澀是邪伏深固肺氣鬱而不達也左肋一點疼痛不移防發肺疽現在聲啞乃竭力正虛雖為金實不鳴之象然一夜安眠晨起則音清究屬煩勞傷氣可知擬芎枳散合瀉白法一面清金一面挑其深入血分之風桑皮杏仁川芎枳殼蘇梗骨皮冬瓜子桃仁另用敷方乳香沒藥芫花葶藶子各一錢上藥共研細末用蔥白頭三個搗爛和入陳酒乾麵少許調和敷痛處再加麝香三釐更妙某陰虛而兼痰濁致為咳嗽用金水六君煎半夏陳皮茯苓炙草當歸川貝杏仁紫菀熟地砂仁拌炒鬆後入略煎一兩沸原注仿飲子煎法濁藥清投取其益陰而不膩滯痰濁也詒按陰虛而挾濕痰最難用藥此亦無法中之一法疝氣某先天不足腎氣虛寒膀胱失化腎囊脹大疝氣上攻嘔吐不止防其發厥肉桂金鈴子烏藥巴戟肉胡蘆巴半夏吳茱萸澤瀉小茴香荔枝核又末藥方棉子肉四兩炒小茴香二兩鹽水炒糯米半升炒黃共研末砂糖調服淵按水盛凌土之象須崇土御水為主曾嗜酒之人多濕濕注下焦而成㿗疝腫脹久而不已慮其變釀囊癰濕漏等疾是屬奄纏萆薢橘核桃仁茯苓焦白朮延胡索海藻洗清昆布洗清澤瀉川黃柏炒打通草川楝子炒打附丸方金鈴子一兩炒打萆薢一兩炒茯苓一兩烘澤瀉一兩炒防己一兩焦山梔一兩白朮八錢炒黑白醜各二錢炒黃柏五錢炒川連三錢吳萸二錢煎汁炒苡仁一兩炒茅朮八錢米泔水浸昆布一兩洗淡炒橘核一兩炒打海藻五錢洗淡炒上藥共研細末用老絲瓜筋三兩砂仁三錢通草三錢煎湯泛丸每朝三錢開水送下秦濕熱素盛下注小腸厥陰之絡囊腫胯筋脹痛小有寒熱已經匝月擬泄肝絡兼通小腸金鈴子散柴胡青皮川山甲全蠍龍膽草枳殼山楂肉黑山梔沉香吳茱萸橘核復診疝本屬寒久則化熱其熱為標其寒為本當標本兼治金鈴子散木香烏藥吳茱萸橘核小茴香車前子川黃柏枸杞子胡蘆巴吳子和論七疝都隸於肝近因遠行勞倦奔走傷筋元氣下陷其疝益大蓋筋者肝之合也睪丸者筋之所聚也大凡治疝不越辛溫苦泄然勞碌氣陷者苦泄則氣益陷今先舉其陷下之氣稍佐辛溫是亦標本兼治之法補中益氣湯茯苓茴香延胡全蠍木香又丸方黨參白朮茯苓吳茱萸烏藥小茴香木香當歸枸杞子川楝子淡蓯蓉上藥研末用荔枝半斤去殼煮爛取肉搗爛另將核炙脆研末連前藥末共搗成丸朝暮用鹽花湯送下三錢詒按論病親切不浮周中氣不足濕熱下注厥陰之絡胯凹腎囊之間每逢勞碌必發疝氣攻痛兼有寒熱前用搜絡方法未獲效驗今用補中益氣湯加搜絡清裡之藥補中益氣湯去黃耆炙草加黃柏茴香全蠍吳茱萸黑山梔川楝子橘核絲瓜絡又藥酒方枸杞子沙苑子茴香仙茅川楝子熟地菟絲子吳茱萸杜仲巴戟肉黨參燒酒十斤浸夏五冬十日飲勿醉某中陽虛弱厥陰寒疝僭逆腹痛筋急大便堅結痛甚則嘔吐擬大建中湯川椒炮薑黨參附子半夏橘餅詒按此寒疝證之偏於虛者故用藥專於溫理某寒濕伏於厥陰久則化熱兩胯凹筋脹左睪丸偏墜發作則身有寒熱而囊皮腫脹出水此謂濕疝也屢發不已防有囊癰之變川楝子巴豆二枚同炒焦去豆茴香鹽水炒吳萸黃柏楂炭黑梔橘核萆薢荔枝核詒按濕鬱則化熱故須寒熱互用既屬濕疝似宜參用蒼朮苡仁燥濕之品又疝氣方川楝子巴豆七粒同炒焦去豆五錢小茴香鹽水炒三錢青皮炒三錢木香曬不見火三錢當歸酒炒三錢全蟲酒洗炙七個昆布漂淡炒三錢楂炭三錢共研末用韭汁一杯蔥頭汁一杯絲瓜絡煎濃汁二兩泛丸每日服一錢詒按此方溫肝通陽驅邪理疝用意頗佳可以為法遺精顧遺精無夢為腎虛咳嗽寒熱乃風邪腹脹納少兼肝氣此三者當先何治曰咳嗽盜汗出不宜治肺肝氣橫不宜伐肝然則治其腎乎六味丸去澤瀉加陳皮白芍沉香牡蠣芡實湘蓮肉復診遺精屬腎不寐屬心心火刑金則咳心陽下陷則遺陰虛則盜汗肝虛則結瘕法當交濟坎離大生地遠志芡實茯苓白芍黨參龍齒棗仁懷山藥龜版六神麯麥冬牡蠣五味子丹皮建蓮肉陳遺精無夢不特陰虛陽亦衰矣乾咳無痰不特肺虛胃亦弱矣補精納氣溫煦真陽治其腎也補土生金清肅高源治其肺也若夫救本之圖在於息心無妄無妄二字所該者廣心君鎮定自無震撼之虞大熟地黨參五味子枸杞子茯神菟絲子龍骨沙苑子懷山藥牡蠣龜版丹皮杜仲芡實張男子十四發身太早保真不固究竟外豐內虧不時內熱身倦乏力恐其延成勞損培補先天兼理後天尤宜自知愛惜為上黨參大熟地懷山藥丹皮茯苓陳皮沙苑子苡仁杜仲金狗脊薛左尺極細寸關微而似數右三部俱弦滑下有遺精暗疾肛門癢而出水上則頭眩耳鳴舌苔粉白以脈合症腎陰下虧濕熱相火下淫上混清竅為之蒙閉法當補腎之陰而清相火清金和胃分利膀胱以化濕熱萆薢大生地蛤粉炒知母澤瀉龜版麥冬黃柏赤苓半夏丹皮牡蠣懷山藥詒按病源分析極清用藥亦尉貼周到又丸方大生地砂仁陳酒拌蒸冬朮土炒黃連鹽水炒苦參天麻懷山藥丹皮鹽水炒川芎芡實龜版酥炙牡蠣煅澤瀉鹽水炒黃柏鹽水炒知母鹽水炒半夏萆薢鹽水炒赤苓麥冬元米炒上藥為末用建蓮粉四兩神麯四兩煮糊搗丸淵按此方治腎虛濕熱遺精極妙然須胃納尚旺者若穀食式微連柏等苦寒宜斟酌詒按此方用丹溪大補陰丸合封髓豬肚分清等法而成腎虛濕熱者用之頗合或乃以苦寒疑之是未識制方之妙義也高淋濁而兼遺滑耳聾目花肝腎大虛不宜滲利法當固攝沙苑子懷山藥破故紙茯神家韭子芡實龍骨牡蠣朝暮服威喜丸三錢淵按純屬虛象宜加熟地山茱萸李北門之籥得守則陽氣固坤土之陽得運則濕濁化濕濁化則精旺陽氣固則精守所嫌肌肉盡削夫肌肉猶城垣也元氣猶主宰也城垣傾頽主宰困窮然則非大補元氣不可大熟地西黨參冬朮枸杞子厚杜仲麥冬炙甘草懷山藥淡蓯蓉當歸半夏陳皮茯苓穀芽詒按案語精切此六君合景嶽大補元煎之方也脾腎兩顧用以填補則可特嫌少靈光耳某脾腎兩虛而濕熱又甚雖腰痛夢泄自汗盜汗而口膩味甜大便溏薄腎陰虛而不充脾陽困而不振進求治法只可先運脾陽茅朮炒黑乾薑熟地山藥五味牡蠣黨參茯神棗仁浮麥紅棗詒按此黑地黃丸加味確合脾腎兩補之法方中乾薑宜炮黑用再診溫運脾陽補攝腎陰仿繆仲醇雙補丸法茅朮制炮薑牡蠣黨參茯苓補骨脂熟地杜仲山藥首烏制浮麥五味子紅棗三診脾陽稍復腎陰仍弱節交夏至陽盛陰衰之候大劑養陰以迎一陰來復兼化濕熱以調時令之氣熟地生地黨參冬朮茅朮制黃柏鹽水炒茯神麥冬五味牡蠣龍骨杜仲五淋癃閉嚴淋濁三年不止腎虛濕熱不化陰頭碎癢筋骨微疼六味補腎能化濕熱耐心久服莫計效遲大生地懷山藥茯苓山萸肉五味子麥冬益智仁丹皮澤瀉湘蓮肉詒按六味能化濕熱其理頗精擬再加黃柏牡蠣又按此證陰頭碎癢筋骨微痛疑有瘡毒內戀而然須精濁連年不斷兼有血塊淋漓肝腎大虛八脈無以固攝濕熱混亂不清舌苔白膩法當脾腎雙補固攝下焦懷山藥茯苓菟絲子阿膠赤石脂炒杜仲血餘炭五味子沙苑子金櫻子蓮鬚旱蓮草淵按肝腎八脈之虛由濕濁混淆精血頻下若不先清濕熱以寧相火徒事補腎固精所謂不清其源而欲塞其流能乎否乎蕭據述病情多系情懷鬱勃肝腎下虛小溲頻數澄腳遍體機關骨節不利頭面覺麻此由陰液內虧風陽繞絡源泉不足膀胱不化使然養陰液以熄風陽救源泉以通氣化又須怡情安養庶幾可瘳大生地二冬龜版沙苑子五味子川斷茯神沙參覆盆子家韭子淵按既從七情鬱結而來乃心火不能下交於腎水致腎關不固似宜心腎兼治丁水竅精竅異路同門二竅不並開水竅開則濕熱常泄相火常寧精竅常閉若水竅為敗精瘀濁阻塞不通則濕熱不泄病已二載頗服滋補使濕熱敗濁漫無出路致下焦濁氣上攻及胃時時噯氣腹中不和二便不爽失下行為順之理診脈細肢寒腎陽與胃陽不布法宜通陽滲濕益腎化濁破故紙韭菜子茯苓萆薢小茴香菟絲子復診證勢仍然前方加減前方加桂枝白芍龍齒牡蠣三診雜藥亂投諸病不除中氣早戕故腹中不和大便不暢至於本病精濁淆混亦脾虛濕熱所致萆薢益智仁半夏陳皮黨參石菖蒲黃柏烏藥砂仁詒按精濁淆混四字將病情包括無遺用藥亦清靈不滯四診九竅不和腸胃病也胃以下行為順腸以傳道為職腸胃失司則噯氣腸鳴頭眩大便難小溲渾濁肛門溺竅皆癢白朮苦參茯苓陳皮香附六神麯澤瀉桃仁火麻仁檳榔青皮茵陳草五診濕熱濁邪混入清氣之中無路可出外則肌膚生瘰如粟且癢上則頭眩下則溺竅後陰俱癢精濁時流大便艱澀三焦俱受其邪虛實混淆之病也疏泄濁邪從下而出復入交濟坎離虛實同治朝服控涎丹十四粒陳皮湯送下暮服磁朱丸三錢沙苑子湯下淵按借控涎丹以瀉中焦濕熱痰濁磁朱丸以交濟坎離可謂善於騰挪王病起膏淋變為石淋今又成血淋矣蓋腎虛精不藏聚濕熱相火蒸灼致精化為濁濁凝成塊陰傷日久血亦下注故見血塊也填補陰髓以化濕熱法當滑澀兼施大熟地阿膠龜版天冬血餘炭芡實秋石沙苑子冬葵子韭菜子炒湘蓮肉蔣腎藏精肝藏血膀胱主疏泄故前陰一物也而有二竅二竅不並開水竅開則濕熱常泄相火常寧若房事過度則相火旺而精血不藏混入水竅為血淋竅痛焉大生地玄精石丹皮龜版五味子川黃柏血餘炭沙參知母麥冬茯苓阿膠高脈細固屬陰虛若下垂尺澤是相火下淫故精血下流小溲頻數溺竅疼痛大便乾結也補養腎陰兼清相火為法大生地龜版黃柏大黃酒炒木通小薊炭阿膠蒲黃炒焦山梔甘草梢知母玄明粉茯苓車前子牛膝張操觚蓮幕形逸心勞腎水下虧不能上承於心心陽內亢而反下趨於腎即坎離之不交也不交則諸病生由是而下為淋濁尿血宗筋絆痛上為眩暈咳嗽心中震躍診脈左小右大內傷虛證何疑今遠道初歸跋涉勞頓且擬和平補益庶無畸重畸輕之病馬料豆甘草梢茯神懷山藥麥冬建蓮肉沙參紅棗鮮藕枇杷葉復診心陰耗損君不制相相火妄動強陽常舉精濁時流肛門氣墜大便溏薄心中嘈辣干嗽無痰右脈空大兩尺皆虛法宜補心陰以制相火益腎氣以固元精西洋參黃柏五味子知母牡蠣龜版大生地麥冬另破故紙鹽水炒韭菜子鹽水炒研末煉蜜為丸每服三錢淵按相火旺而腎陰虧極矣二味為丸專助腎陽恐於此證不合包勞碌氣虛濕熱隨之下陷淋濁初起覺痛今不疼而但覺氣墜小便頻數色黃而渾濁不清仿東垣補脾胃去濕濁瀉陰火升清陽方法黃耆鹽水炒柴胡升麻沙參茯苓芡實萆薢黃柏知母燈心食鹽沖服一捻某腎虛精關不固濕熱混於坎宮精從溺後而出左脈虛細右脈洪大陰虧而相火勝也補腎陰化濕熱用涼八味法涼八味湯加萆薢另威喜丸三錢淡鹽湯送下再診精濁稍止而兩足重墮無力咳嗽胸痛金水兩虧濕熱不化擬清暑益氣以化濕熱兼固腎陰洋參黃耆茯苓五味神麯麥冬蒼朮白朮陳皮前胡通草另知柏八味丸三診精濁已止腿足重墮無力舌苔白而噁心坎宮之濕熱雖清胃家之濕熱猶戀擬和中化濕法豆卷半夏茯苓陳皮麥冬沙參扁豆另資生丸四診腎虛胃濕胸悶噁心口沃清水凡大便時則精竅自滲如膩濁擬滲胃濕固腎精熟地五味蒼朮白茯苓沙苑炮薑黃柏建蓮另威喜丸詒按凡腎虛胃濕之病用藥甚難著手第一方專顧腎第二方腎胃兼顧第三方專治胃第四方兩層合治從黑地黃丸加味最有巧思某淋濁日久不痛口常甜膩此腎虛而有濕熱也蒼朮四兩分作四份一份用米泔水浸透曬一份用鹽水炒一份用酒炒一份用破故紙三錢拌炒去故紙黃柏四兩分作四份一份用鹽水炒一份生曬一份酒炒一份用益智仁三錢拌炒去益智蓮蕊須馬料豆制首烏茯苓生草共研細末懷山藥粉煮糊為丸詒按腎虛而兼濕熱者用藥甚難觀此方取意極佳惟於腎虛一面尚可增入沙苑菟絲龜版之類某腎開竅於二陰前有淋濁之新恙後有腸紅之舊疾皆由於陰虛而有濕熱也寓育陰於利水清熱之中豬苓湯合加味槐花散主之茯苓豬苓阿膠生地槐米枳殼六一散血餘炭側柏炭詒按兩證貫串一線用藥自然親切再診便血已止淋濁未清今當固本芡實炙草洋參麥冬黃柏生地茯苓沙苑砂仁蓮肉懷山藥另八仙長壽丸每服三錢開水送下某小便頻數溺後有血絲塊此膀胱有熱腎虛有火逼衝任之血而下走前陰也法當通澀兼行生地炭阿膠蒲黃炒川連龜版赤苓黃柏鹽水炒大黃醋炒成炭血餘車前子藕另血餘炭二錢血珀一錢研末分兩服雞子清調下再診血止小便頻數氣墜擬補陰升陽法生地牡蠣茯苓龜版懷藥丹皮杜仲黨參建蓮鹿角霜詒按兩方用藥極為周到所嫌者平實而已某先腹痛數日遂至小便不利少腹脹滿如鼓今已半月屢用通利之藥小便雖通不爽少腹脹滿益甚診脈弦緊舌苔白膩飲食少納身無寒熱大便頻泄黏膩如痰此中陽不足水濕泛溢膀胱氣化無權法當溫土以御水寒通陽以化濕濁乾薑炒黃肉桂茯苓澤瀉茅朮木香茴香詒按因舌膩便痰故知其為寒濕惟先曾腹痛則方中又宜兼通氣分擬再加牛膝烏藥再診張先生用平胃化胃中之濕濁用五苓通膀胱之氣化簡淨的當無從增損愚意復入半夏一味暗合通徹陰陽之路使水濕痰涎從小便出是亦古人加減成方之心法也半夏茅朮川朴陳皮甘草茯苓豬苓肉桂澤瀉張寒氣客於下焦瘀凝停於小腹中央乃膀胱之部也寒氣瘀凝阻塞胞門膀胱陽氣失化以致癃閉産後八日而小溲不通脈細肢寒腹中覺冷恐其氣逆上攻發厥法以溫通下焦化瘀利水全當歸八錢川芎四錢山楂炭五錢炮薑五分桃仁三錢車前子五錢益母草湯陳酒各一碗煎藥另研桂心五分血珀五分甘遂三分為末藥汁調下淵按從生化湯加通瘀祛寒藥可法詒按末藥方甚佳煎方中擬加澤蘭牛膝吳萸此證甚急用藥能絲絲入扣迥異膚浮之家復診小溲癃閉已通惡露瘀凝未下少腹板痛再以溫通肉桂延胡索紅花桃仁丹參山楂炭歸尾牛膝炮薑炭冬葵子兩頭尖車前子痿證腳氣痹證某先天不足骨髂空虛常以後天滋補栽培脾胃脾胃得補濕熱壅滯形體驟然充壯而舌本牽強兩足痿軟不能行走上盛下虛病屬痿躄經云濕熱不攘大筋軟短小筋弛長軟短為拘弛長為痿是也今擬法補先天之精氣強筋壯骨以治其下扶後天之脾胃運化濕熱以治其中然必耐心久服確守弗懈庶克獲效倘朝秦而暮楚恐難許收功也熟地四錢附子三分煎汁炒茯苓三錢桑枝一兩牛膝一錢五分鹽水炒虎脛骨炙三錢川斷二錢酒炒巴戟三錢鹽水炒黃柏一錢薑汁炒蒼朮一錢五分萆薢二錢鹽水炒竹瀝二十匙薑汁一匙另洗方獨活三錢當歸五錢紅花一錢陳酒糟二兩豬後腳骨二隻蔥白頭三個煎湯日洗一次詒按此等證本難奏效其立方仍從丹溪虎潛法加味用藥固未嘗不切當也某伏熱留於肺胃胃熱則消穀易飢肺熱則痿躄難行熱氣熏於胸中故內熱不已延今半載節屆春分天氣暴熱病加不寐據述先前舌苔黃黑今則舌心乾紅其陰更傷仿仲景意用甘寒法生地三錢知母一錢五分茯神三錢棗仁一錢五分麥冬二錢滑石三錢夜合花五分沙參三錢百合一兩泉水煎服詒按金匱百合病篇有以百合配知母地黃滑石等法此方即用其意再診經云肺熱葉焦則生痿躄前方清心肺而退熱已能起床步履但夜不安寐是腎氣不交於心陰虛陽亢故也清金麗水取坎填離為治生地天冬麥冬棗仁山藥玄參沙參洋參百合另虎潛丸三錢詒按經云肺熱葉焦則生痿躄又云治痿必取陽明經訓昭然守此二語治法不外是矣三診陰虛未復夜寐未安熱退不清仍宜養陰自云腹中微微撑痛此屬中虛治當補益脾陰兼清心肺之熱生地沙參洋參山藥麥冬棗仁薏米茯神甘草白芍赤苓百合另歸脾丸某冷雨淋背於先竭力鼓棹於後勞碌入房挾雜於中病起身熱咳嗽至今四十餘日痰氣腥臭飲食能進臥床不起形肉消脫是肺先受邪而復傷其陰也經云陰虛者陽必湊之肺熱葉焦則生痿躄又云一損損於肺皮聚毛落至骨痿不能起床者死合經旨而互參之分明棘手重證矣沙參紫菀茯苓地骨皮川貝玉竹薏仁另八仙長壽丸四錢再診肺為水源百脈朝宗於肺猶衆水朝宗於海也肺熱葉焦則津液不能灌輸於經脈而為痿躄臥床不能行動形肉消削咳嗽痰臭舌紅無苔脈細而數是皆津液消耗燥火內灼之象考經論治痿獨取陽明者以陽明主潤宗筋胃為氣血之源耳今擬生胃津以供於肺仿西昌喻氏意沙參阿膠杏仁甘草玄參火麻仁天冬麥冬玉竹茯苓桑葉枇杷葉詒按議病立方深合內經痿論之旨三診投清燥救肺法病情稍安仍宗前制桑葉杏仁麥冬川貝百合玄精石阿膠沙參玄參枇杷葉野茭白根某長齋草載精血久枯大雨淋身濕侵入骨腿股酸重不能舉動法以宣通關節佐以養血生津麻黃蒼朮白芷當歸川芎白芍防風熟地桂枝獨活牛膝桑枝詒按此從陽和湯增減因系濕邪故加蒼朮某暑雨潮濕濕從下受入於經絡兩足腿股酸楚不能屈伸起臥轉側均覺艱難此屬腳氣適值經行之際少腹窒塞小便澀痛濕熱自氣傷營故舌苔白而底絳脈形濡身微寒熱慮其有氣逆沖胸之變擬東垣防己飲加減防己薏仁萆薢秦艽獨活桑寄生牛膝木通防風歸尾延胡威靈仙澤蘭絲瓜絡詒按此濕熱注於經絡之病與載入類傷寒中之腳氣宜用雞鳴散者不同再診兩足稍能行動濕熱有流通之機仍宗前法增損兼參健步丸意防己萆薢獨活牛膝杜仲晚蠶砂木瓜當歸延胡秦艽桑枝絲瓜絡某風寒濕三氣伏留於骨骨節痠痛自冬而起所謂骨痹也骨痹不已內舍於腎則發熱奄纏即成勞損秦艽杜仲五加皮生地地骨皮當歸續斷牛膝萆薢茯苓詒按邪郁化熱則傷及陰血故易入損方內再加丹皮桂枝更覺周到某寒濕之氣從外而入於內遍體歷節疼痛而又胸滿嘔痰經云從外之內者治其外又云胃為藏府之長束筋骨利機關皆胃氣之流行然則外通經絡內和胃氣便是治法之綱領矣川附茯苓南星半夏陳皮木瓜竹瀝薑汁詒按骨節痛與嘔痰自是兩途之病用藥兩面照顧亦為合法案中以胃氣一層牽合筋節雖似有理而實非內經本旨方中木瓜竹瀝是筋絡藥擬再加桂枝秦艽獨活桑枝牛膝婦人楊心胸覺冷經事數月一來食入則腹中脹痛寒痰氣鬱凝滯不通當以辛溫宣暢遵熟料五積散意半夏桂枝茯苓蒼朮白芍當歸身川芎川朴丹參炙甘草陳皮枳殼高良薑復診苦辛溫通之劑而能調經散痞用之而效益信古人言不妄發法不虛立在用者何如耳前方去良薑加茺蔚子砂仁王經後少腹痛連腰股肛門氣墜大便不通小便赤澀熱痛擬宣肝經之鬱熱通絡脈之凝澀柴胡川楝子焦山梔郁李仁延胡索猩絳旋覆花歸尾龍膽草青蔥管大黃淵按此經未盡而行房過度所致乃經血乘虛入絡衝任八脈受傷也詒按病情於小便上得之王經來半月不止有紫血塊少腹疼痛氣墜陰門診脈沉澀下午惡寒陽陷入陰營虛失守法以升陽收攝其陰黨參熟地黃耆升麻歸身阿膠蒲黃炒冬朮白芍柴胡淡芩血餘炭陸營分有熱則經至而淋漓衛分有寒則脈小而遲緩脾為營之本胃為衛之源經至而舌苔反布胸無痞悶是胃陽虛而無氣以化濁也擬醒胃陽以攝脾陰為法歸芍六君子加神麯復診經行過多血氣兩衰肝腎失固麗翁所論包括盡矣然治病之道有相機從事之權夫舌白多痰胃有濁也咽乾色紅陰虛而火浮也脈細遲緩中氣不足也考古人腎虛有痰濁者金水六君煎氣虛而上有浮火者生脈四君子合而參之似覺不可擅易還祈哂政大熟地半夏五味子歸身炭陳皮於朮茯苓麥冬人參穀芽建蓮肉三診肝腎與脾胃同治經漏仍然不止左脈稍覺有力原得歸地之功右脈更覺細微脾氣虛衰不振許學士謂補腎不若補脾蓋謂脾胃虛者言之今心跳食少心脾不足可知經血如漏厄不息衝任不得不固腹中微痛氣虛且滯不得不補不得不通仿黑歸脾法熟地炭黃耆炒焦茯神棗仁白芍廣木香歸身炭冬朮人參陳皮炙甘草淵按既云固衝任而無固衝任之藥仍用歸脾恐漏仍不止古人治崩漏急證自有專方如血餘棕炭百草霜倒挂塵等殊有效驗且脈小遲緩其漏未必屬熱或脾腎陽虛不能固攝其血尤非固而兼溫不效未可見血即以為熱也張營虛不足經事愆期肝氣有餘瘀凝停滯心蕩頭眩腹鳴脹滿是其徵也脹滿能食病在肝而不在脾擬疏肝化瘀和營養陰方法金鈴子吳茱萸當歸延胡索陳皮沙苑子茯苓香附大麥芽青皮曹經事來多去少似崩非崩是血虛有熱也所謂天暑地熱則經水沸溢用白薇湯加阿膠主之女貞子白薇阿膠米粉炒淡芩炭醋炒黃柏沙苑子鹽水炒白芍蓮心歸身炭旱蓮草詒按立方精到尉貼奚肝為藏血之臟脾為生血之源肝氣鬱則營血失藏脾氣弱則生源不足腹中結瘕肝氣所結也經事先期肝血失藏也飲食少納脾氣弱也便後帶血脾失統也氣弱血虛宜乎不孕矣調補肝脾則衝任充足自然有孕西黨參大熟地冬朮人乳拌白芍香附醋炒杜仲鹽水炒茯神辰砂拌菟絲子歸身木香川斷艾葉炭阿膠米粉炒烏鰂骨丁經事參前而色淡淡則為虛參前屬熱是血虛而有熱也四物湯香附阿膠黨參冬朮炮薑炭丹皮玫瑰花淵按佐炮薑以行四物之滯非溫經也可謂得旨朱痛而經來肝氣橫也經事參前血分熱也色黑有瘀和而化之可也金鈴子延胡索香附當歸丹皮白芍山楂肉澤蘭葉木香茯苓砂仁詒按立方平善復診經來色黑而痛當與化瘀生地桃仁炒黑紅花澤蘭黑梔香附醋炒當歸川芎醋炙大黃炭陸營虛發熱瘀阻經停心中若嘈飲食厭納時吐酸水是脾胃不足而夾痰飲者也夫心生血脾統血肝藏血胃為氣血之總司故調治之方必以和脾胃為第一脾胃健則營血自生停飲自運瘀凝自化半夏陳皮川連吳萸炒茯神辰砂拌桃仁旋覆花猩絳丹參野薔薇花白扁豆孫經期一載不來大便時常祕結每月胸中不舒數日此肝血虛而胃氣不和也理氣之方不在平肝而在養血和胃之法不在破氣而在補氣氣血充而肝胃自和矣西黨參熟地砂仁拌棗仁陳皮歸身製半夏丹參於朮人乳拌炒茯苓白芍沙苑子橘餅穀芽復診肝腎素虧氣鬱胃氣不舒脾陰不足飲食知味而不能多進經事不來二便時常不利肩膝痠疼舌苔或黃或白此有濕熱雜其中補養氣血之方雖穩當然無理氣化濁之品未能奏效今擬一方以觀驗否制首烏懷山藥棗仁牛膝焦山梔柏子仁茅朮炭陳皮半夏建蓮肉常服苡仁紅棗煮食某經停少腹痛小溲淋漓有血縷此肝火與瘀凝交阻當通而導之龍膽草小薊炭車前子丹皮桃仁大黃酒炒冬葵子海金沙延胡索焦山梔詒按立方切實徐咽乾乾咳全由津液之虧內熱經停已見虛勞之候設欲生津降火以養其陰而飲食減少者適以傷脾計惟調其中氣俾飲食增而津液旺以復其真陰之不足蓋津液生成於水穀水穀轉輸於脾胃舍此別無良法也白扁豆茯苓白芍玉竹炙甘草苡仁懷山藥金石斛玫瑰花枇杷葉陸驚恐飢飽勞碌內傷氣血血凝氣滯經停不來已及八月內熱食少慮成乾血勞損肉桂一錢二分桃仁二錢三分川斷一錢麝香五釐當歸二錢五分大黃醋炒一錢三分砂仁四分牛膝酒炒三錢乳香去油五分沒藥一錢五靈脂醋炒一錢五分共研細末分五服每日一服陳酒送下淵按此調經散加減法頗得古人遺意元氣可支者用之徐經行後奔走急路冷粥療飢少腹疼痛連腰脅兼及前陰此肝腎受傷又被寒侵而熱鬱也經云遠行則陽氣內伐熱舍於腎冷粥入胃則熱鬱不得伸故痛也遵寒熱錯雜例兼腹痛治法川連酒炒炮薑炭桂枝白芍吳萸三分煎汁炒木通全當歸香附山楂炭焦山梔旋覆花猩絳詒按推究病原親切不膚張形壯面色紫黑經事或數月或數十日而後來來亦色淡不多今經行後少腹攻痛痛在左則左股酸而無力痛在右亦如之兼有淋帶如膏此瘀凝化濁衝任失調也通絡泄濁治之五靈脂香附丹參金鈴子延胡索當歸尾冬葵子吳茱萸旋覆花猩絳青蔥管何漏下淋瀝不斷少腹板痛微寒微熱口渴不欲飲此有瘀血著於臍下擬化瘀生新法小生地當歸丹參桃仁泥澤瀉柴胡延胡索旋覆花大黃炭酒炒地鱉蟲酒浸復診漏下淋漓少腹板痛化瘀和營未能奏效食少無力微寒微熱治在肝脾緩之調之柴胡當歸丹參茯苓澤瀉赤芍白朮香附地鱉蟲山楂炭某寒熱無序脈促數下有淋帶上則心跳又少腹痛大便堅面色痿黃血瘀之候也慮延勞損大生地桃仁茯苓冬葵子當歸丹參柏子仁白芍穭豆衣玫瑰花王向有淋帶月前血崩崩止淋帶不斷少腹板痛脈象細數身發寒熱脾胃大虛此血瘀未盡復兼肝氣夾寒也法當通補鮮生地渣薑汁炒焦當歸炭荊芥炭杜仲陳皮生薑渣鮮地汁炒焦香附炭醋炒香穀芽淵按鮮地生薑互炒名交加散能通瘀調氣和寒熱而不傷血耗氣女科之妙方也陳經行作嘔血虛肝旺也嘔止而腹中結塊經事四五月不來當臍跳動疑為有孕恐其不然想由瘀凝氣聚與痰涎互結成塊耳內經腸覃石瘕二證狀如懷子病根皆在乎血雖不敢大攻當氣血兼理仿婦科正元散法黨參白朮川芎茯苓陳皮半夏當歸砂仁木香枳殼香附原注有孕無孕最難辨別此證斷乎非孕服此二十餘帖至八九月而經始行李婦人之病首重調經經事初起不來狀如懷子以後來而略少但腹漸脹大三載有餘豈得尚疑有孕內經謂腸覃石瘕皆腹大如懷子石瘕則月事不來腸覃則月事仍來而提其要曰皆生於女子可導而下夫豈徒有虛文而無斯症哉余曾見過下紅白垢汙如豬油粉皮樣者無數調理得宜亦有愈者借曰不然則天下盡有高才博學之醫就有道而正焉無煩余之多贅也大黃蟅蟲丸每朝三十粒炒大麥芽泡湯送下蘇石瘕生於胞中寒氣客於子門子門閉塞氣不得通惡血當瀉不瀉衃以留止日以益大狀如懷子此段經文明指石瘕一證由於寒氣瘀凝夾阻而成今腹痛泄瀉食少脾胃虛寒肝木橫逆病延半載元氣已衰理脾胃兼溫中下尚恐莫及備候主裁肉桂冬朮土炒陳皮木香金鈴子訶子茯苓乾薑澤瀉延胡索生熟穀芽潘年近六旬天癸久去而反頻來是謂脫營脫營者元氣極虛不能固攝血從外脫也又名下竭故腰痛如折下竭者必上厥故面赤火升發熱也血屬陰陰虛則陽亢故脈弦硬無情其脈愈數其陰愈虛夏令一交陽亢無制恐致水涸龍飛難為力矣阿膠赤石脂拌炒牡蠣海參線魚膠米粉炒玄精石沙苑子貢菜洗淡豬腰子酒洗茯神龜版膠餘糧石拌炒生洋參元米炒朝服震靈丹二錢暮服威喜丸二錢淵按吳鞠通法也妙以咸降有情之物補下焦精血舒乳房屬胃乳汁血之所化無孩子而乳房膨脹亦下乳汁非血之有餘乃不循其道以下歸衝脈而為月水反隨肝氣上入乳房變為乳汁事出反常非細故矣夫血猶水也氣猶風也血隨氣行如水為風激而作波瀾也然則順其氣而使之下行如風回波轉可也何必參堵截之法澀其源而止其流哉此可與知者道難與俗人言也玄精石赤石脂紫石英牡蠣烏藥寒水石郁李仁大生地白芍茯神歸身焦麥芽詒按此等議論全是精心結撰毫無依傍非胸有積理者不能道於乳汁變化之道確鑿指出非見理精到者不能方擬去石脂郁李加丹參丹皮牛膝某目之烏珠屬肝瞳神屬腎病因經行後腰痛口乾烏珠起白翳怕日羞明瞳神散大此肝腎之陰不足而相火上炎也補陰之藥極是再稍參清泄相火之品女貞子旱蓮草生地杞子黃柏三分煎汁炒潼沙苑穀精草丹皮玄參桑楂子黑芝麻另磁朱丸再診血虛則木旺木旺則脾衰脾衰則痰濕不化肝旺則氣火易升是以腹中時痛臍右有塊目中乾澀口常甜膩舌苔白而經水不調也治法不宜制肝制則耗其氣但當養陰以和肝不可燥濕燥則劫其陰只宜和脾以運氣此仲景治肝補脾之要法也黨參當歸白芍茯苓冬朮半夏陳皮丹皮香附橘葉三診脈輕按虛微是為元氣之虛重按細數是屬營陰之損左尺細弱腎水虧也歷診病情每遇經來其熱輒甚舌上即布白苔良以胃中濕濁因裡熱熏蒸而上泛也少腹有塊攻痛聚散無常是名為瘕瘕屬無形之氣隸乎肝腎為多揆其致病之由因目疾過服苦寒戕伐生生之氣胃受寒則陽氣鬱而生濕肝受寒則陰氣凝而結瘕陽氣鬱於胸中故內熱陰氣凝於下焦故腹痛經事過則血去而陰虛故其熱甚甚則蒸濕上泛故舌苔濁厚也刻下將交夏令火旺水衰火旺則元氣耗而不支水衰則營陰涸而失守惟恐增劇耳圖治之法補脾胃以振元氣培肝腎以養營陰是治其本也稍佐辛溫宣通下焦陰氣是兼治其瘕痛之標也黨參黃耆冬朮茯苓炙草歸身酒炒萸肉酒炒首烏木香白芍吳萸三分煎汁炒馬料豆生熟穀芽詒按三案論病則委曲周至用藥是細膩尉帖看似平淡無奇實則苦心斟酌以出之誠以調理內傷久病與治外感時邪不同病久正虛者病機必多錯雜礙手之處用藥並非一二劑所能奏效故立方必須四面照顧通盤打算不求幸功先求無弊此等工夫非老手不能擅場某內熱日久經停二月投養陰調血通經之劑得熱退經行可謂效矣然猶未也脈數不和舌仍光赤乃陰津未充虛陽未斂也仍宜小心安養為善生地當歸白芍丹皮阿膠香附黨參茯苓陳皮地骨皮詒按平正妥帖再診脈數已和舌色光紅已退但有時尚覺微熱仍以前法增損前方去丹皮阿膠加麥冬狗脊某經事不來足腫腹滿臍下偏左有塊上攻作痛此瘀凝氣滯病屬血分慮延成臌三稜醋炒莪朮香附當歸神麯楂肉延胡砂仁另大黃蟅蟲丸每服五粒日三次詒按此氣血兩疏之法用藥切實不浮好在丸藥緩攻不嫌其峻再診經停腹滿形瘦色黃氣血瘀凝防其成臌香附延胡枳殼茯苓蘇梗川朴大腹皮冬瓜皮另大黃蟅蟲丸某憂愁抑鬱耗損心脾之營而肝木僭逆胸中氣塞內熱夜甚經事兩月不來脈沉而數熱伏營血之中擬用柴胡四物湯和營血以舒木鬱黨參冬朮生地當歸白芍香附青蒿白薇生熟穀芽詒按此等證調治失當最易入於損途擬再加丹皮丹參某經行後少腹作痛上及胸脘腰脅內熱口乾大便不通小便熱痛此肝氣挾瘀所致川楝子延胡桃仁香附山梔薑汁炒澤蘭川連吳萸炒丹皮另當歸龍薈丸三錢淡鹽湯送下詒按病情與前條相似證也近之惟當歸龍薈丸用得太重宜減半服之某年近五十經事頻來且多是衝脈不司收攝故也防其崩決補之攝之黨參黃耆當歸於朮棗仁陳皮茯神阿膠荷葉蒂藕詒按此方從歸脾增減補則有之攝則未也擬加牡蠣龜板茜草炭烏賊骨以佐之某病起當年産後雖經調理而痊究竟營虛未復是以至今不育且經事乖而且多亦營虛而氣不固攝之故自上年九秋又感寒邪入於肺為咳嗽痰中帶血此謂上實下虛血隨氣逆蔓延旬日加以內熱漸成勞損姑仿仲景法扶正化邪以為下虛上實之法生地黨參炙草當歸豆卷前胡茯苓懷藥麥冬阿膠川貝杏仁桂枝枇杷葉詒按趨步古人非胸羅經訓者不能時下隨證敷衍烏能望其項背再診進薯蕷丸法補氣血生津液徹風邪咳嗽已減所謂上實下虛病情不謬據云當年産後腹中常痛至今未愈顯見營分有寒已非一日但內熱奄纏心悸頭眩久虛不復終為勞損茲從八珍加減復入通補奇經王道無近功耐心安養為是十全去耆芎加阿膠艾炮薑紫石英陳皮麥冬款冬花川貝神麯大棗三診溫補奇經病情俱減今仍前制十全去耆芎草加阿膠香附炮薑陳皮吳萸某兩次血崩之後赤帶連綿不斷迄今半載有餘脈象虛微氣血大虧是以頭眩心跳腰痠足軟等證均見也近日腹痛食減恐其復致崩決擬方固攝奇經女貞子烏賊骨茜草炭旱蓮草黨參茯苓白芍丹皮阿膠蓮肉荷葉蒂藕節另震靈丹二錢再診固攝奇經病情不減崩漏不止腹痛不已用升陽固陰法鹿角霜沙苑龍骨牡蠣懷藥杜仲女貞子杞子茯苓棕炭詒按固攝不效進用升澀此用藥轉換一定層次某崩後不時寒熱腹中有塊口發牙疳營虛有火氣虛有滯調之補之黨參陳皮當歸白芍丹皮茯苓麥冬玄參黑梔女貞子建蓮肉某養血以調經理氣以止痛補肝之虛以平眩暈助脾之運以除惡心熟地六兩分三份一份砂仁拌炒鬆一份薑汁炒焦一份陳酒煮爛當歸三兩分三份一份吳萸一錢煎汁炒一份茴香一錢煎汁炒一份酒炒白芍二兩分二份一份肉桂一錢煎汁炒一份炙草三錢煎汁炒香附四兩分四份一份黑梔三錢煎汁炒一份鹽水炒一份醋炒一份酒炒川芎酒炒一兩沙苑鹽水炒三兩茯苓三兩焙陳皮鹽水炒一兩五錢黨參炒三兩丹參酒浸曬乾再浸再曬如此七次焙研三兩詒按此方製法精巧養血理氣兩擅其長木香砂仁亦可酌增丁因瘧小産瘀凝未盡衝任受傷少腹結瘕上攻疼痛大便常溏內熱不已迄今半載不渴不嗽病在下焦通補衝任和營化瘀不越産後治例與陰虧勞損有歧當歸小茴香炒川楝子延胡索香附肉桂心研沖白芍吳萸炒紫石英茺蔚子砂仁玫瑰花淵按從瘧而起脾氣先傷大便常溏即其證據徒治下焦血分無益復診産後蓐勞已經八月內熱瘕痛病在衝任當歸酒炒白芍桂枝三分炒桃仁泥丹參黨參炒丹皮穭豆衣廣皮玫瑰花闕體弱素虧頻年屢患咳嗽今春産後悲傷咳嗽復作背寒內熱氣逆痰多脈虛數大便溏延今百日病成蓐勞按産後血舍空虛八脈之氣先傷於下加以悲哀傷肺咳嗽劇作震動衝脈之氣上逆經云衝脈為病逆氣裡急陽維為病苦寒熱頻進疏風清熱脾胃再傷以致腹痛便溏食減無味斯皆見咳治咳之弊越人謂上損及脾下損過胃俱屬難治姑擬通補奇經鎮攝衝脈復入扶脾理肺大熟地砂仁炒炭當歸小茴三分拌炒紫石英白芍桂枝三分拌炒白茯苓川貝牛膝鹽水炒詒按用熟地歸牛膝紫石英溫攝衝任用歸芍以調陽維用藥頗為親切擬再加胡桃人參山藥沙苑牡蠣張産後營虛發熱已經數月多汗心跳營陰大虧也大熟地黨參黃耆茯神歸身酸棗仁冬朮陳皮玉竹白芍砂仁某産後營虛內熱日久近感風邪發熱更甚胸悶心跳氣滯血虧顯然可見香豆豉炒黃耆防風全當歸白芍白朮棗仁茯神玉竹桑葉淵按虛多邪少從補營方中加輕散藥一二味即可祛邪重加發散邪轉不服反多變證趙病後小産産後感邪咳嗽寒熱似瘧服解散疏和藥五六劑邪退未盡夜猶微熱然頭暈心跳寐則驚惕虛象見矣擬養營化邪法四物湯合二賢加蘇子蘇梗蘇葉川貝杏仁枳殼茯苓款冬花原注用三蘇二賢四物意在泄血分之風和血中之氣加化痰止咳藥佐使之耳復診補肺阿膠合金水六君去半夏加川貝款冬花某左脈細數營陰虧也右脈細軟脾氣虛也産後不能安息反加勞碌氣血傷而不復致身常內熱心蕩若嘈久延慮成勞損人參養營湯加減黨參大熟地冬朮白朮丹參香附遠志甘草湯制砂仁歸身酒炒陳皮茯神棗仁孫前年小産惡露數日即止因而腹中作痛結塊心神妄亂言語如癲此血風病也胞絡下連血海上繫心胞血凝動火火熾生風故見諸證診脈弦搏肝陽有上亢之象防加吐血為治之法當以化瘀為先清火化痰為佐川貝赤苓丹參蒲黃炭五靈脂川連香附延胡焦山梔茺蔚子另回生丹一粒開水化服淵按血風病有數種此因産後瘀凝而得病在衝任血海上及心胞不脫産後著筆詒按疏證病原切實指點與膚浮影響者不同毛産後腹痛一載有餘營虛木鬱脾胃受戕時作惡心時吐酸水用千金當歸建中湯法當歸炮薑炭炙甘草肉桂川椒橘餅白芍吳萸炒南棗詒按用藥切當無支湊幫貼之病自是老手復診前投建中法腹痛已止復因經行之後勞碌受寒腹中又痛加以晡熱飲食減少舌苔乾白此屬血虛肝鬱脾虛木橫用歸脾法加減黃耆黨參冬朮茯苓砂仁炮薑木香陳皮歸身白芍吳萸炒橘餅胡小産半月感邪發熱又遭驚恐衝任受傷少腹脹痛白帶淋濁眼花口苦腰膝拘攣證逾半月飲食不納慮其昏厥姑仿以濁攻濁法兼達邪化瘀備商淡豆豉白前澤蘭葉延胡索焦山梔當歸丹參焦楂肉竹茹交加散兩頭尖章先痙厥半日而後産産後厥仍不醒痙仍不止惡露稀少湯水不能納納則仍復吐出面赤身溫脈洪而荒肝風熾張營虛氣耗虛陽外越冷汗遂出恐其厥而不返奈何奈何姑擬一方希冀萬一肉桂五分當歸三錢煎湯沖童便一杯化下回生丹一丸淵按脈荒者亂也究屬杜撰虛風挾痰上逆化痰降火衝入童便最妙復診前方勉灌三分之一惡露稍多面赤稍退脈大稍軟而厥仍不醒舌色灰黃時沃涎沫兩日飲食不進營虛氣滯胃虛濁泛必得溫通化濁以冀陽回厥醒為妙肉桂炮薑半夏全當歸丹參山楂肉陳皮茯苓紫石英童便衝入三診厥醒進粥半盞諸無所苦惟周身疼痛不能轉側舌苔白口不渴擬溫養氣血兼和胃氣肉桂炮薑黃耆半夏當歸丹參茯苓陳皮桑枝丁産後瘀凝未盡新血不生身熱日久少腹疼痛小溲淋漓帶下血筋此肝經鬱熱兼夾瘀凝為患殊非小恙姑擬泄肝化瘀和營為法鮮地渣薑汁拌炒焦金鈴子延胡索丹參當歸焦山梔生薑渣鮮地汁拌炒焦龍膽草甘草梢赤苓青蔥管猩絳屑詒按恰合病機惟少腹痛者於化瘀一層尚須著意擬加西珀烏藥紅花範産未滿月操作猝遇大雨淋身水寒之氣自毛竅而入於骨節內舍於腎外達太陽陽明是以始病腰疼繼而上攻頭痛遍體機關不利也脈沉而寒熱寐少而恐懼納少而噁心邪氣留連於胃腎據云頭痛甚則汗出太陽之表虛矣用許學士法香豆豉牛蒡子豆卷杜仲磁石藁本白芷川芎金狗脊赤苓半夏甘菊花淵按太陽表虛風藥未免太過況得之産後乎復診前投益腎通經和胃泄濕頭項腰脊之痛原有松機今産後兩月有餘經水適來而心跳恐懼是營氣虛而不攝也擬和營止痛仍佐理胃泄濕黨參桂枝秦艽棗仁杜仲豆卷半夏赤苓苡仁金狗脊歸身陳皮桑枝酒炒三診産後營虛雨濕寒氣襲入經絡機關不利前投宣通養血兩法俱無少效雖頭痛略鬆而右半之腿臂轉增痛熱猶幸脾胃稍旺今惡風發熱口乾是寒濕漸化為熱矣擬疏泄濕熱以通經絡再議羚羊角丹參防風秦艽苡仁陳皮羌活絲瓜絡防己當歸白芷忍冬藤木通桑枝王産未百日骨蒸發熱奄延匝月熱勢漸加迄今五十日矣診左寸關輕取虛小中按之數重按數而且堅知其熱在陰中心肝之火獨亢右寸關虛軟而數則知脾肺氣虛兩尺皆虛腎陰虧也陰虛陽盛熱氣熏於胸中蒸動水穀之濕上泛故舌苔反見濁厚耳耳鳴而聾者腎虛肝陽上逆也據述服參耆則熱勢愈甚投膠地則胃氣益憊節近清明地中陽氣大泄陰虛陽亢莫制恐其交夏加劇刻下用藥以脾胃為要土旺四季各十八日清明節后土氣司權趁此培土冀其脾胃漸醒飲食漸加佐以清金平木必須熱退為妙北沙參地骨皮丹皮歸身懷山藥白扁豆茯苓白芍生熟穀芽白薔薇露徐昔立齋治病每定一方令人服數十劑非心精識果烏能若此然非病家信之真任之專亦烏能若此林也不才何敢妄希前哲然審病既的藥當不謬從此加鞭以圖進益天冬麥冬生地熟地懷山藥沙參茯神棗仁牡蠣白芍洋參阿膠紅棗浮麥原注此婦年三十四五從未生育因驚恐患怔忡頭昏耳鳴火升發熱汗出食少便堅將及百日服此方三十帖見效即將此方加重煎膏常服幾及一年全愈後生一子小兒李胎驚之病得之於母腹胎孕之後其母有所大驚氣應於胎驚氣入肝故數月嬰孩即有胎驚之患往往不能愈姑擬一方備採羚羊角天竺黃陳膽星石菖蒲大黃共研末竹油或鉤鉤湯調服五分許音啞喘咳痰聲嗘咯風痰襲肺肺脹夾驚險候麻黃杏仁射干桔梗桑白皮菖蒲枳殼前胡白前紫菀白蘿蔔汁沖服詒按此證風痰壅閉與喉科中馬脾風相類治之稍遲即不可救學者最宜留意朱痧後夾積移熱於大腸腹中熱痛每交寅卯二時則痛甚擬開肺金之郁仿丹溪論參越桃意高良薑桔梗川連通草滑石焦山梔山楂炭焦六曲砂仁復診痧後腹痛甚於黎明陽氣為陰寒凝遏欲升而不得升故痛甚於黎明也前用溫寒並進見效今仍前法加減桂枝炮薑吳茱萸木香延胡索香附山楂炭花檳榔赤苓焦山梔白蔻仁詒按此寒熱錯雜之證大抵熱為寒鬱故立方以寒熱互用見功方痧後肺火不清移熱於大腸之絡腹痛便溏手脘內外腫痛防發痧毒治以清解升麻葛根赤芍焦山梔甘草高良薑丹皮桔梗忍冬藤淵按此方匪夷所思庸者必與清肺健脾化積解毒套劑矣復診前方已效輕減其制防風焦楂肉銀花砂仁桔梗甘草陳皮赤芍某先痢而後瘧已經兩載面黃內熱腹滿足腫脾氣大虛舌紅形瘦陰液大傷童勞證也黨參茯苓於朮陳皮黃耆澤瀉川連神麯防風根再診瘧痢三年脾胃元氣大傷脈數舌紅腹滿足腫小溲短少前投升陽益胃熱勢略減今擬補益脾陰兼以化濁然童稚陰虧病延日久夏令防其增劇黨參懷藥冬朮麥冬五味白芍陳皮茯苓砂仁雞內金詒按小兒虛證自以後天脾胃為主然脈數舌紅陰液亦損亦當稍參養陰之意某先天不足三陰虧損筋絡空虛兩足蜷攣身熱骨瘦童勞痼疾難治生地當歸牛膝川斷狗脊苡米鱉甲羚羊角桑枝詒按用苡米桑枝於補劑中稍參風濕治法某斷乳太早元氣薄弱咳嗽發熱已逾四月形瘦骨立疳勞重證唇紅而善食胃有疳蟲也川貝杏仁茯苓百部川連黨參地骨皮陳皮蕪荑款冬花桑白皮詒按此方專以殺蟲為主愚意當另擬培元之法以佐之戚馬脾風極重險症危生倏忽姑與牛黃奪命散大黃生切四錢檳榔一錢五分黑牽牛三錢共研末分二服白蘿蔔汁溫調服詒按此古方也病情急重非此亦無法可挽或有痰熱壅甚者服越婢麻杏甘石湯亦效
