仁三錢生穀芽三錢薑汁一匙更衣丸一錢半藥汁送下原注此方略加薑汁宣通胃氣不使地冬等滯而不行稍寓微意王旭高曰按此證在第十二日即十一診動氣已寧舌焦齒垢晡熱若用滾痰丸滌其餘實大便一通斷然不致病退之後舌焦猶未化盡暗失機宜只心中自知之可與智者道難與俗人言也此病得力處在第六日即第五診用承氣合小陷胸法早一日不得遲一日不得當下失下必致昏狂莫可著力時下多蹈此弊亦只可意會而不可以言語形容也十九診服更衣丸似欲大便而不得出此幽門燥結故也宜豬膽導之二十診便通思食腹中尚不通暢擬和其胃大豆卷三錢赤苓三錢生熟穀芽各二錢半新會皮一錢鹽水炒生熟砂仁各三分川通草四分宋濕溫過候斑疹並見心胸煩懊神識模糊脈數混混而不清舌心苔干而不膩濕蘊化熱熱漸化燥氣粗短促目赤耳聾陰精下虧風陽上亢慮其內陷昏痙擬生津達邪兼芳香逐穢鮮斛淡豆豉竹茹連翹橘紅天竺黃赤苓黑山梔菖蒲鬱金羚羊陳膽星牛黃清心丸五分加犀黃三釐二診濕溫邪在太陰陽明濕勝於熱太陰為多熱勝於濕陽明為甚日晡煩躁陽明旺時也口雖渴苔仍白膩乃濕蘊化熱余濕猶滯氣火熏蒸矇蔽清竅故斑疹雖透而神識時糊脈沉小而數疾皆邪郁不達之象倘若熱甚風動變痙便難措手半夏赤苓鮮石斛連翹川連薑汁炒菖蒲通草豆豉鬱金益元散黑山梔竹茹茅根淵按宜參涼膈散緩緩通下不致下文化燥內陷耳蓋濕溫雖不可早下而熱勝挾滯者不下則熱邪挾滯不去濕邪亦從熱化燥化火也三診濕溫旬日脈數較大於昨熱勢較盛於前所謂數則煩心大為病進並非陰轉為陽自內達外之象舌苔白厚上罩微灰面紅目赤陽盛之徵頭昏耳聾陰虛之象小溲窒塞氣化不及也當生津以徹熱利竅以化濕救陰不在腎而在生胃津去濕不可燥而在通小便蓋汗生於津津充汗出而熱解小腸為心之府小便通利心火降而神清羚羊角赤苓菖蒲天竺黃澤瀉益元散知母鮮石斛通草竹葉鮮薄荷根另用珠子五分血珀五分為末調服淵按名言讜論勿草草讀過四診濕熱鬱蒸如煙如霧神識沉迷脈時躁時靜靜則神倦若寐躁則起坐如狂邪內陷矣雖便不通而腹鳴不滿腸胃不實其糞必溏未可驟攻下之大凡溫邪時證驗舌為先今尖苔白上罩微黴邪在營氣之交葉氏云邪乍入營猶可透熱仍轉氣分而解如犀羚玄翹等是也從此立方參以芳香宣竅犀角羚羊角鮮石斛天竺黃玄參連翹益元散赤苓竹茹至寶丹一粒五診前方加鮮地栝蔞仁枳實六論舌黑而干濕已化燥頻轉屎氣脘腹按痛邪聚陽明腸胃已實當商通腑但小便自遺腎氣虛也正虛邪實津枯火熾惟有瀉南補北勉進黃龍湯法鮮地人參生大黃玄參玄明粉菖蒲天竺黃連翹竹葉甘蔗汁代水煎藥淵按蔗汁生飲最妙代水煎藥不但膩膈且失涼潤之性矣七診下後舌黑稍退而脈反洪大神識仍昏陽明火旺也清陽明燔灼之火救少陰涸竭之陰用景嶽玉女煎鮮地玄參鮮斛知母天竺黃麥冬石膏竹葉蘆根蔗汁一杯沖八診津回舌潤固屬休徵風動頭搖仍為忌款溫邪雖退元氣大虛虛風上擾不息又防眩暈厥脫今當扶正熄風參以生津和胃生洋參鉤鉤天麻茯神製半夏秫米石決明陳皮麥冬竹茹甘蔗皮淵按熱滯雖從下而鬆肝家陰液早為燥火所傷故見證如此遲下之纍也胡素有肝胃病適挾濕溫七日汗解八日復熱舌灰唇焦齒板口渴欲得熱飲右脈洪大數疾左亦弦數脘中仍痛經事適來靜思其故請明析之夫肝胃乃腹中一臟一腑木乘土則氣鬱而痛若不挾邪安得寒熱即有寒熱斷無大熱以此為辨也又詢大便堅硬而黑是腸胃有實熱所謂燥屎也考胃氣痛門無燥屎症惟瘀血痛門有便血然此證無發狂妄喜之狀則斷乎非蓄血此又一辨也渴喜熱飲疑其為寒似矣不知濕與熱合熱處濕中濕居熱外必飲熱湯而濕乃開胸中乃快與真寒假熱不同再合脈與唇觀之其屬濕溫挾積無疑傷寒大白云唇焦為食積此言諸書不載可云高出千古豆豉鬱金延胡山梔香附赤苓連翹竹茹蔞皮外用蔥頭十四個鹽一杯炒熱尉痛處原按病本濕溫挾食交候戰汗而解少頃復熱為一忌汗出而脈躁疾者又一忌適值經來恐熱邪陷入血室從此滋變亦一忌故用豆豉以解肌黑梔以清裡一宣一泄祛表裡之客邪延胡索通血中氣滯氣中血滯兼治上下諸痛鬱金苦泄以散肝鬱香附辛散以利諸氣二味合治婦人經脈之逆行即可杜熱入血室之大患栝蔞通府赤苓利濕加竹茹連翹一以開胃氣之郁一以治上焦之煩外用蔥鹽熱尉即古人摩按之法相贊成功淵按此雖有食積亦不可下以胸痞脘痛渴喜熱飲中焦濕飲郁遏不開寒熱錯雜陽明之氣失於順降若遽下之輕則痞隔重即結胸矣同一濕溫夾滯其不同有如此者詒按此等證最易混淆案語層層搜剝可謂明辨以晰惟既見挾積方中似應加用枳實山楂此證汗解復熱凡伏氣發溫逐層外出之證往往有此不必疑其別有他邪也用藥兩疏表裡大致亦合惟既見舌灰唇焦則中焦有濁積無疑疏里之藥尚宜加重倘苔灰而燥即大黃亦可用也復診服藥後大便一次色黑如栗者數枚兼帶溏糞脘痛大減舌黴唇焦俱少退原為美事惟脈數大者變為虛小無力心中覺空是邪減正虛之象防神糊痙厥等變今方九日延過兩候乃吉香豉青蒿沙參赤芍川貝鬱金黑山梔竹茹稻葉金橘餅淵按大便通而痛減乃蔥鹽按摩之功也蔥能通氣咸能順下陽明之氣得通胃氣自然下降胃氣通降大便無有不通者夫便猶舟也氣猶水也水流順暢舟無停滯之理若但知苦寒攻下不明中氣之逆順是塞流以行舟耳詒按大解後熱平脈轉弱小倘內伏之熱邪已淨或稍有餘熱而不甚重則從此各候俱平祗須清養而已若停一二日伏邪再熾則脈隨病變或仍數大亦未可知若熱勢盛而脈虛小是邪盛正虛之重候仍當隨見證治之不得以九日兩候等語為憑也某久病元氣未復又感濕溫已逾旬日解表疏中通下之藥皆已服過現脈仍數舌白膩頭汗多身熱不解咳嗽不揚小溲不爽且以分泄三焦再看轉機豆卷杏仁赤苓腹皮川朴桔梗蔞皮蘇梗澤瀉滑石通草高舌白口渴咽痛濕溫化熱證方四日年高正虛勢防戰汗冀其無變為佳薄荷桔梗射干滑石牛蒡子橘紅杏仁枳殼蔻仁蘆根二診溫邪挾積化燥昨服藥後戰汗不透大熱雖減裡熱仍熾舌黴邊白脈形不顯高年恐其內陷大力子香豉鮮石斛連翹黑山梔薄荷根滑石枳實三診胸脘板痛拒按此屬結胸舌心燥邊白此挾痰水挾氣積證交七日溫邪內伏將燥未燥將陷未陷昨午投生津達邪一劑今結胸證已具勢不容緩再進小陷胸法川連半夏枳實蔞仁香豉黑山梔淵按仲景小陷胸以枳實佐川連栝蔞佐半夏苦泄辛潤開中焦之痞以化痰水熱邪方名陷胸與諸瀉心湯出入並非下劑今人以蔞枳為通府之藥殊屬可笑查證交八日舌苔灰白膩渴不多飲咳逆不爽痰多稠黏周身骨節疼痛兩脅痹痛尤甚大便濡泄神識時糊脈形軟數證屬濕溫邪居手足太陰而以手太陰為要蓋肺主一身之氣氣機不達則三焦竅絡皆阻故此病之所慮者在於氣急氣急乃喘之漸若喘甚不休則有厥脫之危擬方備商射干七分杏仁三錢苡仁三錢赤苓三錢滑石三錢鬱金一錢半川朴七分橘紅七分連翹三錢豆卷三錢淡豉三錢象貝三錢鮮石斛五錢茅根一兩枇杷葉三片原注效暑病溫暑邪挾積身熱腹痛先與疏達香薷川朴花檳榔砂仁藿梗焦六曲蘇梗赤苓陳皮通草復診腹痛拒按當臍有塊壯熱無汗舌苔黃膩氣升煩懊防其發厥法以表裡兩解柴胡淡芩枳實赤苓玄明粉生大黃半夏赤芍三診投大柴胡湯法下出碎塊溏糞兩次腹痛不減煩懊不安氣升嘔逆舌苔黃燥食積填塞陽明暑邪內走厥陰防其昏厥擬以泄厥陰通陽明川連吳萸炒楂炭淡豆豉黑山梔栝蔞仁當歸龍薈丸三錢包煎枳實蘇梗木香三味磨沖外敷方蔥一把鹽一杯丁香一錢飛面三錢打爛敷痛處原注此四磨飲合小陷胸梔豉左金合劑疏通氣分泄肝化積再用外敷法其氣有不通行者乎淵按暑必挾濕濕為陰邪最能阻礙陽氣故暑濕病多脘腹痞痛積滯內阻暑濕之不化實由氣機之不通下而痛仍不減乃未得辛通之藥中焦痞滯未去耳丁暑乃鬱蒸之熱濕為濡滯之邪暑雨地濕濕淫熱鬱惟氣虛者受其邪亦惟素有濕者感其氣如體肥多濕之人暑即寓於濕之內勞心氣虛之人熱即伏於氣之中於是氣機不達三焦不宣身熱不揚小水不利頭額獨熱心胸痞悶舌苔白膩底絳尖紅種種皆濕遏熱伏之徵顯系邪蘊於中不能外達擬以梔豉上下宣泄之雞蘇表裡分消之二陳從中以和之芳香宣竅以達之冀其三焦宣暢未識得奏微功否六一散黑梔薄荷豆豉半夏陳皮石菖蒲赤苓鬱金蔻仁通草竹茹荷梗詒按議論親切用藥得輕清靈三字之妙再診形體豐肥者必多濕肌肉柔白者必氣虛況暑病必有濕邪遏伏中氣受戕前用微苦微辛宣通三焦服後大便通調胸中寬暢原得小效要知濕性濡滯本難霍然即愈若用辛雄燥濕苦寒泄熱是亦一法然恐非肥白氣虛者所能勝任拙見仍守前法毋存欲速之心反致耗氣之弊惟高明裁之前方去薄荷加杏仁三診白苔漸退而舌心反見裂紋是濕轉燥矣不飲不思食小便仍不爽利餘熱猶滯三焦之氣未盡宣達也三焦者一氣之周流而各司其職上焦主納而不出下焦主出而不納中焦則輸其出納清陽出上竅濁陰走下竅三焦自協於平今議從中升降其上下所謂升降者亦升其清而降其濁耳葛根杏仁赤苓陳皮紫菀薏仁川貝炒黃澤瀉血珀竹茹大麥稻葉吳勞碌之人中氣必虛暑濕熱穢濁之氣自口鼻吸入氣道滿布三焦雖舌苔滿布而胸無痞悶非邪伏膜原之比重濁之藥徒傷中氣與濕熱瀰漫之邪無益今交五日神氣似清而渾恐其過候有耳聾神迷厄逆等變為治之法且以芳香理氣逐穢再議刀豆子鬱金澤瀉石菖蒲杏仁陳皮栝蔞仁滑石香薷桔梗北沙參赤苓藿香佛手鮮荷葉鮮佩蘭葉丁咳嗽已久近患時溫之後原氣未復又感暑風閉其汗孔身復發熱法當先理暑風用輕劑宣上桑皮蘇梗杏仁川貝橘紅冬瓜子茯苓竹茹原注此虛而挾邪暫用輕揚表法未便著手蔣三瘧日久又感暑風咳嗆痰血熱勢變亂且以解暑清肅肺胃香薷一錢北沙參五錢冬瓜皮三錢六一散四錢神麯三錢青蒿錢半杏仁三錢丹皮錢半桑葉錢半白扁豆三錢枇杷葉二片淵按咳嗆痰血肺陰肺氣已傷雖有表邪香薷用宜斟酌李暑邪內閉惡寒發熱脈象不達口不能言先有咳嗽此肺氣閉塞擬開而達之射干五分桔梗一錢連翹三錢豆豉三錢杏仁三錢象貝三錢香薷一錢橘紅一錢菖蒲五分竹茹一錢牛蒡子二錢玉樞丹四分磨沖安連日煩勞憂慮深暑邪傷氣易歸心神昏脈數細而沉病危甚邪閉心胞如火如焚舌色干黃唇齒燥耳聾便泄津枯了三焦皆病須分曉究治療河間熱論宜參考鮮石斛天竺黃連翹菖蒲赤苓通草北沙參益元散茉莉花竹茹薄荷葉蘆根鮮荷葉紫雪另調服李暑濕陰氛之氣從口鼻肌表而入寒熱便泄頭脹擬芬芳逐穢分消濕熱方法藿香川朴焦六曲半夏茯苓大腹皮陳皮澤瀉砂仁通草某暑邪內閉不達神糊舌白恐其昏厥芳香透達為宜鮮藿香天竺黃菖蒲赤苓連翹益元散鬱金竹茹澤瀉另至寶丹一丸菖蒲湯化下復診暑濕內蘊熱勢起伏胸痞泄瀉神糊心跳經行未止乃正虛挾邪慮其暈厥據云腹脹噁心且寬中理氣太無神朮散去草加茯苓澤瀉蘇梗葛根淡芩黨參柴胡砂仁通草竹茹某暑濕熱阻滯陽明積垢雖下尚未盡淨夜間熱甚神識沉迷所慮津傷化燥等變今以生津泄熱化濁佐之鮮石斛赤苓連翹香豉栝蔞仁淡芩天竺黃山梔菖蒲竹茹伏暑某伏暑挾積傷脾身熱腹滿便泄脾傷則木橫熱勝則風動故手足搐搦眼吊口噤漸著角弓反張之狀幼科所謂驚即大方所謂痙也亂進丹丸頻灌湯水水飲留伏中氣不運以致胸腹膨滿漉漉有聲法當轉運中氣用連理湯法然脈細如絲終為險候川連冬朮炙草炮姜茯苓陳皮優龍肝原注效某伏暑內蘊不能外達為瘧又不能下注為痢但瀰漫中宮升降不利表氣不通則頭痛惡寒裡氣不通則胸悶噁心且擬芬芳疏達為法藿梗一錢半蘇梗一錢半川朴一錢神麯三錢炒香薷一錢鬱金一錢大腹皮一錢半赤苓二錢橘紅一錢白蔻仁四分通草四分何此真伏暑證也不似瘧疾之往來寒熱分清又非疸瘧之煩熱躁亂惟口膩下午熱勢稍甚原能飲食但差少耳伏暑之治分清濕熱宣化胃氣而已然須數十日乃愈不善調理亦能生變製半夏一錢茯苓皮二錢新會皮一錢杏仁三錢建神麯三錢炒鬱金一錢通草四分滑石三錢川朴一錢枇杷葉二片李暑濕先伏於內涼風復襲於外交蒸互郁皆能化火濕遏熱伏其熱愈熾故其為瘧也先寒後熱日輕夜重喻氏所謂陰日助陰則熱減而輕陽日助陽則熱甚而重也夫瘧之發必從四末始既必擾及中宮故心胸煩躁中脘痞塞又必先嘔吐而泄瀉瀉已乃衰腹中猶脹所以然者熱甚於中蒸熏水穀之濕上泛而復下泄熱勢得越煩躁乃安余濕復聚故仍作脹也今當瘧退脈弦帶數舌苔白膩小溲不爽本有胃寒痰濁素盛雖從未得汗表邪未解而病機偏重於里法從里治大旨泄熱為主祛濕兼之解表佐之是亦表裡分消三焦並治之意葛根淡芩川連甘草蒼朮川朴橘皮藿香菖蒲赤苓澤瀉薄荷滑石鬱金竹茹淵按泄瀉嘔吐乃兼有之症非必有之症由暑濕穢濁郁遏中宮太陰失升陽明失降不克分化使然楊年過花甲病逾旬日遠途歸家舟車跋涉病中勞頓雪上加霜欲詢病原無從細究刻診脈沉糊神昧舌強色白中心焦身熱不揚手足寒冷氣短作厄便泄溏臭是屬伏邪挾積正虛邪陷之象深慮厥脫大黃人參製附子柴胡半夏茯苓陳皮淡芩澤瀉當歸枳實丁香柿蒂竹茹淵按虛象實象雜沓而至立方最宜斟酌如無實在把握還從輕面著筆否恐一誤不可收拾詒按虛寒積熱層層照顧處處著力此等方非學力極深者不能下筆復診證尚險重再望轉機桂枝柴胡人參白芍川連半夏枳實丁香陳皮蔻仁炙甘草竹茹三診伏暑化燥劫津動風舌黑唇焦鼻煤齒燥神昏手指牽引今早大便自通據云病勢略減然兩脈促疾陰津消涸邪火燎原仍屬險象恐其復劇犀角羚羊角鮮生地玄參蘆根鉤鉤鮮石斛六一散沙參連翹通草天竺黃枇杷葉竹葉珠黃散另調服詒按幸得大便自通尚有一線生機陸外有寒熱起伏之勢里有熱結痞痛之形上為煩懊嘔惡下則便泄溏臭此新邪伏邪濕熱積滯表裡三焦同病也易至昏厄變端擬從表裡兩解佐以芳香逐穢柴胡生大黃淡芩枳實半夏川連栝蔞皮赤苓鬱金菖蒲蔻仁詒按頗合病機藥品亦切實不膚復診投兩解法得汗得便竟安兩日昨已起床照鏡開窗看菊須臾之間漸漸發熱熱甚神糊兩目上視幾乎厥脫逮黃昏神漸清熱漸減脈沉不起據述熱時舌色乾紅熱退舌色黃膩此乃濕遏熱熾將燥未燥將陷未陷但陽證陰脈相反可虞勉擬河間甘露飲滌熱燥濕之中更借桂以通陽苓以通陰復入草果祛太陰濕土之寒知母清陽明燥金之熱甘露飲去滑石白朮加茅朮草果知母薑汁蔥白頭詒按此是正氣已衰餘邪復聚之證所擬之方大致頗合但嫌藥味粗獷未能絲絲入扣耳某懷孕六月感暑熱伏邪噁心懊憹炎天居舟防其暈厥墮胎青蒿大腹皮半夏赤苓川朴淡芩焦六曲蘇梗陳皮鮮佛手某伏暑為病濕熱居多陰虛之體邪不易達此其常也然陰虛大有輕重之分須知此證虛亦不甚邪亦不多耳鳴眩悸苔濁胸痞微寒微熱脈形弦數未便大補亦不可重劑攻邪但得脈情無變可保無虞洋參半夏茯神甘菊花蔻仁青蒿陳皮鉤鉤刺蒺藜秫米豆卷竹茹詒按不沾沾於補虛不斤斤於泄邪而所用藥品無不絲絲入扣所謂成如容易卻艱辛胡伏暑三候神糊厄逆手肢微痙痰多舌白渴不多飲音低脈大而虛殊屬棘手今日忽周身乾燥而癢煩躁不安細詢病原從未得汗按仲景云汗出不徹身癢如蟲行皮膚中久虛故也吳又可云髮根燥癢心煩如灼名曰藥煩中氣虛也經云聲如從甕中出是中氣之濕也又謂言微音低謂之奪氣由此推之明是中虛濁戀液涸痰蒙勢極凶危惟有和中宣化聽其胃氣自為敷布以冀萬一生機洋參三錢橘餅三錢甜杏仁三錢豆卷五錢蜜梅一枚北沙參三錢麥冬三錢枇杷葉蜜炙二片薑汁少許原注右方取辛甘化濁酸甘化液考又可藥煩條中重用人參生薑和中宣化法有來歷某營陰素虧伏邪晚發熱勢起伏心嘈胸悶舌心光紅邊薄白瘧邪初起勢防加重豆豉赤苓半夏沙參桑葉青蒿黑山梔陳皮淡芩某證經九日熱勢起伏神糊舌乾黑此伏邪壅遏劫液入營之勢也高年最易昏痙之變鮮生地天花粉黑山梔犀角香豆豉菖蒲鮮石斛薄荷葉連翹蘆根天竺黃吳暑濕伏於太陰中焦陽氣不化神蒙若寐身熱不揚肢冷脈濡手指牽引舌根牽強風痰阻絡之象曾用通陽益陰云蒸化雨之法病亦無甚增損然舌苔灰白厚掯口泛甜味極甚中宮有濁陽不舒化仿縮脾飲醒中化濕濁濁化則口甜減陽舒則矇昧清黨參烏梅淡乾薑草果炙甘草砂仁茅朮大生地茯苓生薑大棗淵按據舌苔口甜而論濕痰阻遏中宮陽不舒化無疑黨參烏梅生地酸甘助陰膩膈大不相宜矛盾一至此乎手指牽引雖屬木燥土虛肝風內動當此上中焦濕痰蒙閉肺胃氣機不能舒布即欲養陰如胃氣不化何治病當先急者大者若頭痛醫頭便為庸手趙高年元氣素虧未病以前先已倦怠乏力微覺咳嗽五六日來加以發熱熱勢起伏是有新邪乘虛而襲引動伏邪晚發也今診脈小數而虛乾咳欲嘔舌邊光紅根苔白掯熱甚無汗津枯邪戀慮其化燥神昏北沙參蘇子青蒿杏仁川貝牛蒡子前胡橘紅通草枇杷葉吳伏邪內蘊為疸瘧外發為流注入於肺則喘咳注於腸則便溏正虛不克支持幼孩當此易致成驚青蒿杏仁淡芩澤瀉荊芥象貝桔梗橘紅赤苓六一散雙鉤鉤童伏邪晚發朝涼暮熱頭痛胸悶舌白無汗似宜疏達至於腰痛眼花其陰內虧邪不易達恐致奄纏宜小心為是秦艽赤苓青蒿蘇梗杏仁甘菊花枳實杜仲薑汁炒豆豉桑葉顧病方三日外無大熱而虛煩懊憹反復不安寐則神思擾亂舌苔白膩噁心欲嘔腹中鳴響大便溏泄穢臭邪積在裡氣機不達用梔豉以發越其上陳朴以疏理其中葛以散之苓以泄之夏秫和胃而通陰陽陰陽交則得寐明日再議淵按起病即是濕痰挾滯阻遏中宮熱鬱不達之象勿謂外熱不揚而輕視之復診伏暑至秋而發其發愈晚其伏愈深故其為病也大起而大伏熱一日退亦一日既非間瘧又非疸瘧疸瘧則但熱不寒間瘧則寒熱往來此證微寒發熱熱一晝夜而退退亦不清名之伏暑其說最通夫暑必挾濕濕蘊則化熱蒸痰痰不易出熱盛劫津也身重屬濕煩躁屬熱熱來口渴渴不多飲仍是濕遏熱熾見象舌苔白而乾枯是濕邪在於氣分氣虛故濕不易化也葉氏云舌白而薄者肺液傷也病方八日邪未宣達刻下用方無庸深刻但須解表而不傷正去濕而不傷陰清熱而不助濕生津而不礙濁中正和平耐心守服扶過兩候始冀漸安黑山梔連翹茯苓川貝通草北沙參滑石澤瀉豆豉枇杷葉鮮薄荷根淵按伏邪深重脾肺氣弱力不足以化達之故大起大伏耳馬幼稚伏邪挾積阻滯腸胃蒸痰化熱肺氣窒痹是以先瀉後咳繼以發熱今便泄已止而氣急痰嘶肺氣阻痹尤甚法當先治其肺恐肺脹生驚發搐其變有莫測耳葶藶子三錢萊蔔子三錢六一散三錢枇杷葉三片淵按著重消痰瀉肺清熱化積即在其中復診痰氣喘逆平其大半熱勢起伏退而復作時下多瘧須防轉瘧白蘿蔔汁一杯鮮薄荷汁半杯二味略煎去渣加入冰糖三錢煬化再以薑汁一滴沖服淵按此方更妙詒按兩方用藥俱清簡可法於小兒尤宜何伏暑挾積寒輕熱重已經月餘舌心焦黃舌邊白膩陽明積熱化火劫津煉濁成痰將至蒙閉至於脘痛拒按兩經攻下痛仍不減苔猶未化非清化不能蕩其實擬用涼膈散加味涼膈散鮮石斛川連原注兩下之後舌心猶然焦黃故仍可用下法然舌邊白膩必挾水氣涼膈散中再加半夏亦可陸伏邪挾枳但熱不寒頭痛鼻血便泄稀水表裡兩窒而熱甚於里擬清裡解表法葛根芩連湯豆豉連翹枳實黑山梔原注鼻血便泄稀水知其為熱不用犀角者其舌苔白也不用大黃者其腕腹按之不痛也詒按此證專意解表想因未得汗解故也李伏邪濕熱內蘊三焦氣機不達午後發熱胸悶頭脹尿少無汗舌苔白膩脈象軟細擬開上疏中滲下仿河間法豆卷杏仁陳皮藿梗滑石赤苓桔梗半夏焦六曲川朴通草胡素有痰飲咳嗽今夏曾經吐血是肺受熱迫也茲六七日來伏暑內蘊涼風外襲病起先寒栗而後大熱熱有起伏表之汗不暢清之熱不退所以然者痰飲阻於胸中肺胃失其宣達故耳舌色底絳望之黏膩心苔白厚如豆大者一瓣此即伏暑挾痰飲之徵而況氣急痰嘶乎據云草六日便泄數次至今大便不通按腹板窒卻不硬痛小溲先紅濁今則但赤不渾乃濕熱痰濁聚於胸中因肺金失降不能下達膀胱故濕濁上逆為痰氣喘嗘之候病機在是病之凶險亦在是法當從此理會滌痰泄熱降氣清肺乃方中必需之事但清肅上焦尤為要務耳葶藶子鬱金川貝杏仁枳實羚羊角膽星連翹赤苓竹油枇杷葉滾痰丸入煎絹包詒按案語精當方藥親切迥殊率爾操觚陳餘邪余積留戀未清元氣元陰消耗欲渴暫停苦口之藥且投醒胃之方化氣生津忌夫重濁變湯蒸露法取輕清效東垣以化裁希弋獲以圖幸清暑益氣湯荷葉香稻葉蒸露每晨溫服四五杯淵按湯丸膏散古人各有意義非徒具虛文若變湯為露法取輕清惟大邪去而胃氣不勝苦藥者宜之此處恰合詒按伏暑久淹正虛邪戀胃弱不勝重藥者此法當仿徐熱伏心胸濕蘊脾胃病起如瘧延今兩月胸中熱悶飲食不思從未得汗舌色底絳苔如醬瓣此即濕遏熱伏之驗也無汗者津液虧徒發其汗無益也生津徹熱化濕開胃胃氣敷布其汗自來川連黑山梔豆豉廣皮香薷麥冬赤苓薄荷生薑六一散此藥煎好露一宵早起溫服浦伏邪挾積阻塞中宮瘧發日輕日重重則神蒙煩躁起臥如狂此乃食積蒸痰邪熱化火痰火上糊胞絡怕其風動痙厥脈沉實而舌苔黃邪積聚於陽明法當通下仿大柴胡例備商柴胡淡芩川朴枳實生大黃栝蔞仁半夏詒按脈舌與證合參大柴胡是的對之藥復診下後熱淨神清竟若脫然無恙惟是病退太速仍恐變幻莫測擬方再望轉機川連鮮斛連翹山梔竹茹枳實鬱金栝蔞仁滾痰丸三錢原注病退太速仍恐變幻老煉之言宜省凡下後方法總以瀉心加減仍用栝蔞枳實何也蓋因胸痞未舒舌苔未化故耳三診昨日瘧來手足寒冷即時腹中氣撐上塞咽喉幾乎發厥但不昏狂耳此乃少陰瘧邪挾內伏之痰濁上走心胞為昏狂下乘脾土為腹撐脾與胃為表裡前日之昏狂病機偏在陽明故法從下奪今腹脹舌白脈細病機偏在太陰法當辛溫通陽轉運中氣為要隨機應變急者為先莫道用寒用熱之不侔也乾薑炒黃半夏陳皮茯苓熟附子川朴丁香檳榔草果白蔻仁通草原注前方用寒後方用熱隨證用藥轉換敏捷不避俗嫌的是一腔熱血淵按少陰陰邪上凌君火下乘脾土經所謂氣有餘則制已所勝而侮所不勝案亦老練必如此轉語方不為病家指摘否則雖有熱腸亦招謗怨詒按此人必中氣素虛故痰濁乘虛上僭也四診投姜附達原神香二陳合劑喉中汩汩痰聲頓時即平腹脹遂松今脈緩大神氣安和腹中微覺脹滿痰多黏膩脾臟陽氣雖通寒熱痰涎未化仍宗前法輕減其制前方去附子檳榔加大腹皮五診腹中之氣稍平濕熱餘邪未盡所以微寒微熱仍歸瘧象頭脹身痛知飢能食法擬疏和兼調營衛二陳去甘草豆卷青蒿秦艽焦六曲穀芽生薑紅棗疫痧陳爛喉丹痧乃溫熱時邪肺胃受病發於春夏為多首用辛涼散邪繼用甘寒化毒是為大法今交秋季而貴地江陰盛行此證證雖同於溫熱而義則有分大抵時行為厲多由地氣鬱發輕則偏患一方盛則遍及他境吳又可謂疫厲為邪著無常處氣有盛衰所傷亦異是也貴地僻處江隅今歲夏秋久晴少雨熱逼水土之中鬱極則發濕上甚為熱交秋燥金司令熱勝金燥邪干肺胃所患盡屬丹痧而咽喉或痛或腫或腐者由乎燥火濕熱孰輕孰重與體質之偏燥偏溫而攸分也茲閲所服之方初用升葛等之升發繼用芩連等之苦寒雖亦有辛涼解散甘寒清化者仍用升提苦燥夾雜其中要未明歲氣天時與病成而變之旨徒守老成之見不通權變之方譬猶苦拒劍閣而寇兵已早渡陰平同一局也刻下序屆秋分雖當燥金用事而消殘日暑尚餘濕熱蒸淫經云先夏至日者為病溫後夏至日者為病暑則知先秋分日者為病暑後秋分日者為病燥也此病起於秋分以前謂非伏暑濕熱之使然歟濕熱鬱蒸則化火互相傳染則成毒然則上解肺胃之火下清濕熱之邪芳香闢穢甘寒化毒苟理有可通必法有可採至於肌膚之紅咽喉之腐胸中之煩躁舌上之濁苔口之燥渴脈之數急身之壯熱溲之短澀干厄不已飲食艱進種種皆為濕邪火熾邪不外達之象凶險何辭顧已共云而共聞之矣茲不煩贅磨犀角八分沖連翹三錢鮮石斛一兩山豆根三錢牛蒡子三錢人中黃六分六一散三錢薄荷一錢同研絹包蘆根一兩竹葉草片通草四分金銀花露一杯沖另用西黃三釐藥珠一分血珀三分川貝母五分共研細末細葉菖蒲湯調下二診服藥後得汗熱減喉腐稍脫仍遵前法參以生津前方去六一散薄荷牛蒡子加麥冬三錢花粉三錢鮮地黃一兩三診半月未診小愈復劇痧乃陽邪速來速去安得留戀至今意必有過慎失察等弊或熱邪未淨而早用滋陰抑胃氣未清而漫嘗滋味容或有之不可不告也據述七八日前身熱大減胃氣漸開惡食陳米進以新香稻粥此外無他夫穀食雖非葷油之比然早稻性溫壅氣助熱內經熱論有食復之禁此其然歟今診脈數大無力右脈澀滯不調身時燥熱口仍乾渴咽齶蒂丁白腐滿布頭面手足肌膚浮腫頤毒穿潰膿水清稀面色乾枯神情困憊而又脘腹脹痛舌苔黃濁正虛邪戀復夾食滯攻補兩難殊屬棘手勉擬一方備候商用鮮生地一兩同淡豆豉三錢搗和鮮石斛八錢川連三分淡薑汁炒焦神麯三錢枳實五分磨沖鬱金七分連翹三錢桑白皮二錢茯苓皮三錢銀花露一杯沖枇杷露一杯沖白蘿蔔汁一杯沖仍服珠黃琥珀散四診原方加竹油草匙沖栝蔞仁三錢研五診兩投輕清宣化之法蕩積而不傷正解毒而不傷陰服後便通腹軟喉腐稍退頗得應手慰喜慰喜惟是諸恙仍然且昧爽時作譫語此屬大虛之兆深為可慮當此之時進退維谷徒清邪恐元氣不支而即脫徒補正恐邪毒不化而蔓延姑撰一方希圖弋獲孟舍有云舍豈能為必勝哉能無懼而已矣豫雖不才請事斯語洋參一兩黃耆皮一兩麥冬一兩甘草一兩茯苓一兩穀芽二兩白扁豆二兩連翹一兩北沙參一兩金銀花一兩五錢鮮石斛一兩緑豆一兩蘆根四兩枇杷葉草片上藥共蒸為露時時頻服之仍用珠黃散每日一服原注此病全愈賀胸背臂膊肌膚隱隱有紅點咽喉紅紫碎腐此即爛喉丹痧之症也奈何認作喉蛾清之不已更瀉之以致邪不外達火反內郁右齶續加腫痛痛掣耳中診脈不見浮弦洪數之象而反軟數模糊時時惡寒皆邪郁不達之明驗今證交五日漫投清瀉之後丹痧欲透不透深防內陷之變急與解肌透達兼以清化牛蒡子三錢薄荷一錢蟬蛻一錢桔梗一錢山豆根三錢連翹三錢川石斛三錢大貝母三錢桑葉一錢荊芥一錢蘆根一兩二診左脈較昨稍大右脈仍然不利胸背肌膚紅點略透而喉腫益甚乃肺胃邪熱欲達不達而痰火又上盛故也總之早進寒涼是謂倒行逆施故證幾及候當退邪之時而勢猶發軔正屬火熾之際仍擬透解兼以清化前方去桔梗荊芥加射干制殭蠶黑山梔三診得汗肌松丹痧已化痰火上盛喉腫未消擬泄衛清營兩和方法前方去制蠶射干山豆根蟬蛻加犀角金銀花四診昨議清營泄衛服後似不相安一夜少眠痰多幹嘔咽喉仍痛診脈緩滑不數是熱且退矣想因體肥多濕濕得熱而蒸痰痰阻肺胃胃氣失降故邪熱雖因清泄而除而稠痰因清泄而盛是必以降氣化痰為主清解次之蓋必得氣降而痰始化亦必痰化而氣漸和也牛蒡子三錢薄荷一錢川貝母一錢半枳殼八分麩炒蘇子三錢甜杏仁三錢橘紅一錢鹽水炒射干五分葶藶子五分炒研竹茹七分水炒桑葉一錢蘆根一兩枇杷葉二片五診諸恙皆減惟二便不爽邪退之餘津液未充故也川貝母玄參川斛杏仁蘇子赤苓蘆根通草靳爛喉痧證來勢甚暴甫周一日丹疹密隱咽喉已腐壯熱無汗大便泄瀉煩躁渴飲脘腹按之痛邪不外達熾盛於裡燎原之勢不可向邇恐其遽爾內陷昏喘生變現在方法辛涼透散通同一律無煩聚訟鄙見莫若且用涼膈散將無形之邪熱有形之痰食一齊盡祛分所使散上者上達表者表達下者下達庶幾熱從外出而丹痧透火從下泄而煩躁安按內經病機暴注下迫皆屬於熱仲景方論急下之法正以存陰幸勿拘現患泄瀉而遂謂不可再下也雖然智愚千慮各有得失尚祈高正是荷涼膈散加牛蒡子桔梗枳實詒按既患丹痧則營絡中必有熱邪方中丹皮鮮地銀花玄參等味斷不可少再診投涼膈散煩躁略安脘痛已止胸膈之燔稍衰其勢而咽喉紅腫乾咳嗆逆上炎之火未熄其威況丹痧一片點粒模糊證交三日正屬邪張之際尚在險途未歸坦境擬方再望轉機為妙犀角連翹玄參象貝桔梗鮮石斛牛蒡子鮮薄荷根蘆根孫風火暴臨喉痛碎爛皮膚隱約有點身熱惡寒防發丹痧現今便泄氣促證勢非輕葛根煨一錢白桔梗一錢豆豉三錢牛蒡子三錢杵鮮石斛三錢桑葉錢半荊芥穗錢半淡芩二錢連翹三錢枳殼二錢鮮蘆根五錢去節二診痧回熱減溫邪初退之餘咽喉反腐虛火又從而附之良由久患喉痹陰虛火亢茲系熱淫擾動亢焰復張此際用方最宜加謹過清恐傷脾胃早滋恐戀餘邪姑擬甘涼平調肺胃冀其上焦清肅鮮石斛三錢大貝母三錢玄參二錢生甘草五分丹皮錢半鮮沙參五錢羚羊角八分扁豆三錢穭豆衣三錢雪梨兩大斤詒按看似平淡無奇實已斟酌盡善瘧疾李瘧熱傷陰肺津胃汁被劫舌紅燥裂咳嗽氣逆養肺胃之津液而降其氣如喻氏清燥救肺之例葉氏遵其意而減其制恆取玉竹門冬之屬今仍葉氏意麥冬玉竹川貝母甜杏仁花粉沙參雪梨肉茯苓桑葉枇杷葉二診脈經有寸左右彈陽蹺為病之訣內經有陽蹺脈滿令人不寐之文大抵陽盛陰虧衛氣不交於陰此寒熱止而復來仍屬營衛不和也陽蹺者少陰之別陽蹺由外踝而上行衛分陰翹由內踝而上行營分夫肺主衛心主營又脾為營之本胃為衛之源蓋以營衛生成於水穀而五臟多受蔭於脾胃靈樞半夏秫米湯主陽蹺脈滿衛氣不得入於陰陰虛而目不瞑者即以和脾胃調營衛交通陰陽為治未嘗專主奇經自古奇經為病亦未嘗有專主之劑然以半夏秫米施之於此病似有不合者嫌其燥也今舌邊碎痛而惡辣味體質陰虧而喜甘柔之藥其不宜辛燥可知矣連日用方大法甘潤益陰不出門冬玉竹之屬昨因瘧勢寒熱又來未便進劑自飲百合湯數盞咳緩得寐頗覺相安思百合色白入肺其形象心甘苦微寒為心肺二經生津清火之藥仲景用百合一味為君治百脈一宗悉致其病從心營肺衛立法王晉三注之甚詳不遑縷晰經云問病人之所好惡即可得其治法今遵此旨燮安世長兄聞之得毋又笑其不憚煩乎百合一兩大生地四錢麥冬二錢玉竹三錢川貝母一錢半北沙參三錢桑葉五片紅棗五枚榮去年三瘧迄今變亂汗出甚多舌心苔色灰白脅下結塊此乃中州之濕濁未化而衛外之陽已虛矣擬調營衛佐以化濁為法桂枝五分生黃耆三錢防風五分煎汁同炒白芍三錢黨參二錢茯苓二錢半夏一錢半陳皮五分鹽水炒炙鱉甲三錢白朮三錢牡蠣三錢煅浮小麥一把煨姜一片嚴年屆六旬元氣素弱向有肝氣近患三瘧兩月以前先受伏暑小愈之後三瘧遂作脈弦肝胃尤甚木勝胃土惡谷厭納痰多嘔惡心跳少寐便閉溺赤蓋胃氣一虛百病叢生矣高年雖大便兩旬不通未可以通腑為務培養中氣啓胃化痰是為扼要調和營衛退其寒熱佐之黨參冬朮茯苓半夏陳皮當歸桂枝淡芩棗仁澤瀉穀芽鹿角霜生薑紅棗原注上方以六君子湯坐鎮中宮補脾健胃氣運則痰濕自化氣旺則津液自生合入當歸桂枝和營散邪更復鹿角霜之通陽者以治背獨惡寒再加黃芩以泄熱監製桂鹿之辛溫使無偏畸不失調和之義棗仁安神澤瀉去濕穀芽醒胃薑棗調和營衛皆佐使之助耳某大瘧百日營衛兩虛胃為衛之本脾乃營之源胃陽虛則胸腹時痛而吞酸脾陰虛則經事愆期而盜汗補脾胃以化其瘧痰和營衛而退其寒熱營衛一和盜汗自止黨參薑汁炒冬朮土炒半夏茯苓陳皮川連吳萸三分煎汁拌炒制首烏煨姜紅棗白芍桂枝三分煎汁拌炒吳三瘧一載有餘經停將及兩載腹中脹滿有塊作痛是血先凝結於前氣復阻滯於後加以寒痰積聚中氣失運法當先運其中六君子湯去甘草加木香當歸川朴生薑茺蔚子紅棗石三瘧久而痰涎聚肝膽逆而鬱火盛以致發狂今狂已退痰火猶未全除擬化胃經之痰平肝膽之火半夏茯苓橘紅牡蠣淡芩川貝牛膝鱉甲白朮土炒竹茹鉤鉤徐盜汗便溏心脾之病也脾氣不運則便溏心陰不守則盜汗大瘧日久寒熱仍作營衛不調補心脾和營衛歸脾湯加減治之黨參黃耆冬朮熟地白芍砂仁六曲棗仁歸身茯神木香牡蠣浮麥紅棗淵按運脾氣補脾陰和營衛溫督脈前數方皆虛瘧久瘧治法營久患瘡疥濕熱浸淫復因外感暑濕為瘧纏綿不已變為三瘧診脈濡小其濕仍戀而元氣漸傷慮加腹滿宜早圖之然須安逸忌口為要白朮半夏赤苓陳皮大腹皮川朴神麯藿梗蔻仁通草雞距子原注此用正氣散去甘桔蘇芷加通草蔻仁疏通氣分之濕用雞距子以解酒濕朱少陽過升陽明失降瘧來煩悶痞嘔當變柴胡制而為瀉心法和陽明即所以和少陽也川連薑汁炒半夏廣皮藿梗白蔻仁竹茹薑汁炒生薑原注此人舌色左半邊光紅右半邊白苔濕滑如水晶粉團之色因過服柴胡升陽以劫其營而痰濁又變於胃以致痞嘔故用瀉心之法初用生薑一片無效後加至三片痞嘔乃止瘧亦不來詒按用古法而能通其意心靈手敏此為善讀書人莊但寒不熱此為牝瘧柴胡桂枝湯主之柴胡桂枝半夏茯苓陳皮川朴草果炙甘草生薑紅棗復診瘧髮間日但寒不熱口膩多涎乃寒痰鬱於心下陽氣不得宣越故也蜀漆桂枝半夏陳皮茯苓羌活菖蒲另獨頭蒜六枚黃丹六分雄黃五分共研末為丸清晨分五服開水送每晨一服三診舌白胸悶背寒獨甚擬宣通陽氣以化痰濁麻黃湯合二陳湯加鹿角霜石菖蒲原注以上三方皆金匱法四診瘧止當調胃半夏茯苓炙甘草陳皮白蔻仁生薑紅棗詒按牝瘧不多見大略由於陽虛痰聚阻遏邪機不得外越所致用藥總以通陽宣濁為主孫間瘧變為大瘧其寒也三日一作其熱也日無間斷此衛氣不得疏通邪痹不達是屬衛實而營虛營虛故內熱不止也擬和營衛以祛邪桂枝白芍柴胡半夏赤苓天花粉淡芩陳皮生薑紅棗徐左脈細弦肝腎虧也右脈軟弱脾胃虛也三瘧之後氣血兩虧補肝腎調脾胃養氣血必得安逸少勞而後可也黨參大熟地杜仲枸杞子冬朮茯神歸身陳皮白芍生薑紅棗王三瘧止作延及五年營衛之不調脾胃之不和肝腎之不足不言可知矣近今月經頻至且多而有血塊腹反脹滿何也夫血之與氣猶權衡也和則平偏則病一勝必一負血去多則血虛血虛則氣旺非真氣之旺也氣無血以涵之則氣肆橫而有似於旺耳蓋瘧久必傷脾脾傷則肝亢脾統血肝藏血肝亢則血不藏脾虛則血失統故經事頻來而仍有血塊者肝亢則火熾下焦衝任之血受其迫燥欲下而不盡下故凝而為瘀瘀則結塊也圖治之方藏統肝脾之血而固衝任之經一層調其氣之肆橫而致和平又一層是治月事與腹滿之法至於理脾胃調營衛又為三瘧久纏之治合而成劑不出求本之圖黨參元米炒冬朮川朴五分拌炒香附醋炒丹參陳皮茯苓烏藥鱉甲當歸炭茜草炭白芍桂枝三分拌炒烏鰂骨漂淡鮮生地渣薑汁炒焦姜渣鮮生地汁炒焦鱉甲煎丸十五粒藥汁送下淵按因脾氣傷而血失統血去舍空其氣更失所依故腹益脹滿調養脾氣治脹即所以攝血潤養肝陰固血即所以涵氣妙在交加散清血熱而不寒滯通營氣而不辛散其心思識力超越尋常若辛香耗氣以治脹苦澀涼膩以治血則失之遠矣葉瘧為少陽病少陽者膽與三焦也膽失清寧則煩而不寐三焦失其輸轉故胸悶而大便帶溏口膩味甜熱甚煩悶熱處濕中故熱愈甚也擬溫膽法半夏茯苓陳皮棗仁枳殼天竺黃川朴青蒿秫米佩蘭竹茹曾浴出當風腠理閉塞水氣舍於皮膚之內與衛氣戀而不化變為三瘧瘧發不透濕熱內走筋絡四肢無力微微內熱是半虛半實之證和脾胃化濕熱通筋絡達肌表標本兼治茅朮半夏香薷茯苓秦艽獨活澤瀉防風川朴陳皮通草姜皮生苡仁奚三瘧發於夜而漸移至日中原有自陰出陽之象今屆春深陽氣升發當助其升舉參以化痰為法柴胡防風茯苓丹皮杜仲冬朮制首烏半夏陳皮牛膝黃大瘧十番寒熱雖輕而邪陷入於三陰治必從中以達外體質雖虛未可便投補藥仿王晉三加減達原飲柴胡川朴半夏茯苓當歸草果川貝花檳榔陳皮紅花童大瘧日久小愈復作寒熱雖輕其根不斷根者何水飲痰涎是也欲治其根必溫中土用四獸飲加減六君子湯加烏梅草果蜀漆炭尤久瘧之後脾虛木鬱痰阻氣滯胸悶噁心頭眩心嘈經事不調擬舒木鬱兼以化痰柴胡石決明半夏陳皮當歸炙甘草茯苓丹皮砂仁薄荷復診投逍遙合二陳法木鬱稍舒痰氣稍化今從前法加減柴胡炙甘草杏仁冬朮陳皮半夏焦山梔茯神砂仁吳瘧不離乎少陽即兼陽明太陽亦必使其還返少陽而後已今預於瘧發之前先用柴胡引入少陽之界則邪氣從樞轉出矣小柴胡湯去參棗加知母草果陳皮淵按仲景小柴胡治傷寒往來寒熱非治風瘧往來寒熱風瘧與傷寒判若天淵後人往往借用積習深矣風瘧早用柴胡必糾纏難愈須中焦濕熱半化或秋深邪深乃合復診瘧脈自弦弦大者為陽其邪易達今瘧來熱勢稍輕而短邪有退機矣仍從前法照前方加沙參茯苓通草三診瘧勢漸衰當和中氣以化痰濁養心陰合病體標本而施治也沙參陳皮麥冬炙甘草冬朮半夏扁豆棗仁茯苓生薑淵按瘧病最忌扁豆想未之知耳奚三瘧變為日作延來兩月有餘今則熱發於夜口乾汗少邪戀營分其陰已虧而又胃弱納少懷孕半身恐其正虛不克支持姑擬和胃扶正達邪黨參制首烏冬朮茯苓川朴天花粉柴胡防風陳皮淡芩丁三瘧久延營衛兩傷復因産後下焦八脈空虛今病將九月而瘧仍未止腹中結塊偏左此瘧邪阻於血絡聚於肝募是屬瘧母奄纏不已慮成瘧勞夏至在邇乃陰陽剝復之際瘦人久病最怕陰傷趁此圖維迎機導窾和陽以生陰從産後立法稍佐搜絡以杜瘧邪之根制首烏冬朮白芍桂枝炒杞子當歸地骨皮青皮川芎香附烏梅另鱉甲煎丸每日服十粒原注用四物去地換首烏從産後血分立腳淵按産後陰血固屬虛耗然久瘧而至結塊必濕熱痰涎伏膜原未化此方宜斟酌之復診三瘧日久腹中結癖夏至前投和陽生陰通調營衛參入搜絡方法節後三瘧仍來但熱勢已減癖塊略小然口乾心跳營陰大虧情懷鬱勃多令化火傷陰木曰曲直曲直作酸瘧來多沃酸水蓋肝木鬱熱挾胃中之宿飲上泛使然夫養營陰須求甘潤理肝鬱必用苦辛久瘧堪截癖塊宜消惟是體虛胃弱諸宜加謹為上黨參冬朮鱉甲醋炒當歸茯神棗仁香附三稜醋炒川連吳萸炒牡蠣陳皮淵按膜原所伏之邪見矣詒按因病化裁頗不沾滯方中白芍似不可少三診丸方川貝一兩半夏一兩知母一兩共研細末薑汁醋各半泛丸每朝三錢開水送詒按此半貝丸成法也增入知母一味嫌其偏於涼潤尚有可商曹勞瘧因勞碌而發寒熱似瘧奄纏不已慮變瘧勞舌苔白而乾燥胃燥氣傷也法當益氣生津用益氣補中意黨參黃耆冬朮炙甘草麥冬歸身陳皮青蒿五加皮生熟穀芽張間瘧寒熱舌苔滿白用柴胡達原飲柴胡黃芩半夏青皮花檳榔草果川朴茯苓生薑原注舌苔滿白邪伏膜原必用檳榔草果若舌苔白而燥者忌用某陳無擇云瘧家日久必有黃痰宿水聚於胸腹膈膜之中須得脾土旺而後宿水自行元氣復而後濕痰自化余見久瘧有泄水數次而愈者即宿水自行之效也六君子湯加炮姜木香神麯砂仁詒按前曾見治老瘧之法用逐痰瀉水之藥入雞子中煮服得泄黃水即愈其意與此正同但用藥有虛實之分耳某素有痰飲咳嗽近復涼風外薄食積內停寒熱似瘧脈弦數額角痛胸脘痞脹大便不通是有表復有里也擬以疏里解表柴胡黃芩半夏枳實川朴大腹皮橘紅竹茹詒按立方用藥不深不淺如初拓黃庭恰到好處再診脈弦數兩手掌心獨熱大便五日不通舌苔薄白不黃燥屎尚未全結欲通其腑緩法為宜川連薑汁炒枳實磨沖蔞仁研半夏萊蔔子炒竹茹詒按先用緩法通腑此亦病機所在不可不知顧久處南方陽氣泄越中臟常寒慣服溫補現患溫瘧及今旬日舌尖已紅根苔滿白便泄稀水兼有蛔蟲渴不欲飲口中甜膩皆是濕遏熱伏之象就錫邑治法葛根芩連是主方若合體質而論似宜溫中滲下清上解肌擬用桂苓甘露法試服之以觀驗否生石膏三錢豬苓三錢澤瀉錢半肉桂三分滑石三錢生茅朮一錢茯苓三錢藿香一錢通草八分木香四分復診照前方加北沙參五錢王肝經久有濕熱伏於下焦經絡之中疝氣交春而發夏甚秋衰至冬而平發時每有寒熱是屬濕火無疑斷非寒疝可比去冬迄今患瘧兼以咳嗽舌底紅裂而苔黃掯此瘧邪濕熱傷陰之象法以養陰化痰和胃泄肝為治制首烏鱉甲陳皮杏仁桃仁川楝子青皮延胡索川貝沙參紅棗生薑痢疾馬高年下痢一日夜百餘次舌苔白掯身熱噁心診脈細飲食不納痢下五色皆為忌款敗毒散法初起的是然須人參扶正和胃若喻氏痢疾門中五色噤口不治者多尚祈商政是荷參鬚敗毒散陳米荷葉包石菖蒲苗濕傷於下風傷於上熱處於中濕夾熱而成痢痢下紅血濕熱傷血分也風夾熱而咳嗽痰稠舌白風熱傷氣分也從手太陰陽明一臟一腑立法豆豉荊芥炭黃芩薄荷焦六曲桑葉黑山梔杏仁桔梗薤白頭赤芍通草孫濕溫邪陷厥陰下痢色紫後重左脈沉小右脈弦大舌黃晡熱是陽明積熱內戀而木來乘土高年體虛神怯防其厥脫沙參川連白頭翁升麻淡芩焦六曲川朴通草楂肉秦皮葛根金銀花白芍砂仁復診前方升陽明泄厥陰以提下陷之邪今改用敗毒法祛其邪從表解即喻氏逆流挽舟之意也人參敗毒散去薄荷生薑加神麯陳米煎湯代水三診舌苔灰黃腹痛下痢是陽明濕熱積滯而倦怠音低正氣大虛飲食不納慮延噤口重症仍以苦辛寒化腸胃之濕熱而開通其氣冀其谷進熱和痢減為妙北沙參川石斛川連木香石菖蒲川朴枳實滑石白芍淡芩焦楂肉陳皮荷葉鮮藕四診下痢不減胃氣略開病將半月高年元氣內虧濕熱未化深恐生變沙參淡芩川連川朴枳實白芍廣木香木瓜西洋參茯苓通草荷梗五診痢將半月色如敗醬腹痛後重舌苔灰黃濕熱膠滯腸胃不和納穀殊少高年防其虛脫西洋參川連陳皮六神麯穀芽青皮當歸白芍地榆炭淡芩砂仁茯苓皮六診考治痢方法因於暑濕熱阻滯腸胃者不出苦辛寒藥疏通理氣若胃不納者謂之噤口痢實九死一生之證今高年體弱胃不納穀舌色灰黃身熱腹痛既不可補又難用攻只得宣通化滯開其胃氣白頭翁湯枳實紅曲白芍青皮木香楂肉炭荷葉蒂茉莉花蒂砂仁半生半熟炒研稻葉某紅痢日久脾氣必虛營氣必耗前方理中湯下駐車丸頗驗奈輕聽人言服紅曲滑石末致痢復劇脈遲緩而澀舌薄白而底絳渴不貪飲口惡甜味素體多濕今脾陽失運濕又動於中矣徐靈胎云血痢挾濕者胃風湯最妙醫歸痢疾門亦採是法八珍湯去地草加肉桂升麻粳米淵按理中湯溫運中陽駐車丸分導濕熱從脈象遲澀看出紅曲滑石適與相反李久吸洋烟脈沉而細病方三日微寒微熱頭略脹痛晝不痢痢在夜是屬寒邪而反色赤者寒傷營也當以和營散寒溫通陽氣為法勿與常痢同治防風根白朮陳皮木香炮姜砂仁白芍桂枝三分煎湯炒原注服二劑愈應手之至淵按脈細肢寒晝不痢痢在夜乃脾陽不能統攝營陰也蔡右脈細弦木侮土也左脈細弱腎水虧也病由肝氣而起水不涵木也茲患下痢赤白木勝土衰濕熱不化也華先生用補中升陽參入育陰從本求治極有見地鄙意再參溫化乃兼顧脾腎之陽氣也黨參茯苓冬朮歸身阿膠杜仲白芍炮姜木香川連神麯菟絲餅尤伏暑挾積濕熱內蘊胸痞嘔惡發熱舌燥通腑之後變為下痢痢色紅白膩凍飲食不納慮成噤口須得胃開谷納痢減不嘔為妙高年頗為重症川連淡芩白芍陳皮青皮茯苓焦楂肉川朴沙參砂仁穀芽玫瑰花原注此病兩脈虛濡脾胃元氣大弱似宜參入扶正為善然下痢古稱滯下起於濕熱居鄉早補早斂往往受纍此河間苦辛宣通腑滯之法所以為痢門必採之方若補陰陽治脾胃多為久痢而設尚非此時議論所以寧落輕淺不用深重之劑蓋行遠自邇之意云耳詒按閲是方者有病重藥輕之疑故方後申言其意陸脈經云代則氣衰細則氣少多指陽氣為言今下痢而得是脈脾胃之陽微特著況形衰畏冷而小便清長者乎惟下痢赤者屬血分腹中痛者為有積立方從此設想尋其罅而通之補之亦治病之機巧也附子枳實理中湯送下駐車丸詒按看病於虛中求實極為精審方亦的當薛先患紅痢續加以瘧又變泄瀉瀉止仍痢兩月有餘脈弦硬晝無小便每交子後至辰便痢數次小溲亦得稍通此伏暑濕熱蘊於腸胃及厥陰厥陰之表便是少陽故先見熱痢後兼瘧象乃厥陰少陽表裡同病也瘧後大便溏泄者少陽木邪侮土也瀉止而瘧痢仍作者胃氣強旺土不受邪仍還厥少兩經也小便少者陰氣虧則滲愈少當滋其化源也今清厥陰之熱而舉清陽兼益腎之陰運脾之濕從白頭翁合胃風湯意白頭翁湯防風白朮白芍五味子大熟地茯苓神麯穀芽北沙參淵按議論如秋月寒潭開後學心思不少方亦精妙王厥陰有寒腸中有熱少腹冷痛下痢紅黏身熱肢寒汗出舌膩噁心不食慮成噤口擬辛通厥陰之寒苦泄湯中之熱用姜萸當歸四逆湯加香連芩楂主之桂枝白芍吳茱萸炮姜炙甘草木通當歸川連木香黃芩楂肉炭砂仁淵按有熱深厥深之象乃濕熱積重遏腸胃氣機不得通化宜佐通因通用法使膠黏之邪速去範肝胃不和濕熱積滯為痢痢延半載仍脘腹脹痛噁心治以苦辛泄肝和胃佐以分消運化川連茯苓川朴木香楂肉青皮陳皮砂仁赤芍白芍另用駐車丸三錢烏梅丸一錢相和服復診痢減腹仍痛肝胃未和也現值經來脈弦寒熱血虛木鬱擬養血疏肝八珍湯去草加香附木香陳皮神麯砂仁另駐車丸烏梅丸歸脾丸各一錢相和服詒按前後兩方均親切不浮此方中可加醋炙柴胡五分醋炒青皮一錢徐紅痢匝月仍腹痛後重據云先曾發瘧三次此屬中虛表邪傳裡現今脈細肢寒太陰陽氣已弱小便艱難膀胱氣化又鈍擬開其中焦化其濕熱兼升陽解表亦表裡雙解之法也柴胡桂枝茯苓澤瀉川連木香白朮黨參砂仁炮姜炙甘草詒按論病立方均尉貼老到此理中湯加香連五苓散加柴胡張瘧後勞碌感寒瘧邪復發更加紅痢後重此中虛氣陷濕熱未楚也用敗毒散活人敗毒散加神麯楂炭陳皮許熱伏營中久痢純血腰疼腹痛舌苔薄白底絳兼有紫點此屬濕熱挾瘀之候病將一載法以鹹苦通澀兼施杜仲鹽水炒阿膠川連炒川斷鹽水炒黃柏鹽水炒地榆炭白芍防風根炙升麻當歸生熟砂仁復診投鹹苦通澀之劑諸恙皆減仍宗前法增損原方去黃柏防風加熟地淡芩醋炒荷葉蒂高三瘧汗少邪不外達飲食不節變增泄瀉今竟下痢紅白黏膩自來體質氣虛多濕最怕奄纏急宜忌口為要羌獨活柴胡前胡川芎花檳榔陳皮萊蔔子炙甘草茯苓山楂炭焦六曲木香砂仁金紅痢三年腹左結塊板硬不移按之則痛漉漉作聲即便下痢此瘀凝寒積久留於腸腑當以溫藥下之蒼朮炭川熟附枳實炭地榆炭茯苓當歸通草桃仁炒黑研大黃酒炒詒按溫通瘀積方極穩當惟病久正傷或再加扶正之品更為周到某從來肺有積熱者大腸必燥以相為表裡故也三五年來屢發喉證肺熱可知今秋齦腫出血多服涼藥及西瓜等物遂患下痢赤白常有干糞夾雜其中延及百日近見堅栗而痢反更甚此必有故夫脾受瓜果之寒濕既下流於大腸而為痢則大腸之燥當除今獨不然竟若燥與濕各樹旗幟相為犄角之勢豈非以脾屬中土而主濕大腸屬燥金而主津津虧則燥益堅脾虛則濕愈甚耶昔秦氏論痢有濕火傷氣燥火傷血之分此則濕燥兩傷擬撰一方潤燥兼行氣血兼理或通或塞均非所宜全栝蔞六錢當歸一錢五分木香五分川連酒炒五分甘草四分升麻三分藕一兩陳火腿足骨炙灰一錢詒按論病切實不浮方也穩適微嫌氣分藥尚少恐機關不能靈動耳某陽樞之瘧邪轉入陰樞為痢痢色紅而後重氣墮肛門覺熱是下焦廣腸有熱也白頭翁法甚當然今瘧止又來仍從陰樞達出陽樞立法佐以和中使以泄熱四逆散異功散黃芩湯加生熟穀芽詒按推論病機轉析極清立方自然尉貼某瘧邪挾積內陷為痢痢下紅膩腹中陳痛舌苔黃掯瘧勢仍來形容大削元氣內虧慮有變端治之不易神麯川朴茯苓秦皮川連黃芩白頭翁柴胡白芍枳實炙草詒按此白頭翁湯合四逆散是由瘧轉痢濕熱挾積之的方張便痢白膩如水晶魚腦色小便不利少腹偏右板窒諸醫以為腸癰固亦相似然考腸癰為病有寒有熱金匱並出二方如大黃牡丹湯薏苡附子敗醬散概可見矣此證則屬寒積試觀脈弦緊而不數面色青而不渴是其徵也宜用溫通肉桂五苓散加楂肉砂仁復診溫通已效仍從前方加炮薑木香三診欲溺不爽溺後氣向下墜便痢白膩雖稀然腰尻痠痛如折全屬陽虛氣陷之象仿東垣意參入前法西黨參升麻冬朮肉桂茯苓澤瀉炮姜木香訶子煨砂仁生鹿角原注此方連服三劑大便白膩全無脾胃已開按此證並非腸癰乃寒積下痢耳因諸醫皆云腸癰只得委曲周旋但從腸癰有寒有熱輕輕轉筆折入溫通方法既不礙醫又與病相合不得不然之事也故志之詒按認證正確用藥自然針芥相投某泄痢白膩腹不痛脈沉細此寒也宜溫也吳茱萸茯苓木香陳皮炮姜六神麯焦白朮訶子烏藥砂仁李河間論痢屬熱者多而景嶽論痢屬寒者不少此證腹不甚痛但肛酸且脹脈緊肢寒並不發熱兼素有寒疝苔白不渴寒象為多宗景嶽論治之吳茱萸茯苓炮姜木香炙甘草陳皮焦六曲砂仁某休息痢將及五年腹中塊壘時痛痢下仍兼干糞脈弦遲苔灰白此虛而有寒積也本事方云痼冷在腸胃泄瀉腹痛宜先取去然後調理不可畏虛養病此證的是姑擬一方備採參鬚三錢熟附子三錢乾薑二錢炒甘草錢半當歸錢半酒炒大黃三錢酒炒川朴三錢玄明粉二錢枳實三錢土炒共研細末蜜水泛丸每日三錢砂仁湯送下淵按痢疾濕熱未清早服兜澀往往延成休息用溫下法頗為合拍但大黃分量宜重一倍否則不但積不去且不敵薑附子溫燥耳邢休息痢必有積延來兩月近今發熱濕熱鬱蒸於腸胃痢色或赤化濕熱以運中州疏積滯以和氣血勿以為日既久遽投固澀也白朮川連白芍木香當歸茯苓廣皮楂炭升麻澤瀉防風另資生丸補中益氣丸駐車丸等分相和一處每朝服三錢開水送下宋奔走遠行傷飢飲酒脾胃受病而成休息下痢痢經兩載不愈許學土香茸丸最妙今師其意變湯服之杜仲菟絲餅丁香當歸白芍鹿角霜炮姜木香茯苓砂仁詒按此脾腎兩治而專重於腎者查原方皆用鹿茸沉香麝香無用丁香者煎劑中宜改用沉香為妥某休息下痢延及半載色紅而黏脈弦是風邪久羈於腸臟營分之中而莫能出近日畏風身熱是又感新風於外也補中升陽兼涼血為法黨參白朮防風蠶砂茯苓升麻神麯砂仁陳皮炙草椿根皮炭另駐車丸詒按方中於新感一層未曾顧到腸中有風邪惟蠶砂能治之煎方中宜加黃耆張證有變遷治無一定痢疾多由積滯而煙客中氣素虧腎氣亦損小溲不利腎虛陽氣不化也舌紅無苔腎虛陰津不升也腹不痛無積可稽氣下注清陽下陷種種虛象所以奄纏不易奏功夫有胃則生古人是訓而大煙傷氣剝削可虞故煙痢一證醫家難以著手諸宜自愛謹慎為上熟地炭白芍川芎炭肉桂澤瀉冬朮歸身炭黨參元米炒茯苓蜜炙粟殼淵按熟地不宜妙炭某痢而滑脫證已險逆溫固臟真一定成法然須得效庶可回春熟地杞子龍骨茯苓萸肉蓯蓉杜仲烏梅炙草山藥鹿角膠赤石脂炒龜版禹餘糧炒穀芽煎湯代水詒按用藥極其切當惟病象已深未識能挽回否陳痢一病瘧一病腹中痞塊又一病新産之後氣血大傷痞塊瘧痢內外交徵其何以堪勉擬一法分頭求治瘧來之日治瘧退之日治痢治痞塊寓扶正於達邪治瘧之中寓和胃養陰於止痢化痞之內古法有諸並非杜撰瘧來日用人參小柴胡湯瘧退日用理中湯合保和丸去萊蔔子加香附莪朮煎湯送下駐車丸李少腹瘕痛久痢久泄或痢白黏或泄清水或時出燥屎一二枚或時溏糞諸藥俱無效殆難經所謂大瘕泄耶今變前法治之深求不應退而求淺以博胡先生一哂防風陳皮三稜神麯白芍白朮川芎雞內金黃鱔下半截三寸長一段炙黃朝服資生丸二錢威喜丸二錢原注服後效泄瀉霍亂薛便泄半載脾腎兩虧脈沉細澀陰陽並弱陽痿不舉精傷特甚面白無華氣虛已極足跗浮腫陽虛濕注於下納食暖氣胃虛氣逆於中調治之方自宜脾腎雙補陰陽並顧然剛熱補陽恐劫其陰滋膩補陰恐妨其胃刻下節屆清明木旺土衰之候脾者土也腎屬坎水一陽藏於二陰之中當於補土中兼顧腎藏陰陽為是懷山藥炮姜炙甘草黨參五味子菟絲子砂仁茯苓冬朮鹿角霜如不效黨參換人參鹿角霜換鹿茸復診脾腎雙補略見小效今腹中鳴響氣向下墜屬脾虛氣陷舌心光紅脈沉細數為腎藏陰傷用補中升陽法高麗參懷山藥冬朮炙甘草肉果五味子菟絲子陳皮沙苑子川斷鹿角霜白芍謝汗多表虛便泄裡虛腹痛中虛氣升腎虛經停肝虛多夢神虛三焦皆病五臟無一不虛姑擬培土為主以土為萬物之母也黨參冬朮茯苓沙苑子懷山藥白芍棗仁陳皮五味子白扁豆丹皮紅棗浮麥張氣虛則脾弱肝強侮其所勝食即飽脹腹中氣衝作泄也扶土泄木一定法程炙甘草防風根砂仁陳皮焦神麯冬朮川朴五分煎汁拌炒茯苓白芍吳萸三分煎汁拌炒炮姜某泄為脾病嘔為胃病脾胃屬土居中而司升降脾宜升不升則泄胃宜降不降則嘔土衰則木橫木橫而土益衰高年當此頗慮土敗木賊古人治肝當先實脾況茲土弱尤當先補其中稍佐平肝可也理中湯加茯苓橘餅詒按案語理明詞達方法切實不浮但既有嘔惡見證則半夏似不可少擬再加木瓜白芍砂仁王脾虛氣陷肛門先發外瘍瘍潰之後大便作瀉迄今一月有餘自云下部畏冷而兩脈弦硬不柔此胃牢脈證屬陰虛法以溫中扶土升陽化濕黨參防風根炮姜陳皮冬朮川芎破故紙砂仁神麯四神丸一兩資生丸二兩和服日三錢開水送淵按雖從陰虛而起目前脾虛陽弱不得不先治之陳吐瀉轉筋肢冷脈伏汗出音低目陷鼻冷口不渴身不熱陽欲脫亡險重之證擬方備商川熟附一錢五分黨參四錢淡乾薑六分白芍三錢茯苓三錢陳皮八分炙草四分炒木瓜一錢五分澄冷服二診霍亂雖平湯水下咽嗆吐小便不利四肢仍冷兩手脈微細冷汗仍出今擬五苓通利其陰陽佐以清上冀其不嗆為妙肉桂四分後下茯苓三錢豬苓二錢白朮二錢澤瀉一錢五分丁香三分去油六一散三錢麥冬一錢五分陳皮一錢鹽水炒茅根五錢枇杷葉二片黃疸某風邪久戀鬱蒸化熱熱不得越蘊而為黃目黃面黃胸悶痞滿身仍發熱用柴胡梔豉合茵陳湯柴胡淡黃芩赤苓黑山梔通草茵陳枳實飛滑石豆豉川朴某酒客濕熱瀰漫於中加之以郁氣分不暢內熱溺黃食少無力口膩舌苔白而咽乾目睛黃病延兩月大便艱澀津液內枯慮成酒勞谷疸之候治之不易茅朮米泔浸製茵陳當歸酒炒香附葛花雞距子黑梔神麯大麻仁茯苓陳皮通草澤瀉雪羹某脾腎陽微不能化濕上則目黃下為足腫夜多小便時或鼻血下有凝寒上有浮焰法當補中溫下少佐清上黨參炮姜冬朮桑螵蛸巴戟肉鹽水炒茯苓炙甘草益智仁覆盆子川石斛王兩目身體皆黃小便自利色清此屬脾虛非濕熱也名曰虛黃黃耆四兩白芍三兩茯苓二兩地膚子二兩酒浸服詒按此疸病中另自一種以小便清利為據證不多見録之以備一格周伏暑濕熱為黃疸腹微痛小便利身無汗用麻黃連翹赤小豆湯表而汗之麻黃連翹杏仁淡豆豉茵陳草赤苓川朴枳殼通草六神麯炒赤小豆一兩煎湯代水詒按此濕熱在表而無汗者朱濕熱內走太陰遍體發黃肌膚粟起小便黃赤與茵陳梔子柏皮湯茵陳連翹赤苓大黃澤瀉黑山梔黃柏淡芩通草曾脈形乍大乍小面色暗晦不澤似有一團陰氣阻遏於中苔黃而濕腹滿足腫小便黃赤又有濕遏熱伏之形色證合參是屬女勞黑疸變為腹滿在法難醫姑擬泄腎熱以去脾濕仿金匱法冬瓜皮桑白皮地骨皮生薑皮黃柏川朴茵陳陳大麥柴煎湯代水施三瘧止而復作腹滿平而又發今目黃脈細面黑溺少防延黑疸然疸而腹滿者難治姑與分消製附子大腹皮陳皮麥芽綿茵陳赤苓滑石焦山梔通草栝蔞皮淵按疸而腹滿前人未言其故余謂肝脾臟氣兩傷木土相剋也故難治復診面色黧黑腹滿足腫脈沉而細此脾腎之陽不化水濕阻滯於中證勢甚重且與通陽燥濕四芩散肉桂川朴陳皮大腹皮焦六曲細辛香櫞皮麥芽詒按此肉桂五苓散加味溫中疏濕前人所謂陰黃想即指此等證而言黃面黃無力能食氣急脫力傷脾之證也用張三丰伐木丸皂礬一兩泥土包固置糠火中煨一日夜取出候冷礬色已紅去泥土淨茅朮一兩米泔浸切炒川朴五錢製半夏一兩陳皮二兩鹽水炒茯苓一兩炙甘草五錢共研細末用大棗肉煮爛為丸每服二錢開水送飲酒者酒下此方頗效詒按此方以皂礬為君合以平胃二陳明為消除垢積之劑案云脫力傷脾便與此方不合當云脫力脾困瘀濕不化乃合然此方用之頗靈其功效自不可掩
