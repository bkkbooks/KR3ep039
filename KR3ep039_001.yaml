body:
  text: 卷一風溫溫熱朱風溫襲肺肺失宣降咳嗽氣急頭痛發熱舌苔乾白脈象滑數面色暗晦額上汗出正虛邪實慮其喘脫老蘇梗磨汁鬱金磨汁杜蘇子杏仁象貝母前胡炙紫菀旋覆花橘紅鮮枇杷葉去毛栝蔞皮蛤殼打竹茹陳雞冠海蟄一兩洗淡荸薺五個原注凡感邪發熱初起即便氣急其證必險若體實無汗可用麻黃射干開達肺氣若痰多舌苔濁膩可用枳實竹油薑汁滌痰法此證額上有汗不可再用發散舌苔乾白不膩津液已虧不可再用滌痰此謂正虛邪實只宜降氣化痰方法尤為穩當二診服藥後熟寐半夜痰氣平靜但身熱仍然未退直至早晨又復咳嗽氣升今診脈數稍減苔仍乾白面色晦滯不開邪不外達正氣先虛證屆七日乃一候關節之機使得安穩庶幾無變擬方再望轉機淡豆豉杏仁象貝母前胡栝蔞霜旋覆花青木香鮮薄荷根六錢鮮石斛六錢陳雞冠海蟄荸薺某久患三瘧未愈勞力更感風溫而發時證及今八日壯熱煩躁汗不能出疹不能透熱鬱蒸痰神糊囈語兩脅疼痛難以轉側胸悶氣粗動則欲厥所以然者邪熱與瘀傷混合痰濁與氣血交阻莫能分解以致擾亂神明漸有昏喘之險豆豉五錢蘇梗一錢鬱金一錢赤茯神三錢連翹二錢丹皮錢半當歸三錢杏仁三錢天竺黃錢半木通一錢猩絳七分菖蒲五分青蔥枇杷葉淵按鬱金杏仁解氣鬱當歸蔥猩解血鬱豆豉蘇梗從里達表尤宜佐黃芩鮮地等以解熱鬱否則熱不解而諸郁亦不開熱蒸痰阻陷入胞絡易易陳的系溫邪上受自衛入營逆傳膻中蒙閉竅絡以致神昏譫妄舌黑焦乾短縮氣急喘粗身重不能轉側溲溺自遺目圓直視陰津涸竭勢有痙厥之險勉擬大劑生津參以芳香宣竅欲圖萬一之幸舍此更無別法鮮生地汁一茶杯甘蔗汁一茶杯蘆根汁一茶杯茅根汁一茶杯枇杷露一酒杯金銀花露一茶杯犀角汁草匙玫瑰花露一酒杯竹瀝草匙雪梨汁一茶杯細菖蒲汁十匙生薑汁一匙上諸藥汁略煎數沸頻頻灌之一晝夜飲盡為妙另用人參一錢煎湯化下紫雪丹五分二診神識清舌能伸苔仍燥黑大便泄出黏膩臭穢照前方諸汁代水煎入後藥大生地一兩阿膠一錢雞子黃一個入煎另用西黃三釐珠子三分血珀三分研細人參湯調下三診大病須投大劑急症必用急法古人垂訓後學宜遵也昨投一派甘寒搗絞自然生汁取天一之陰津救陽邪之亢烈幸能獲效不辱遠道而來從此告辭聊贈片言而去喜逢知己袁公博學多才還憶舊交禹門精思卓識林今返棹勉論二君協力相資同心共濟溫乃陽邪始終務存津液胃為陽土到底宜濟甘涼養陰而在津與汗葉氏之名言熱病之後治在胃喻氏之碩議甘寒甘平甘淡逐步推移生津化濁和中相機從事頻頻灌溉漸漸回春是所望焉倘若因循怠緩藥少沾唇徒有服藥之名而無服藥之實竊恐不為善後厥墮前功特告主人幸毋忽此至於寒暄飲食務當刻刻留心勿使再觸風波庶可望登彼岸謹諸戒諸鮮石斛一兩北沙參一兩麥冬三錢知母一錢半川貝母二錢花粉三錢連翹三錢玄參三錢蘆根一兩蔗汁一杯沖朱溫邪六日舌白尖紅胸中煩悶脈形弦數邪留少陽陽明不肯宣達外則症狀如瘧里則協熱便泄擬大柴胡法柴胡枳實淡芩半夏川朴大黃竹茹二診得汗身涼舌苔未化胸悶未除表解里不解大豆卷藿梗川朴鬱金半夏橘紅通草竹茹孫年逾古稀觸染溫邪遽爾內陷便泄氣粗神蒙如寐舌焦乾短左脈空大右脈模糊勢防痙厥磨犀角一錢沖鮮生地一兩北沙參五錢麥冬三錢天竺黃一錢半大生地一兩細菖蒲三分赤芍一錢半磨沉香三分二診泄止加厄危險迫矣洋參三錢大生地一兩川貝母一錢半玄參三錢北沙參五錢橘皮一錢天竺黃一錢半麥冬三錢柿蒂二個細菖蒲三分竹茹一錢三診厄止神識稍清舌上津液漸回大有起色仍擬甘寒大生地一兩鮮生地一兩天麥冬各三錢北沙參五錢玄參三錢川貝母一錢半蘆根一兩四診神糊已清津回未足虛體易於反復諸宜謹慎為囑前方去天冬鮮地蘆根加洋參玉竹甘蔗皮秦溫邪十二日斑疹遍透神識仍糊大便屢行齒垢未脫舌尖紅中心焦陰津灼也左脈大右脈小元氣弱也昨投清泄芳開是從邪面著筆今診脈神委頓當從元氣推求要知溫屬陽邪始終務存津液胃為陽土到底宜濟甘涼所慮液涸動風易生痙厥之變胃虛氣逆每致厄忒之虞耳羚羊角沙參生草天竺黃菖蒲犀角鮮石斛玄參洋參澤瀉茯神蘆根蔗汁另用濂珠粉三分上血珀末三分開水調服二診昨用甘寒生津扶正病勢無增無減然小便得通亦氣化津回之兆也證交十三日是謂過經乃邪正勝負關頭從此而津液漸回神氣漸清便是邪退之機從此而津液不回神糊益甚便是邪進之局正勝邪則生邪勝正則重仍以生津救液冀其應手羚羊鮮石斛沙參洋參麥冬澤瀉赤苓玄參蔗汁蘆根珠黃散又加知母川貝三診甘寒清潤固足生津亦能滋濕向之舌絳乾焦者今轉白膩口多白沫是胃濁上泛也小便由於氣化濕滯中焦氣機不暢三焦失於輸化故不飢不思納小便不利也法宜宣暢三焦豆卷赤苓豬苓澤瀉生苡仁杏仁通草竹茹陳皮半夏曲穀芽血珀五分研末沖服淵按帆隨湘轉妙於轉環脾腎陽氣素虛陽邪一化陰濕即來在脈神委頓時早防之庶免此日波變然不料其變之如是速耳古方大豆卷治筋攣濕痹蘇地用麻黃湯浸藉以發汗與此證總不相宜四診瘀熱畜於下焦膀胱氣痹不化少腹硬滿小溲不利下既不通必反上逆恐生喘厄之變開上疏中滲下俾得三焦宣暢決瀆流通紫菀杏仁桔梗川朴陳皮赤苓豬苓澤瀉蘇梗血珀通草又照方加參鬚五分煎湯調下血珀五分外用田螺二枚蔥白一握桃仁三錢曲少許麝香五釐肉桂五分合打爛燉溫敷臍下關元穴五診溫邪甫退少腹板硬膀胱氣化無權昨議疏泄三焦小便仍不暢今少腹硬滿過臍其大如盤按之不痛脈沉小舌白膩身無熱口不渴所謂上熱方除中寒復起是也夫膀胱與腎相表裡膀胱氣化賴腎中陽氣蒸騰腎陽不足膀胱水氣凝而為瘕須防犯胃衝心厄厥等變急急溫腎通陽泄水猶恐莫及肉桂五苓散送下金匾腎氣丸三錢淵按須此方解下焦之圍再佐蔥鹽按摩更妙六診通陽泄水與病相投雖未大減已奏小效腹中覺冷中陽衰弱顯然照方加木香炮姜某溫邪十一日神昏不醒齒燥舌焦乾脈形糊數斑疹透而未足色不鮮澤陽明邪火熾盛少陰陰液消亡勢有痙厥之險勉擬生津救液佐以芳香宣竅備候高明商奪犀角羚羊角淡豆豉北沙參鮮生地天竺黃連翹心牛蒡子九節菖玄參鮮石斛至寶丹一丸細葉菖蒲煎湯化下華溫邪八日神識模糊斑色紅紫脘腹拒按結熱旁流舌紅乾燥目赤唇焦而又膚冷汗出脈伏如無邪熱內閉陰津外泄頗有內閉外脫之慮勉進黃龍湯法大生地參鬚生大黃枳實連翹玄參天竺黃菖蒲鮮石斛淵按膚冷汗出脈伏非虛象乃閉象也從班色紅紫上看出參鬚可斟酌尤證交十二日目赤耳聾舌白煩渴脈洪大而汗出當辛涼以徹氣分之熱邪甘涼以救肺胃之津液北沙參麥冬知母天竺黃玄參滑石生石膏薄荷同打竹葉蘆根二診目張不語而神慧與湯則咽身能轉側舌苔灰白脈形洪滑並非邪閉心包乃肝陽夾痰火阻塞清明之府勿再芳香開達開則邪反內陷矣慎之羚羊角川貝鬱金茯苓膽星石決明遠志鮮石斛竹油薑汁北沙參淵按清火熄風豁痰通竅絲絲入扣惟沙參可斟酌以其補肺也舌苔灰白痰火徵兆三診目張不語多汗脈大陽盛陰虛防其厥脫急救其陰希圖萬一生洋參石決明沙參茯神麥冬川貝五味子四診目已能合口已能言但舌蹇而言澀汗多稍收脈大稍斂似有一線生機所嫌兩臂動強恐其發痙擬存陰熄風法羚羊角鮮地生地洋參沙參石決明麥冬鉤鉤蔗汁淵按幾乎類中大抵平素肺腎陰氣不足肝陽有餘年過四十者每有是證顧溫邪得食則復舌心尖焦黃而干邊苔白膩心胸痞悶此挾積挾氣挾痰挾水大便已十二日不通其勢不得不下半夏茯苓澤瀉川連枳實川朴蔞仁大黃玄明粉楊胸悶頭痛寒熱往來邪在少陽有汗而熱不解是傷於風也舌薄白邊色乾紅陰虧之體邪未外達而津液暗傷漸有化燥之象證交七日中脘拒按似欲大便而不得出少陽之邪傳及陽明胃家將燥實矣防其譫語擬少陽陽明兩解法柴胡淡芩半夏枳實甘草香豉黑山梔蔞仁桔梗滾痰丸錢半淵按從大柴胡陷胸變化不用大黃黃連以陰虧液傷拒按在中脘不在大腹也借滾痰丸以微通之心靈手敏詒按溫邪深伏往往有汗不解未必皆因於風也少陽陽明合病想因將燥未燥故不用大黃稍用滾痰丸以示意也二診得汗得便邪有松機是以胸悶心跳煩躁等證悉除而頭痛略減也雖自覺虛餒未便多進穀食亦未可就進補劑但和其胃化其邪可耳香豉豆卷半夏川貝赤苓陳皮鬱金川斛通草竹茹詒按方極妥洽三診用和胃化邪法一劑頗安二劑反劇良以畏虛多進穀食留戀其邪不能宣化鬱於心胃之間濕蘊生痰熱蒸灼液煩燥噁心錯語兩手寸關脈細滑數兩尺少神舌邊乾紅心苔黃膩皆將燥未燥將陷未陷之象當此陰虧之體能不慮其內陷乎擬導赤瀉心各半法生津化濁和胃清心犀角川連鮮石斛枳實半夏黑山梔赤苓連翹橘紅生甘草通草鬱金竹茹蘆根萬氏牛黃清心丸五分淵按陽明痰熱未清遽進穀食致有下文如是大變宜仿仲景食復法佐大黃以微下之詒按推論病原未嘗不細意研求但伏溫之邪每多一層解後停一二日再透一層且每有後一層之邪更甚於前者此證乃第二層之邪發作耳觀後數案病情自明若謂穀食戀邪與以後病情不合矣且不至有如此重候也查萬氏原方中山梔川連鬱金均已入煎劑所少者牛黃一味耳且似此病情可不必用四診證交十三日身熱不揚神昏舌短苔黴邪入膻中閉而不達急急清泄芳開希冀轉機犀角連翹枳實天竺黃蘆根菖蒲黑膏牛蒡玄參薄荷根鬱金鮮石斛紫雪丹五分另調服詒按此案病情大是可危五診神情呼喚稍清語仍不出邪欲達而不達也胸脅紅點稍現跡稀不顯斑欲透而不透也口臭便祕時覺矢氣陽明燥實復聚也舌短心焦邊絳膻中邪火方熾也芳開清泄之中參以生津蕩實前方加沙參細生地磨大黃玄明粉詒按服此方後想已得有大解氣分之邪熱得泄故下方專於清營六診口臭噴人胃火極盛斑疹雖見透而未足目赤神糊脈洪口渴急急化斑為要古法化斑以白虎為主今仍參以犀地清營解毒再復存陰玉女煎犀角黑膏麥冬天竺黃大生地知母沙參洋參菖蒲人中黃蘆根石膏薄荷打淵按前方未知下否若未通可再下之所謂急下以存陰也有犀地白虎清營救液見證有實無虛不妨放膽詒按此方與後方如仍加大黃以通胃腑則伏熱得泄可免後來許多周折七診目能識人舌能出口證漸有生機當大劑存陰冀其津回乃吉大生地鮮石斛麥冬洋參玄參生甘草鮮生地石膏犀角沙參蔗汁詒按至此始有轉機亦險矣哉八診黑苔剝落舌質深紅陰津大傷燥火未退左脈細小右脈洪大是其徵也際此陰傷火旺少陰不足陽明有餘惟景嶽玉女煎最合一面存陰一面瀉火守過三候其陰當復鮮生地生石膏玄參洋參大生地黑山梔生甘草知母沙參連翹蘆根淵按右脈洪大陽明熱結夾滯顯然詒按有形之垢已去無形之熱猶存用藥仍宜虛實兼顧不敢稍忽也九診頻轉屎氣咽喉乾燥燥則語不出聲此陽明火勢熏蒸津不上承重救其陰兼通其腑再商大生地一兩鮮生地一兩麥冬三錢生大黃三錢海參二兩北沙參一兩生甘草四分玄參五錢玄明粉三錢淵按從前缺下尚是實熱見象海參嫌膩膈詒按此吳鞠通增液承氣法也因腑中垢熱又聚故用藥如此如前第六七方中仍兼大黃用之則無此波折矣海參腥穢不堪入口擬去之仍加洋參石斛十診下後液未回急當養陰醒胃生洋參茯苓橘紅麥冬蔗皮大生地石斛沙參玄參穀芽十一診耳聾無聞舌乾難掉陰津大傷用復脈法大生地麥冬玄參洋參阿膠川連三分拌炒生甘草雞子黃詒按熱去陰傷此後可專意養陰矣然耳聾未聰則陰經尚有餘熱未泄也十二診疊進滋陰大劑生津則有餘瀉火則不足今交三候齒垢退而復起神識已清非陰之不復乃燥火未清耳今當法取輕靈洋參枳殼川貝橘紅赤苓棗仁豬膽汁炒川連雪羹湯煎詒按此方用意不甚親切緣此時仍宜養陰泄熱兩層兼到方合病機十三診諸恙向安每啜稀粥必汗出沾濡非虛也乃津液復而營氣敷布周流也小溲澀痛餘火未清惟宜清化冬瓜子鮮石斛通草黑山梔生穀芽甜杏仁甘草梢詒按小便澀痛宜參導赤各半法加生地木通連柏十四診病退日間安靜至夜發熱神昏乃餘熱留於營分也小溲熱痛心火下趨小腸仿病後遺熱例用百合知母滑石湯合導赤散木通甘草梢竹葉知母鮮生地滑石百合泉水煎服詒按藥後餘波亦題中應有之義方亦輕清合度範陰虛挾濕之體感受時令風溫初起背微惡寒頭略脹痛欲咳不爽發熱不揚舌苔白膩大便溏泄峻投消散暗劫胃津以至飢不欲食嗜臥神糊厄忒斷連斑疹隱約證方八日勢涉危機閲周先生方洵盡美善僭加甘草一味以和之具生津補中之力未始非贊襄之一助也若云甘能滋濕甘能滿中孰不知之須知苔薄光滑胸不滿而知飢乃無形濕熱已有中虛之象此葉氏所以深戒苦辛消克之劑幸知者察焉牛蒡子前胡橘紅天竺黃鬱金刀豆子桔梗神麯菖蒲連翹薄荷葉竹茹甘草枇杷葉淵按此痰厄也中虛挾痰胃氣通降不順所致詒按審證精細論亦透徹苔白滑而光亮無津此濕蘊津傷之候專投香燥每每涸液增變案中議論洵屬閲歷之言復診證逾旬日系溫邪挾濕病在氣營之交苔白膩而邊紅疹點透而不爽寐則譫語寤則神清厄聲徐而未除脈象軟而小數周先生清營泄衛理氣化濁恰如其分僭加一味仍候主裁犀角連翹天竺黃川連橘紅半夏牛蒡子丁香柿蒂竹茹薄荷根通草茅根枇杷葉淵按寐昏寤明痰火阻塞上中焦顯然方較上首好三診熱處濕中神蒙嗜臥呼之則清語言了了舌白膩脈軟數知非邪陷膻中乃濕熱瀰漫於上焦肺氣失宣布耳厄尚未除胃濁未化擬從肺胃立法射干杏仁鬱金橘紅代赫石川貝沙參桔梗通草旋覆花茅根冬瓜子淵按開肺降胃更為得旨所以厄除神清詒按論病清切此時若誤認入營而投清營之品則邪機愈遏而增病矣以中虛陰弱之體患溫邪夾濕之病過投辛燥則陰涸過與消克則中傷若回護其虛又恐助濁增病此等證用藥最難觀前後六案論病親切用藥清靈疏邪扶正虛實兼顧自非老手不辦四診厄除苔稍化欲咳不揚仍從前法加減前方去代赭石加蛤殼赤苓五診去旋覆花射干桔梗加豆卷六診便泄數次黏膩垢汙胃濁以下行為順故連日沉迷嗜臥昨宵便惺惺少寐且屢起更衣愈覺神煩倦乏耳今便泄未止舌苔仍白身熱已和酒客中虛濕勝擬和中化濁仿子和甘露飲生洋參於朮赤苓澤瀉滑石雞距子廣藿香木香葛花橘紅通草竹茹淵按痰從便去熱亦隨之中焦之濁清上焦之熱亦降故諸恙若失轉惺惺少寐耳然苔未化余濕未清脾胃轉運未復也不可早補七診病已退濕未楚前方加減前方加參鬚神麯穀芽孫溫邪襲肺肺失清肅濕挾熱而生痰火載氣而逆上喘息痰嘶舌乾口膩昨日之脈據云弦硬現診脈象小而澀數陰津暗傷元氣漸餒頗有喘汗厥脫之慮夫溫邪為病隸乎手經肺胃位高治宜清肅痰隨氣湧化痰以降氣為先氣因火逆降氣以清肅為要姑擬一方備候高明酌奪鮮石斛射干杏仁象貝沙參蘇子桑皮沉香蘆根竹油沖服冬瓜子枇杷葉薑汁原注凡時證之脈先大而後漸小先強而後變弱其熱不退而病反增者必死此死證也無能為力立方用藥無甚深意詒按此要訣也最須記好初病之脈硬大者邪正相搏也轉為弱小正氣餒矣而病象不退而反增正氣不能敵邪也病日進而正日虧不死何待黃舌乾而絳齒燥唇焦痰氣喘粗脈象細數無形邪熱熏蒸於膻中有形痰濁阻塞於肺胃而又津枯液燥正氣內虧恐有厥脫之變擬化痰滌熱治其標扶正生津救其本必得痰喘平神氣清庶幾可圖羚羊角旋覆花葶藶杏仁川貝玄參鮮石斛茅根竹油沉香代赭石蘇子薑汁枇杷葉滾痰丸三錢人參湯送下詒按虛實兼到立方頗為詳盡方中藥品已多蘇子旋赭可以去之二診頭汗淋瀝痰喘不止脈形洪大面色青晦舌紅乾涸齒板唇焦此少陰陰津不足陽明邪火有餘火載氣而上逆肺失降而為喘證勢危險深慮厥脫勉擬救少陰之津清陽明之火益氣以斂其汗保肺以定其喘轉輾圖維冀其應手乃妙大生地海浮石拌搗洋參牛膝五味子石膏桑皮川貝炙甘草麥冬人參一錢另沖煎陳粳米煎湯代水原注此玉女煎合生脈散蓋溫病以救陰為急也淵按脈形洪大合之頭汗面青上實下虛大著從補下納氣之中想出清熱救津之法故能應手人參石膏粳米救肺清熱亦所以救腎也詒按前後三案均有齒垢唇焦見證其胃腑中有垢熱可知用玉女法清胃救腎大致亦合若於中稍參泄熱之意則見效更速矣方中五味酸斂炙草粳米甘膩均不相宜三診汗稍收喘稍平脈大稍軟但氣仍急促心中煩躁舌紅乾涸齒垢唇焦津液猶未回虛陽猶未息上逆之氣猶未降雖逾險嶺未涉坦途今心腹似有透㾦之象是亦邪之出路仍擬救少陰清陽明再望轉機大生地蛤粉炒洋參沙參玄參麥冬鮮生地牛膝通草豆卷五味子竹葉枇杷葉陳粳米煎湯代水淵按前方應手此即頭頭是道通草豆卷淡滲泄表恐其耗津不必慮邪之不去津氣回而邪自不容矣詒按此與前方同意四診陰津稍回氣火未平仍宜步步小心勿致變端為幸大生地洋參沙參玄參澤瀉天竺黃麥冬鮮石斛石決明茯神蘆根詒按仍以養陰之法收功張溫邪兩候不解脈形洪大中空神昏蒙而如醉舌淡紅而無苔與湯亦不卻不與亦不討囈語如呢喃叮嚀重復道昨日用芳開神情略覺好然憑證而論之乃津枯而液燥是必甘寒潤燥生津液俾得氣化津回方保吉大生地鮮石斛沙參茯苓麥冬羚羊角鮮生地大竺黃甘蔗汁蘆根尖淵按案語清華方法簡潔非學識兼到者不能許溫邪內蘊痰濁上泛壯熱無汗神識模糊氣逆痰多舌膩尖紅大便不通勢防厥脫羚羊角葶藶杏仁川貝天竺黃蔞仁黑山梔枳實豆豉菖蒲滾痰丸三錢原注此方效淵按實熱夾痰滾痰丸甚合煎方亦好吳溫邪五日舌苔干黃壯熱無汗胸腹板滿硬痛手不可近此屬結胸煩燥氣喘口吐涎沫防其喘厥黑山梔豆豉蔞仁川連杏仁生大黃葶藶柴胡枳實淡芩玄明粉皂莢子原注凡結胸證煩躁氣促者死此方是大柴胡湯大小陷胸梔豉合劑淵按煩躁無汗而有氣喘者柴胡不可用用柴胡仍蹈前人治傷寒之故轍也幸有硝黃連杏主持其間否則壞矣詒按葶藶治痰喘證屬實者若身不熱而脈微者忌之二診下後結胸之硬滿已消而煩躁昏狂略無定刻舌苔乾燥渴欲涼飲壯熱無汗邪氣猶在氣分以苦辛寒清裡達表冀其戰汗無變為妙幸其壯熱無汗可冀戰汗若汗出而仍壯熱則內陷矣三黃石膏湯雞蘇散與梔豉合劑三診戰而得汗脈靜身涼邪已解矣舌黃未去胃中余濁未清尚宜和化川貝赤苓豆豉炒連翹黑山梔通草滑石枳殼炒竹茹原注凡戰汗後脈靜身涼用方大法不外乎此總以和胃氣化濕熱為主嚴病後元氣未復溫邪乘虛竊發初起即便壯熱神糊舌乾肩膊脅肋疼痛今方二日邪未宣達已見津涸之象其為重候可知當此論治是宜達邪以解其表然葉氏云初起舌即干神略糊者宜急養正微加透邪之藥若昏憒而後救里有措手不及之虞矣北沙參一兩牛蒡三錢杏仁三錢焦曲三錢黑山梔錢半豆豉三錢連翹三錢天竺黃一錢枳殼一錢茅根一兩鮮薄荷根五錢淵按深得葉氏心傳孫營陰素虧之體感受溫邪病起肢麻寒熱旋即便泄神糊今交七日脈數而洪舌燥齒乾心蕩氣促陽明之火方熾少陰之陰已涸又腹硬痛大便三日不通積聚於中不下氣火盡浮於上似宜通降為先然陰津大涸不得不先養其津姑擬一方備商鮮生地一兩四錢北沙參二兩磨蘇梗五分沖杏仁三錢天竺黃錢半茯神三錢麥冬五錢川貝三錢雪梨汁一杯沖枇杷葉三片淵按先養正救津斯為老眼無花二診津回舌潤汗出甚多熱勢亦退惟心煩不寐大便不通仍以前方加減前方去蘇梗加細生地一兩天冬三錢麻仁三錢蔡溫邪發斑透疹總在肺胃兩經邪熱鬱蒸從里達外血分熱熾則發斑氣分熱熾則發疹邪從外入由氣傳營熱自內出由營達氣此證胸前先發斑點身未覺熱數日之後始發寒熱續布痧疹似乎營分先有伏熱而後溫邪湊集肺胃受病始見咳嗽寒熱等證然斑已將化疹已透齊即有餘邪清之解之可已乃反脘痞煩悶氣升噁心喉痛難咽其故何歟良以懷孕八月適當太陰陽明養胎之候邪熱甚於肺胃胎氣失蔭而上逆繇是胸高氣逆煩躁不得臥豈非病雖由熱而實乃胎氣上衝所致也為今之計清解肺胃溫邪以化斑疹熱毒是為正治然燎原之下液灼津傷亦必養其津液胎氣上升為變最速尤要先平胎氣肺主一身之氣又必降其肺氣肺氣降而得臥胎安不上衝庶無喘厥之虞矣鮮生地一兩淡豆豉三錢同鮮地研川貝三錢磨蘇梗五分沖磨犀角五分沖磨鬱金五分沖玄參二錢白薇三錢竹茹一錢野苧根五錢枇杷葉三片去毛二診溫邪上受自氣傳營而化火上炎由胃及肺喉屬肺經咽屬胃經凡咽喉之證屬實火者多因肺胃之陽盛腎脈循喉肝脈繞咽系虛火者始關肝腎之陰虧是其大略也此證乃斑痧之後喉痛色赤全由邪火熾張圖治之方犀角地黃不出甘寒清解昨吐紅痰無非氣火熏蒸今觀脈色已覺神情爽朗立夏恰今朝病能減而即是退胎不動而即是安大便才通亦是轉機之兆小心調理冀無欲速之譏犀角羚羊角川貝鮮石斛玄參知母鮮生地麥冬枇杷葉金銀花露緑豆皮煎湯與燕窩湯相和頻飲三診夫溫邪燔亢之餘餘熱固未能淨肺胃燎原之下陰津必受其戕養陰不在血而在津與汗葉氏之名言安胎須順氣陰火忌上衝婦科之要論此證幾及兩候溫痧既退安得邪火復熾喉腫既消何以燥痛復盛所以然者胎當七八月之間正肺與大腸司養之際肺腸相為表裡肺主氣而大腸主津肺受火淫燥熱移於大腸大腸當養胎之際遂移熱於胞絡內經云人有重身九月而喑是胞之絡脈絶也胞脈者繫於腎而絡胞胎今熱上迫肺故音啞咳嗽而喉復痛也按此段經文明指胎中陰火當九月之期有此音啞一證教人勿亟治之惟恐傷其胎氣耳茲方八月即得音啞咳頻豈非殃及池魚之謂歟今以甘涼生津治其上燥參入鹹寒以降陰中伏火經所謂熱淫於內治以鹹寒是也須知治病要察機宜養陰而火自降指久病虛羸而言火退而陰自充乃暴病未虛之證先輩有提其要曰暴病多實久病多虛是其義也然歟否歟仍候華先生裁正北沙參一兩川貝去心勿研三錢玄精石三錢知母三錢秋石煎湯拌浸蟬衣一錢去翅足大豆卷三錢玄參三錢天花粉三錢枇杷露一杯沖服野苧根三錢赤苓三錢生甘草四分改方加羚羊角錢半鮮生地七錢黑山梔錢半淵按伏溫由內達外由里傳表從少陰而出太陰所以退而復來輕而再重不盡由乎胎熱疹屬肺肺主一身之表斑屬胃胃為萬物所歸溫邪每從兩經而達也胞絡者乃胞門子戶之胞非心胞絡胞絡系腎少陰之脈貫腎上入喉中熱邪由少陰上干喉中故音啞甚則喉痛鮑半月不大便證交十二日神昏舌煤齒垢乾枯陽明邪火極熾少陰陰液已虧腸中宿垢不下邪熱靡有出路不下恐火盛劫液而痙厥下之恐亡陰而厄脫極難著筆姑備一方犀角鮮生地生大黃茯神當歸菖蒲大生地連翹枳實麥冬天竺黃玄明粉淵按一面養陰徹熱一面通腑最穩當硝黃宜輕用二診便解三次神氣稍清舌煤已化今擬生津鮮石斛一兩川貝二錢茯神三錢玄參三錢生甘草五分麥冬三錢天竺黃錢半竹茹一錢北沙參一兩大生地一兩甘蔗皮一兩沈陰虛之體感受溫邪反復今交九日神識時迷滿舌碎腐脈象漸沉防其昏厥備方候致和先生哂政犀角四分磨沖連翹三錢丹皮錢半栝蔞仁三錢鮮生地五錢玄參三錢天竺黃錢半鮮薄荷根一兩另珠子三分血珀四分研細末蘆根湯送下二診照前方去蔞仁加大生地生洋參沙參麥冬三診陰津大虧痰火熾盛內風暗動痙厥將至煎藥不肯沾唇姑以湯方備試參鬚一錢川貝二錢石決明八錢杏仁三錢蘆根一兩竹油三十匙沖麥冬三錢雪梨汁一杯沖羚羊角錢半先煎蔗汁一杯沖四診證勢稍轉機仍候濟慎先生裁正羚羊角鮮生地大生地天冬麥冬鮮石斛北沙參石決明西洋參鉤鉤蘆根竹油茯神蔗汁梨汁淡薑汁生甘草玄參二味濟慎先生加淵按數方養陰則有餘瀉火尚不足致有下文邪熱逗留之弊五診照前方加減備候濟慎先生裁正大生地川貝鮮石斛石決明玄參丹皮麥冬生洋參北沙參蘆根甘蔗汁六診腑氣不通陽火不降陰津不升元氣雖虛不得不通其腑大生地八錢鮮石斛五錢北沙參一兩玄參三錢知母錢半生大黃三錢當歸三錢生洋參三錢麥冬三錢蘆根一兩洪溫邪初起胸悶頭痛發熱有汗先宜涼解牛蒡子豆豉黑山梔連翹桔梗橘紅荊芥杏仁薄荷蘆根秦發汗太過津液內奪昨日生津以達邪汗雖未出而疹點已化熱雖未退而脈象稍和是佳兆也苔煤而不甚燥神糊而有時清犀角地黃雖可用然大勢無變方亦無事更張仍照前方加味北沙參一兩天竺黃錢半鮮石斛一兩連翹三錢麥冬三錢茯神三錢朱拌生甘草四分玄參三錢茅根一兩去心燈心三尺朱拌九節菖蒲八分淵按神糊苔煤鮮石斛可用北沙參不可用雖養肺陰究嫌補肺助痰麥冬亦然此老好用二物瑕瑜並見張久患便血陰氣先傷於下今感溫邪挾積肺胃之氣阻窒上喘下泄發熱口渴舌絳如朱額汗不止遍體無汗脈小數疾厥脫險象環生擬一方備正葛根一錢黃芩錢半石膏三錢薄荷同研赤苓三錢黃連四分杏仁三錢牛蒡元米炒三錢生甘草四分枇杷葉三片上藥用水兩盞煎至一盞另用人參一錢麥冬錢半五味子五分炒生地四錢阿膠二錢蛤粉炒用水兩盞另煎煎至半盞沖和前煎徐徐服下原注此為復方法病系溫邪而陰虛欲脫故立此法凡暴喘多實而壯熱舌乾宜從清解惟久患便血今更下泄不止所謂喘而不休泄痢不止水漿不入者不治故不得不救其陰希圖萬一淵按陰血既耗於下脾氣復傷於中故一感溫邪而上喘下泄泄為脾陷喘為腎逆兩藏不守厥脫易易頭汗者陰不守而陽越也身無汗者陰液虛而氣不能化也舌絳如朱胃陰虧而心火熾脈小數疾陰血虛而邪火伏兩方頗有心思惟葛根嫌升發牛蒡嫌泄肺蓋陰陽兩虛中氣不守氣雖陷不可升汗雖無不可發急急顧慮中氣陰液猶恐不及然肯用心如此敬服之至何陽明熱邪充盛遍體發出紫斑鼻血齦碎急與清解防內陷犀角八分石膏八錢薄荷茜草三錢丹皮錢半鮮生地五錢連翹三錢紫草三錢玄參三錢茅蘆根各五錢某凡證於陰陽虛實疑似之間最當詳審此證音低神倦似虛而便泄臭水中脘按痛實也肢冷脈細似陰而小便熱痛陽也至於舌白譫語乃痰蒙火鬱之徵而日暮煩躁為陰虛陽盛之兆鄙意百般怪證多屬乎痰痰蒙火鬱清化不解須從下奪即使正虛而虛中夾實亦當先治其實耳羚羊角天竺黃石菖蒲膽星鮮石斛茯神橘紅鬱金竹瀝薑汁另滾痰丸詒按議論明快立方切實的是此道中高手二診風火熾盛痰迷竅絡神昏不語耳聾目張痙厥之兆立至證屆兩候正在關節之期勉擬一方以盡人事犀角羚羊角鮮石斛鮮生地石決明茯神天竺黃石菖蒲玄參膽星三診無形之風火鴟張故神識昏蒙不醒而有形之痰濁上泛故舌苔反見濁厚清開不應擬進苦泄再望轉機川連枳實膽星半夏石決明橘紅赤苓滑石竹瀝薑汁羚羊角另當歸龍薈丸四診有汗發痙謂之柔痙痙盛神昏風淫火熾極矣夫內風多從火出欲熄其風先須清火欲清其火必須鎮逆考古有風引湯一法多用石藥其原論云痙發不止醫不能療風引湯主之良由風火熾盛草木諸藥不能平旋動之威非用石藥之慓悍滑疾者不足以勝之故曰醫不能療也病極凶危醫宜盡力其然其否尚祈高明裁正石膏寒水石紫石英靈磁石紫蛤殼滑石石決明生地砂仁拌炒阿膠赤石脂拌炒鉤鉤牛膝炭竹瀝薑汁詒按疊進清火豁痰三方而病勢未平仍有昏痙之狀不得已而出此方竊思溫邪乃伏氣內發之病每多已發之邪化熱而為痙厥未發之邪仍舊鬱伏不動及外一層經清化而解然後內伏之邪再逐層外露故於清化之後再用透托者有之再用下泄者有之再用清營通絡者亦有之此證病情如此疑其尚有伏邪在內所致金匱風引湯所治之證究與時邪發痙之證有別姑存之以備一法可也濕溫田體質素虧溫邪甫起頭脹身疼發熱舌苔濁厚兼挾痰食宜避風忌口為要淡豉三錢