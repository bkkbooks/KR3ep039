body:
  text: 卷四腦疽對口玉枕疽楊悲哀惱怒則傷肝肝陰傷則虛陽上亢爍及三陽從三陽總會之所而瘍生焉證名腦疽及今兩候有餘膿水見而不多火勢極盛腐肉未化堅腫未消頃診脈左部弦洪右部細小大便艱結小溲頻數顯系氣虛下陷之體肝陽上升之病夫氣虛宜補肝陽宜鎮鎮肝抑火固外瘍所必然而補托化膿亦高年所宜講所慮者陰分不充氣將日陷肝陽無制膿水腐肉無朝生暮長之功氣血亦無以滋生勢將漸蹈於陷機擬方呈政羚羊片一錢五分石決明五錢殭蠶二錢細生地五錢川貝一錢五分茯苓二錢丹皮一錢五分橘紅一錢製半夏錢半竹茹一錢二分二診議扶正潛陽氣血兼顧同徐先生酌奪參鬚七分當歸錢半石決明一兩茯苓二錢生地三錢製半夏一錢黃耆一兩粳米一撮三診昨投補托參入鎮肝小溲之數大減不可謂非佳兆從此陷者升氣漸蒸騰而上可為生肌去腐之助所以昨晚定方竟從十全大補參商乃藥未服胸脘似悶自云平素之肝氣因交芒種而發夫肝氣者肝火沖激胃脘之痰飲也痰飲宜化氣虛宜補既用補托不能不先化痰飲因思舌苔白膩胸悶嘔噦前人每用溫膽一法此證既屬高年氣虛古人補法之中未始無兼而行之者則十味溫膽之謂也仿其意以立方補不嫌壅滯化不嫌香燥參酌至當庶幾內臟安而外瘍有益昨方加麩炒枳殼一錢制香附一錢磨鬱金五隻蔻仁五分竹茹薑汁炒錢半四診從十味溫膽立方並無胸滿悶滯等患且能安寐兩時受補可知惟左脈之弦洪不減酉戌之交煩躁不安心火太旺膿水較多終未能暢根盤稍和究未能化仍恐火勢太甚乘氣虛而內陷擬清心化熱之品與補托藥相輔成功真老港濂珠犀黃血珀同研末心煩時用藕汁調服五診日中至黃昏為陽中之陰此時痛勢最甚必有陰火上乘邪火因而愈熾昨用補托膿水甚多想正氣得扶毒便外出今日診脈左部略平惟髮際之堅腫火色未退而脾胃仍不思飲食當從昨方運以調胃之法參以鎮火之品備正臺參鬚鹽水拌七分於潛術錢半石決明七錢細生地四錢川貝三錢枳殼五分鮮石斛二錢陳皮鹽水炒五分茯苓錢半殭蠶一錢連翹錢半赤芍錢半竹茹薑汁炒四分另水炙黃耆一兩夏枯草一兩煎湯代水六診膿水淋漓毒能泄也小溲能暢火從下降也所以面赤火升得平痛勢亦減左脈之洪數亦較平於前日種種佳兆皆由升降各職其司升降之職司未始非補托之助氣盛則上下咸宜也然而前日之方宜增不宜減人參條一錢細生地四錢川貝錢半石決明一兩麥冬肉錢半銀花錢半赤芍一錢歸身一錢陳皮一錢另水炙黃耆一兩夏枯草五錢鮮藕一兩煎湯代水七診夫外瘍以候數言者取七日來復之義此其大略也而人之氣血強弱不同少長各異有未至而至即有至而不至仲景先師分明言之矣太太之瘍昨交三候已盡方見膿水大暢瘡口開放痛勢大減意者高年氣血生長稍緩藉補托以扶助而後霞蔚云蒸火毒外潰乎今診兩部大得和緩之意所謂有胃氣也飲食不須苦勸胃和可知所嫌陰中之陰之候左關加弦痛勢加增煩躁亦甚無非陰火內動此時定方補氣養營之外不能不兼顧陰中之火人參條全當歸白芍細生地丹皮左牡蠣川貝鮮石斛地丁草陳皮另黃耆藕夏枯草各一兩煎湯代水八診補氣顧陰為劑昨日自朝至暮神氣清朗胃氣亦開脈情亦和何樂如之據述醜寅之際自覺不適似夢非夢語言錯誤此心營內虛相火上乘意者昨晚珍珠停服乎夫調理高年重虛之體因事制宜者尤當因時服藥鄙意欲陽分服補氣之方一交陰分加養陰之品質之同道先生以為然否人參條一錢於潛術錢半細生地三錢朱茯神二錢酸棗仁川連汁炒三錢川貝母一錢杏仁錢半麥冬肉錢半歸身一錢陳皮五分另黃耆藕各一兩煎湯代水辰初服一盞後加赤芍一錢夏枯草錢半左牡蠣三錢丹皮一錢金箔三張燕窩二錢煎一小杯沖珠粉一分酉正服九診統觀脈證其發於外者痛止火退膿多而腐未脫耳其在內者舌苔灰濁胃氣不開據述昨晚不時煩悶且云腹痛乾嘔而嗆自覺有時模糊種種見證由臟腑不和濕熱乘虛而入夫病後宜補一定之理而補法亦有因時制宜之道古人六腑以通為補亦猶五臟以填為補也況時令濕熱蒸郁弱體尤易見纍擬暫去參耆從胃腑立法俾胃和再商圖本川貝母枳殼赤苓橘紅鮮石斛薏苡仁豆卷竹茹另參鬚五分煎湯送真珠粉一分十診從胃立法煩悶頓除自覺脘中空爽口味大和藥能應手何其速也今晨診脈左三部較和於昨右關亦旺蓋久病宜調補脾胃胃和則臥能安寐升降自調轉運得所生長之機自復惟每日下午精神較怯睡覺亦見神情恍惚神氣不安夏至在邇陰氣大剝之候而體中真陰大傷未免因時而動動而太過則飛揚之虞不能不慮及之而目前所宜仍當從胃立法而從柔從潤未始不顧及陰分也用薛氏鹽降法加味海參生蛤殼川貝母荸薺橘葉朱茯神漂海蟄薏苡仁川百合鮮荷葉白粳米另卯刻服人參條一錢酉正服真濂珠粉五分十一診右關一部和緩有神不特飲食知味而夢寐亦安何快如之至左脈之弦亦和於昨此波平浪靜之時正休養生息之候慎勞動節飲食培植脾胃以扶初生之陰其在斯時乎於潛術雲茯苓川貝母麥冬肉上綿耆五味子人參條一錢煎湯送下前藥另燕窩二錢煎湯送下珠粉一分半晚服十二診腐肉能脫營衛和矣眠食能安臟腑和矣目前之病謂之已愈無乎不可何以昨日未申之交氣之升降失調脘悶自汗不能偃臥脈亦不調如是數刻自云素有肝氣逢節則發將交夏至似乎復發而其實非也夫舌苔濁厚而帶灰色胃中濕濁分明外見有證可據以有濕之胃而當濕令大行之時高年氣弱不能多運食物午後陽中之陰氣為陽劫則陰益弱宜其濁氣當權反劫正氣此即世俗所謂之痧脹也從此立方似乎見證治證之道廣藿梗醋製半夏赤苓豆卷蘇梗炙烏梅廣橘紅枳殼薄荷白粳米另吉林參鬚一錢煎湯過藥十三診用補從濕熱一邊著手隨補隨通濕去而正自復此東垣先生所以高於諸名家也而夏秋為尤宜昨日立方從此著想竟能安適夫病者自雲安適則真安適矣今既脈靜神怡陰生之節已在目前補氣調胃和平其制此際立方正無事求其奇也川貝母橘紅薏苡仁雲茯苓粳米漂海蟄大地栗香穀芽鮮荷葉另煎人參條一錢朝暮空心服十四診古人夏至之日有定心氣以待晏陰之成文此無他動則耗陽靜則生陰也養陰之道何獨不然寡言語以養氣慎思慮以養心陰從此日積月充目視多怪夢寐多勞等疾亦可因陰壯而安所謂陰能斂陽也用藥亦不外乎此酸棗仁鹽水炒朱茯神肥玉竹鹽水炒川貝母橘紅枇杷葉鮮荷葉粳米獺肝磨沖一分另煎人參條二錢空心不時服十五診脾宜升則健胃宜降則和便溏數次脾氣不和也宜其精神稍倦左脈帶弦右部略軟腹中隱痛必冷積留於腸間幸納食尚多胃氣尚和然高年當大病之後亦不宜多降擬錢氏參苓白朮散加味雲茯苓於潛白朮白扁豆陳皮懷山藥六神麯炮薑苡仁奎砂仁建蓮肉大棗另煎人參條一錢過藥十六診諸氣膹郁皆屬於肺諸腹脹滿皆屬於脾內經明文也太太從前膹郁之病已安昨日便溏而腹中脹痛豈非脾病乎夫便溏而兼腹痛雖屬脾虛必有積滯昨從錢氏法加入溫消之品腹痛已和便溏亦止胃氣亦調今晨左脈弦象稍減右亦有神目前論治統諸臟腑而權宜究須從脾胃著手以昨錢氏法去其溫消之品可也參苓白朮散加穀芽十七診諸恙向安而舌苔之灰色者亦淨胃中濁降可證宜乎飲食滋味較勝於前而昨晚少寐似乎心神不安理當從此著想揀棗仁青龍齒辰拌茯神川貝母柏子仁鮮首烏鮮荷葉白粳米總案太太之體先天至足之體也先天者何天一之水即命門之火道家所謂丹田關元醫家所謂元陽真火也此火足則氣旺而後陰生血長精神福澤有不能不過人者所以八旬之年而智慮常用然數年中操持耗陰寒暑耗陰老年悼子則更耗陰於壯歲尚多生長之機於老年生機漸少未免不足矣夫陰以陽為根陽以陰為宅既陰不足則孤陽少所維繫而有失所之虞睡後自覺奔走無定以昭其陰火之不斂也目中每見奇異以昭其精之不蘊也夫不足宜補一定之理而太太之體則有不易補陰者何則舌苔濁厚胸脘易痞居海虞常熟卑濕之地加以平日茶飲常多高年氣弱變而成飲濁膩有質之品已屬難投而況春夏令行正濕氣當權之日目前調理之法惟有補氣之中略加健燥以拂拭其胃中之濁待秋分之後燥令大行或可漸加陰藥而氣分之藥仍不可卻雖然論時論體不宜峻補倘如前神失精離之病日甚何可不補轉輾思維惟有珠粉之靈可以定心安神獺肝之靈可以養肝之神此補陰而不礙於濕者也抑更進者此後暑令日加惟有濕之人引暑於自然同氣相求之理喻西昌有言人不能避身中之濕何能避天地之暑而太太胃恆有濕之體其於暑之一門不能不加意焉夫暑之見證多端大約以口膩頭蒙胸悶噦惡皆其明證至治暑之方要不外去其引暑之濕古人立方如消暑丸香茹飲六和湯藿香正氣等法無不半雜燥濕祛濕之品其進而深者則有十味香茹飲清暑益氣湯清燥湯消暑十全散生脈散等此則寓扶正於消暑中者皆可因時採用不必泥定成方而心手間須活潑潑地蓋暑必傷氣斷無血分一藥則重濁之品不宜投可知而老年尤留意者又在養津液之所在即濕之所留去濕可也去液不可去濕不可過燥故藥當適用而不宜漫用喻嘉言有瘦人以濕為寶之論語似太過其於護液之道一片婆心殊可取也故用豆卷而不用茅朮用川貝而不用半夏用半夏而必須醋炒前人制法用藥盡情透露但未明言耳以上數條於夏季秋初調理之法似乎略備而秋冬不敢懸擬茲承主人厚意款待賢昆仲待愛過當屢以醫理下問夫空言無補何如實事為得即太太之病竭其愚衷書之以為芻蕘之獻惟主翁先生暨賢昆仲先生諒教不逮原注此熟邑恬莊楊元豐之如君也年八秩以外因所生員外郎病故悲哀而生腦疽其人瘦而多火又每日吃蓋碗茶六七盞胃有痰飲用藥頗難其病至三候方透膿出腐恰值小滿後起病看病在芒種時節適當太陰濕土司令時雨大作在濕飲之體屢致脘悶不適當時同道同看者又因膏粱富貴之家一味蠻補其中斡旋頗難蓋恐傷同道之情也兩次就診下榻近二十日方中組織斡旋處似乎煞費經營顧腦疽幾及三候根盤板滯膿水清稀神識時糊脈虛細數此正虛不能化毒毒反陷入於裡姑用扶正托毒望其轉機生綿耆全當歸赤芍西洋參連翹金銀花丹皮九節菖蒲調珠黃散二診腦疽最怕三陷變局謂火陷虛陷干陷也茲瘍經三候忽然面赤喘促肢冷汗出全屬少陰失藏真陽外越勢有孤城失守之虞王先生同議回陽救逆希僥幸於萬一川熟附片人參淡乾薑炙甘草白芍全當歸北五味子抱木茯神原注用溫藥以救脫急則治其標也劉偏腦疽自右延及於左三候有餘偏右穿潰膿少偏左木腫未腐頭頂平塌根腳散蔓此氣虛不能引血化腐成膿托毒外出高年殊慮內陷至舌苔白膩大便閉結在瘍科指為火毒內閉濕熱上蘊而用內疏黃連等法閲倪先生方案謂內夾雜氣邪伏膜原引用達原三消數劑異想超出尋常今大便已通舌苔稍化然右脈軟弱胃氣殘憊瘍不甚腫色不甚紅深恐陽變為陰大凡外瘍起發膿腐須賴元氣承載所謂元氣者衛外捍禦之氣胃中衝和之氣三焦升降之氣也虧則膿腐不克依期從此生變故黃耆為外瘍托毒之聖藥即兼別症再參他方古法有攻補兼施補瀉同用者拙見欲托毒必扶正生黃耆五錢當歸三錢赤苓三錢陳皮錢半藿梗錢半法半夏錢半香附二錢穀芽炒三錢殭蠶三錢二診腦疽將四候起發膿俱遲欲問真消息陰陽各半推陽多方是吉陰長便生危頂不高兮根不束皮不腐兮膿不足凡此皆因氣血衰順逆安危看結局乃若瘡流鮮血即為變陷之端況夫年逾六旬尤宜加謹為要蓋陰轉為陽僅百中之一二必膿透而根松方無忌而無慮茲當補托佐以疏通補其正而托其毒疏其氣而通其壅俾脹滿寬而加谷期瘍毒化而收功黃耆五錢當歸二錢制殭蠶三錢皂角刺三錢陳皮錢半川朴六分赤苓三錢法半夏錢半香附二錢錢對口疽初起一粒如椒根腳四面堅硬膿腐不透火毒未化高年犯此極易生變備方商用生綿耆全當歸防風鎊羚羊片大貝母鮮首烏制殭蠶連翹角針忍冬藤周對口疽幾及兩候膿稀根硬煩躁噁心濕熱壅於胃火毒不得外泄漸有神昏之變川毛連製半夏黑山梔連翹枳殼廣鬱金竹茹王對口疽膿未透徹用方急於補托火毒不能外泄而反瀰漫於中中宮漸增痞悶嘔惡子和云虛而不補無害實而補之禍生蓋虛者不補尚藉穀氣滋培實者補之反助邪威也經云營氣不從逆於肉裡乃生癰腫又云膏粱之變足生大疔是瘍門扼要語茲瘍旬日僅一更衣脈滑數舌白膩皆濕熱壅遏之象用苦辛宣達冀其表裡宣通庶免邪陷神昏變端瀉心湯合溫膽湯加杏仁栝蔞仁二診苦辛宣越能降能通今嘔平便解和中解毒為是製半夏錢半大豆黃卷二錢連翹三錢淡黃芩二錢金銀花三錢甘草五分白蒺藜去刺三錢鮮荷梗去刺五分某對口生疽足根發疔此二處皆屬太陽膀胱之絡濕熱內聚風熱外侵致生此證勿得輕視羌活錢半防風錢半連翹三錢歸尾二錢五分萆薢三錢鹽水炒土貝母三錢乳香沒藥各五分銀花三錢甘草梢五分桑枝五錢酒炒孫玉枕疽已逾三候膿泄不暢腐肉未脫大便溏薄脈形遲細法以補托冀其膿透腐脫為妙潞黨參三錢甜冬朮二錢陳皮錢半殭蠶三錢粉歸身錢半生黃耆四錢淨角針三錢穀芽三錢二診玉枕疽及四候根稍突膿稍透脈遲細元氣虧溫補法理無違前方去穀芽加川芎八分丹皮炒錢半金銀花二錢生甘草五分三診玉枕疽已經月餘頭頂僵突不膿不腐有刺如豎肉此乃肝火鬱結血燥不能化腐成膿防有翻花之變羚羊片錢半殭蠶三錢全當歸二錢赤芍二錢生甘草五分左秦艽酒炒三錢大貝母三錢銀花二錢粉丹皮炒錢半夏枯草三錢大頭瘟抱頭火丹魏先痛而後腫者自氣分傷及營分咳逆頭脹餘邪尚留於隧道未全入絡可知夫肺主一身之氣化氣機利則關節咸利氣機痹則脈絡俱痹斯謂治病之大綱是宜從事氣機矣薄荷葉五分蘇梗三錢杏仁三錢打牛蒡子三錢杵橘紅一錢製半夏錢半廣鬱金錢半枳殼錢半金銀花三錢王風火襲入三陽頭額焮腫而為遊火丹毒證方初起舌白不幹發熱惡寒先從解表立法普濟消毒飲去黃芩黃連二診腫勢愈甚惡寒已除脈來弦數右大舌苔微黃風溫兼夾痰食已入胃中防其化燥神昏前方加芩連神麯羚羊角半夏三診病已及候頭面滋水淋漓而五日不大便脘痞苔黃脈沉按之而實溫邪外郁化火而內結也當乘勢逐之前方加制軍三錢芒硝錢半四診便解神清邪已外內俱泄善後之法清滌餘邪金石斛三錢川貝母二錢栝蔞霜錢半豆卷三錢黑山梔三錢天花粉三錢穀芽三錢連翹三錢丹皮三錢原注虛加人參實加大黃鬢疽面顴毒某鬢疽屬少陽肝膽風火而成古方用柴胡清肝湯今時改用荊防活命飲亦效然須避風為要荊芥防風黑山梔甘草節天花粉金銀花角刺連翹大貝母桑葉蘆根陸面顴毒乃陽明鬱火所結今已穿潰孔如豆大雖比顴骨疽較輕然收功亦遲須忌一切發風動火之物羚羊角三錢白芷五分茯苓三錢辰拌土貝母三錢廣皮錢半黨參三錢連翹三錢丹皮錢半銀花三錢甘草五分骨槽風牙咬癰陶形寒脈遲細頰車堅腫牙關緊合不開此陰虧絡空寒邪襲入盤踞不出久則竟難驅化治當於溫通散寒之中搜其錮結之邪陽和湯加漂全蠍三錢制殭蠶三錢二診熱則筋縱寒則拘急昨投陽和之劑而牙關和再劑而面轉紅一若春回寒谷陽氣融和者是誠佳兆再從前法加減前方加刺蒺藜骨碎補許肝膽鬱火凝結成痰腮頰硬腫牙關不開此骨槽痰也脈象郁澀氣失利暢藥力不易見效宜自怡悅為要柴胡四分黑山梔三錢香附二錢鹽水炒秦艽三錢酒炒制殭蠶三錢丹皮錢半炒石決明先煎一兩土貝母三錢鬱金錢半骨碎補三錢刺蒺藜去刺三錢鉤鉤錢半王寒痰凝阻頰車不利高而腫硬色白不紅此屬陰寒骨槽與色紅身熱者不同大熟地麻黃桂枝秦艽防風制殭蠶當歸白芥子詒按此病挾肝火者十之八九此獨不然於此可悟辨證之不可膠執也某肝陽內郁風冷外侵寒與火搏牙關緊閉不開痛掣耳中鬢頰症屬牙咬形寒身熱防變骨槽勿輕視之牛蒡子薄荷連翹制殭蠶大貝母桔梗秦艽鉤藤甘菊桑葉二診牙齦腫而不堅腐而不潰脈形虛數日晡微熱此屬血虛肝鬱木火上升略兼外感而發前方解散表邪已退今擬養營熄風潛陽為治仍宜避風為要細生地四錢川石斛三錢甘菊一錢刺蒺藜三錢石決明五錢女貞子三錢天麻一錢麥冬三錢丹皮一錢半桑葉一錢某肝膽風陽上逆乘襲陽明胃絡牙齦腫痛上引頭角下連頸腮筋中皆牽掣而痛此即肝風入絡也最屬奄纏鮮生地羚羊角山梔玄參天麻鉤藤石決明川石斛秦艽丹皮桑葉某陰虧鬱火上炎牙齦結腫堅硬延及一載有餘恐至牙岩之變犀角鮮石斛大貝母玄參制殭蠶桔梗連翹丹皮蘆根某陽明熱毒上攻逆走少陽結成牙咬潰膿面頰腫脹神識時糊此係正虛瘍毒內陷極險之症必得熱退神清飲食能進始可登岸否則恐難挽救金銀花一兩甘草五錢馬料豆二兩緑豆二兩蘆茅根各二兩煎濃湯磨沖犀角汁一錢調下琥珀蠟礬丸胡素稟陰虧火亢風陽易於上擾近感時令風溫引動肝膽之陽挾痰入絡阻襲少陽陽明牙關堅急不開左頰結塊焮腫近世謂之託腮牙咬即古所云時毒是也現今懷孕八月乃手陽明經氣養胎診脈弦數舌苔白口中膩咽喉痛厥陽痰濁風溫三者雜合為病夫風溫宜祛之外散厥陽宜使之內平痰濁宜化胎氣宜安蓋病邪龐雜藥必兼賅自當內外施治非處方之冗雜也牛蒡子射干羚羊角鉤藤薄荷川貝母橘紅石決明桔梗刺蒺藜制殭蠶蘇梗連翹淡芩砂仁桑葉外用三角楓煎湯熏一熏即效高牙咬癰色白而脈細弦身微寒熱此寒痰阻於關竅略感風邪所致治以辛溫解散桂枝三分細辛三分防風錢半羌活錢半秦艽三錢荊芥穗錢半薄荷葉五分鉤鉤錢半制殭蠶三錢冬桑葉錢半褚牙咬癰身熱頭脹大便不通已經五日濕熱未化結聚陽明宜表裡雙解玄明粉八分西寧大黃三錢生甘草五分黑梔錢半牛蒡子三錢杵大連翹三錢薄荷錢半淡芩二錢川萆薢三錢鹽水炒白桔梗八分牙疳牙漏沿牙毒牙宣劉暑邪熱毒走入營中遍身紫黑藍斑鼻血齦腐此發斑牙疳之險症也倘至壯熱神昏不可挽矣犀角片羚羊角連翹鮮石斛銀花黑山梔淡黃芩蘆根丹皮鮮生地詒按此證於清營中宜稍參疏透之意周肝經鬱火乘犯陽明牙齦癢痛出血而發牙疳舌紅碎裂頭眩心煩營陰內虧而納穀氣撑又屬脾氣虛餒也猶幸大便燥結可用清滋先平其炎上之火羚羊角三錢鮮生地八錢鮮石斛三錢玄參二錢麥冬二錢茯苓三錢石決明一兩女貞子三錢棗仁三錢詒按立方專於養陰熄肝愚意再加廣皮雞內金以健運脾氣似更周到丁牙為腎之餘齦為胃之絡齦爛而出血齒黑而動搖頸間結痰核身熱日久此乃先天之水不足後天之火有餘清胃玉女二方似乎近理然而久熱不已不獨在乎牙疳殆即腎疳重損之根非易治也胡黃連生西洋參冬朮地骨皮白桔梗淮山藥六神麯砂仁扁豆生甘草廣陳皮雲茯苓安牙疳腐爛出血延日已久是陽明有濕熱也擬用清胃散加味川連升麻全當歸連翹肥知母丹皮淡芩象貝生甘草蘆根龐牙齦滲膿三載不愈此屬牙漏腎虛胃有濕熱所致六味丸三錢資生丸三錢相和每朝服四錢淡鹽湯送下詒按六味補腎固佳資生清濕熱似嫌力量不到某此病並非陰症乃風痰入絡也周身肌肉跳動曰風有一二處隱痛色白不甚腫者曰痰至於牙齦出膿久而不愈曰牙漏亦痰與火為患也淺學之流烏知及此漫云陰症豈不可笑余擬一方能效然不能速半夏一兩刺蒺藜一兩茯苓一兩烘制殭蠶一兩昆布一兩洗大貝母一兩風化硝三錢全蠍稍二錢酒洗炙共研末用竹油一茶杯薑汁半酒杯泛丸劉平日豪飲胃濕必甚去冬齦腫咳嗽仍不節飲以致音啞齦腐蔓延及唇此沿牙毒也雖非牙岩之比然亦不易收功用甘露飲子加減鮮生地六錢淡芩二錢莧麥冬二錢葛根一錢雞距子三錢西茵陳錢半赤茯苓三錢蟬蛻五分二診沿牙毒延爛及唇更兼咳嗽多痰肺胃兩經濕熱極盛病來日久藥難速效川連四分鹽水炒杏仁三錢去皮尖川貝母三錢北沙參三錢廣鬱金錢半莧麥冬三錢川石斛三錢雞距子三錢蘆根五錢去節胡少陰腎水不足陽明胃火有餘牙宣出血晡時微寒壯熱而其脈極細此素體之陰虧也當憑此論治用景嶽玉女煎生地知母牛膝川連石膏麥冬薄荷蘆根詒按此證之脈細想系素稟如是若云陰虛未必脈細也總之須見證確可據乃可舍脈從證未可冒昧以將事也舌疳舌岩某舌根邊僵木不痛已經數月防變舌疳此屬心脾鬱火治以清養營陰稍參苦降鮮生地川連玄參丹參麥冬生甘草丹皮桔梗二診川連三分蒲黃一錢冰片二分五靈脂一錢人中白四分煅共研細末吹舌根錢心脾鬱火上炎舌根牽強而碎延來三月防變舌疳非輕證也細生地三錢川雅連五分肥知母二錢麥冬錢半鮮金石斛四錢遠志肉二錢馮白帶三年陰津下脫坎水不能濟離火震陽隨之上炎舌左碎腐舌心乾涸皆津液枯涸之象宜戒操勞以養心絶思慮以安神加之藥餌尚可望愈否則變成岩菌殊可慮也酸棗仁遠志連翹川石斛麥冬肉竹葉鮮蘆根薛舌根強硬已經數月防變舌岩川雅連五分連翹三錢玄參二錢廣鬱金錢半鮮石菖蒲三錢茯神三錢黑山梔三錢川石斛三錢甘草五分蘆根五錢鼻淵鼻痔鼻衄尤膽熱移腦為鼻淵肝熱移肺為鼻痔病根日久難以卒效羚羊角三錢丹皮錢半黑梔三錢甘菊錢半玄參二錢辛夷二錢蒼耳子三錢石決明一兩另用雄黃月石冰片研末搐鼻詒按耳菌鼻痔均屬外證須另用專方治之先生長於外科故用藥自然絲絲入扣金膽熱移腦辛頞鼻淵鼻淵者濁涕下不止也久而不已傳為鼻衄防其目暗無光烏犀尖八錢先煎京玄參三錢辛夷二錢鮮生地八錢洗切生錦紋大黃四錢石決明八錢先煎蒼耳子三錢丁血熱妄行鼻痔而兼鼻衄大補陰丸治其本四生丸治其標鮮生地側柏葉荷葉蘆根另大補陰丸附鼻痔方藜蘆三錢細辛三錢皂礬三分麵包煨輕粉三分大方八一粒炙生礬三分皂莢子一粒炙杏仁三錢另研雄黃三分甘遂三分麵包煨桃仁二粒另研上藥共研細末用蜜杵和捻作條子塞鼻孔內耳癰耳菌麋陰分下虧肝陽上冒肺胃被灼鼻塞不通顴旁高凸按之無情頭脹耳痛時作時止證由七情內傷擬熄風育陰潛陽鎊羚羊大熟地石決明全當歸白芍阿膠川牛膝鉤鉤二診茹素津枯肝風易動化火上逆阻絡傷營今耳癰已成牙咬緊結腫繞於外耳竅放血時發時止仍以育陰和陽熄風為治蓋陰足則肝木平乙癸同源也大補陰丸加羚羊片莧麥冬白芍丹皮石決明鉤鉤某耳中久已潰膿今則繞耳紅腫連及腮頰此風熱之邪乘虛而入症勢來暴防其生變羚羊角牛蒡子薄荷大貝母鉤藤連翹丹皮金銀花桑枝唐七竅皆通此症生於耳中深底故膿從上齶鼻孔而出然痛在耳中仍屬耳癰脈虛頭眩心嘈從肝虛風陽上逆治之細生地甘菊茯神天麻石決明穭豆皮玄參鉤藤丹皮桑葉某風毒內攻入腦走入耳竅疼痛出膿膿出不爽盤及耳後頸間硬腫不消此盤耳癰也已延兩月證無頭面牙關不痛恐滋蔓骨槽等變殊非易治羚羊角玄參磁石甘菊花細生地牛蒡子制殭蠶菖蒲鉤鉤蔥白頭錢鬱怒傷陰木火上乘竅絡耳生息肉名曰耳菌最屬奄纏久久不已防有血出翻花之變生地四錢丹皮錢半北沙參三錢玄參錢半遠志三錢鉤鉤二錢羚羊角三錢石決明一兩先煎刺蒺藜三錢滁菊錢半另用藜蘆腰黃硇砂上三味皆少許為細末點入耳中立效喉癰喉疳喉痹趙咽喉腫及上齶的屬喉癰湯水難咽痰多便閉症交四日邪火熾張秀翁主以清化滌痰極是鄙意竟用涼膈散通徹表裡尤為簡淨仍候裁正涼膈散牛蒡子桔梗蘆根沈鎖喉癰生於結喉之上咽喉之下視之不見脹塞不通湯水難進極為險重急以化痰宣竅開通肺氣方法射干一錢牛蒡子三錢杵殭蠶三錢薄荷錢半荊芥三錢山豆根一錢桔梗八分貫仲三錢洗生甘草五分茅蘆根各五錢吳暑熱蒸迫心火暴甚喉舌腫痛及今旬日勢防成膿用涼膈散加犀羚解上焦以泄君火之燔牛蒡子犀角連翹焦山梔生大黃水浸大貝母玄明粉竹葉蘆根薄荷某喉疳腫腐飲食難進外熱不揚大便不通熱伏於裡症勢非輕鮮生地栝蔞仁枳實玄參川石斛大貝母山豆根桔梗蘆根鮮薄荷根朱體質陰虧兼染穢毒咽喉碎腐已逾兩月此屬肺毒喉疳極難速愈現今痛而難咽又夾溫邪身熱頭脹暫與清解牛蒡子薄荷桔梗生甘草淨連翹玄參金銀花川石斛方肺毒喉疳蒂丁爛去聲嘶音啞川貝母三錢防風錢半全當歸三錢制南星錢半製半夏錢半桑螵蛸三錢天花粉三錢白芷五分金銀花三錢土茯苓一兩賀喉疳腐爛脈數不揚眉心不開肺氣內閉深慮喘厥之變炙麻黃三分杏仁三錢打甘草五分生石膏八錢先煎淨射干一錢山梔錢半蘆根去節五錢楊一陰一陽結謂之喉痹一陰者厥陰也一陽者少陽也相火寄於肝膽君火一動相火隨熾上炎灼金喉痹之症作矣鮮生地四錢玄參錢半麥冬錢半焦山梔三錢大熟地四錢石決明八錢沙參三錢桔梗八分生甘草一錢穭豆衣三錢梨肉兩大片汪內經云一陰一陽結謂之喉痹指少陰君火合少陽相火上逆而為病也病由內生非關外感風溫故治之不易速效養陰降火化痰每相須為法惟嫌脈息太細系素稟六陰真陽不足然清藥亦宜酌用恐陰未足而陽先傷耳慎之沙參石決明白扁豆玄參懷山藥蛤殼川石斛生甘草茯苓川貝桔梗另玄明粉一錢硃砂五釐冰片二分研細末吹某始由肝腎不和久進溫通之劑肺胃液傷氣火上逆症成喉痹金不制木木盛化風風陽入絡頸項筋急擬清金平木生津降火北沙參麥冬馬料豆鉤藤川石斛石決明天花粉生草玄參雪梨肉某鬱火喉痹每數日則一寒熱是火鬱之證也鮮生地山豆根麥冬玄參馬勃射干玄精石桔梗知母滾痰丸五分二診咽喉之紅色已退痹痛亦減惟寒熱之勢仍然數日一來肝膽之鬱火未清再宜清泄鮮生地玄精石知母射干玄參麥冬黑山梔龍膽草蘆根滾痰丸五分華陰虛內虧肝火上亢遍體節骱痠疼喉痹燥癢頭面頸背發瘰怕見日光且惡炎熱此皆本原之病勿得輕視羚羊片錢半大生地五錢麥冬肉三錢丹皮錢半知母錢半京玄參三錢苡米仁五錢天門冬三錢川石斛三錢龜板三錢二診陰虧火亢喉痹骱痛膚癢怕熱擬大劑養陰大生地八錢川柏片鹽水炒一錢地骨皮三錢敗龜板二錢肥知母錢半麥冬肉三錢玄參三錢川貝錢半羚羊片錢半另川百合一兩煎湯代水痰癧馬刀失榮王痰癧自周歲而起蔓延日久至八九年來而後潰潰爛至今又將一載不能收口前在缺盆之下後連肩膊之間脂水常流皮肉不相裹著此濕熱久居於經絡乃至榮衛之行失其常度不能溫分肉充皮膚以致肌肉相離而不相著殊非細故矣然則內補氣血兼化痰濕更兼忌口再以藥外敷之冀其皮肉相裹著脂水無容留之地然亦非旦夕可圖也生黃耆四錢軟白薇錢半製半夏錢半歸身錢半廣皮錢半桑枝酒炒五錢炙甘草五分雲茯苓三錢另生半夏三錢生南星三錢乳香沒藥各三錢紅曲三錢上藥研末和黑靈散一兩每日三錢醋調敷附黑靈散方牡蠣粉虢丹硫黃研各一分露蜂房銼二分上藥同炒令煙盡研末入發灰一分元寸少許和勻敷之熊痰癧二載自頸延脅或已潰或未潰或潰而不斂或他處續生纍纍然如貫珠如疊石潰後色黑而膿稀外軟而內堅診脈不甚虛飲食尚可細詢病由氣鬱而起鬱則肝膽三焦之火循經上走於絡結成痰核核之小者為癧大者為痰收功非易必放開胸襟曠觀物理乃佳夏枯草五錢昆布三錢山茨菰三錢遠志甘草湯煮三錢玄參三錢川貝二錢歸身二錢天葵草三錢香附一錢五分功勞葉二錢詒按此病也與失營證相類幸脈實能納故用藥專從痰火著想某先天元氣不足胎中伏毒因虛竄絡頸項結核或已潰或未潰或潰而不斂兼以耳聾鼻塞腦門遇陰雨則脹痛咳嗆牙關不利皆陰虛陽亢毒邪上蒙清竅之見端也若徒治其虛伏毒何能宣化擬養陰化毒北沙參三錢花粉三錢當歸三錢海螵蛸三錢仙遺糧三錢川貝二錢防風一錢五分銀花三錢穭豆衣三錢珠粉一分血珀五釐西黃五釐詒按鼻塞腦痛皆餘毒內戀之象擬再用化毒丹佐之張陰虧火亢繞頸生痰生癧寒熱似瘧而實非瘧也少陰水虧不能涵木少陽火亢更來灼金金木交戰乃生寒熱飲食少脾胃弱慮延勞損六味地黃湯牡蠣黨參麥冬柴胡白芍五味子詒按方以六味滋腎生脈保肺合柴芍以清肝立方周到尉帖愚意擬去溫肝之萸肉再加清膽之芩茹榮頸項左右發出瘰癧驟然而起延今半月有餘手足有丹毒鼻孔且腫痛此必有熱毒阻於經絡大抵在手太陰足陽明二經致病之由或觸染穢惡而得之或誤食毒物而得之均未可知然其為熱則一也方書有鼠癧螻蛄癧之名此症類似今且清其熱毒再議金銀花夏枯草大貝母天葵草甘草丹皮連翹玄參鉤藤桑葉二診女子以肝為先天肝血虧則木火易熾木火熾則津液燥結阻於經脈而成瘰癧瘰者纍纍然如貫珠癧者歷久而不易愈者也故曰瘰癧逍遙散加減主之柴胡三分鹽水炒大生地四錢玄參三錢牡蠣三錢煅歸身一錢半白芍一錢茯苓三錢川貝母三錢夏枯草三錢三診前用解毒清肝之劑痰核未見消散據述素有鼻衄不時舉發體質陰虧陽亢已露一斑然則誤食毒物之説或者其然而所以結核成痰之故究系陰虛於下陽浮於上今擬清肝兼舒其鬱蓋痰無郁不生耳羚羊角石決明夏枯草丹皮玄參穭豆皮柴胡女貞子大貝母細生地天葵草陸本原不足兼挾風溫微微寒熱頸間結核成痰二十餘日不紅不腫不消散亦不作膿是半虛半實證慎柔方有良法用四君子加牛蒡子世所未知余曾驗過四君子加牛蒡子象貝桑葉淵按四君補虛佐蒡貝以消風痰桑葉清肺通絡從補虛中想出祛邪之法心思靈敏詒按四君補虛加蒡貝以消風化痰桑葉以清肺通絡虛實兼顧絶不犯手二診昨用慎柔方是托散法服下若汗出熱退則數劑可消若汗不出仍發熱則數劑成膿膿成穿潰不易收功前方加鉤鉤某三歲孩童但哺乳汁不進穀食脾胃虛弱可知頸結痰核初起寒熱必挾風溫屬半虛半實今將一月熱退而其塊不消不作膿大便溏脾胃不足氣血兩虛黨參三錢冬朮二錢陳皮錢半荊芥錢半黃耆五錢歸身二錢防風錢半葛根錢半砂仁五分二診立齋云外瘍經久不消散亦不作膿氣虛也徒用攻消恐無所益黃耆四錢黨參三錢歸身三錢澤蘭葉二錢川山甲三錢殭蠶三錢丹參錢半廣皮錢半桑枝五錢孫體質陰虧火亢兼感風邪風火相搏襲入少陽膽絡耳下頸間結核成痰此虛中夾實之症也法當養陰清火疏風化痰細生地玄參薄荷象貝母連翹殭蠶丹皮荊芥鉤鉤冬桑葉秦陰虧肝鬱營分有熱兩足脛紅頸結痰核心跳頭暈用逍遙散加味大生地三錢全當歸三錢細柴胡五分黑山梔錢半焦白朮錢半東白芍二錢川黃柏錢半象貝母三錢生甘草五分天葵花錢半茯神三錢京膽星一錢薛營虛肝鬱頸結痰核潰者未斂堅者不消脈數食少有時嘔惡此脾胃氣虛也慎勿漫進苦寒消痰之藥當以益氣養營為主冀其嘔止熱減為妙欲圖速效斷斷不能黨參三錢半夏曲一錢陳皮八分川貝母一錢半歸身一錢半酒炒白芍一錢半炙草三分麥冬一錢半茯苓二錢玉竹三錢炒青蒿一錢半竹茹五分水炒十大功勞葉三錢蜜炙某瘧久陰傷項發痰核頭傾不舉腹中有塊年逾二八天癸未通慮延勞損大生地制首烏茯苓丹皮懷山藥軟柴胡白芍當歸陳皮十大功勞嚴衝脈隸於肝腎女子以肝為先天及笄之年癸水未通頸項虛痰纍纍骨蒸晨汗血枯肝鬱現象勞瘵之根萌也局方逍遙散為女科聖劑大意重在肝脾二經因郁致損其方下云養血以潤之指歸芍也培土以生之指朮草也佐柴胡以升春生之氣令木氣敷榮即內經木鬱達之之義但久瘍速效難期必得天癸通行病根斯拔逍遙散另天王補心丹每朝服項痰之標為火痰之本為濕前哲謂流痰瘰癧雖則同源而有陰陽之別陰虧陽亢則生癧核脾虛濕滯則病虛痰此證是矣治宜崇土以運濕徒用攻消無益也生黃耆四錢歸身片二錢東白芍二錢焦白朮錢半製半夏錢半廣陳皮錢半苡仁三錢雲茯苓三錢唐物以乾元資始人以脾胃資生稚齡陰氣未充當以後天為本倉廩充足關閘不徹胃陽振而化液脾陽運以生津津液充則形體自肥不治虛痰而虛痰自愈歸芍六君子湯某兩目內眥肉脹而有紅絲此屬水虧火亢左耳上結核如雞蛋色不變而堅硬脈形小弱帶數症屬虛痰用壯水制陽兼以咸降六味丸加蛤殼牡蠣制殭蠶天葵草大力子另用雞蛋一枚全蠍一隻酒洗入雞蛋內飯上蒸熟去全蟲食雞蛋每日一枚某陰虧肝亢頸發虛痰頭髮疳瘡腹中時痛木乘脾土故也仿薛氏法柴胡三分當歸一錢半炒丹皮一錢黑山梔一錢半冬朮一錢半砂仁五分茯苓二錢炙草三分香附二錢丸方大生地四兩茯苓三兩山藥三兩川貝母二兩女貞子三兩棗仁二兩歸身二兩丹皮一兩五錢甘菊一兩萸肉二兩牡蠣一兩茜草一兩烏賊骨一兩共研末蜜丸每朝湯下二錢鄒按脈空虛色白不澤跨凹胸脅之間素有瘰癧如貫珠夢遺滑精已經數載今腹脹如鼓上氣喘逆兀坐不能睡臥此水泛土潰以凌金下虛上實之候也惟水愈深者火愈衰欲利其水先溫其火欲歸其氣必攝其陰果能吸受之地完固狂瀾滔天之勢自止矣所慮者病深氣竭竊恐藥難奏效為棘手耳然極重之候豈容袖手旁觀大熟地三錢淡蓯蓉三錢子沉香五分川牛膝錢半青皮錢半甘杞子炒三錢紫衣胡桃肉去穰五錢另金匱腎氣丸三錢淡鹽湯送下某心火與濕熱交結而成痰核上則舌下中則脘間下則陰頭皆結小核如棉子此皆火鬱之所致川連二錢酒炒陳皮一兩鹽水炒甘遂三錢麵包煨去心半夏一兩五錢茯苓二兩澤瀉一兩蛤殼二兩研粉紅芽大戟三錢洗淡炒上藥共研細末水泛為丸每朝一錢開水送下霍痢將一載脾胃兩虧加以情懷鬱勃肝膽氣火上逆而發馬刀殊非小恙不可忽視炒黨參三錢焦白朮錢半細柴胡五分清炙草五分大貝母三錢東白芍二錢白蒺藜去刺三錢歸身二錢丹皮錢半茯苓三錢曹七情鬱結痰火上逆入於肝膽之絡頸項結核大者堅硬如石小者如梅如李此失榮證也舌根強飲食嗆肺胃津枯心肝火亢又將舌岩矣此證在法難治須自怡情安養庶幾帶疾延年鮮石斛八分黑玄參三錢羚羊片三錢淨鉤鉤錢半川貝母三錢丹皮炒錢半生蛤殼三錢雲茯苓三錢石決明五錢雪梨肉兩大片鮮竹茹三錢發背腎俞發腎俞痰某營行脈中衛行脈外體肥濕勝之人衛恆虛冷營多盛熱故肥人當暑往往肌膚常冷而易生外瘍也瘍發背脊三候內膿已結外腐未透營中之火極熾衛弱失於敷布不能引血化腐載毒外出漸顯內陷之機頗為可慮非溫不能助衛陽以鼓舞非清不能解營熱以化毒經曰血實宜決之氣虛宜掣引之此法是矣生黃耆四兩切碎用附子二錢煎汁拌干金銀花三錢炙甲片四錢制殭蠶五錢地丁草三錢大連翹三錢角針劈四錢淡黃芩三錢鮮生地一兩洗切另用三角楓薰之二診進杜撰法皮膚紅腫而腐何其快也服之膿未暢出者當須半制其劑以繼之此種外瘍須用刀穿之毒始外泄前方黃耆附子分兩減半三診瘡已高腫用刀猛力破之膿出盞許毒得外泄從此理其脾胃調其心志可以無憂參鬚六君子湯加穀芽笪瘍不依期而透根高頂陷膿稀不腐毒未外泄氣血已傷正虛不能引血化腐為膿慮有火毒反陷入營神昏痙厥之變重證也姑擬清營泄熱冀其轉機羚羊片鮮首烏金銀花牡丹皮制殭蠶淨角針連翹殼塊滑石穆瘍發極大膿去過多精神憊敗脈數無神脾胃困頓其勢甚險亟宜扶正托毒猶恐鞭長莫及吉林參二錢云茯神三錢川石斛三錢制首烏三錢白芍藥二錢廣陳皮錢半另穀芽一兩煎湯代水秦曲運煩冗心陽暗亢氣血怫逆乃生大疽方書雖有陰陽之別指人之體質而言論病不外乎火毒但有虛實之分耳經云諸痛癢瘡皆屬心火今以癢為虛以痛為實則又似是而非夫羌防升散黃耆固氣適足以增炎而固火火毒不得外泄而反陷入於營中致有煩躁之患脈來太旺亦非高年所宜按背疽條例最怕三陷變局此證膿稀根硬煩渴乾噦慮有火陷之險徐先生方極是但甘寒之品僅泄陽明之火混處血中之火猶恐未能遽化鄙意佐入芳香以宣內竅未識以為然否犀角地黃湯化下牛黃丸二診背疽旬日煩躁膿稀昨遵正翁方法佐入芳香清營泄熱之中微逗宣化之意今膿稍多而煩略減其營中伏熱似有外達之機但根堅不化未可以為無事也備方候裁鮮生地六錢金銀花三錢淨角針三錢黑山梔錢半淡黃芩二錢連翹殼三錢丹皮錢半殭蠶三錢劉腎俞漫腫色白脈虛微熱此腎俞發也屬三陰虧損濕熱入絡氣血凝滯而生最為奄纏姑與消散法當歸防風杜仲秦艽金狗脊胡桃肉丹參廣皮萆薢獨活桑枝李腰為腎俞腎俞發痰腎虛可知腎為肝母母病及子子病則侮其勝而脾胃受戕舌苔白膩胸痹嘔噦等證見也擬用苦辛甘立法化胃之痰膚脾之弱泄木之強從金匱見肝之病當先實脾之意所謂苦以泄之辛以散之甘以緩之是也川毛連薑汁炒五分淡乾薑五分吉林人參二錢炙甘草五分橘紅一錢製半夏錢半薑汁炒竹茹二錢茯苓三錢二診先哲謂肝病宜疏腑病宜達以通為補昨遵是議用苦辛甘藥泄肝和胃已得小效仍宗前法漸次調理俟中原病復然後下趨坎藏壯水之主庶幾水足而木自平所謂思惟北征宜先入南兵法如是醫法亦何獨不然前方加益智仁錢半白蔻仁八分金腎俞痰由肝腎精血衰微絡脈空虛而發是外證中虛損也潰膿以來調治三月頗有向愈之象最為可喜無如每交節令必發寒熱脈弱無神面色萎黃即使外證功尚難恃而況膿水淋瀝多此空竇暗損其津耶擬補益真元治內即所以治外如仍罔效則非所敢任人參條二錢炙綿耆四錢歸身炒二錢東白芍二錢厚杜仲鹽水炒三錢川斷肉鹽水炒三錢菟絲子鹽水炒三錢潼沙苑三錢胡桃肉去隔五錢某前年産後勞力驚恐受傷以致腿股痠痛延今一載有半結瘍成膿膿從腰脊而出此屬腎俞虛痰不易收功頗易成損非補不可大熟地白芍冬朮胡桃肉杜仲上黃耆歸身黨參鹿角霜杞子臑癰手腕毒鼓槌流痰石臂後內臁漫腫筋中痠痛而難動初起陡然寒熱此暑濕入於少陰太陽二經名曰臑癰又曰藕包毒法當清二經之火身懷重孕用藥勿礙胎可也鎊犀角三錢黑山梔三錢生甘草五分牛蒡子三錢廣鬱金錢半連翹殼三錢鮮生地五錢淡芩二錢桑寄生酒炒三錢鮮忍冬藤三錢王濕火入絡手之外腕及足跗指皆腫痛而紅兩脈洪大轉數擬清絡熱方法羚羊片三錢川毛連四分鮮首烏五錢全當歸二錢川黃柏鹽水炒錢半川萆薢鹽水炒三錢左秦艽三錢防風錢半川牛膝錢半絲瓜絡錢半趙脾虛濕熱入絡兩手指節手腕皆木腫此乃鼓槌流痰不易速愈黃耆白朮防風秦艽川貝母當歸茯苓某鼓槌多骨流痰膿孔甚多手掌及腕皆腫硬而色紫不痛已出過多骨出骨之處已斂而餘外仍腫此風毒濕熱錮結手經延來五月收功不易當歸防風苡仁丹皮連翹廣皮生甘草紅花桑枝另蜣螂蟲炙五錢研末摻乳癰乳頭風乳痰乳癖乳岩某先嘔而口甜膩後惡寒而身熱乳房結核腫痛而髮乳癰此陽明蘊熱後兼外感入於胃絡所致生石膏三錢打桂枝三錢白薇三錢蒲公英三錢橘紅一錢蘇梗一錢半薑炒竹茹八分白蔻仁四分研沖顧胎前乳癰延至産後一月有餘滿乳房腫硬傳瓤不易收功上黃耆三錢當歸二錢茯苓二錢金銀花三錢蒲公英三錢陳皮一錢制殭蠶一錢半連翹二錢橘核三錢打砂仁五分任妊娠六月陽明養胎陽明虛厥陰橫乳房結腫雖經潰膿堅腫不消最有傳瓤之纍焦白朮枳殼青皮炙甘草制香附蘇梗淡黃芩栝蔞皮徐乳房結核堅硬雖皮色不紅而推之鬆動此非乳痰仍屬乳癰肝鬱所致身微寒熱防滋蔓難治柴胡五分鹽水炒當歸三錢白芍二錢黑梔錢半川貝三錢香附二錢栝蔞皮三錢另金針菜炙脆三錢射干炙三錢皂莢子炙三錢研末分三服飲酒者酒下否則砂仁湯下詒按煎方用逍遙散亦通套方也好在有末藥以佐之再診乳癰已潰寒熱亦止第余塊未化惟和其氣血調其鬱結而已當歸白芍香附川貝遠志砂仁丹參貝木喜條達條達則敷榮土喜疏通疏通則潤澤條達之性失則鬱而成火疏通之性乖則聚而為濕乳頭濕瘍成焉此無他乳房屬胃土乳頭屬肝木治以泄肝和胃川楝子酒炒三錢青陳皮同炒各錢半製半夏錢半春砂仁五分雲茯苓三錢王素體營虧肝火暗動近來寒熱乳頭結腫略硬此屬肝鬱不舒氣血不和所致且以舒郁和肝川楝子酒炒三錢杜橘核炒打三錢東白芍炒二錢生甘草五分青皮錢半貝母三錢歸身炒二錢蒲公英三錢淨雙鉤二錢連殼砂仁五分後下二診心脾營血內虧肝家氣鬱不舒前方舒郁和肝故乳頭之腫硬已消而頭眩骨痛心蕩等症仍然今以調養心脾之郁兼佐和脾化濕西潞黨三錢當歸身二錢東白芍二錢春砂仁五分制香附二錢青皮錢半象貝母三錢金鈴子二錢潼沙苑三錢棗仁三錢金毛脊酒炒三錢茯神三錢另歸脾丸三錢清晨服用桑枝膏湯送下盧乳頭風得鬱則癢吮乳則痛漫無愈期生黃耆五錢金銀花三錢全當歸三錢甘草節一錢東白芍二錢蘇梗三錢蟬蛻五分蜣螂蟲三隻甜白酒一斤煎藥某肝鬱結成乳痰延及旬月堅中帶軟頂色轉紅勢將穿潰潰後見膿乃吉若血多膿少非所宜也川楝子當歸青皮白芍橘紅川貝香附茯苓砂仁二診乳痰穿破有血無膿乃氣虛不能引血化腐為膿也防變乳岩不易收功黨參歸身白芍茯神棗仁川貝香附陳皮牡蠣砂仁甘草橘葉詒按此等郁痰證須正氣不虧更能曠懷自遣乃可醫治二者缺一不可治也又單方川貝三錢橘紅五錢萊蔔子炒三錢蓮蓬皮另炙灰五錢某氣鬱痰凝乳房結塊漫腫色白不甚痛症屬乳痰法擬養營舒肝兼以化堅川楝子鬱金茯苓大貝母牡蠣香附山茨菰瓦楞子天葵草法半夏陳皮歸身鄭素有肝火橫逆入絡去夏乳房結痰潰膿收口今復結核漫腫阻於缺盆井穴內經所謂肝有邪其氣流於兩脅證雖外瘍實從內出脈左弦數右濡弱潮熱氣逆咳嗽痰多胸痹納少統諸見證皆肝邪侵胃更侮肺金惟熱久津傷柔肝顧陰尤在所先不當純用瘍家消腫法也擬仲景炙甘草湯去陽藥真阿膠鮮石斛生石決明細生地鮮南沙參麥冬肉生牡蠣川貝母白芍白蒺藜鉤鉤橘葉呂營枯無以養絡絡脈不和而成木硬乳房結核症名乳癖更兼遍體肢麻掣痛非養營無以生血非泄木無以化結治病之法雖則如是然須開懷胸襟於服藥之先四物湯加青皮川楝子廣鬱金左牡蠣連殼砂仁於木鬱不達乳房結核堅硬胸脅氣撑腰脊疼痛氣血兩虧鬱結不解論其內證即屬郁勞論其外證便是乳岩皆為難治黨參三錢香附二錢川貝二錢當歸三錢白芍二錢青皮錢半橘核三錢狗脊三錢杜仲三錢砂仁五分詒按論病簡潔老當二診乳岩肝鬱也嘔而不納脾胃弱也胸脅背腹氣攻作痛元氣虧脾胃弱木橫無制也經云有胃則生無胃則死安穀者昌絶谷者亡勉擬一方以盡人事而已川連五分吳萸三分拌炒鹽半夏錢半東白芍二錢火麻仁三錢朱茯神三錢金橘葉數片人參一錢另煎沖三診前方加炙黑草五分烏梅肉三分另金橘餅過藥曹營虛肝鬱氣結不舒乳房結核堅硬如石此乳岩之根也消之不易必須暢懷為佳用繆氏疏肝清胃法當歸三錢川石斛三錢川楝子三錢炒打白芍一錢半大貝母三錢甘草四分茜草一錢山茨菰五錢昆布一錢半洗淡制沒藥五分乳香五分二診前方化塊軟堅此方養營舒郁宜相間服之黨參三錢歸身一錢半酒炒白芍一錢半石決明五錢打茯神三錢炒棗仁三錢遠志肉五分甘草湯制刺蒺藜三錢丸方川楝子一錢炒當歸一錢酒炒兩頭尖一兩炒制首烏一兩炒帶子露蜂房三錢炙共研末蜜丸每服三錢開水下李陰血虧肝氣鬱木來乘土乳房結核血不榮筋筋脈拘急病所由來匪伊朝夕症雖外瘍實從內生法當養血榮筋漫用攻消無益大生地歸身香附白芍茯神柏子仁川貝母刺蒺藜丹皮夏枯草羚羊角木瓜山茨菰另附乳岩丸方黨參三兩熟地四兩白芍三兩歸身二兩茯神三兩棗仁三兩炒阿膠二兩冬朮三兩香附三兩茜草炭三兩山藥四兩陳皮一兩丹皮二兩沙苑子三兩山茨菰三兩共為末用夏枯草半斤煎極濃汁一大碗濾去渣將汁再煎滾調下真藕粉四兩為糊和上藥末搗為丸每朝服五錢建蓮紅棗湯送下肺癰肺痿外肺癰肺花瘡吳風舍於肺肺逆為咳熱入於營蒸痰作臭惡風而內熱肺癰初起之候也牛蒡子杵三錢杏苡仁各三錢橘紅一錢象貝三錢前胡一錢蘇子三錢枇杷葉去毛兩片蘆根去節五錢某咳吐臭痰如膿血此屬肺癰舌苔濁厚痰濁膠黏仿仲景法葶藶子冬瓜子桃仁桔梗桑皮栝蔞仁旋覆花蘇子川貝蘆尖某咳嗽月餘痰腥帶血氣升嗆逆脈弦滑數風溫久戀化火蒸痰灼金耗液證屬肺癰非輕候也冬瓜子淡芩薏仁紫菀川貝桑皮甜杏仁蘇梗沙參蘆根尖附録張氏醫通云薏仁根搗汁頓熱服之下咽臭痰即解有蟲者蟲即死出薏仁為肺癰專藥然性燥氣滯服之未免上壅不及根汁之立能下奪已潰未潰皆可挽回陳芥菜汁溫服灌吐最妙一方用薄荷濃煎稍入白蜜已潰未潰皆效二診咳逆痰腥帶血脈形弦硬面色暗晦肺氣失降木火上逆防加喘急羚羊角鮮生地川貝甜杏仁蛤殼石決明桑白皮紫菀枇杷葉蘆尖詒按此治肺癰初潰之主方孫熱在中脘部分時吐紅痰帶臭不甚咳嗽病在於胃留熱伏於中宮法當清泄犀角冬瓜子射干當歸桃仁玄明粉苡仁川貝連翹大黃酒浸炒金銀花復診不咳嗽但吐紅痰如膿自覺灼熱在胃脘之中將及二月此非肺癰乃瘀傷濕熱留胃中故也當以清化川貝冬瓜子當歸苡仁沙參川石斛連翹金銀花赤豆蘆根三診吐痰如膿已止脘中之熱已退時覺微寒微熱餘火未清仍從前法加減黨參當歸薏仁杏仁沙參冬瓜子丹皮黃芩甘草茅根赤小豆蘆根詒按此病得力在第一方故知其非肺癰然紅痰如膿而臭究與脘癰無異作胃脘癰治當不致誤陸濕蒸熱鬱而成肺癰癰者壅也壅則宜通宜泄而醫者偏以五味斂之邪無從出咳吐痰穢仲景膿成之戒今已犯之金匱葦根湯加減一定之理冬瓜仁三錢銀花錢半單桃仁打三錢石葦三錢橘紅一錢生苡仁三錢蘆根五錢枇杷葉露二兩沖某肺癰咳吐膿痰肺葉已傷勢屬重候羚羊角冬瓜子桔梗葶藶子苡仁生甘草桃仁泥野茭根川石斛蘆根二診痰臭雖減咳嗽未除羚羊角川貝母杏仁苡仁桃仁桔梗蘇子甘草冬瓜子蘆根野茭根某咳唾臭膿脈數而不欲食時寒時熱肺癰已見膿後熱不退者虛也火剋金而土虛不能生金是謂重虛恐難治北沙參生苡仁杏仁玄參扁豆茯苓川貝母金銀花冬瓜子百部周咳吐臭痰已延三月脈數而虛其陰已傷面白無華飲食漸減肺失所恃防成肺痿沙參黃耆麥冬白芨茯苓玄參大生地杏仁百合蘆根尖二診咳痰腥臭面色青晦脈數而虛納穀大減此木火乘金金傷及土臟氣克賊恐延不治北沙參桑白皮麥冬苡仁茯苓白扁豆野茭根橘紅紫菀玄參蘆根尖吳咳逆舌絳脈見洪數無神肺陰大傷咳痰穢濁腥臭不獨肺癰重候也仲景不云乎脈數大而虛為肺痿癰猶可也痿則難治紫菀茸炙錢半桑皮炙三錢木防己三錢莧麥冬二錢生苡仁三錢白桔梗八分川貝三錢栝蔞仁三錢杏仁去皮尖三錢肥知母二錢生黃耆三錢川百合三錢忍冬藤三錢茅根肉去心五錢張伏暑三候以外濕鬱化火之邪從汗而出未能化清留於肺胃之絡乳房結腫漸見紅色勢必結膿外泄此外肺癰也所幸衛分之邪漸退胃口尚健可以收功但絡間之瘍必致曠日持久慎無欲速欲速則生變六君子湯加制殭蠶四隻蠍尾酒洗五隻二診讀書之人心營素虛加以誦讀傷氣此肺絡本傷病後所以餘邪入絡也今既穿潰膿色尚正但咳吐語言俱關肺氣一動一作膿必外泄調治之難概可知矣是非倍用補法加以自攝不可惟明理者自揆之庶幾可收緩功人參鬚三錢上黃耆一兩甜冬朮三錢炙黑草三錢制首烏五錢歸身炒錢半三診前方十劑飲食倍增滋味之物以養陰化氣不獨藥之補氣也瘍勢漸見膿稀然不足恃也此病所忌外感風寒則生咳內動肝火則亦咳咳則瘍必熾張須平心靜氣慎風寒以解內熱百日之後可保無虞少君乃明達之人毋容老夫饒舌者也前方去首烏加淮山藥三錢大熟地炒四錢東白芍二錢四診補氣養營膿水漸少行動有神從此可望完復然百日正功行完滿之時當局尤當加意慎調四君子湯合四物湯加黃耆海參豬脊髓為丸唐肺花瘡乃肺虛火炎金受其戕音啞咳嗆勞損之根不易見效北沙參三錢玄參一錢桑皮三錢杏仁三錢川貝三錢款冬花炙錢半肋癰脅癰脅痰肝癰脾癰程濕熱結疝初起腎囊紅腫漸至氣上攻脅脅肋腫痛已及半月防成肋癰病在肝絡肝性善升甚則恐致氣升發厥非輕證也川楝子三錢延胡二錢青皮錢半香附二錢楂炭三錢枳殼錢半覆旋花錢半桃仁三錢赤苓三錢猩絳三分蔥管兩枝詒按方治疝氣而肋癰即在其中內病外瘍一以貫之也某肋骨癰因氣血瘀傷而成非輕症也炙山甲柴胡花粉青皮紅花桃仁當歸大黃陳虛體著邪留戀不化肺氣失清肅之令胃津乏遊溢之權咳逆痰黏納少季脅腫痛邪熱逗留入絡矣脈來弱而數弱為陰不足數為陽有餘瘦人最有液涸之慮戚先生同議益氣生津氣壯則邪自卻津充則熱自除惟日暮寒熱痛勢加劇乃成膿之象旦晚未易奏功人參二錢川貝母炒黃三錢茯苓三錢川石斛三錢炙甘草一錢莧麥冬二錢丹皮錢半橘紅一錢二診病後餘邪留絡而遺毒昨議津氣兼顧諸恙仍然右脅腫瘍其勢更甚此將潰時必然之勢膿泄自可向安惟納穀無多咯痰不已後天生氣不振最易奄延成瘵考古化痰理嗽諸方難施於胃敗少納之體潰後安穀則昌茲先和養胃氣人參二錢川石斛三錢炒麥冬二錢法半夏錢半炙甘草一錢生穀芽三錢陽春砂仁一錢茯苓三錢三診久嗽不得左臥瘍潰以來日暮猶然潮熱胸痞不舒胃氣未為醒豁肺陰日漸耗傷刻下火令盛行再怕煅煉辛金而成肺痿經云諸痿喘嘔皆屬於肺諸氣膹郁不開必致津枯液涸而後已用喻西昌清燥法意在生津以救肺亦內經虛則補其母之義清燥救肺湯去石膏四診服甘涼之劑頗合可與甘緩柔方炙甘草湯去薑桂蔡脅痰多起於病後由陰損陽亢氣血不能來復所致潰久不斂脂流液枯子夜少寐用養營法去桂地人參養營湯去桂地二診脅痰潰久成漏食少臥不安寐前法嫌其呆守疏腑養臟為宜六君子湯加當歸芍藥柏子仁穀芽張怒則肝氣逆而血菀於上章門結塊硬痛寒熱脈數小便短少症屬肝癰防其內潰咳吐膿血而劇紫菀三錢鬱金二錢猩絳三分柴胡三分天花粉三錢旋覆花錢半桃仁三錢當歸三錢川山甲三錢忍冬藤三錢青蔥管兩枝繆病起微寒微熱右肋章門穴痠疼延今兩月痛處略腫食少便溏面浮足腫腰脊痠痛脈附骨極細而鋭此脾家有濕熱瘀傷症屬脾癰日久正虛胃弱恐其不克支持黨參三錢炙甘草一錢陳皮錢半白朮土炒二錢川朴八分吳茱萸四分木香八分乾薑五分當歸三錢川芎八分白芍二錢六神麯三錢茯苓三錢肉果五分砂仁一錢敷方官桂吳茱萸乾薑川烏生半夏獨活乳香沒藥南星白芥子當歸各一錢研末用陳酒乾麵調和燉溫敷痛處胃脘癰肚角癰胡胃脘生癰脈虛形瘦初起寒熱延今四十餘日晨必泄瀉無度是中氣大虛不勝攻消之任也今與內托法倘仍作瀉則難矣黨參三錢木香八分法半夏錢半茯苓三錢枳殼錢半砂仁五分當歸三錢冬朮二錢乾薑八分陳皮錢半周濕熱痰滯阻塞中宮胃脘高突而痛綿延月餘陡起咳逆遂吐膿痰盞許而胸脘痛減此癰膿內潰殊非輕恙較外潰之癰膿尤重宜加意調攝為要川貝母三錢製半夏錢半蘇子三錢前胡一錢川朴八分橘紅一錢杏仁三錢鬱金錢半赤苓三錢曹中脘脹滿大如覆盆短氣不足以息半月以前偶因勞碌曾經上嘔下圊盡皆汙血血去之後從此脘脹短氣食少無力此飢飽勞碌傷胃胃為氣血之海氣血錯亂瘀凝氣滯而成此患防發內癰且以化瘀理氣和中宣降旋覆花錢半猩絳四分炒黑桃仁三錢紫丹參錢半橘紅錢半制香附二錢蘇子炒研三錢棗仁三錢雲茯苓三錢檀降香片各四分徐脈來左虛弱右弦數濕熱壅滯踞於胃脘之絡胸高堅突不移此肚角癰也病後氣虛不復厭谷納少且用扶土和中亦扶正卻邪之治川雅連四分淡乾薑五分同炒川朴八分製半夏錢半廣陳皮錢半廣鬱金錢半焦枳實二錢砂仁五分研益智仁三錢炒穀芽三錢澤瀉二錢茯苓三錢二診肚角癰成膿於皮裡膜外由濕熱壅滯中焦氣不宣化所致仍以扶土和中前方去益智乾薑澤瀉加西洋參錢半全栝蔞五錢蘇梗三錢淨角針三錢查脘下結腫按之痛不可仰是痰氣交凝阻塞脈絡所致有癰膿之慮擬和中化痰攻逐絡中之瘀桃杏仁打各三錢延胡炒三錢青皮錢半炙甲片三錢臺烏藥錢半枳殼錢半製半夏錢半栝蔞仁三錢郭伏暑之邪兼挾肝鬱氣痹血阻脘左板痛脈形郁數寒熱不時勢有肚角癰之慮擬和解宣絡三物旋覆花湯加柴胡青皮香附蘇梗酒炒當歸廣鬱金六神麯枳殼茯苓二診進宣通和解數劑痛勢已松寒熱亦減惟絡中尚未宣暢邪之郁者未清仍從和解為宜川朴青蒿白蒺藜蘇梗制香附六神麯枳殼製半夏淡乾薑橘葉臍癰臍風腸癰少腹癰周當臍腫硬名曰臍癰脈數身熱內癰已成若不從臍中而出恐其內走大腸而變為盤腸芽孩犯此非輕丹皮錢半制軍五錢澤蘭三錢赤芍二錢桃仁泥三錢歸尾三錢延胡二錢苡仁三錢角針三錢馮臍風由乎脾腎濕熱而成今腹痛便泄先運其中白朮錢半赤芍二錢茯苓三錢陳皮錢半木香八分當歸三錢六神麯三錢龍骨五錢苡仁四錢秦盤腸癰腹痛已久二三日來驟然脹滿連及於腰小便莖中亦痛勢已有膿擬用牡丹湯排膿逐毒從大腸導下之所慮飲食極少胃氣不克支持耳丹皮錢半桃仁三錢皂角刺三錢冬瓜子三錢紅花五分赤苓三錢大黃制五錢延胡索二錢廣橘皮錢半山楂肉三錢歸尾三錢二診盤腸癰已成膿不得不從導下之法所慮飲食極少不克勝任今改排膿逐毒法生黃耆五錢皂角刺三錢歸尾三錢桃仁三錢紅花五分甘草五分土貝母三錢金銀花錢半丹皮錢半山甲片三錢冬瓜子三錢廣皮錢半三診腸內癰膿將足脈細食少治以托裡冀其外潰為妙黃耆銀花川山甲肉桂當歸皂角刺赤苓澤瀉苡仁廣皮另血珀屑五分通草湯下某濕熱積聚阻於少陽病起發熱便少腹偏右板痛足屈不伸小腸癰也身熱不止防其成膿甘草桔梗枳殼蘇梗赤苓土貝母砂仁延胡索焦楂肉川楝子澤蘭葉許寒氣入於厥陰濕熱隨經下注睪丸腫脹少腹結硬腫痛防成縮腳小腸癰重症川楝子吳茱萸枳殼歸尾焦楂肉橘核小茴香萆薢黑山梔蔥白頭陳本體陰虧四月間濕熱成瘍潰膿而愈愈後正虛肝風升動眩暈跌僕以致腿股環跳受傷漫腫色白而生附骨痰疽今二便阻塞少腹脹滿將有腸癰之變忍冬藤丹皮桃仁延胡索鮮首烏車前子歸身牛膝血珀五分研末藥汁調下王濕熱阻於肝絡右少腹高突成癰綿延匝月膿腳已成脈數寒熱舌苔灰膩法當攻營逐絡兼以和解豆卷三錢延胡二錢殭蠶三錢青皮錢半歸尾三錢炙甲片三錢楂炭二錢澤蘭葉錢半二診癰膿大潰濕熱未清治以養胃運濕慎勞節食又當自謹於服藥之外歸身二錢川石斛三錢東白芍二錢茯苓三錢香穀芽三錢丹皮錢半通草八分三診飲食不節寒熱復作瘍膿不盡弦數之脈灰膩之苔減而復來仍以和解中宮冀其熱退谷增為妥豆卷三錢柴胡五分製半夏錢半赤芍二錢六神麯三錢丹皮錢半枳實二錢淡芩二錢尤少腹腫如墩阜其色鮮紅已經三月不能行動而飲食如常無傷六淫之感故積久如斯否則結成癰瘍而為腸癰極重之病當以仲景法調之非久服不效抵當丸每服三十粒益母草湯送下橫痃腎岩肛門癰漏管蕭腿之裡股及胯皆三陰經循行之地此處疼痛而略腫足屈不能伸先有寒熱是陽邪入於陰經而欲結外瘍也舌苔干掯小便赤痛大便溏泄但脈細汗多精神疲憊年逾六旬恐其不克支持而生暈厥症勢險重備商當歸白芍桂枝甘草葛根本通丹參澤蘭砂仁淡芩二診汗稍斂便泄不止胯凹仍痛高年食少正虛防其內陷生變潞黨參炒白朮白芍歸身半夏炮薑防風木香陳皮桂枝砂仁三診胯凹痛而略腫不高又無紅色而痛著於骨如針刺之狀此橫痃疽也疽屬陰由五臟而生故脈細而便泄皆為陰象惟是舌色焦紅乾涸小溲赤痛是屬津虧火亢此陰中夾陽寒熱兩歧高年犯此頗屬棘手潞黨參茯苓炒熟地五味子丹皮山藥澤瀉鹿角先煎肉桂白芍麥冬元米炒通草四診諸恙皆減惟小溲赤痛未除仍從前法加滋陰之藥照前方加龜版三錢五診胯凹痛而無形已及四十餘日脈細便溏多汗皆屬虛寒之象舌乾苔掯陰津大虧飲食少納脾胃極弱惟小溲莖中作痛尿色渾濁似有濕熱內瘀高年犯此頗慮奄延敗壞法以溫補為主佐以分清化濕備商大熟地潞黨參炒當歸炒白朮川熟附五分益智仁五分萆薢烏藥草稍延胡酒炒絡石藤袁濕熱濁邪錮結厥陰之絡兩胯凹筋脹間隔數日則一寒熱寒熱平則筋脹亦平旬月以來已發作十次飲食二便如常法當搜剔絡中之錮結兼以疏泄厥陰川楝子巴豆一粒同炒黃去巴豆三錢龍膽草四分全蠍三個酒洗楂肉三錢柴胡稍四分鹽水炒黃柏一錢鹽水炒木通一錢小茴香五分鹽水炒炙甲片三片青皮一錢滋腎丸三錢鹽花湯送下原注此症據病人自云先患濕火挾疝腎囊紅腫服龍膽瀉肝湯囊腫消後遂得此症凡怒勞或飲酒必發知其有濕熱伏於肝絡也余用此方三服一年不發後因大醉而復發仍用此方三劑永不再發矣許腎岩翻花法在難治怡情安養庶幾可圖然非易事也鮮首烏一兩馬料豆一兩銀花一兩生甘草一兩濃煎服朝服六味丸三錢淡鹽花湯送另西黃一分川連五分血珀五分藥珠三分燈心灰五分大貝二錢人中黃一錢研末分十服每朝一服詒按此腎虛而兼瘡毒之變證也某濕久蘊於下焦氣血凝滯而結瘍生於合纂之旁滋蔓肛臀之際初起數日即潰火甚毒甚可知潰後爛孔極深迄今四五十日新肉雖生而嫩肛臀余腫仍僵久臥床褥脾胃之轉輸自鈍刻當痛楚形容之色澤尤枯調治方法自宜補益高明見解大略相同愚意虛處固虛而實處仍實擬用煎丸二方各走一經虛實兼顧六君子湯去半夏茯苓加黃耆歸身白芍穀芽又丸方川連酒炒一錢胡連酒炒一錢苦參炒一錢黃柏一錢當歸三錢乳香一錢沒藥一錢白芷一錢犀黃二分血珀四分白礬三錢刺蝟皮炙一錢象牙屑三錢海螵蛸三錢共為末用黃占煬化作丸每朝服五分原注凡極苦之藥直入下焦堅陰而化濕熱用蝟皮牙屑之專消漏管者引入患處更用黃占以澀之固之俾上中不受苦寒之藥氣俾入下焦其性始達詒按丸方用意極精某瘍漏久而成管用消管丸緩緩圖治胡黃連一兩刺蝟皮一兩炙象牙屑一兩五倍子一兩炙蟾酥酒化三錢陳硬明角燈二兩炙上藥為末煉蜜丸用上好雄精三錢泛上為衣每朝三錢金銀花湯送下詒按方意極佳惟蟾酥大毒走竄之品擬減半用之黴瘡任濕熱伏邪內蘊引動宿毒遍發廣痘亦曰廣風恐其肢節酸強殊難速效防風當歸赤芍皂莢子銀花天花粉連翹甘草陳皮土茯苓朱結毒穿破不斂在於當額眉稜俱屬陽明部位已及半載當養氣血以化毒大熟地黨參川芎皂莢子茯苓黃耆土貝母當歸生甘草銀花土茯苓某廣風自頭而起漸延遍體濕熱穢毒之邪從鼻而受為日既久未易掃除擬用金蟾脫甲酒意金銀花三兩蟾蜍去腸一隻苦參三兩大黃一兩皂莢子十粒川芎一兩白蘚皮二兩一本有蛇蛻一兩甲片二兩用陳酒五斤浸七日每日飲杯許詒按此與前條之證皆系餘毒所致流注某暑邪挾積阻滯腸胃脘腹疼痛大便泄出如膿如血證屬盤腸流注非輕證也川連木香檳榔當歸楂肉神麯黃芩枳殼赤芍砂仁詒按膿血痢而名流注説頗新奇閲方仍是治痢之藥憶蔣問齋醫略中論痢疾一證謂是腸中作膿當用外瘍治法與此案正相合也某多年濕毒左足前臁腐爛今則膝骨臀股上及缺盆而木腫此濕得熱而蔓延循經竄絡病在陽明名濕毒流注口苦帶膩脈緩而小濕勝於熱熱伏濕中仿防己飲法防己蒼朮黃柏南星制木通威靈仙防風歸身獨活紅花萆薢羚羊角滑石詒按此治外瘍正法是瘍證之偏於陽者二診前用防己法宣通關節以化濕熱膝股之痛稍緩惟缺盆處咳嗽引痛不平擬參以清肺化痰前方去羚羊角防風木香紅花加薏仁杏仁川貝沙參某病後陰虛而發喉痹今因勞碌右肩復發流注至於腰脊痠痛淋帶如膿皆為虛象雖有外瘍難投攻劑姑進和營止痛緩緩調之上黃耆大生地丹參當歸酒炒桑枝玉竹川斷白茯苓澤蘭秦艽榮附骨流注發於秋冬原由伏邪暑濕而成而色白痠痛必兼外寒阻襲法當用辛溫散外寒苦辛祛內濕關節流通通斯不痛然內熱不已者終防成膿桂枝八分蒼朮一錢黃柏一錢獨活一錢防己一錢防風一錢半當歸三錢柴胡三分炙甲片一錢半金銀花三錢黃耆三錢萆薢三錢孫流注潰者潰發者發氣血未通寒熱尚作仍防作膿消補兼施生黃耆三錢當歸三錢獨活一錢澤蘭三錢丹參三錢制殭蠶三錢陳皮一錢苡仁三錢桑枝四錢某伏暑流注發於右少腹及左臂外臁乃手巨陽陽明經行之所此必努力傷氣兼夾食滯者故大小二腸經絡受病擬流氣飲加減治之木香檳榔防風青皮蘇梗陳皮烏藥楂肉川朴紅花砂仁某流注潰膿之後氣血兩虧而胸腹多痰口舌黏膩心嘈心跳飲食少進故用十味溫膽法補虛而兼化痰濁若得脾胃一醒氣血乃復然後收功黨參茯苓半夏棗仁炒枳殼陳皮遠志穀芽薑炒竹茹某水疔潰膿之後復發流注痠痛漫腫乃寒與濕從足下而受逗留入營衛不通也身發寒熱防其成膿羌活獨活防風秦艽當歸丹參澤蘭苡米牛膝桑枝附骨疽腿癰鶴膝風脫疽某環跳臀股之間從前曾患外瘍今戽水傷筋受水寒之氣襲筋骨之中臀股胯凹腓腨痠痛大便燥結小便不利氣墜尻酸病在太陽少陰二經防發附骨陰疽六味地黃湯去山藥加細辛麻仁獨活川熟附另東垣資腎丸二錢開水送下於寒邪入絡腿股痠痛漫腫色白脈細口不渴當溫散之擬陽和湯法麻黃四分大熟地五錢川烏五分薑汁製桂枝一錢當歸三錢牛膝三錢山甲片一錢半炒鹿角膠二錢煬化白芥子五分炮薑三分桑枝五錢二診前投溫經散寒諸恙俱減仍宗前方炙麻黃三分大熟地六錢鹿角膠二錢煬化肉桂五分後下白芥子一錢炮薑五分當歸三錢制川烏五分川斷三錢全蠍三個酒洗牛膝三錢桑枝五錢原注服七帖全愈某貼骨腿癰半陰半陽之症也外雖腫而色不變其痛在筋骨之間此平日積勞氣血受傷筋絡失和寒熱乘襲所結治之不易見效若發寒熱久必成膿歸尾三錢澤蘭三錢丹參三錢牛膝三錢延胡一錢半防風一錢半秦艽一錢半炙甲片一錢半獨活一錢桃仁三錢桑枝五錢某腎主骨膝者骨之溪谷也腎虛則骨髓空而寒濕乘之兩足跟痛及於膝久而不已防成鶴膝風痹大熟地萆薢苡仁牛膝桂枝枸杞子川斷防風獨活另虎潛丸每朝三錢毛右膝腫大皮色不紅骨中如火灼之痛脈洪口膩身熱此濕熱相火乘虛注於溪谷症屬鶴膝風痹殊非小疾極難速效羚羊角一錢半薑汁炒黃柏一錢獨活一錢苡仁三錢牛膝三錢川連五分酒炒秦艽一錢半萆薢三錢防風一錢半當歸二錢細生地三錢鮮金銀花藤一兩絲瓜絡一錢半二診膝腫稍平其痛亦減但痛處骨中仍熱法當補腎之陰清骨之熱仿丹溪法大生地龜版黃柏知母牛膝當歸萆薢苡仁羚羊角獨活絲瓜絡桑枝鮮金銀花藤朝服虎潛丸三錢原注服二十帖愈吳足大指屬厥陰肝經太陰脾經由此起今足大指干爛乃肝經血枯脾經濕熱也延及數月防成脫疽兼上唇麻木亦脾虛風動殊非易治萆薢當歸牛膝枸杞子苡仁丹參川斷茯苓桑枝皮膚病某周身碎癢而痛似疥瘰狀心中煩熱膚上出膿水證屬肺風馬勃象貝荊芥黃芩杭菊蒺藜炒詒按此濕熱走於血分之病當兼疏血絡擬加歸鬚丹皮赤芍忍冬藤浮萍細生地榮血枯膚燥內風暗動加以汗液之濕留於膚腠風濕相搏遍體發瘰搔癢此必涼血潤燥祛風化濕久久服之緩緩圖之乃效殊非旦夕間事也細生地八錢炒丹皮一錢五分秦艽一錢半刺蒺藜三錢炒防風一錢酒炒茯苓二錢防己一錢酒炒穭豆衣三錢甘草三分黑芝麻三錢桑葉一錢二診皮膚之風濕略平而臟腑之營陰究弱是以頭眩心嘈喉齶時癢亦虛風挾心陽上煽所致也大生地四錢女貞子三錢鹽水炒白芍一錢半川貝母三錢穭豆衣三錢石決明五錢打甘菊炭一錢棗仁三錢炒刺蒺藜三錢炒黑芝麻三錢玫瑰花二朵紅棗二個野薔薇花三朵三診營陰內虧肝風久動皮膚枯燥成風投以養血熄風原得小效而不能了了者操持勞碌血未能充長故也耐心久服當必有驗大生地石決明白芍女貞子川貝母穭豆衣棗仁防風酒炒淡芩酒炒玫瑰花野薔薇花某手之三陽從手走頭足之三陽從頭走足此病兩手指及頭項發出紅紫塊瘰且腫且癢且熱是屬風症門中紫雲之類卻非小恙勿得輕視乘其初起未久急急療之喻嘉言謂汗宜頻發血宜頻刺當仿之麻黃四分角刺一錢半白朮一錢半白蒺藜三錢生石膏三錢打甘草四分大黃三錢苦參二錢金銀花三錢外用生軍一塊磨汁桐油調塗某足丫碎爛南方濕熱之常病也患者甚多今足指碎爛掌心皮厚而燥非徒濕熱血亦枯矣經云手得血而能握足得血而能步碎爛不愈恐成風濕夫治風先治血血行風自滅祛濕先治脾脾旺濕自絶所謂治病必求其本也制首烏丹參當歸防風苡仁懷山藥茯苓萆薢豨蘞草紅棗三角胡麻袁瘍膿之後氣血必虛奔走烈日之中汗出招風風與熱毒舍於皮膚脈絡之間至秋涼氣外束熱鬱於皮中遂覺遍體搔癢幾及兩月近來面色帶黑而浮少腹略滿據云奇癢之時唇舌俱麻是外風引動內風也經云面腫曰風夫風行必燥木勝剋土此證現為風癩久防腹滿理勢所必然也羚羊角秦艽地骨皮陳皮通草丹皮北沙參苡仁黃耆防風又洗方紫背浮萍杜牛膝側柏葉巴豆殼煎湯洗淵按面黑腹滿乃脾腎兩虛見症復診古有風癩一症周身搔癢擬用千金法生石膏防風麻黃茯苓生甘草白朮鮮生地百部
